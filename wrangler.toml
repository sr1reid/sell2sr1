name = "sell2sr1"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
CONFIRMATION_FROM_EMAIL = "appraisals@sr1companies.com"
CONFIRMATION_FROM_NAME = "SR1 Companies Appraisals"

[triggers]
# Fires at 11:00 and 12:00 UTC daily; worker checks America/New_York hour === 7 so it always runs at 7:00 AM ET (EST & EDT)
crons = ["0 11,12 * * *"]

[ai]
binding = "AI"

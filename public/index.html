    // Direct Firebase Cloud Storage upload for raw photos and videos
    async function uploadMediaFileToStorage(file) {
      try {
        if (!storage && typeof firebase !== 'undefined' && firebase.storage) {
          try { storage = firebase.storage(); } catch (e) {}
        }
        if (!storage) {
          throw new Error('Firebase Storage not available');
        }

        const ext = file.name ? file.name.split('.').pop().toLowerCase() : (file.type?.startsWith('video/') ? 'mp4' : 'jpg');
        const cleanName = (file.name || 'upload')
          .replace(/[^a-zA-Z0-9._-]/g, '_')
          .toLowerCase();
        const path = `inquiries/${Date.now()}_${Math.random().toString(36).substr(2, 6)}_${cleanName}`;
        const ref = storage.ref(path);
        
        let contentType = file.type || '';
        if (!contentType) {
          if (ext === 'heic' || ext === 'heif') contentType = 'image/heic';
          else if (ext === 'mov') contentType = 'video/quicktime';
          else if (ext === 'mp4') contentType = 'video/mp4';
          else contentType = 'image/jpeg';
        }

        const metadata = { contentType };
        const snapshot = await ref.put(file, metadata);
        const downloadUrl = await snapshot.ref.getDownloadURL();
        return downloadUrl;
      } catch (err) {
        console.warn('Firebase Storage upload error:', err);
        return null;
      }
    }

    // Convert JavaScript object to Firestore REST typed format
    function jsonToFirestoreFields(obj) {
      if (obj === null || obj === undefined) return { nullValue: null };
      if (typeof obj === 'string') return { stringValue: obj };
      if (typeof obj === 'number') {
        return Number.isInteger(obj) ? { integerValue: obj.toString() } : { doubleValue: obj };
      }
      if (typeof obj === 'boolean') return { booleanValue: obj };
      if (Array.isArray(obj)) {
        return { arrayValue: { values: obj.map(jsonToFirestoreFields) } };
      }
      if (typeof obj === 'object') {
        const fields = {};
        for (const [k, v] of Object.entries(obj)) {
          if (v !== undefined) {
            fields[k] = jsonToFirestoreFields(v);
          }
        }
        return { mapValue: { fields } };
      }
      return { nullValue: null };
    }

    // Convert Firestore REST typed format back to plain JavaScript object
    function firestoreFieldsToJson(fsVal) {
      if (!fsVal) return null;
      if ('stringValue' in fsVal) return fsVal.stringValue;
      if ('integerValue' in fsVal) return parseInt(fsVal.integerValue, 10);
      if ('doubleValue' in fsVal) return fsVal.doubleValue;
      if ('booleanValue' in fsVal) return fsVal.booleanValue;
      if ('nullValue' in fsVal) return null;
      if ('arrayValue' in fsVal) {
        return (fsVal.arrayValue.values || []).map(firestoreFieldsToJson);
      }
      if ('mapValue' in fsVal) {
        const res = {};
        for (const [k, v] of Object.entries(fsVal.mapValue.fields || {})) {
          res[k] = firestoreFieldsToJson(v);
        }
        return res;
      }
      return null;
    }

    // Direct REST API save: 100% reliable across all browsers & phones
    async function saveInquiryToCloudRest(inquiry) {
      try {
        let clean = JSON.parse(JSON.stringify(inquiry));

        // Firestore strictly enforces a 1MB (1,048,576 byte) document limit.
        if (clean.photos && Array.isArray(clean.photos)) {
          clean.photos = clean.photos.slice(0, 12).map(p => {
            const isHttp = (p.url && typeof p.url === 'string' && p.url.startsWith('http'));
            const rawThumb = p.thumbUrl || p.url || '';
            const safeThumb = isHttp 
              ? p.url 
              : (typeof rawThumb === 'string' && rawThumb.length < 75000 ? rawThumb : '');
            return {
              id: p.id || 'p-' + Math.random().toString(36).substr(2, 6),
              label: p.label || 'Unit Media',
              url: isHttp ? p.url : safeThumb,
              thumbUrl: isHttp ? (p.thumbUrl || p.url) : safeThumb,
              isVideo: !!p.isVideo,
              fileSize: p.fileSize || 0,
              fileType: p.fileType || (p.isVideo ? 'video/mp4' : 'image/jpeg'),
              uploadedAt: p.uploadedAt || new Date().toISOString()
            };
          });
        }

        const body = { fields: jsonToFirestoreFields(clean).mapValue.fields };
        const url = `${FS_REST_BASE}/${inquiry.id}?key=${FS_API_KEY}`;
        const res = await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          console.error('Firestore save failed with HTTP', res.status, errData);
          return false;
        } else {
          console.log('Inquiry successfully saved to Firestore:', inquiry.referenceId);
          return true;
        }
      } catch (e) {
        console.error('Cloud REST save notice:', e);
        return false;
      }
    }

    // Direct REST API fetch: instant fallback & multi-device sync
    async function fetchInquiriesFromCloudRest() {
      try {
        const url = `${FS_REST_BASE}?key=${FS_API_KEY}&pageSize=100`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        if (!data.documents) return [];
        return data.documents

            const item = {};
            for (const [k, v] of Object.entries(doc.fields || {})) {

            }
            return item;
          })
          .filter(item => item && item.referenceId && !String(item.id || '').startsWith('_'));
      } catch (e) {
        return null;
      }
    }

      if (VIN_SPEC_NOISE_REGEX.test(vin)) return false;

      // Position 10 (index 9) can NEVER be 0, U, Z, I, O, or Q on a standard 17-char VIN
      if (/[0UZIOQ]/.test(vin[9])) return false;
      // Valid WMI first character (1,4,5,7=US, 2=Canada, 3=Mexico, J=Japan, K=Korea, L=China, S-Z=Europe)

      if (vin[0] === 'W' && vin[1] === 'E') return false;

      const letterCount = (vin.match(/[A-Z]/g) || []).length;

      if (/^(.)\1{8,}/.test(vin)) return false;

      for (let i = 0; i < 17; i++) {
        const val = VIN_TRANSLITERATION_MAP[vin[i]];

      const expectedCheck = rem === 10 ? 'X' : String(rem);

              const a2 = swapMap[base[p2]];

                      base.slice(p1 + 1, p2) +
                      a2[k2] +
                      base.slice(p2 + 1, p3) +
                      a3[k3] +

      const stops = fragments.filter((f) => f.hasStopStar && f.text && f.text.length >= 5 && f.text.length <= 16);
      if (starts.length === 0 || stops.length === 0) return '';

      const addScore = (vin, sc) => {

          if (v) return v;
        }

        // Determine candidate start positions (0..17-frag.length) of this fragment inside the 17-char VIN
        const candidateOffsets = [];
        if (fragObj.hasStopStar && !fragObj.hasStartStar) {
          // Anchored at the right end of the barcode (suffix of the 17-char VIN)
          candidateOffsets.push(17 - frag.length);
        } else if (fragObj.hasStartStar && !fragObj.hasStopStar) {
          // Anchored at the left start of the barcode (prefix of the 17-char VIN)
          candidateOffsets.push(0);
        } else if (frag.length >= 7) {
          // Try suffix first (if ends in 5 digits), then prefix, then interior offsets
          if (/\d{5}$/.test(frag)) candidateOffsets.push(17 - frag.length);
          for (let off = 0; off <= 17 - frag.length; off++) {
            if (!candidateOffsets.includes(off)) candidateOffsets.push(off);
          }
        }

        for (let oi = 0; oi < candidateOffsets.length; oi++) {
          const offset = candidateOffsets[oi];
          if (offset < 0 || offset + frag.length > 17) continue;

          // Case 1: Suffix fragment (e.g. offset = 2, frag = "9D7EF29LN814218", needs 2 leading chars from OCR)
          if (offset > 0 && offset + frag.length === 17) {
            const overlapLen = Math.min(6, frag.length);
            const fragOverlap = frag.slice(0, overlapLen);

            for (let p = 0; p < allOcrPieces.length; p++) {
              const piece = allOcrPieces[p];
              if (piece.length < offset + 2) continue;
              for (let s = 0; s <= Math.min(4, piece.length - (offset + 2)); s++) {
                const cmpLen = Math.min(overlapLen, piece.length - (s + offset));
                if (cmpLen < 2) continue;
                let matches = 0;
                for (let k = 0; k < cmpLen; k++) {
                  if (piece[s + offset + k] === fragOverlap[k]) matches++;
                }
                if (matches >= Math.max(2, cmpLen - 1)) {
                  const candidate17 = piece.slice(s, s + offset) + frag;
                  const repaired = tryRepairSingleOcrSlipVin(candidate17, true);
                  if (repaired) return repaired;
                }
              }
            }
          }

          // Case 2: Prefix fragment (e.g. offset = 0, "*5WFBF121" or "*5WFBF1", needs trailing chars from OCR)
          if (offset === 0 && frag.length < 17) {
            const needed = 17 - frag.length;
            const overlapLen = Math.min(6, frag.length);
            const fragTail = frag.slice(frag.length - overlapLen);

            for (let p = 0; p < allOcrPieces.length; p++) {
              const piece = allOcrPieces[p];
              // 2a. If `piece` is a 16..19-char VIN-like token ending in 5+ serial digits (even if its left side was mangled like "WEFBEA298HW071774"),
              // splice the barcode-anchored prefix `frag` directly onto the last `needed` characters of `piece`!
              if (fragObj.hasStartStar && piece.length >= Math.max(needed, 15) && piece.length <= 19 && /\d{5}$/.test(piece)) {
                const tailDirect = piece.slice(piece.length - needed);
                const direct17 = posNormalizeVin17(frag + tailDirect);
                if (isValidNorthAmericanVin(direct17)) return direct17;
                const directRepaired = tryRepairSingleOcrSlipVin(direct17, false);
                if (directRepaired) return directRepaired;
              }

              // 2b. Overlap alignment in `piece`
              if (piece.length < needed + 2) continue;
              for (let s = 0; s <= piece.length - (needed + 2); s++) {
                const cmpLen = Math.min(overlapLen, piece.length - s - needed);
                if (cmpLen < 2) continue;
                let matches = 0;
                for (let k = 0; k < cmpLen; k++) {
                  if (piece[s + k] === fragTail[overlapLen - cmpLen + k]) matches++;
                }
                if (matches >= Math.max(2, cmpLen - 1)) {
                  const tailFromOcr = piece.slice(s + cmpLen, s + cmpLen + needed);
                  if (tailFromOcr.length === needed) {
                    const candidate17 = frag + tailFromOcr;
                    const repaired = tryRepairSingleOcrSlipVin(candidate17, true);
                    if (repaired) return repaired;
                  }
                }
              }
            }
          }
        }
      }
      return '';
    };

    // Custom multi-scanline Code 39 decoder that reads intact lower/upper/tilted scanlines of scraped barcodes
    const CODE39_PATTERNS = {
      '0': 'nnnwwnwnn', '1': 'wnnwnnnnw', '2': 'nnwwnnnnw', '3': 'wnwwnnnnn',
      '4': 'nnnwwnnnw', '5': 'wnnwwnnnn', '6': 'nnwwwnnnn', '7': 'nnnwnnwnw',
      '8': 'wnnwnnwnn', '9': 'nnwwnnwnn', 'A': 'wnnnnwnnw', 'B': 'nnwnnwnnw',
      'C': 'wnwnnwnnn', 'D': 'nnnnwwnnw', 'E': 'wnnnwwnnn', 'F': 'nnwnwwnnn',
      'G': 'nnnnnwwnw', 'H': 'wnnnnwwnn', 'I': 'nnwnnwwnn', 'J': 'nnnnwwwnn',
      'K': 'wnnnnnnww', 'L': 'nnwnnnnww', 'M': 'wnwnnnnwn', 'N': 'nnnnwnnww',
      'O': 'wnnnwnnwn', 'P': 'nnwnwnnwn', 'Q': 'nnnnnnwww', 'R': 'wnnnnnwwn',
      'S': 'nnwnnnwwn', 'T': 'nnnnwnwwn', 'U': 'wwnnnnnnw', 'V': 'nwwnnnnnw',
      'W': 'wwwnnnnnn', 'X': 'nwnnwnnnw', 'Y': 'wwnnwnnnn', 'Z': 'nwwnwnnnn',
      '-': 'nwnnnnwnw', '.': 'wwnnnnwnn', ' ': 'nwwnnnwnn', '$': 'nwnwnwnnn',
      '/': 'nwnwnnnwn', '+': 'nwnnnwnwn', '%': 'nnnwnwnwn', '*': 'nwnnwnwnn'
    };
    const CODE39_REV_MAP = Object.fromEntries(
      Object.entries(CODE39_PATTERNS).map(([ch, pat]) => [pat, ch])
    );

    const decodeCode39RunLengths = (runs, startIdx) => {
      let out = '';
      let idx = startIdx;
      while (idx + 9 <= runs.length) {
        const seg = runs.slice(idx, idx + 9);
        let minR = seg[0];
        let maxR = seg[0];
        for (let i = 1; i < 9; i++) {
          if (seg[i] < minR) minR = seg[i];
          if (seg[i] > maxR) maxR = seg[i];
        }
        if (minR <= 0 || maxR > minR * 6.5) break;

        // 5 bars (even indices 0,2,4,6,8): 2 wide, 3 narrow
        const barIndices = [0, 2, 4, 6, 8].sort((a, b) => seg[b] - seg[a]);
        // 4 spaces (odd indices 1,3,5,7): 1 wide, 3 narrow
        const spaceIndices = [1, 3, 5, 7].sort((a, b) => seg[b] - seg[a]);
        if (seg[barIndices[1]] <= seg[barIndices[2]] * 1.12) break;
        if (seg[spaceIndices[0]] <= seg[spaceIndices[1]] * 1.12) break;

        const wideSet = new Set([barIndices[0], barIndices[1], spaceIndices[0]]);
        let pat = '';
        for (let i = 0; i < 9; i++) {
          pat += wideSet.has(i) ? 'w' : 'n';
        }
        const ch = CODE39_REV_MAP[pat];
        if (!ch) break;
        out += ch;
        if (ch === '*' && out.length > 1) break;
        if (idx + 9 < runs.length) {
          const gap = runs[idx + 9];
          if (gap > maxR * 2.6) break;
        }
        idx += 10;
      }
      return out;
    };

    const scanCanvasForCode39 = (canvas, categoryKey) => {
      const result = { fullVin: '', fragments: [] };
      if (!canvas || !canvas.width || !canvas.height) return result;
      const w = canvas.width;
      const h = canvas.height;
      if (w < 120 || h < 20) return result;

      let imgData;
      try {
        imgData = canvas.getContext('2d').getImageData(0, 0, w, h).data;
      } catch (e) {
        return result;
      }

      // Precompute grayscale buffer
      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
        gray[i] = (imgData[p] * 77 + imgData[p + 1] * 150 + imgData[p + 2] * 29) >> 8;
      }

      const fragmentMap = new Map();
      const tiltOffsets = [0, -8, 8, -16, 16, -24, 24, -34, 34, -44, 44];
      const numRows = 64;
      const halfWin = 22;

      for (let r = 1; r < numRows; r++) {
        const y0 = Math.floor((h * r) / numRows);
        for (let t = 0; t < tiltOffsets.length; t++) {
          const dy = tiltOffsets[t];
          if (y0 + dy < 2 || y0 + dy >= h - 2) continue;

          // Sample scanline with 3px vertical averaging
          const line = new Uint8Array(w);
          const prefix = new Int32Array(w + 1);
          for (let x = 0; x < w; x++) {
            const y = Math.min(h - 2, Math.max(1, y0 + Math.round((dy * x) / w)));
            const rowOff = y * w + x;
            const val = (gray[rowOff - w] + gray[rowOff] + gray[rowOff + w]) / 3;
            line[x] = val;
            prefix[x + 1] = prefix[x] + val;
          }

          // Local adaptive binarization (1 = black bar, 0 = white space) and run-length encoding
          const runs = [];
          let prevBit = -1;
          let runLen = 0;
          for (let x = 0; x < w; x++) {
            const xL = Math.max(0, x - halfWin);
            const xR = Math.min(w - 1, x + halfWin);
            const localMean = (prefix[xR + 1] - prefix[xL]) / (xR - xL + 1);
            const bit = line[x] < localMean * 0.91 ? 1 : 0;
            if (bit === prevBit) {
              runLen++;
            } else {
              if (prevBit !== -1) runs.push(runLen);
              prevBit = bit;
              runLen = 1;
            }
          }
          if (runLen > 0) runs.push(runLen);

          // Try decoding starting at every black bar run (even indices if first run is black, odd if white)
          const firstBlackIdx = (line[0] < (prefix[Math.min(w, halfWin)] / Math.min(w, halfWin)) * 0.91) ? 0 : 1;
          for (let s = firstBlackIdx; s < runs.length - 49; s += 2) {
            const decoded = decodeCode39RunLengths(runs, s);
            if (!decoded || decoded.length < 6) continue;

            const hasStartStar = decoded.startsWith('*');
            const hasStopStar = decoded.endsWith('*') && decoded.length > 1;
            const core = decoded.replace(/^\*+|\*+$/g, '').replace(/[^A-Z0-9]/g, '');
            if (core.length < 5) continue;

            // Check if this scanline decoded a complete 17-char VIN!
            const full = extractVinFromBarcodeValue(core, categoryKey);
            if (full && isValidNorthAmericanVin(full)) {
              result.fullVin = full;
              return result;
            }

            // Record partial barcode fragment (e.g. "*5WFBF121" or "8HW071774*" or "9D7EF29LN814218*")
            if (core.length >= 5 && core.length <= 17 && (hasStopStar || hasStartStar || core.length >= 10)) {
              const prev = fragmentMap.get(core);
              fragmentMap.set(core, {
                text: core,
                hasStartStar: Boolean(prev?.hasStartStar || hasStartStar),
                hasStopStar: Boolean(prev?.hasStopStar || hasStopStar),
                hits: (prev?.hits || 0) + 1
              });
            }
          }
        }
      }

      result.fragments = Array.from(fragmentMap.values()).sort((a, b) => {
        const anchorScoreA = (a.hasStopStar || a.hasStartStar ? 100 : 0) + a.text.length * 4 + a.hits;
        const anchorScoreB = (b.hasStopStar || b.hasStartStar ? 100 : 0) + b.text.length * 4 + b.hits;
        return anchorScoreB - anchorScoreA;
      });

      const stitched = stitchBarcodeFragments(result.fragments);
      if (stitched) {
        result.fullVin = stitched;
      }
      return result;
    };

    const extractVinFromBarcodeValue = (rawVal, categoryKey) => {
      if (!rawVal) return '';
      const upperRaw = String(rawVal).toUpperCase().trim();

      // Strip common explicit prefixes like "VIN:", "V.I.N / N.I.V.", or Code-39 import prefix "I" on 18-char payloads
      const strippedPrefix = upperRaw.replace(/^(?:(?:V\.?I\.?N\.?|N\.?I\.?V\.?)(?:\s*(?:NO|NUMBER|#))?[:\s\-\/]+)+/, '');
      const tokens = strippedPrefix.split(/[^A-Z0-9]+/).filter(Boolean);

      for (let t = 0; t < tokens.length; t++) {
        let tok = tokens[t];
        if (tok.length === 18 && tok.startsWith('I')) {
          tok = tok.slice(1);
        }
        if (tok.length === 17) {
          const repaired = tryRepairSingleOcrSlipVin(tok);
          if (repaired) return repaired;
          const norm = posNormalizeVin17(tok);
          const digits = (norm.match(/\d/g) || []).length;
          const letters = (norm.match(/[A-Z]/g) || []).length;
          if (/^[A-HJ-NPR-Z0-9]{17}$/.test(norm) && !VIN_SPEC_NOISE_REGEX.test(norm) && digits >= 4 && letters >= 2) return norm;
        }
      }

      const cleaned = strippedPrefix.replace(/[^A-Z0-9]/g, '');
      if (cleaned.length === 18 && cleaned.startsWith('I')) {
        const sub17 = posNormalizeVin17(cleaned.slice(1));
        if (/^[A-HJ-NPR-Z0-9]{17}$/.test(sub17) && !VIN_SPEC_NOISE_REGEX.test(sub17)) return sub17;
      }
      // Sliding 17-char check for valid NHTSA check-digit VIN inside longer DataMatrix/QR/Code128 payloads
      for (let i = 0; i <= cleaned.length - 17; i++) {
        const slice17 = posNormalizeVin17(cleaned.slice(i, i + 17));
        if (isValidNorthAmericanVin(slice17)) return slice17;
      }
      const match17 = cleaned.match(/[A-HJ-NPR-Z0-9]{17}/);
      if (match17) {
        const v = posNormalizeVin17(match17[0]);
        const digits = (v.match(/\d/g) || []).length;
        const letters = (v.match(/[A-Z]/g) || []).length;
        if (!VIN_SPEC_NOISE_REGEX.test(v) && digits >= 4 && letters >= 2) return v;
      }
      if (categoryKey === 'container') {
        const isoMatch = cleaned.match(/[A-Z]{3}[UJZ]\d{6,7}/);
        if (isoMatch) return isoMatch[0];
      }
      if (categoryKey === 'boat_pwc') {
        const hinMatch = cleaned.match(/[A-Z]{3}[A-HJ-NPR-Z0-9]{5}[A-L]\d{3}/);
        if (hinMatch) return hinMatch[0];
      }
      return '';
    };

    const extractVinOrSerialFromOcrText = (rawText, categoryKey, barcodeFragments = []) => {
      if (!rawText) return '';
      const upper = String(rawText).toUpperCase();
      const hasTagContext = /\b(V\.?\s*I\.?\s*N\.?|N\.?\s*I\.?\s*V\.?|VEHICLE\s+IDENTIFICATION|IDENTIFICATION\s+NUMBER|GVWR|GAWR|PNBV|MFD\s+BY|MFG\s+BY|FABRIQUE|MANUFACTURED|CONFORMS\s+TO|TRAILER|SERIAL\s*(?:NO|NUMBER|#)|P\.?I\.?N\.?|PRODUCT\s+IDENTIFICATION|HULL\s+ID)/i.test(upper);

      // 0. If we have partial Code 39 barcode fragments from a scraped barcode, try fusing them with OCR text first
      if (barcodeFragments && barcodeFragments.length > 0) {
        const fused = fuseBarcodeFragmentsWithOcr(upper, barcodeFragments);
        if (fused) return fused;
      }

      // 1. Check explicitly labeled VIN / N.I.V. / PIN lines (handles "V.I.N.. : 1D9D7EF29LN814218" and "V.I.N / N.I.V. 4P53F3729V3074758")
      const labeledVinRegex = /(?:V\.?\s*I\.?\s*N\.?|N\.?\s*I\.?\s*V\.?|VEHICLE\s+IDENTIFICATION(?:\s+(?:NO\.?|NUMBER|#))?|P\.?\s*I\.?\s*N\.?)(?:\s*[\/\\|]\s*(?:N\.?\s*I\.?\s*V\.?|V\.?\s*I\.?\s*N\.?))?(?:\s*(?:NO\.?|NUMBER|#))?[\s:#.\-\/;]*([A-Z0-9][A-Z0-9 \-.]{13,30})/g;
      let m;
      while ((m = labeledVinRegex.exec(upper)) !== null) {
        const rawCandidate = m[1].replace(/^(?:N\.?\s*I\.?\s*V\.?|V\.?\s*I\.?\s*N\.?)[\s:#.\-\/;]*/, '');
        const compact = rawCandidate.replace(/[^A-Z0-9]/g, '');
        if (compact.length >= 17) {
          for (let i = 0; i <= Math.min(compact.length - 17, 6); i++) {
            const sub17 = compact.slice(i, i + 17);
            const repaired = tryRepairSingleOcrSlipVin(sub17, true);
            if (repaired) return repaired;
          }
          if (compact.length >= 18) {
            const repaired18 = tryRepairExtraCharVin18(compact.slice(0, 18));
            if (repaired18) return repaired18;
          }
          const first17 = posNormalizeVin17(compact.slice(0, 17));
          const digits = (first17.match(/\d/g) || []).length;
          const letters = (first17.match(/[A-Z]/g) || []).length;
          if (
            /^[A-HJ-NPR-Z0-9]{17}$/.test(first17) &&
            !VIN_SPEC_NOISE_REGEX.test(first17) &&
            !/[0UZIOQ]/.test(first17[9]) &&
            digits >= 5 &&
            letters >= 2
          ) {
            return first17;
          }
        }
      }

      // Collect all 17-char sliding windows from contiguous alphanumeric runs of length 17..28
      const candidateWindows17 = [];
      const longRuns = upper.match(/[A-Z0-9]{17,28}/g) || [];
      for (let r = 0; r < longRuns.length; r++) {
        const run = longRuns[r];
        for (let i = 0; i <= run.length - 17; i++) {
          candidateWindows17.push(run.slice(i, i + 17));
        }
      }

      // 2. Direct valid check-digit 17-char VIN match from contiguous runs
      for (let i = 0; i < candidateWindows17.length; i++) {
        const norm = posNormalizeVin17(candidateWindows17[i]);
        if (isValidNorthAmericanVin(norm)) return norm;
      }

      // 3. Try 1-char and 2-char OCR slip repair on contiguous 17-char candidate windows BEFORE space-stripping lines
      for (let i = 0; i < candidateWindows17.length; i++) {
        const norm = posNormalizeVin17(candidateWindows17[i]);
        if (hasTagContext || /\d{5,6}$/.test(norm)) {
          const repaired = tryRepairSingleOcrSlipVin(candidateWindows17[i], false);
          if (repaired) return repaired;
        }
      }

      // 3a. Try 18-char split-character repair on contiguous 18-char runs (e.g. faded "5WFBF1218HW071774" read as "5WEFBF1218HW071774")
      for (let r = 0; r < longRuns.length; r++) {
        const run = longRuns[r];
        if (run.length === 18 && /\d{5,6}$/.test(posNormalizeVin17(run.slice(1)))) {
          const repaired18 = tryRepairExtraCharVin18(run);
          if (repaired18) return repaired18;
        }
      }

      // 3b. Try OCR slip repair on lines explicitly containing VIN/N.I.V./IDENTIFICATION keywords
      const lines = upper.split(/\r?\n/);
      for (let l = 0; l < lines.length; l++) {
        const line = lines[l];
        if (/(?:V\.?\s*I\.?\s*N|N\.?\s*I\.?\s*V|IDENTIFICATION)/i.test(line)) {
          const afterLabel = line.replace(/^.*?(?:N\.?\s*I\.?\s*V\.?|V\.?\s*I\.?\s*N\.?|IDENTIFICATION(?:\s+NUMBER)?)[\s:#.\-\/;]*/i, '');
          const cleanedLine = afterLabel.replace(/[^A-Z0-9]/g, '');
          if (cleanedLine.length >= 17 && cleanedLine.length <= 32) {
            for (let i = 0; i <= cleanedLine.length - 17; i++) {
              const sub17 = cleanedLine.slice(i, i + 17);
              const repaired = tryRepairSingleOcrSlipVin(sub17, true);
              if (repaired) return repaired;
            }
          }
        }
      }

      // 3c. Check non-spec lines where OCR inserted spaces/hyphens inside a 17-char VIN
      // Never strip spaces across weight/tire/pressure spec lines (GVWR, GAWR, PNBV, KPA, PSI, TIRE, RIMS)
      const specLineRegex = /\b(GVWR|GAWR|PNBV|PNBE|KPA|PSI|TIRE|TIRES|RIM|RIMS|COLD|AXLE|CARGO|CAPACITY|PRESSURE|CONFORMS)\b/i;
      const vinKeywordRegex = /(?:V\.?\s*I\.?\s*N|N\.?\s*I\.?\s*V|IDENTIFICATION|P\.?\s*I\.?\s*N)/i;
      for (let l = 0; l < lines.length; l++) {
        const line = lines[l];
        if (specLineRegex.test(line) && !vinKeywordRegex.test(line)) continue;
        const strippedLine = line.replace(/[^A-Z0-9]/g, '');
        if (strippedLine.length >= 17 && strippedLine.length <= 36) {
          for (let i = 0; i <= strippedLine.length - 17; i++) {
            const sub = posNormalizeVin17(strippedLine.slice(i, i + 17));
            if (isValidNorthAmericanVin(sub)) return sub;
          }
        }
      }

      // 4. Accept structurally valid 17-char VIN/PIN (e.g. Kubota/equipment PINs without NHTSA Mod-11 check digit)
      for (let i = 0; i < candidateWindows17.length; i++) {
        const norm = posNormalizeVin17(candidateWindows17[i]);
        const digits = (norm.match(/\d/g) || []).length;
        const letters = (norm.match(/[A-Z]/g) || []).length;
        if (
          /^[A-HJ-NPR-Z0-9]{17}$/.test(norm) &&
          !VIN_SPEC_NOISE_REGEX.test(norm) &&
          !/[0UZIOQ]/.test(norm[9]) &&
          digits >= 5 &&
          letters >= 3 &&
          (hasTagContext || /^[1-57A-HJ-NPR-Z][A-HJ-NPR-Z0-9]{10}\d{6}$/.test(norm))
        ) {
          return norm;
        }
      }

      // 5. Shipping Container ISO 6346 Box ID (e.g. MSCU 123456 7)
      const containerMatch = upper.match(/\b([A-Z]{3}[UJZ])\s*[- ]?\s*(\d{6})\s*[- ]?\s*(\d)\b/);
      if (containerMatch) {
        return `${containerMatch[1]}${containerMatch[2]}${containerMatch[3]}`;
      }

      // 6. Boat / PWC 12-char USCG Hull Identification Number (HIN)
      if (categoryKey === 'boat_pwc' || /\b(H\.?I\.?N\.?|HULL)\b/.test(upper)) {
        const hinMatch = upper.match(/\b(?:US\s*[- ]?\s*)?([A-Z]{3}[A-HJ-NPR-Z0-9]{5}[A-L]\d{3})\b/);
        if (hinMatch) return hinMatch[1];
      }

      // 7. Explicitly labeled Serial Number on Tractor / Equipment / Trailer plates
      const serialRegex = /(?:SERIAL\s*(?:NO\.?|NUMBER|#)|S\/N)\s*[:#.\-]?\s*([A-Z0-9][A-Z0-9\-]{5,17})/g;
      while ((m = serialRegex.exec(upper)) !== null) {
        const candidate = m[1].replace(/^-+|-+$/g, '');
        const cleanAlnum = candidate.replace(/[^A-Z0-9]/g, '');
        const digits = (cleanAlnum.match(/\d/g) || []).length;
        if (
          cleanAlnum.length >= 6 &&
          cleanAlnum.length <= 17 &&
          digits >= 3 &&
          !/^(207|603|800|888)\d{7}$/.test(cleanAlnum)
        ) {
          return candidate;
        }
      }

      return '';
    };

    // Detect whether a File/Blob is an Apple HEIC/HEIF image (by extension, MIME, or ISO base media magic bytes)
    const isHeicOrHeifFile = async (file) => {
      if (!file) return false;
      const name = String(file.name || '').toLowerCase();
      const type = String(file.type || '').toLowerCase();
      if (name.endsWith('.heic') || name.endsWith('.heif') || type.includes('heic') || type.includes('heif')) {
        return true;
      }
      try {
        const headerBuf = await file.slice(0, 16).arrayBuffer();
        const bytes = new Uint8Array(headerBuf);
        if (bytes.length >= 12) {
          const ascii = String.fromCharCode(...bytes);
          if (ascii.includes('ftyp') && /(heic|heix|hevc|heim|heis|hevm|hevs|mif1|msf1)/i.test(ascii)) {
            return true;
          }
        }
      } catch (e) {}
      return false;
    };

    // Convert HEIC/HEIF File/Blob to a universally decodable JPEG File/Blob (works in Chrome, Edge, Firefox & Safari)
    const ensureDecodableImageBlob = (file) => {
      if (!file) return Promise.resolve(file);
      if (file._decodedBlobPromise) return file._decodedBlobPromise;

      file._decodedBlobPromise = (async () => {
        const isHeic = await isHeicOrHeifFile(file);
        if (!isHeic) return file;

        const baseName = String(file.name || 'photo').replace(/\.(heic|heif)$/i, '') + '.jpg';
        const wrapAsFile = (blob) => {
          if (!blob) return null;
          try {
            return new File([blob], baseName, { type: 'image/jpeg', lastModified: Date.now() });
          } catch (e) {
            return blob;
          }
        };

        // 1. If running on local preview server, try fast native macOS sips conversion endpoint first (<100ms)
        if (
          typeof window !== 'undefined' &&
          (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ) {
          try {
            const resp = await fetch('/api/convert-heic', {
              method: 'POST',
              headers: { 'Content-Type': 'application/octet-stream' },
              body: file
            });
            if (resp.ok && (resp.headers.get('content-type') || '').includes('image/jpeg')) {
              const jpegBlob = await resp.blob();
              if (jpegBlob && jpegBlob.size > 1000) {
                return wrapAsFile(jpegBlob);
              }
            }
          } catch (localErr) {
            // Fall through to in-browser WASM HEIC decoders
          }
        }

        // 2. Modern heic-to (libheif 1.18+ WASM — supports iPhone 15/16/17 Pro Max grid HEICs)
        try {
          for (let tries = 0; tries < 12 && !window.HeicTo && !window.heicTo; tries++) {
            await new Promise((r) => setTimeout(r, 150));
          }
          let heicToFn =
            typeof window.HeicTo === 'function'
              ? window.HeicTo
              : typeof window.HeicTo?.heicTo === 'function'
              ? window.HeicTo.heicTo
              : typeof window.heicTo === 'function'
              ? window.heicTo
              : null;

          if (!heicToFn) {
            try {
              const mod = await import('https://cdn.jsdelivr.net/npm/heic-to@1/+esm');
              heicToFn = mod?.heicTo || mod?.default?.heicTo || (typeof mod?.default === 'function' ? mod.default : null);
            } catch (esmErr) {}
          }

          if (heicToFn) {
            const converted = await heicToFn({
              blob: file,
              type: 'image/jpeg',
              quality: 0.92
            });
            const outBlob = Array.isArray(converted) ? converted[0] : converted;
            if (outBlob && outBlob.size > 1000) {
              return wrapAsFile(outBlob);
            }
          }
        } catch (heicToErr) {
          console.warn('heic-to conversion notice, trying fallback:', heicToErr);
        }

        // 3. Fallback to heic2any if available
        try {
          if (typeof window.heic2any === 'function') {
            const converted = await window.heic2any({
              blob: file,
              toType: 'image/jpeg',
              quality: 0.9
            });
            const outBlob = Array.isArray(converted) ? converted[0] : converted;
            if (outBlob && outBlob.size > 1000) {
              return wrapAsFile(outBlob);
            }
          }
        } catch (heic2anyErr) {
          console.warn('heic2any fallback notice:', heic2anyErr);
        }

        // 4. Safari native HEIC decode fallback (ensure explicit image/heic MIME type)
        try {
          return new Blob([file], { type: 'image/heic' });
        } catch (e) {
          return file;
        }
      })();

      return file._decodedBlobPromise;
    };

    // Shared queued Tesseract.js worker so multiple photos reuse one WASM instance cleanly
    let sharedTesseractWorkerPromise = null;
    let tesseractJobChain = Promise.resolve();

    const getSharedTesseractWorker = async () => {
      if (sharedTesseractWorkerPromise) return sharedTesseractWorkerPromise;
      if (typeof window === 'undefined') return null;
      for (let tries = 0; tries < 25 && !window.Tesseract; tries++) {
        await new Promise((r) => setTimeout(r, 200));
      }
      if (!window.Tesseract) return null;
      sharedTesseractWorkerPromise = window.Tesseract.createWorker('eng')
        .catch((err) => {
          console.warn('Tesseract worker init error:', err);
          sharedTesseractWorkerPromise = null;
          return null;
        });
      return sharedTesseractWorkerPromise;
    };

    // Pre-warm Tesseract worker in background after initial page render
    if (typeof window !== 'undefined') {
      setTimeout(() => {
        if (window.Tesseract) getSharedTesseractWorker();
      }, 1200);
    }

    const createCroppedCanvasFromImage = (img, rx, ry, rw, rh, maxWidth = 1800, enhanceContrast = false) => {
      const natW = img.naturalWidth || img.width || 1200;
      const natH = img.naturalHeight || img.height || 900;
      const sx = Math.max(0, Math.round(natW * rx));
      const sy = Math.max(0, Math.round(natH * ry));
      const sw = Math.max(1, Math.min(natW - sx, Math.round(natW * rw)));
      const sh = Math.max(1, Math.min(natH - sy, Math.round(natH * rh)));

      let dw = sw;
      let dh = sh;
      if (dw > maxWidth) {
        dh = Math.max(1, Math.round((dh * maxWidth) / dw));
        dw = maxWidth;
      } else if (dw < 900 && sw > 200) {
        // Upscale small barcode/text crops slightly for sharper recognition
        const scale = Math.min(1.6, 1100 / dw);
        dw = Math.round(dw * scale);
        dh = Math.round(dh * scale);
      }

      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, dw);
      canvas.height = Math.max(1, dh);
      const ctx = canvas.getContext('2d');
      if (enhanceContrast) {
        try {
          ctx.filter = 'grayscale(100%) contrast(125%)';
        } catch (e) {}
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas;
    };

    // Isolates true black printed ink while erasing medium-gray scrapes, smudges, and thin horizontal laminate tear lines
    const createInkIsolatedCanvas = (sourceCanvas, thresholdRatio = 0.42, removeThinHorizontalLines = true) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) return sourceCanvas;
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = w;
      outCanvas.height = h;
      const outCtx = outCanvas.getContext('2d');

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, w, h);
      } catch (e) {
        return sourceCanvas;
      }

      const data = srcData.data;
      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
        gray[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
      }

      // Compute 80th-percentile local background luminance in 64x64 blocks
      const blockSize = 64;
      const bw = Math.ceil(w / blockSize);
      const bh = Math.ceil(h / blockSize);
      const bgGrid = new Uint8Array(bw * bh);
      const hist = new Int32Array(256);

      for (let by = 0; by < bh; by++) {
        const y0 = by * blockSize;
        const y1 = Math.min(h, y0 + blockSize);
        for (let bx = 0; bx < bw; bx++) {
          const x0 = bx * blockSize;
          const x1 = Math.min(w, x0 + blockSize);
          hist.fill(0);
          let count = 0;
          for (let y = y0; y < y1; y += 2) {
            const rowOff = y * w;
            for (let x = x0; x < x1; x += 2) {
              hist[gray[rowOff + x]]++;
              count++;
            }
          }
          const target = Math.floor(count * 0.8);
          let acc = 0;
          let p80 = 200;
          for (let v = 0; v < 256; v++) {
            acc += hist[v];
            if (acc >= target) {
              p80 = Math.max(90, v);
              break;
            }
          }
          bgGrid[by * bw + bx] = p80;
        }
      }

      // Threshold at true ink (lum < localBg * thresholdRatio), turning medium-gray scrapes (90..150) into pure white (0 = white, 1 = black ink)
      const mask = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        const by = Math.min(bh - 1, (y / blockSize) | 0);
        const rowOff = y * w;
        for (let x = 0; x < w; x++) {
          const bx = Math.min(bw - 1, (x / blockSize) | 0);
          const bg = bgGrid[by * bw + bx];
          if (gray[rowOff + x] < bg * thresholdRatio) {
            mask[rowOff + x] = 1;
          }
        }
      }

      // Optional: erase 1-2px thin horizontal laminate tear lines where vertical black run in [y-4..y+4] is <= 3px
      const outData = outCtx.createImageData(w, h);
      const outPixels = outData.data;
      for (let y = 0; y < h; y++) {
        const rowOff = y * w;
        const yMin = Math.max(0, y - 4);
        const yMax = Math.min(h - 1, y + 4);
        for (let x = 0; x < w; x++) {
          let isInk = mask[rowOff + x] === 1;
          if (isInk && removeThinHorizontalLines) {
            let vCount = 0;
            for (let yy = yMin; yy <= yMax; yy++) {
              vCount += mask[yy * w + x];
            }
            if (vCount <= 2) {
              isInk = false;
            }
          }
          const val = isInk ? 0 : 255;
          const p = (rowOff + x) << 2;
          outPixels[p] = val;
          outPixels[p + 1] = val;
          outPixels[p + 2] = val;
          outPixels[p + 3] = 255;
        }
      }

      outCtx.putImageData(outData, 0, 0);
      return outCanvas;
    };

    // Local 32x32 tile adaptive contrast normalization (CLAHE-like) that restores faded/rubbed-off thermal print
    // on metallic silver stickers (e.g. IMG_2044) and sharpens low-contrast Code 39 barcodes
    const createLocalContrastCanvas = (sourceCanvas) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) return sourceCanvas;
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = w;
      outCanvas.height = h;
      const outCtx = outCanvas.getContext('2d');

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, w, h);
      } catch (e) {
        return sourceCanvas;
      }

      const data = srcData.data;
      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
        gray[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
      }

      const tile = 32;
      const gw = Math.ceil(w / tile) + 1;
      const gh = Math.ceil(h / tile) + 1;
      const pLow = new Uint8Array(gw * gh);
      const pHigh = new Uint8Array(gw * gh);
      const hist = new Int32Array(256);

      for (let ty = 0; ty < gh; ty++) {
        const y0 = Math.max(0, Math.min(h - tile, ty * tile - (tile >> 1)));
        const y1 = Math.min(h, y0 + tile);
        for (let tx = 0; tx < gw; tx++) {
          const x0 = Math.max(0, Math.min(w - tile, tx * tile - (tile >> 1)));
          const x1 = Math.min(w, x0 + tile);
          hist.fill(0);
          let cnt = 0;
          for (let y = y0; y < y1; y += 2) {
            const ro = y * w;
            for (let x = x0; x < x1; x += 2) {
              hist[gray[ro + x]]++;
              cnt++;
            }
          }
          const tLo = Math.floor(cnt * 0.08);
          const tHi = Math.floor(cnt * 0.85);
          let acc = 0;
          let lo = 0;
          let hi = 255;
          let gotLo = false;
          for (let v = 0; v < 256; v++) {
            acc += hist[v];
            if (!gotLo && acc >= tLo) {
              lo = v;
              gotLo = true;
            }
            if (acc >= tHi) {
              hi = v;
              break;
            }
          }
          if (hi - lo < 16) lo = Math.max(0, hi - 60);
          pLow[ty * gw + tx] = lo;
          pHigh[ty * gw + tx] = hi;
        }
      }

      const outData = outCtx.createImageData(w, h);
      const outPixels = outData.data;
      for (let y = 0; y < h; y++) {
        const fy = y / tile;
        const ty0 = Math.min(gh - 2, fy | 0);
        const wy = fy - ty0;
        const ro = y * w;
        for (let x = 0; x < w; x++) {
          const fx = x / tile;
          const tx0 = Math.min(gw - 2, fx | 0);
          const wx = fx - tx0;
          const i00 = ty0 * gw + tx0;
          const lo =
            pLow[i00] * (1 - wx) * (1 - wy) +
            pLow[i00 + 1] * wx * (1 - wy) +
            pLow[i00 + gw] * (1 - wx) * wy +
            pLow[i00 + gw + 1] * wx * wy;
          const hi =
            pHigh[i00] * (1 - wx) * (1 - wy) +
            pHigh[i00 + 1] * wx * (1 - wy) +
            pHigh[i00 + gw] * (1 - wx) * wy +
            pHigh[i00 + gw + 1] * wx * wy;
          const norm = Math.max(0, Math.min(255, ((gray[ro + x] - lo) * 255) / Math.max(18, hi - lo)));
          const val = norm < 135 ? 0 : norm | 0;
          const p = (ro + x) << 2;
          outPixels[p] = val;
          outPixels[p + 1] = val;
          outPixels[p + 2] = val;
          outPixels[p + 3] = 255;
        }
      }

      outCtx.putImageData(outData, 0, 0);
      return outCanvas;
    };

    // Creates a rotated (90 deg CW or CCW) canvas from a vertical strip (for vertical backup VINs printed on trailer tags)
    const createRotatedCropCanvasFromImage = (img, rx, ry, rw, rh, clockwise = false, maxLongSide = 1600) => {
      const baseCrop = createCroppedCanvasFromImage(img, rx, ry, rw, rh, maxLongSide, false);
      const cw = baseCrop.width;
      const ch = baseCrop.height;
      const rotCanvas = document.createElement('canvas');
      rotCanvas.width = ch;
      rotCanvas.height = cw;
      const ctx = rotCanvas.getContext('2d');
      ctx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
      ctx.rotate((clockwise ? 90 : -90) * (Math.PI / 180));
      ctx.drawImage(baseCrop, -cw / 2, -ch / 2);
      return rotCanvas;
    };

    const loadImageCanvasesForScan = async (file) => {
      if (!file) return null;
      const decodableBlob = await ensureDecodableImageBlob(file);
      if (!decodableBlob) return null;

      return new Promise((resolve) => {
        let objectUrl = '';
        try {
          objectUrl = URL.createObjectURL(decodableBlob);
        } catch (e) {
          return resolve(null);
        }

        const img = new Image();
        let settled = false;
        const finish = (val) => {
          if (settled) return;
          settled = true;
          if (objectUrl) {
            try { URL.revokeObjectURL(objectUrl); } catch (e) {}
          }
          resolve(val);
        };

        const timer = setTimeout(() => finish(null), 10000);

        img.onload = () => {
          clearTimeout(timer);
          try {
            // Crop directly from full native camera resolution (e.g. 4032x3024) so barcodes & text stay razor-sharp
            const fullCanvas = createCroppedCanvasFromImage(img, 0, 0, 1, 1, 2000, false);
            const stickerCenterCanvas = createCroppedCanvasFromImage(img, 0.06, 0.14, 0.88, 0.72, 1800, false);
            const vinBandCanvas = createCroppedCanvasFromImage(img, 0.06, 0.34, 0.88, 0.36, 1800, false);
            // Left/center text crop excludes right-hand barcode bars so OCR reads "V.I.N / N.I.V." or "V.I.N.. :" cleanly
            const vinLeftTextCanvas = createCroppedCanvasFromImage(img, 0.06, 0.34, 0.58, 0.32, 1600, false);
            // Local contrast-normalized crops restore faded thermal print on metallic tags (IMG_2044) & boost barcodes
            const localContrastLeftCanvas = createLocalContrastCanvas(vinLeftTextCanvas);
            const localContrastBandCanvas = createLocalContrastCanvas(vinBandCanvas);
            // Scrape-erased ink-isolated crops turn medium-gray scrapes & thin laminate tear lines into pure white (IMG_4623)
            const inkIsolatedLeftCanvas = createInkIsolatedCanvas(vinLeftTextCanvas, 0.42, true);
            const inkIsolatedBandCanvas = createInkIsolatedCanvas(vinBandCanvas, 0.42, true);
            // Right/middle and left/middle native-res barcode crops cover both right-side (IMG_2270) and left-side (IMG_4623, IMG_2044) barcodes
            const barcodeRightZoomCanvas = createCroppedCanvasFromImage(img, 0.42, 0.32, 0.52, 0.40, 1800, false);
            const barcodeLeftZoomCanvas = createCroppedCanvasFromImage(img, 0.06, 0.36, 0.56, 0.30, 1800, false);
            const barcodeLeftContrastCanvas = createLocalContrastCanvas(barcodeLeftZoomCanvas);
            const contrastCenterCanvas = createCroppedCanvasFromImage(img, 0.06, 0.14, 0.88, 0.72, 1600, true);
            // Vertical backup VIN strip on the right side / far right edge of trailer stickers (rotated 90° CCW and 90° CW)
            const verticalRightCCW = createRotatedCropCanvasFromImage(img, 0.58, 0.18, 0.42, 0.68, false, 1500);
            const verticalRightCW = createRotatedCropCanvasFromImage(img, 0.58, 0.18, 0.42, 0.68, true, 1500);

            finish({
              barcodeCanvases: [
                barcodeLeftZoomCanvas,
                barcodeLeftContrastCanvas,
                barcodeRightZoomCanvas,
                vinBandCanvas,
                stickerCenterCanvas,
                fullCanvas
              ],
              code39Canvases: [
                barcodeLeftContrastCanvas,
                barcodeLeftZoomCanvas,
                localContrastBandCanvas,
                vinBandCanvas,
                barcodeRightZoomCanvas
              ],
              ocrCanvases: [
                localContrastLeftCanvas,
                inkIsolatedLeftCanvas,
                localContrastBandCanvas,
                inkIsolatedBandCanvas,
                vinLeftTextCanvas,
                vinBandCanvas,
                verticalRightCCW,
                verticalRightCW,
                stickerCenterCanvas,
                fullCanvas,
                contrastCenterCanvas
              ]
            });
          } catch (err) {
            finish(null);
          }
        };

        img.onerror = () => {
          clearTimeout(timer);
          finish(null);
        };

        img.src = objectUrl;
      });
    };

    const scanImageFileForVin = async (file, categoryKey) => {
      if (!file) return '';
      const isVideo = file.type?.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name || '');
      if (isVideo) return '';

      try {
        const canvases = await loadImageCanvasesForScan(file);
        if (!canvases) return '';

        // Pass 1A: Fast native BarcodeDetector across zoomed barcode regions, band, center, and full frame
        if (typeof window !== 'undefined' && 'BarcodeDetector' in window) {
          try {
            let formats = ['code_39', 'code_128', 'codabar', 'itf', 'data_matrix', 'pdf417', 'qr_code'];
            if (typeof window.BarcodeDetector.getSupportedFormats === 'function') {
              const supported = await window.BarcodeDetector.getSupportedFormats();
              formats = formats.filter((f) => supported.includes(f));
            }
            if (formats.length > 0) {
              const detector = new window.BarcodeDetector({ formats });
              for (let c = 0; c < canvases.barcodeCanvases.length; c++) {
                try {
                  const barcodes = await detector.detect(canvases.barcodeCanvases[c]);
                  for (let i = 0; i < (barcodes || []).length; i++) {
                    const found = extractVinFromBarcodeValue(barcodes[i]?.rawValue, categoryKey);
                    if (found) return found;
                  }
                } catch (e) {}
              }
            }
          } catch (barcodeErr) {}
        }

        // Pass 1B: ZXing Multi-Format Barcode Reader fallback on zoomed barcode canvases
        if (typeof window !== 'undefined' && window.ZXing && typeof window.ZXing.BrowserMultiFormatReader === 'function') {
          try {
            const zxingReader = new window.ZXing.BrowserMultiFormatReader();
            for (let c = 0; c < Math.min(3, canvases.barcodeCanvases.length); c++) {
              try {
                const dataUrl = canvases.barcodeCanvases[c].toDataURL('image/jpeg', 0.92);
                const res = await zxingReader.decodeFromImageUrl(dataUrl);
                if (res && res.getText) {
                  const found = extractVinFromBarcodeValue(res.getText(), categoryKey);
                  if (found) return found;
                }
              } catch (zErr) {}
            }
          } catch (zxingInitErr) {}
        }

        // Pass 1C: Custom multi-scanline Code 39 decoder (reads intact scanlines of scraped/creased barcodes & stitches fragments)
        const barcodeFragmentsMap = new Map();
        for (let c = 0; c < (canvases.code39Canvases || []).length; c++) {
          const c39 = scanCanvasForCode39(canvases.code39Canvases[c], categoryKey);
          if (c39.fullVin) return c39.fullVin;
          for (let f = 0; f < c39.fragments.length; f++) {
            const frag = c39.fragments[f];
            const prev = barcodeFragmentsMap.get(frag.text);
            barcodeFragmentsMap.set(frag.text, {
              text: frag.text,
              hasStartStar: Boolean(prev?.hasStartStar || frag.hasStartStar),
              hasStopStar: Boolean(prev?.hasStopStar || frag.hasStopStar),
              hits: (prev?.hits || 0) + (frag.hits || 1)
            });
          }
        }
        const barcodeFragments = Array.from(barcodeFragmentsMap.values());
        const crossStitched = stitchBarcodeFragments(barcodeFragments);
        if (crossStitched) return crossStitched;

        // Pass 2: Queued Multi-Crop Tesseract.js OCR (with scrape-erased canvases + partial barcode fragment fusion)
        const runOcr = () =>
          new Promise(async (resolve) => {
            const timeout = setTimeout(() => resolve(''), 28000);
            try {
              const worker = await getSharedTesseractWorker();
              if (!worker) {
                clearTimeout(timeout);
                return resolve('');
              }
              let combinedText = '';
              for (let c = 0; c < canvases.ocrCanvases.length; c++) {
                const res = await worker.recognize(canvases.ocrCanvases[c]);
                const text = res?.data?.text || '';
                if (text) {
                  const found = extractVinOrSerialFromOcrText(text, categoryKey, barcodeFragments);
                  if (found) {
                    clearTimeout(timeout);
                    return resolve(found);
                  }
                  combinedText += '\n' + text;
                  const combinedFound = extractVinOrSerialFromOcrText(combinedText, categoryKey, barcodeFragments);
                  if (combinedFound) {
                    clearTimeout(timeout);
                    return resolve(combinedFound);
                  }
                }
              }
              clearTimeout(timeout);
              resolve(extractVinOrSerialFromOcrText(combinedText, categoryKey, barcodeFragments));
            } catch (ocrErr) {
              clearTimeout(timeout);
              resolve('');
            }
          });

        const nextJob = tesseractJobChain.then(runOcr, runOcr);
        tesseractJobChain = nextJob.then(() => {}, () => {});
        return await nextJob;
      } catch (err) {
        console.warn('VIN scan error:', err);
        return '';
      }
    };

    // --- REVISED CATEGORIES (NO IMAGE/EMOJI ICONS) ---
    const CATEGORIES = {
      rv: {
        label: 'RV / Camper',
        desc: 'Travel trailers, 5th wheels, motorhomes, toy haulers & truck campers',
        subtypes: ['Travel Trailer', 'Fifth Wheel', 'Toy Hauler', 'Class C Motorhome', 'Class A Motorhome', 'Class B / Van', 'Pop-Up', 'Truck Camper'],
        isHours: false
      },
      trailer: {
        label: 'Trailer',
        desc: 'Dump trailers, cargo/enclosed, equipment haulers, utility, tilt & goosenecks',
        subtypes: ['Dump Trailer', 'Cargo / Enclosed', 'Equipment Hauler', 'Utility / Landscape', 'Gooseneck / Deckover', 'Tilt Bed', 'Snowmobile / ATV Trailer'],
        isHours: false
      },
      tractor: {

        desc: 'Sub-compact, compact & utility tractors with loaders & attachments',
        subtypes: ['Sub-Compact (<25 HP)', 'Compact Tractor (25-50 HP)', 'Utility Tractor (50+ HP)', 'Commercial Mower', 'Tractor Loader Backhoe'],
        isHours: true
      },
      equipment: {

        subtypes: ['Compact Track Loader (CTL)', 'Skid Steer (Wheeled)', 'Mini Excavator', 'Backhoe Loader', 'Attachments'],
        isHours: true
      },
      powersports: {

        subtypes: ['UTV / Side-by-Side', 'ATV / 4-Wheeler', 'Snowmobile', 'Youth Powersports'],

    function normalizeInquiry(inq) {
      if (!inq || typeof inq !== 'object') return null;
      if (inq.id === '_config_email_routing' || inq.isConfigDoc) return null;
      const rawRef = inq.referenceId || inq.id || '';
      const cleanRef = String(rawRef).replace(/^SR1-SELL-/i, '') || String(Math.floor(1000 + Math.random() * 9000));
      const id = inq.id || `inq-${cleanRef}`;
      
      const unit = inq.unit && typeof inq.unit === 'object' ? inq.unit : {};
      const customer = inq.customer && typeof inq.customer === 'object' ? inq.customer : {};
      const financials = inq.financials && typeof inq.financials === 'object' ? inq.financials : {};

      const isArchived = inq.isArchived !== undefined ? !!inq.isArchived : (inq.stage === 'archived');
      const stage = inq.stage && STAGES[inq.stage] ? inq.stage : (isArchived ? 'archived' : 'new');

      return {
        ...inq,
        id,
        referenceId: cleanRef,
        createdAt: inq.createdAt || new Date().toISOString(),
        updatedAt: inq.updatedAt || new Date().toISOString(),
        stage,
        isArchived,
        archivedAt: inq.archivedAt || null,
        archivedBy: inq.archivedBy || null,
        previousStage: inq.previousStage || (stage !== 'archived' ? stage : 'new'),
        intent: inq.intent === 'trade' ? 'trade' : 'sell',
        workingWithSalesperson: inq.workingWithSalesperson || 'no',
        salespersonName: inq.salespersonName || '',
        assignedStaffName: inq.assignedStaffName || '',
        preferredLocation: inq.preferredLocation || inq.dealershipLocation || 'turner_me',
        customer: {
          firstName: customer.firstName || 'Client',
          lastName: customer.lastName || '',
          email: customer.email || '',
          phone: customer.phone || '',
          preferredContact: customer.preferredContact || 'phone',
          city: customer.city || '',
          state: customer.state || '',
          zipCode: customer.zipCode || ''
        },
        unit: {
          category: unit.category || 'other',
          subcategory: unit.subcategory || 'Equipment',
          year: unit.year || '',
          make: unit.make || 'Unknown Make',
          model: unit.model || '',
          trimOrFloorplan: unit.trimOrFloorplan || '',
          vinOrSerial: unit.vinOrSerial || 'VIN-PENDING',
          mileageOrHours: Number(unit.mileageOrHours) || 0,
          isHours: !!unit.isHours,
          specs: unit.specs && typeof unit.specs === 'object' ? unit.specs : {},
          condition: unit.condition || 'Good',
          conditionNotes: unit.conditionNotes || '',
          tireOrTrackCondition: unit.tireOrTrackCondition || '',
          knownIssuesOrDamage: unit.knownIssuesOrDamage || ''
        },
        financials: {
          titleStatus: financials.titleStatus || 'Owned outright',
          lienHolderName: financials.lienHolderName || financials.lienHolder || inq.lienHolderName || inq.lienHolder || '',
          estimatedPayoff: Number(financials.estimatedPayoff) || 0,
          askingPrice: Number(financials.askingPrice) || 0
        },
        photos: Array.isArray(inq.photos) ? inq.photos : [],
        offers: Array.isArray(inq.offers) ? inq.offers : [],
        notes: Array.isArray(inq.notes) ? inq.notes : [],
        seenBy: Array.isArray(inq.seenBy) ? inq.seenBy : [],
        outreach: (inq.outreach && typeof inq.outreach === 'object') ? {
          reachedOut: !!inq.outreach.reachedOut,
          staffName: inq.outreach.staffName || '',
          reachedOutAt: inq.outreach.reachedOutAt || null
        } : { reachedOut: false, staffName: '', reachedOutAt: null }
      };
    }

      if (!locId) return 'SR1 Turner, ME';
      const found = LOCATIONS.find(l => l.id === locId || l.name === locId);
      if (found) return found.name;
      const legacyMap = {
        'turner_me': 'SR1 Turner, ME',
        'manchester_me': 'SR1 Manchester, ME',

        'houlton_me': 'SR1 Houlton, ME',
        'caribou_me': 'SR1 Caribou, ME'
      };
      return legacyMap[locId] || locId;
    }

    function formatInquiryDate(dateStr) {
      if (!dateStr) return { date: 'Recently', time: '' };
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return { date: 'Recently', time: '' };
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const dateFormatted = isToday 
          ? 'Today' 
          : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
        const timeFormatted = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return { date: dateFormatted, time: timeFormatted };
      } catch (e) {
        return { date: 'Recently', time: '' };
      }
    }

    function formatSeenTimestamp(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return String(dateStr);
        const info = formatInquiryDate(dateStr);
        return info.time ? `${info.date} at ${info.time}` : info.date;
      } catch (e) {
        return String(dateStr);
      }
    }

        return 'sell';

        try {
          const raw = localStorage.getItem('sell2sr1_deleted_inquiry_ids');
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];

      })());

      const [inquiries, setInquiries] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('reset') === '1') {
            try {
              localStorage.removeItem('sell2sr1_inquiries_v2');
              localStorage.removeItem('sell2sr1_deleted_inquiry_ids');
              deletedIdsRef.current = [];
            } catch (e) {}
            return INITIAL_INQUIRIES_DATA.map(normalizeInquiry).filter(Boolean);
          }
          const deletedSet = new Set(deletedIdsRef.current || []);
          const saved = localStorage.getItem('sell2sr1_inquiries_v2');
          const list = saved ? JSON.parse(saved) : INITIAL_INQUIRIES_DATA;
          return (Array.isArray(list) ? list : INITIAL_INQUIRIES_DATA)
            .map(normalizeInquiry)
            .filter(item => item && !deletedSet.has(item.id));
        } catch (e) {
          console.warn('LocalStorage read error:', e);
          return INITIAL_INQUIRIES_DATA.map(normalizeInquiry).filter(Boolean);

                : p.url,
              thumbUrl: (p.thumbUrl && typeof p.thumbUrl === 'string' && p.thumbUrl.startsWith('data:') && p.thumbUrl.length > 5000)
                ? 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80'
                : (p.thumbUrl || p.url),
              isVideo: !!p.isVideo
            }))
          }));
          localStorage.setItem('sell2sr1_inquiries_v2', JSON.stringify(safeInquiries));
        } catch (err) {
          console.warn('LocalStorage save skipped (quota limit or private browsing):', err);
        }
      }, [inquiries]);

      // Real-time Cloud Database Sync Engine (SDK onSnapshot + REST Polling)
      useEffect(() => {
        let isMounted = true;

        const mergeInquiries = (cloudList) => {
          if (!Array.isArray(cloudList)) return;
          if (cloudList.length === 0 && (!deletedIdsRef.current || deletedIdsRef.current.length === 0)) return;
          const deletedSet = new Set(deletedIdsRef.current || []);
          const normalized = cloudList
            .map(normalizeInquiry)
            .filter(item => item && !deletedSet.has(item.id));
          normalized.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setInquiries(normalized);
        };

        // 1. Immediate fetch from Cloud REST API on startup
        fetchInquiriesFromCloudRest().then(list => {
          if (isMounted && list && list.length > 0) {
            mergeInquiries(list);
          }
        });

        // 2. Real-time Firebase SDK subscription
        let unsubscribe = null;
        if (db) {
          try {
            unsubscribe = db.collection('inquiries').onSnapshot((snapshot) => {
              const cloudInquiries = [];
              snapshot.forEach((doc) => {
                cloudInquiries.push(doc.data());
              });
              if (isMounted && cloudInquiries.length > 0) {
                mergeInquiries(cloudInquiries);
              }
            }, (err) => {
              console.warn('Firestore onSnapshot sync notice:', err);
            });
          } catch (e) {
            console.warn('Firestore subscription error:', e);
          }
        }

        // 3. Fallback continuous polling (every 4 seconds) to ensure 100% sync reliability across all devices
        const pollInterval = setInterval(() => {
          fetchInquiriesFromCloudRest().then(list => {
            if (isMounted && list && list.length > 0) {
              mergeInquiries(list);
            }
          });
        }, 4000);

        return () => {
          isMounted = false;
          if (unsubscribe) unsubscribe();
          clearInterval(pollInterval);
        };
      }, []);

      const handleNewInquiry = async (newInquiry) => {
        const normalized = normalizeInquiry(newInquiry);
        setInquiries(prev => [normalized, ...(prev || []).filter(i => i.id !== normalized.id)]);
        setLastSubmittedRef(normalized.referenceId);

        // Sanitize object (strips undefined values that Firestore rejects)
        const cleanInquiry = JSON.parse(JSON.stringify(normalized));

        // 1. Direct REST save (Guaranteed delivery)
        const saved = await saveInquiryToCloudRest(cleanInquiry);

        // 2. Firebase SDK save
        if (db) {
          try {
            let sdkInq = JSON.parse(JSON.stringify(cleanInquiry));
            if (sdkInq.photos && Array.isArray(sdkInq.photos)) {
              sdkInq.photos = sdkInq.photos.slice(0, 8).map(p => {
                const rawThumb = p.thumbUrl || p.url || '';
                const safeThumb = (typeof rawThumb === 'string' && rawThumb.length < 75000)
                  ? rawThumb
                  : '';
                return {
                  id: p.id || 'p-' + Math.random().toString(36).substr(2, 6),
                  label: p.label || 'Unit Media',
                  url: safeThumb,
                  thumbUrl: safeThumb,
                  isVideo: !!p.isVideo,
                  fileSize: p.fileSize || 0,
                  fileType: p.fileType || (p.isVideo ? 'video/mp4' : 'image/jpeg'),
                  uploadedAt: p.uploadedAt || new Date().toISOString()
                };
              });
            }
            db.collection('inquiries').doc(normalized.id).set(sdkInq)
              .catch(err => console.warn('Firestore SDK save notice:', err));
          } catch (e) {
            console.warn('Firestore write error:', e);
          }
        }
        return saved;
      };

      const handleUpdateInquiry = async (updated) => {
        const normalized = normalizeInquiry(updated);
        setInquiries(prev => (prev || []).map(item => item.id === normalized.id ? normalized : item));

        const cleanUpdated = JSON.parse(JSON.stringify(normalized));

        // 1. Direct REST save
        await saveInquiryToCloudRest(cleanUpdated);

        // 2. Firebase SDK save
        if (db) {

      // Reliably scroll view back up to the start of the next page/section on mobile & desktop
      const scrollToFormTop = () => {

      // Generates a crisp, lightweight JPEG thumbnail (~20KB) directly from a File or Blob
      const compressImageFile = (file, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!file) return resolve('');
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              compressImageToDataUrl(ev.target.result, maxDim, quality).then(resolve);
            };
            reader.onerror = () => resolve('');
            reader.readAsDataURL(file);
            return;
          }

          const img = new Image();
          const cleanup = () => {
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (err) {
              cleanup();
              resolve('');
            }
          };

          img.onerror = () => {
            cleanup();
            try {
              const reader = new FileReader();
              reader.onload = (ev) => {
                const res = ev.target.result;
                if (typeof res === 'string' && res.startsWith('data:image/')) {
                  compressImageToDataUrl(res, maxDim, quality).then(resolve);
                } else {
                  resolve('');
                }
              };
              reader.onerror = () => resolve('');
              reader.readAsDataURL(file);
            } catch (e) {
              resolve('');
            }
          };

          img.src = objectUrl;
        });
      };

      // Extract a lightweight thumbnail preview (~20KB) from a video file
      const extractVideoThumbnail = (file) => {
        return new Promise((resolve) => {
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            return resolve('');
          }

          const video = document.createElement('video');
          video.preload = 'metadata';
          video.muted = true;
          video.playsInline = true;

          let cleaned = false;
          const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          const timer = setTimeout(() => {
            cleanup();
            resolve('');
          }, 6000);

          video.onloadedmetadata = () => {
            video.currentTime = Math.min(1.0, video.duration > 0 ? video.duration * 0.2 : 0.5);
          };

          video.onseeked = () => {
            clearTimeout(timer);
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480;
              let w = video.videoWidth || 480;
              let h = video.videoHeight || 270;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', 0.55));
            } catch (e) {
              cleanup();
              resolve('');
            }
          };

          video.onerror = () => {
            clearTimeout(timer);
            cleanup();
            resolve('');
          };

          video.src = objectUrl;
        });
      };

      // Generate a reduced-size preview base64 JPEG specifically for Resend email attachments
      const createEmailPreviewBase64 = (dataUrlOrUrl, isVideo = false) => {
        return new Promise((resolve) => {
          if (!dataUrlOrUrl) return resolve(null);
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480; // Reduced size for fast email delivery
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

              if (isVideo) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(8, canvas.height - 30, 130, 22);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('▶ VIDEO PREVIEW', 14, canvas.height - 15);
              }

              const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.65);
              const base64Content = jpegDataUrl.includes(',') ? jpegDataUrl.split(',')[1] : null;
              resolve(base64Content);
            } catch (err) {
              resolve(null);
            }
          };
          img.onerror = () => resolve(null);
          img.src = dataUrlOrUrl;
        });
      };

      // Generate optimized lightweight JPEG thumbnail for cloud database sync (~20KB)
      const compressImageToDataUrl = (dataUrl, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!dataUrl) return resolve('');
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (e) {
              resolve('');
            }
          };
          img.onerror = () => resolve('');
          img.src = dataUrl;
        });

      const processFiles = async (filesList) => {
        const files = Array.from(filesList || []).filter(file => 
          file.type.startsWith('image/') || 
          file.type.startsWith('video/') ||
          /\.(mp4|mov|webm|m4v|avi|heic|heif|jpg|jpeg|png|webp)$/i.test(file.name)
        );
        if (files.length === 0) return '';
        setUploading(true);
        let firstDetectedInBatch = '';

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          try {
            setUploadStatus(`Uploading file ${i + 1} of ${files.length}...`);
            const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name);
            const mediaId = 'm-' + Math.random().toString(36).substr(2, 9);
            const label = file.name || (isVideo ? 'Uploaded Video' : 'Uploaded Photo');
            let resolvedDetectedVin = '';

            // Start VIN / Serial barcode + OCR scan in parallel on image files
            if (!isVideo) {
              activeScanCountRef.current += 1;
              setScanningVin(true);
              let scanPromise;
              scanPromise = scanImageFileForVin(file, category)
                .then((detected) => {
                  if (detected) {
                    resolvedDetectedVin = detected;
                    if (!firstDetectedInBatch) firstDetectedInBatch = detected;
                    setPhotos(prev => prev.map(p => (p.id === mediaId ? { ...p, detectedVin: detected } : p)));
                    if (!latestVinRef.current) {
                      latestVinRef.current = detected;
                      setVinScanSource('ocr');
                      setFormData(prev => (prev.vinOrSerial && prev.vinOrSerial.trim() ? prev : { ...prev, vinOrSerial: detected }));
                    }
                  }
                  return detected || '';
                })
                .catch(() => '')
                .finally(() => {
                  activeScanPromisesRef.current = activeScanPromisesRef.current.filter(pr => pr !== scanPromise);
                  activeScanCountRef.current = Math.max(0, activeScanCountRef.current - 1);
                  if (activeScanCountRef.current === 0) {
                    setScanningVin(false);
                  }
                });
              activeScanPromisesRef.current.push(scanPromise);
            }

            // 1. Ensure HEIC/HEIF images are converted to browser-compatible JPEG before upload & thumbnail display
            const uploadableFile = !isVideo ? (await ensureDecodableImageBlob(file)) || file : file;

            // 2. Direct upload to Firebase Cloud Storage bucket
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(uploadableFile);
            } catch (storageErr) {
              console.warn('Storage upload notice, falling back:', storageErr);
            }

            if (cloudUrl) {
              setPhotos(prev => [
                ...prev,
                {
                  id: mediaId,
                  url: cloudUrl,
                  thumbUrl: cloudUrl,
                  isVideo: isVideo,
                  fileSize: uploadableFile.size || file.size,
                  fileType: uploadableFile.type || file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
                  label: label,
                  detectedVin: resolvedDetectedVin || '',
                  uploadedAt: new Date().toISOString()
                }
              ]);
            } else {
              // 3. Client-side fallback if storage bucket was unreachable
              if (isVideo) {
                const thumbUrl = await extractVideoThumbnail(file);
                if (thumbUrl) {
                  setPhotos(prev => [
                    ...prev,
                    {
                      id: mediaId,
                      url: thumbUrl,
                      thumbUrl: thumbUrl,
                      isVideo: true,
                      fileSize: file.size,
                      fileType: file.type || 'video/mp4',
                      label: label,
                      uploadedAt: new Date().toISOString()
                    }
                  ]);
                }
              } else {
                const thumbUrl = await compressImageFile(uploadableFile, 480, 0.55);
                if (thumbUrl) {
                  setPhotos(prev => [
                    ...prev,
                    {
                      id: mediaId,
                      url: thumbUrl,
                      thumbUrl: thumbUrl,
                      isVideo: false,
                      fileSize: file.size,
                      fileType: 'image/jpeg',
                      label: label,
                      detectedVin: resolvedDetectedVin || '',
                      uploadedAt: new Date().toISOString()
                    }
                  ]);
                }
              }
            }
          } catch (err) {
            console.error('Photo/Video processing error:', err);
          }
        }
        setUploading(false);
        setUploadStatus('');
        return firstDetectedInBatch;
      };

      const handleFileSelect = async (e) => {
        await processFiles(e.target.files);

      const handleDragOver = (e) => {

        setIsDragging(false);

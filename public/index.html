        </button>
      );
    }

    function formatInquiryDate(dateStr) {
      if (!dateStr) return { date: 'Recently', time: '' };
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return { date: 'Recently', time: '' };
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const dateFormatted = isToday 
          ? 'Today' 
          : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
        const timeFormatted = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return { date: dateFormatted, time: timeFormatted };
      } catch (e) {
        return { date: 'Recently', time: '' };
      }
    }

    function formatSeenTimestamp(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return String(dateStr);
        const info = formatInquiryDate(dateStr);
        return info.time ? `${info.date} at ${info.time}` : info.date;
      } catch (e) {
        return String(dateStr);
      }
    }

            } catch (e) {}
            return INITIAL_INQUIRIES_DATA.map(normalizeInquiry).filter(Boolean);
          }
          const deletedSet = new Set(deletedIdsRef.current || []);
          const saved = localStorage.getItem('sell2sr1_inquiries_v2');
          const list = saved ? JSON.parse(saved) : INITIAL_INQUIRIES_DATA;
          return (Array.isArray(list) ? list : INITIAL_INQUIRIES_DATA)
            .map(normalizeInquiry)

      const handleSaveEmailRoutingConfig = async (newRouting) => {

      const handleSignOut = () => {

      };

      const handleSavePartner = async (partnerObj) => {
        const normalized = normalizePartner({
          ...partnerObj,
          updatedAt: new Date().toISOString()
        });
        if (!normalized) return null;
        setPartners(prev => {
          const list = Array.isArray(prev) ? prev : [];
          const exists = list.some(p => p.id === normalized.id);
          const next = exists
            ? list.map(p => (p.id === normalized.id ? normalized : p))
            : [normalized, ...list];
          try {
            localStorage.setItem('sell2sr1_partners_v1', JSON.stringify(next));
          } catch (e) {}
          return next;
        });
        if (partnerUser && partnerUser.id === normalized.id) {
          setPartnerUser(normalized);
          try {
            localStorage.setItem('sell2sr1_partner_user', JSON.stringify(normalized));
          } catch (e) {}
        }
        await savePartnerToCloudRest(normalized);
        return normalized;
      };

      const handlePartnerSignInSession = (partnerObj) => {
        const normalized = normalizePartner(partnerObj);
        setPartnerUser(normalized);
        try {
          if (normalized) {
            localStorage.setItem('sell2sr1_partner_user', JSON.stringify(normalized));
          } else {
            localStorage.removeItem('sell2sr1_partner_user');
          }
        } catch (e) {}
      };

      const openPartnerPortal = (portalType) => {
        setSelectedInquiryId(null);
        setCurrentView(portalType === 'bank' ? 'bank_portal' : 'dealer_portal');
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      };

      const [siteAnalytics, setSiteAnalytics] = useState(() => cachedAnalyticsState);
      const [legalModalTab, setLegalModalTab] = useState(null); // 'privacy' | 'terms' | null

      useEffect(() => {
        const listener = (next) => setSiteAnalytics(next);
        analyticsListeners.add(listener);
        return () => analyticsListeners.delete(listener);
      }, []);

      useEffect(() => {
        if (currentView && currentView !== 'portal') {
          recordWebsiteVisitSession(currentView);
        }
      }, [currentView]);

      const goToHome = () => {
        setCurrentView('sell');
        setSelectedInquiryId(null);
        setSellFlowKey(prev => prev + 1);
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      };

      useEffect(() => {
        try {
          // Keep inquiries safe for localStorage (strip heavy base64 strings so mobile never throws QuotaExceeded)
          const safeInquiries = (inquiries || []).map(normalizeInquiry).filter(Boolean).map(item => ({
            ...item,
            photos: (item.photos || []).map(p => ({
              id: p.id,
              label: p.label,
              url: (p.url && typeof p.url === 'string' && p.url.startsWith('data:') && p.url.length > 5000)
                ? 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80'
                : p.url,
              thumbUrl: (p.thumbUrl && typeof p.thumbUrl === 'string' && p.thumbUrl.startsWith('data:') && p.thumbUrl.length > 5000)
                ? 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80'
                : (p.thumbUrl || p.url),
              isVideo: !!p.isVideo
            }))
          }));
          localStorage.setItem('sell2sr1_inquiries_v2', JSON.stringify(safeInquiries));
        } catch (err) {
          console.warn('LocalStorage save skipped (quota limit or private browsing):', err);
        }
      }, [inquiries]);

      // Real-time Cloud Database Sync Engine (SDK onSnapshot + REST Polling)
      useEffect(() => {
        let isMounted = true;

        const mergeInquiries = (cloudList) => {
          if (!Array.isArray(cloudList)) return;
          if (cloudList.length === 0 && (!deletedIdsRef.current || deletedIdsRef.current.length === 0)) return;
          const deletedSet = new Set(deletedIdsRef.current || []);
          const nowMs = Date.now();
          const seenIds = new Set();
          const normalized = cloudList
            .map(raw => {
              const item = normalizeInquiry(raw);
              if (!item) return null;
              seenIds.add(item.id);
              const localLock = recentLocalUpdatesRef.current[item.id];
              if (localLock && (nowMs - localLock.timestamp < 15000)) {
                return localLock.item;
              }
              return item;
            })
            .filter(item => item && !deletedSet.has(item.id));
          Object.entries(recentLocalUpdatesRef.current || {}).forEach(([id, lock]) => {
            if (lock && lock.item && (nowMs - lock.timestamp < 15000) && !seenIds.has(id) && !deletedSet.has(id)) {
              normalized.push(lock.item);
            }
          });
          normalized.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setInquiries(normalized);
        };

        const mergePartners = (cloudPartners) => {
          if (!Array.isArray(cloudPartners)) return;
          const normalized = cloudPartners.map(normalizePartner).filter(Boolean);
          if (normalized.length === 0) return;
          normalized.sort((a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0));
          setPartners(prev => {
            const byId = new Map();
            (Array.isArray(prev) ? prev : []).forEach(p => { if (p && p.id) byId.set(p.id, p); });
            normalized.forEach(p => { if (p && p.id) byId.set(p.id, p); });
            const merged = Array.from(byId.values());
            try {
              localStorage.setItem('sell2sr1_partners_v1', JSON.stringify(merged));
            } catch (e) {}
            return merged;
          });
          setPartnerUser(curr => {
            if (!curr) return null;
            const updatedSelf = normalized.find(p => p.id === curr.id);
            if (updatedSelf) {
              try { localStorage.setItem('sell2sr1_partner_user', JSON.stringify(updatedSelf)); } catch (e) {}
              return updatedSelf;
            }
            return curr;
          });
        };

        // 1. Immediate fetch from Cloud REST API on startup
        fetchInquiriesFromCloudRest().then(list => {
          if (isMounted && list && list.length > 0) {
            mergeInquiries(list);
          }
        });
        fetchPartnersFromCloudRest().then(pList => {
          if (isMounted && pList && pList.length > 0) {
            mergePartners(pList);
          }
        });
        fetchSiteAnalyticsFromCloudRest();

        // 2. Real-time Firebase SDK subscription
        let unsubscribe = null;
        if (db) {
          try {
            unsubscribe = db.collection('inquiries').onSnapshot((snapshot) => {
              const cloudInquiries = [];
              const cloudPartners = [];
              snapshot.forEach((doc) => {
                const data = doc.data();
                if (!data) return;
                if (doc.id === '_analytics_superadmin' || data.isAnalyticsDoc) {
                  if (data.analyticsJson) {
                    try {
                      const parsed = JSON.parse(data.analyticsJson);
                      const merged = mergeAnalyticsStates(cachedAnalyticsState, parsed);
                      notifyAnalyticsListeners(merged);
                    } catch (e) {}
                  }
                  return;
                }
                if (doc.id === '_config_email_routing' || data.isConfigDoc) {
                  return;
                }
                if (data.isPartnerDoc || String(doc.id || '').startsWith('_partner_')) {
                  cloudPartners.push(data);
                } else {
                  cloudInquiries.push(data);
                }
              });
              if (isMounted && cloudInquiries.length > 0) {
                mergeInquiries(cloudInquiries);
              }
              if (isMounted && cloudPartners.length > 0) {
                mergePartners(cloudPartners);
              }
            }, (err) => {
              console.warn('Firestore onSnapshot sync notice:', err);
            });
          } catch (e) {
            console.warn('Firestore subscription error:', e);
          }
        }

        // 3. Fallback continuous polling (every 4 seconds) to ensure 100% sync reliability across all devices
        const pollInterval = setInterval(() => {
          fetchInquiriesFromCloudRest().then(list => {
            if (isMounted && list && list.length > 0) {
              mergeInquiries(list);
            }
          });
          fetchPartnersFromCloudRest().then(pList => {
            if (isMounted && pList && pList.length > 0) {
              mergePartners(pList);
            }
          });
          fetchSiteAnalyticsFromCloudRest();
        }, 4000);

        return () => {
          isMounted = false;
          if (unsubscribe) unsubscribe();
          clearInterval(pollInterval);
        };
      }, []);

      const handleNewInquiry = async (newInquiry) => {
        const normalized = normalizeInquiry(newInquiry);
        recentLocalUpdatesRef.current[normalized.id] = {
          item: normalized,
          timestamp: Date.now()
        };
        setInquiries(prev => [normalized, ...(prev || []).filter(i => i.id !== normalized.id)]);
        setLastSubmittedRef(normalized.referenceId);

        // Sanitize object (strips undefined values that Firestore rejects)
        const cleanInquiry = JSON.parse(JSON.stringify(normalized));

        // 1. Direct REST save (Guaranteed delivery)
        const saved = await saveInquiryToCloudRest(cleanInquiry);

        // 2. Firebase SDK save
        if (db) {
          try {
            let sdkInq = JSON.parse(JSON.stringify(cleanInquiry));
            if (sdkInq.photos && Array.isArray(sdkInq.photos)) {
              sdkInq.photos = sdkInq.photos.slice(0, 8).map(p => {
                const rawThumb = p.thumbUrl || p.url || '';
                const safeThumb = (typeof rawThumb === 'string' && rawThumb.length < 75000)
                  ? rawThumb
                  : '';
                return {
                  id: p.id || 'p-' + Math.random().toString(36).substr(2, 6),
                  label: p.label || 'Unit Media',
                  url: safeThumb,
                  thumbUrl: safeThumb,
                  isVideo: !!p.isVideo,
                  fileSize: p.fileSize || 0,
                  fileType: p.fileType || (p.isVideo ? 'video/mp4' : 'image/jpeg'),
                  uploadedAt: p.uploadedAt || new Date().toISOString()
                };
              });
            }
            db.collection('inquiries').doc(normalized.id).set(sdkInq)
              .catch(err => console.warn('Firestore SDK save notice:', err));
          } catch (e) {
            console.warn('Firestore write error:', e);
          }
        }
        return saved;
      };

      const handleUpdateInquiry = async (updated) => {
        const nowIso = new Date().toISOString();
        let normalizedToSave = normalizeInquiry({
          ...updated,
          updatedAt: nowIso
        });
        setInquiries(prev => {
          const list = prev || [];
          const existing = list.find(i => i && i.id === normalizedToSave.id);
          if (existing) {
            normalizedToSave = normalizeInquiry({
              ...existing,
              ...updated,
              updatedAt: nowIso
            });
          }
          recentLocalUpdatesRef.current[normalizedToSave.id] = {
            item: normalizedToSave,
            timestamp: Date.now()
          };
          return list.map(item => item.id === normalizedToSave.id ? normalizedToSave : item);
        });

        const cleanUpdated = JSON.parse(JSON.stringify(normalizedToSave));

        // 1. Direct REST save
        await saveInquiryToCloudRest(cleanUpdated);

        // 2. Firebase SDK save
        if (db) {
          try {
            let sdkInq = JSON.parse(JSON.stringify(cleanUpdated));
            if (sdkInq.photos && Array.isArray(sdkInq.photos)) {
              sdkInq.photos = sdkInq.photos.slice(0, 8).map(p => {
                const rawThumb = p.thumbUrl || p.url || '';
                const safeThumb = (typeof rawThumb === 'string' && rawThumb.length < 75000)
                  ? rawThumb
                  : '';
                return {
                  id: p.id || 'p-' + Math.random().toString(36).substr(2, 6),
                  label: p.label || 'Unit Media',
                  url: safeThumb,
                  thumbUrl: safeThumb,
                  isVideo: !!p.isVideo,
                  fileSize: p.fileSize || 0,
                  fileType: p.fileType || (p.isVideo ? 'video/mp4' : 'image/jpeg'),
                  uploadedAt: p.uploadedAt || new Date().toISOString()
                };
              });
            }
            db.collection('inquiries').doc(updated.id).set(sdkInq, { merge: true })
              .catch(err => console.warn('Firestore update notice:', err));
          } catch (e) {
            console.warn('Firestore update call error:', e);
          }
        }
      };

      const handleDeleteInquiry = async (inquiryOrId) => {
        if (!isSuperAdmin(staffUser)) {
          alert('Only authorized Admins are permitted to delete inquiries.');
          return false;
        }
        const targetId = typeof inquiryOrId === 'string' ? inquiryOrId : inquiryOrId?.id;
        if (!targetId) return false;

        if (!deletedIdsRef.current.includes(targetId)) {
          deletedIdsRef.current = [...deletedIdsRef.current, targetId];
          try {
            localStorage.setItem('sell2sr1_deleted_inquiry_ids', JSON.stringify(deletedIdsRef.current));
          } catch (e) {}
        }

        setInquiries(prev => (prev || []).filter(item => item && item.id !== targetId));
        if (selectedInquiryId === targetId) {
          setSelectedInquiryId(null);
        }

        await deleteInquiryFromCloudRest(targetId);

        if (db) {
          try {
            db.collection('inquiries').doc(targetId).delete()
              .catch(err => console.warn('Firestore SDK delete notice:', err));
          } catch (e) {
            console.warn('Firestore delete call error:', e);
          }
        }
        return true;
      };

      const handleRefreshPortalData = async () => {
        try {
          const [list, pList] = await Promise.all([
            fetchInquiriesFromCloudRest(true),
            fetchPartnersFromCloudRest(),
            fetchSiteAnalyticsFromCloudRest()
          ]);
          if (Array.isArray(list) && list.length > 0) {
            const deletedSet = new Set(deletedIdsRef.current || []);
            const nowMs = Date.now();
            const seenIds = new Set();
            const normalized = list
              .map(raw => {
                const item = normalizeInquiry(raw);
                if (!item) return null;
                seenIds.add(item.id);
                const localLock = recentLocalUpdatesRef.current[item.id];
                if (localLock && (nowMs - localLock.timestamp < 15000)) {
                  return localLock.item;
                }
                return item;
              })
              .filter(item => item && !deletedSet.has(item.id));
            Object.entries(recentLocalUpdatesRef.current || {}).forEach(([id, lock]) => {
              if (lock && lock.item && (nowMs - lock.timestamp < 15000) && !seenIds.has(id) && !deletedSet.has(id)) {
                normalized.push(lock.item);
              }
            });
            normalized.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            setInquiries(normalized);

          if (Array.isArray(pList) && pList.length > 0) {

                normalizedPartners.forEach(p => { if (p && p.id) byId.set(p.id, p); });
                return Array.from(byId.values());
              });
            }
          }
          return true;

      const [photos, setPhotos] = useState([]);
      const [uploading, setUploading] = useState(false);
      const [uploadStatus, setUploadStatus] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [vinPhotoChoice, setVinPhotoChoice] = useState(''); // '' | 'has_photo' | 'no_photo'
      const [vinPhotoItem, setVinPhotoItem] = useState(null);
      const [vinPhotoUploading, setVinPhotoUploading] = useState(false);
      const [vinPhotoScanFailed, setVinPhotoScanFailed] = useState(false);

      // --- PARTIAL FORM TRACKING (STRICTLY ONLY PAST STEP 2: STEP 3, 4, 5, OR 6) ---
      const formSessionIdRef = useRef('pf-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7));
      const formStartedAtRef = useRef(new Date().toISOString());
      const maxStepReachedRef = useRef(step);
      const countedStep3FunnelRef = useRef(false);
      const isSubmittedRef = useRef(false);
      const latestPartialPayloadRef = useRef(null);

      const activeCatConfig = CATEGORIES[category] || CATEGORIES.rv;
      const idMeta = getPartnerPortalIdFieldMeta(category);

      // Automatically resolve City & State when customer enters a 5-digit Zip Code on Step 6
      useEffect(() => {
        const cleanZip = String(formData.zipCode || '').replace(/\D/g, '').slice(0, 5);
        if (cleanZip.length !== 5) {
          if (formData.city || formData.state) {
            setFormData(prev => ({ ...prev, city: '', state: '' }));
          }
          return;
        }
        let cancelled = false;
        lookupZipCityState(cleanZip).then(res => {
          if (!cancelled && res && res.city && res.state) {
            setFormData(prev => ({
              ...prev,
              city: res.city,
              state: res.state
            }));
          }
        });
        return () => {
          cancelled = true;
        };
      }, [formData.zipCode]);

      const buildPartialFormSnapshot = (overrideStep) => {
        const effectiveStep = overrideStep || step;
        const maxStep = Math.max(maxStepReachedRef.current || 1, effectiveStep);
        if (maxStep < 3) return null; // Strictly only document what makes it past Step 2
        const { isMobile, deviceLabel } = getVisitorDeviceInfo();
        const resolvedVin = (formData.vinOrSerial || latestVinRef.current || '').trim();
        return {
          sessionId: formSessionIdRef.current,
          startedAt: formStartedAtRef.current,
          updatedAt: new Date().toISOString(),
          currentStep: effectiveStep,
          maxStepReached: maxStep,
          lastStepName: STEP_NAME_MAP[maxStep] || `Step ${maxStep}`,
          device: deviceLabel,
          isMobile,
          intent: formData.intent || 'sell',
          workingWithSalesperson: formData.workingWithSalesperson || 'no',
          salespersonName: formData.salespersonName || '',
          category,
          categoryLabel: activeCatConfig.label,
          unit: {
            year: formData.year || '',
            make: category === 'container' ? 'Shipping Container' : (formData.make || ''),
            model: category === 'container' ? 'Container' : (formData.model || ''),

            transmissionType: category === 'tractor' ? (formData.transmissionType || '') : '',
            extrasOrUpgrades: (formData.extrasOrUpgrades || '').trim(),
            vinOrSerial: resolvedVin,
            conditionNotes: (formData.conditionNotes || '').trim()
          },
          financials: {
            titleStatus: formData.titleStatus || '',
            lienHolderName: (formData.lienHolderName || '').trim(),
            estimatedPayoff: formData.estimatedPayoff || ''
          },
          customer: {
            firstName: (formData.firstName || '').trim(),
            lastName: (formData.lastName || '').trim(),
            email: (formData.email || '').trim(),
            phone: (formData.phone || '').trim(),
            preferredContact: formData.preferredContact || 'text',
            city: (formData.city || '').trim(),
            state: (formData.state || '').trim(),
            zipCode: (formData.zipCode || '').trim()
          },
          preferredLocation: formData.preferredLocation || '',
          photosCount: photos.length,
          photos: photos
            .filter(p => p && typeof (p.url || p.thumbUrl) === 'string' && (p.url || p.thumbUrl).startsWith('http'))
            .slice(0, 6)
            .map(p => ({
              id: p.id,
              label: p.label || 'Uploaded Media',
              url: p.url || p.thumbUrl,
              thumbUrl: p.thumbUrl || p.url,
              isVideo: !!p.isVideo
            }))
        };
      };

      // Keep latest snapshot ref updated and sync whenever step >= 3
      useEffect(() => {
        if (isSubmittedRef.current || submittedInquiry) return;
        if (step > maxStepReachedRef.current) {
          maxStepReachedRef.current = step;
        }
        if (maxStepReachedRef.current < 3) return; // Do not document Step 1 or Step 2

        const snapshot = buildPartialFormSnapshot(step);
        latestPartialPayloadRef.current = snapshot;
        if (!snapshot) return;

        const firstTimePastStep2 = !countedStep3FunnelRef.current;
        if (firstTimePastStep2) {
          countedStep3FunnelRef.current = true;
          upsertPartialFormInCloud(snapshot, { incrementStep3Funnel: true, useKeepalive: false });
          return;
        }

        const timer = setTimeout(() => {
          if (!isSubmittedRef.current && latestPartialPayloadRef.current) {
            upsertPartialFormInCloud(latestPartialPayloadRef.current, { incrementStep3Funnel: false, useKeepalive: false });
          }
        }, 700);

        return () => clearTimeout(timer);
      }, [step, category, formData, photos, submittedInquiry]);

      // Immediate keepalive flush if the user closes the tab or switches away after passing Step 2
      useEffect(() => {
        const flushOnLeave = () => {
          if (isSubmittedRef.current || maxStepReachedRef.current < 3) return;
          const snap = latestPartialPayloadRef.current;
          if (snap) {
            upsertPartialFormInCloud(
              { ...snap, closedBrowserAt: new Date().toISOString() },
              { incrementStep3Funnel: false, useKeepalive: true }
            );
          }
        };
        const onVisChange = () => {
          if (document.visibilityState === 'hidden') {
            flushOnLeave();
          }
        };
        window.addEventListener('pagehide', flushOnLeave);
        window.addEventListener('beforeunload', flushOnLeave);
        document.addEventListener('visibilitychange', onVisChange);
        return () => {
          window.removeEventListener('pagehide', flushOnLeave);
          window.removeEventListener('beforeunload', flushOnLeave);
          document.removeEventListener('visibilitychange', onVisChange);
        };
      }, []);

      const handleCategorySelect = (catKey) => {
        setCategory(catKey);
        const validLocations = getLocationsForCategory(catKey);
        setFormData(prev => ({
          ...prev,
          subcategory: '',
          preferredLocation: validLocations.some(l => l.id === prev.preferredLocation)
            ? prev.preferredLocation
            : ''
        }));
      };

      const handleInputChange = (field, value) => {
        if (field === 'vinOrSerial') {
          const trimmed = String(value || '').trim();
          latestVinRef.current = trimmed;
        }
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      // Reliably scroll view back up to the start of the next page/section on mobile & desktop
      const scrollToFormTop = () => {
        const doScroll = () => {
          try {
            const card = document.getElementById('sell-form-card');
            if (card) {
              const rect = card.getBoundingClientRect();
              const yOffset = -75; // Account for top announcement bar and sticky header
              const targetY = rect.top + window.pageYOffset + yOffset;
              window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
              if (window.innerWidth < 768) {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }
            } else {
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          } catch (e) {
            window.scrollTo(0, 0);
          }
        };

        doScroll();
        // Fire again at 50ms and 150ms to beat mobile Safari keyboard dismissal & DOM layout shifts
        setTimeout(doScroll, 50);
        setTimeout(doScroll, 150);
      };

      // Auto-scroll view back up to the start of the next page/step on step changes
      const isFirstStepMount = useRef(true);
      useEffect(() => {
        if (isFirstStepMount.current) {
          isFirstStepMount.current = false;
          return;
        }
        scrollToFormTop();
      }, [step]);

      useEffect(() => {
        if (submittedInquiry) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(() => window.scrollTo(0, 0), 50);
          setTimeout(() => window.scrollTo(0, 0), 150);
        }
      }, [submittedInquiry]);

      // Generates a crisp, lightweight JPEG thumbnail (~20KB) directly from a File or Blob
      const compressImageFile = (file, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!file) return resolve('');
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              compressImageToDataUrl(ev.target.result, maxDim, quality).then(resolve);
            };
            reader.onerror = () => resolve('');
            reader.readAsDataURL(file);
            return;
          }

          const img = new Image();
          const cleanup = () => {
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (err) {
              cleanup();
              resolve('');
            }
          };

          img.onerror = () => {
            cleanup();
            try {
              const reader = new FileReader();
              reader.onload = (ev) => {
                const res = ev.target.result;
                if (typeof res === 'string' && res.startsWith('data:image/')) {
                  compressImageToDataUrl(res, maxDim, quality).then(resolve);
                } else {
                  resolve('');
                }
              };
              reader.onerror = () => resolve('');
              reader.readAsDataURL(file);
            } catch (e) {
              resolve('');
            }
          };

          img.src = objectUrl;
        });
      };

      // Extract a lightweight thumbnail preview (~20KB) from a video file
      const extractVideoThumbnail = (file) => {
        return new Promise((resolve) => {
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            return resolve('');
          }

          const video = document.createElement('video');
          video.preload = 'metadata';
          video.muted = true;
          video.playsInline = true;

          let cleaned = false;
          const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          const timer = setTimeout(() => {
            cleanup();
            resolve('');
          }, 6000);

          video.onloadedmetadata = () => {
            video.currentTime = Math.min(1.0, video.duration > 0 ? video.duration * 0.2 : 0.5);
          };

          video.onseeked = () => {
            clearTimeout(timer);
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480;
              let w = video.videoWidth || 480;
              let h = video.videoHeight || 270;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', 0.55));
            } catch (e) {
              cleanup();
              resolve('');
            }
          };

          video.onerror = () => {
            clearTimeout(timer);
            cleanup();
            resolve('');
          };

          video.src = objectUrl;
        });
      };

      // Generate a reduced-size preview base64 JPEG specifically for Resend email attachments
      const createEmailPreviewBase64 = (dataUrlOrUrl, isVideo = false) => {
        return new Promise((resolve) => {
          if (!dataUrlOrUrl) return resolve(null);
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480; // Reduced size for fast email delivery
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

              if (isVideo) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(8, canvas.height - 30, 130, 22);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('▶ VIDEO PREVIEW', 14, canvas.height - 15);
              }

              const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.65);
              const base64Content = jpegDataUrl.includes(',') ? jpegDataUrl.split(',')[1] : null;
              resolve(base64Content);
            } catch (err) {
              resolve(null);
            }
          };
          img.onerror = () => resolve(null);
          img.src = dataUrlOrUrl;
        });
      };

      // Generate optimized lightweight JPEG thumbnail for cloud database sync (~20KB)
      const compressImageToDataUrl = (dataUrl, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!dataUrl) return resolve('');
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (e) {
              resolve('');
            }
          };
          img.onerror = () => resolve('');
          img.src = dataUrl;
        });
      };

      // Optimize Step 2 photos for fast upload (~65-75% smaller while keeping sharp 2.5K appraisal detail).
      // Note: Step 3 VIN/Serial tag photos bypass this helper and upload at full resolution for OCR.
      const optimizePhotoForUpload = async (file, { maxDim = 2560, quality = 0.88 } = {}) => {
        if (!file || typeof document === 'undefined') return file;
        let bitmap = null;
        let objectUrl = null;
        try {
          let source = null;
          let srcW = 0;
          let srcH = 0;

          if (typeof createImageBitmap === 'function') {
            try {
              bitmap = await createImageBitmap(file);
              source = bitmap;
              srcW = bitmap.width;
              srcH = bitmap.height;
            } catch (bmErr) {
              bitmap = null;
            }
          }

          if (!source) {
            objectUrl = URL.createObjectURL(file);
            source = await new Promise((resolve, reject) => {
              const img = new Image();
              img.onload = () => resolve(img);
              img.onerror = () => reject(new Error('Image decode failed'));
              img.src = objectUrl;
            });
            srcW = source.naturalWidth || source.width;
            srcH = source.naturalHeight || source.height;
          }

          if (!srcW || !srcH) return file;

          let targetW = srcW;
          let targetH = srcH;
          let wasScaled = false;
          if (targetW > maxDim || targetH > maxDim) {
            wasScaled = true;
            if (targetW >= targetH) {
              targetH = Math.max(1, Math.round((targetH * maxDim) / targetW));
              targetW = maxDim;
            } else {
              targetW = Math.max(1, Math.round((targetW * maxDim) / targetH));
              targetH = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = targetW;
          canvas.height = targetH;
          const ctx = canvas.getContext('2d');
          if (!ctx) return file;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(source, 0, 0, targetW, targetH);

          const compressedBlob = await new Promise((resolve) => {
            canvas.toBlob((blob) => resolve(blob || null), 'image/jpeg', quality);
          });

          if (!compressedBlob || compressedBlob.size === 0) return file;

          // Keep original if it wasn't oversized and compression didn't meaningfully shrink it
          if (!wasScaled && compressedBlob.size >= file.size * 0.92) {
            return file;
          }

          const baseName = (file.name || 'photo').replace(/\.[^.]+$/, '');
          try {
            return new File([compressedBlob], `${baseName}.jpg`, {
              type: 'image/jpeg',
              lastModified: file.lastModified || Date.now()
            });
          } catch (e) {
            compressedBlob.name = `${baseName}.jpg`;
            return compressedBlob;
          }
        } catch (err) {
          console.warn('Photo optimization fallback to original:', err);
          return file;
        } finally {
          if (bitmap && typeof bitmap.close === 'function') {
            try { bitmap.close(); } catch (e) {}
          }
          if (objectUrl) {
            try { URL.revokeObjectURL(objectUrl); } catch (e) {}
          }
        }
      };

      // Smart client-side video compression for heavy high-bitrate phone videos (e.g. 4K / 1080p60 > 18MB).
      // Downscales to crisp 720p HD (~2.8 Mbps) silently without audio playback, falling back seamlessly
      // to the original file on unsupported browsers (e.g. older iOS Safari) or if savings < 35%.
      const optimizeVideoForUpload = async (
        file,
        { maxDim = 1280, videoBitsPerSecond = 2800000, audioBitsPerSecond = 96000 } = {}
      ) => {
        if (
          !file ||
          typeof document === 'undefined' ||
          typeof MediaRecorder === 'undefined' ||
          file.size < 18 * 1024 * 1024
        ) {
          return file;
        }

        const candidateTypes = [
          'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
          'video/mp4',
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp8,opus',
          'video/webm'
        ];
        const mimeType = candidateTypes.find((t) => {
          try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; }
        });
        if (!mimeType) return file;

        let objectUrl = null;
        let audioCtx = null;
        let rafId = null;
        let safetyTimer = null;

        try {
          objectUrl = URL.createObjectURL(file);
          const video = document.createElement('video');
          video.preload = 'auto';
          video.playsInline = true;
          video.muted = false;
          video.crossOrigin = 'anonymous';
          video.src = objectUrl;

          await new Promise((resolve, reject) => {
            const metaTimer = setTimeout(() => reject(new Error('Video metadata timeout')), 6000);
            video.onloadedmetadata = () => { clearTimeout(metaTimer); resolve(); };
            video.onerror = () => { clearTimeout(metaTimer); reject(new Error('Video decode failed')); };
          });

          const duration = Number(video.duration) || 0;
          const srcW = video.videoWidth || 0;
          const srcH = video.videoHeight || 0;
          if (!duration || duration > 60 || !srcW || !srcH) return file;

          // Only transcode when bitrate is genuinely high (> 7 Mbps) so we save real time
          const bitrateBps = (file.size * 8) / duration;
          if (bitrateBps <= 7000000) return file;

          let targetW = srcW;
          let targetH = srcH;
          if (targetW > maxDim || targetH > maxDim) {
            if (targetW >= targetH) {
              targetH = Math.max(2, Math.round((targetH * maxDim) / targetW) & ~1);
              targetW = maxDim & ~1;
            } else {
              targetW = Math.max(2, Math.round((targetW * maxDim) / targetH) & ~1);
              targetH = maxDim & ~1;
            }
          } else {
            targetW = Math.max(2, targetW & ~1);
            targetH = Math.max(2, targetH & ~1);
          }

          const canvas = document.createElement('canvas');
          canvas.width = targetW;
          canvas.height = targetH;
          if (typeof canvas.captureStream !== 'function') return file;
          const ctx = canvas.getContext('2d');
          if (!ctx) return file;

          const canvasStream = canvas.captureStream(30);
          const tracks = [...canvasStream.getVideoTracks()];

          // Route audio silently into the MediaRecorder stream (not connected to speakers)
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              audioCtx = new AudioCtx();
              const sourceNode = audioCtx.createMediaElementSource(video);
              const destNode = audioCtx.createMediaStreamDestination();
              sourceNode.connect(destNode);
              destNode.stream.getAudioTracks().forEach((t) => tracks.push(t));
            } else {
              video.muted = true;
            }
          } catch (audioErr) {
            video.muted = true;
          }

          const combinedStream = new MediaStream(tracks);
          const chunks = [];
          const recorder = new MediaRecorder(combinedStream, {
            mimeType,
            videoBitsPerSecond,
            audioBitsPerSecond
          });
          recorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) chunks.push(ev.data);
          };

          const drawFrame = () => {
            if (!video.paused && !video.ended) {
              try { ctx.drawImage(video, 0, 0, targetW, targetH); } catch (e) {}
              rafId = requestAnimationFrame(drawFrame);
            }
          };

          const compressedBlob = await new Promise((resolve, reject) => {
            safetyTimer = setTimeout(() => {
              try { video.pause(); } catch (e) {}
              try { if (recorder.state !== 'inactive') recorder.stop(); } catch (e) {}
              reject(new Error('Video compression timeout'));
            }, Math.ceil((duration + 12) * 1000));

            recorder.onstop = () => {
              clearTimeout(safetyTimer);
              resolve(new Blob(chunks, { type: mimeType.split(';')[0] }));
            };
            recorder.onerror = () => {
              clearTimeout(safetyTimer);
              reject(new Error('MediaRecorder error'));
            };
            video.onended = () => {
              if (rafId) cancelAnimationFrame(rafId);
              try { ctx.drawImage(video, 0, 0, targetW, targetH); } catch (e) {}
              if (recorder.state !== 'inactive') recorder.stop();
            };

            recorder.start(500);
            const playPromise = video.play();
            if (playPromise && typeof playPromise.then === 'function') {
              playPromise.then(() => {
                rafId = requestAnimationFrame(drawFrame);
              }).catch((playErr) => {
                clearTimeout(safetyTimer);
                try { if (recorder.state !== 'inactive') recorder.stop(); } catch (e) {}
                reject(playErr);
              });
            } else {
              rafId = requestAnimationFrame(drawFrame);
            }
          });

          // Only use the transcoded video if it saved at least 35%
          if (!compressedBlob || compressedBlob.size === 0 || compressedBlob.size >= file.size * 0.65) {
            return file;
          }

          const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';
          const outMime = ext === 'mp4' ? 'video/mp4' : 'video/webm';
          const baseName = (file.name || 'video').replace(/\.[^.]+$/, '');
          try {
            return new File([compressedBlob], `${baseName}.${ext}`, {
              type: outMime,
              lastModified: file.lastModified || Date.now()
            });
          } catch (e) {
            compressedBlob.name = `${baseName}.${ext}`;
            return compressedBlob;
          }
        } catch (err) {
          console.warn('Video optimization fallback to original:', err);
          return file;
        } finally {
          if (rafId) cancelAnimationFrame(rafId);
          if (safetyTimer) clearTimeout(safetyTimer);
          if (audioCtx && typeof audioCtx.close === 'function') {
            try { audioCtx.close(); } catch (e) {}
          }
          if (objectUrl) {
            try { URL.revokeObjectURL(objectUrl); } catch (e) {}
          }
        }
      };

      const processFiles = async (filesList) => {
        const files = Array.from(filesList || []).filter(file => 
          file.type.startsWith('image/') || 
          file.type.startsWith('video/') ||
          /\.(mp4|mov|webm|m4v|avi|heic|heif|jpg|jpeg|png|webp)$/i.test(file.name)
        );
        if (files.length === 0) return;
        setUploading(true);

        const batchEntries = files.map((file) => {
          const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name);
          return {
            file,
            isVideo,
            mediaId: 'm-' + Math.random().toString(36).substr(2, 9),
            label: file.name || (isVideo ? 'Uploaded Video' : 'Uploaded Photo')
          };
        });

        const totalCount = batchEntries.length;
        let completedCount = 0;
        let nextIndex = 0;
        const MAX_CONCURRENT_UPLOADS = 3;

        setUploadStatus(
          totalCount === 1
            ? 'Optimizing & uploading 1 file...'
            : `Optimizing & uploading ${totalCount} files...`
        );

        const uploadOneEntry = async (entry) => {
          const { file, isVideo, mediaId, label } = entry;
          try {
            let uploadableFile = file;
            let videoThumbPromise = null;

            if (isVideo) {
              // Extract a lightweight preview frame in parallel while optimizing/uploading the video
              videoThumbPromise = extractVideoThumbnail(file).catch(() => '');
              uploadableFile = await optimizeVideoForUpload(file);
            } else {
              // 1. Ensure HEIC/HEIF images are converted to browser-compatible JPEG
              const decodedFile = (await ensureDecodableImageBlob(file)) || file;
              // 2. Optimize photo resolution/quality (max 2560px, JPEG 0.88) for fast upload with crisp detail
              uploadableFile = await optimizePhotoForUpload(decodedFile, { maxDim: 2560, quality: 0.88 });
            }

            // 3. Direct upload to Firebase Cloud Storage bucket
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(uploadableFile);
            } catch (storageErr) {
              console.warn('Storage upload notice, falling back:', storageErr);
            }

            if (cloudUrl) {
              const videoThumb = isVideo && videoThumbPromise ? (await videoThumbPromise) : '';
              setPhotos(prev => [
                ...prev,
                {
                  id: mediaId,
                  url: cloudUrl,
                  thumbUrl: isVideo ? (videoThumb || '') : cloudUrl,
                  isVideo: isVideo,
                  fileSize: uploadableFile.size || file.size,
                  fileType: uploadableFile.type || file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
                  label: label,
                  uploadedAt: new Date().toISOString()
                }
              ]);
            } else {
              // 4. Client-side fallback if storage bucket was unreachable
              if (isVideo) {
                const thumbUrl = (videoThumbPromise ? await videoThumbPromise : '') || (await extractVideoThumbnail(file));
                if (thumbUrl) {
                  setPhotos(prev => [
                    ...prev,
                    {
                      id: mediaId,
                      url: thumbUrl,
                      thumbUrl: thumbUrl,
                      isVideo: true,
                      fileSize: file.size,
                      fileType: file.type || 'video/mp4',
                      label: label,
                      uploadedAt: new Date().toISOString()
                    }
                  ]);
                }
              } else {
                const thumbUrl = await compressImageFile(uploadableFile, 480, 0.55);
                if (thumbUrl) {
                  setPhotos(prev => [
                    ...prev,
                    {
                      id: mediaId,
                      url: thumbUrl,
                      thumbUrl: thumbUrl,
                      isVideo: false,
                      fileSize: uploadableFile.size || file.size,
                      fileType: 'image/jpeg',
                      label: label,
                      uploadedAt: new Date().toISOString()
                    }
                  ]);
                }
              }
            }
          } catch (err) {
            console.error('Photo/Video processing error:', err);
          } finally {
            completedCount += 1;
            if (completedCount < totalCount) {
              setUploadStatus(`Uploaded ${completedCount} of ${totalCount} files...`);
            }
          }
        };

        const workerCount = Math.min(MAX_CONCURRENT_UPLOADS, totalCount);
        const workers = Array.from({ length: workerCount }, async () => {
          while (nextIndex < totalCount) {
            const idx = nextIndex++;
            await uploadOneEntry(batchEntries[idx]);
          }
        });
        await Promise.all(workers);

        setUploading(false);
        setUploadStatus('');
      };

      const handleFileSelect = async (e) => {
        await processFiles(e.target.files);
        if (e.target) e.target.value = '';
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(true);
      };

      const handleDragEnter = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
      };

      const handleDrop = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          await processFiles(e.dataTransfer.files);
        }
      };

      const removePhoto = (id) => {
        setPhotos(prev => prev.filter(p => p.id !== id));
        if (vinPhotoItem && vinPhotoItem.id === id) {
          activeVinScanIdRef.current += 1;
          setVinPhotoItem(null);
          setVinPhotoUploading(false);
          setScanningVin(false);
          setVinPhotoScanFailed(false);
          setIsEditingDetectedVin(false);
          latestVinRef.current = '';
          setVinScanSource('');
          setFormData(f => ({ ...f, vinOrSerial: '' }));
        }
      };

      const handleContinueFromPhotos = () => {
        if (uploading) {
          alert('Please wait for photos to finish uploading to cloud storage before continuing.');
          return;
        }
        if (photos.length < 3) {
          alert('Please upload at least 3 photos of your unit before continuing.');
          return;
        }
        setStep(3);
        scrollToFormTop();
      };

      const handleRemoveVinPhoto = () => {
        activeVinScanIdRef.current += 1;
        setVinPhotoItem(null);
        setVinPhotoUploading(false);
        setScanningVin(false);
        setVinPhotoScanFailed(false);
        setIsEditingDetectedVin(false);
        setOverrideVinInput('');
        setPhotos(prev => prev.filter(p => !p.isVinPhoto));
        latestVinRef.current = '';
        setVinScanSource('');
        setFormData(prev => ({ ...prev, vinOrSerial: '' }));
      };

      const handleSelectVinPhotoChoice = (choice) => {
        if (choice === vinPhotoChoice) return;
        setVinPhotoChoice(choice);
        if (choice === 'no_photo') {
          activeVinScanIdRef.current += 1;
          setVinPhotoUploading(false);
          setScanningVin(false);
          setVinPhotoScanFailed(false);
          setIsEditingDetectedVin(false);
          setOverrideVinInput('');
          setVinPhotoItem(null);
          setPhotos(prev => prev.filter(p => !p.isVinPhoto));
          setVinScanSource('manual');
        } else if (choice === 'has_photo') {
          setVinPhotoScanFailed(false);
          setIsEditingDetectedVin(false);
        }
      };

      const handleVinPhotoFile = async (file) => {
        if (!file) return;
        const isValidImage =
          file.type.startsWith('image/') ||
          /\.(heic|heif|jpg|jpeg|png|webp)$/i.test(file.name || '');
        if (!isValidImage) {
          alert('Please select a photo image file (JPG, PNG, HEIC, or WEBP).');
          return;
        }

        const scanId = activeVinScanIdRef.current + 1;
        activeVinScanIdRef.current = scanId;
        const mediaId = 'm-vin-' + Math.random().toString(36).substr(2, 9);
        const photoLabel = idMeta.tagLabel || 'VIN / Serial Tag';

        setVinPhotoChoice('has_photo');
        setVinPhotoUploading(true);
        setScanningVin(true);
        setVinPhotoScanFailed(false);
        setIsEditingDetectedVin(false);
        setOverrideVinInput('');
        latestVinRef.current = '';
        setVinScanSource('');
        setFormData(prev => ({ ...prev, vinOrSerial: '' }));

        let uploadedPhotoObj = null;

        const uploadTask = (async () => {
          try {
            const uploadableFile = (await ensureDecodableImageBlob(file)) || file;
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(uploadableFile);
            } catch (storageErr) {
              console.warn('VIN photo storage upload notice, falling back:', storageErr);
            }
            const finalUrl = cloudUrl || (await compressImageFile(uploadableFile, 1200, 0.8));
            if (activeVinScanIdRef.current !== scanId) return null;
            if (finalUrl) {
              uploadedPhotoObj = {
                id: mediaId,
                url: finalUrl,
                thumbUrl: finalUrl,
                isVideo: false,
                isVinPhoto: true,
                fileSize: uploadableFile.size || file.size,
                fileType: uploadableFile.type || file.type || 'image/jpeg',
                label: photoLabel,
                detectedVin: '',
                unreadableVinTag: false,
                uploadedAt: new Date().toISOString()
              };
              setVinPhotoItem(uploadedPhotoObj);
              setPhotos(prev => [...prev.filter(p => !p.isVinPhoto), uploadedPhotoObj]);
            }
          } catch (err) {
            console.error('VIN photo upload error:', err);
          } finally {
            if (activeVinScanIdRef.current === scanId) {
              setVinPhotoUploading(false);
            }
          }
          return uploadedPhotoObj;
        })();

        const scanTask = (async () => {
          try {
            const scanRes = await scanImageFileForVin(
              file,
              category,
              () => activeVinScanIdRef.current !== scanId,
              null,
              { directVinTagPhoto: true }
            );
            if (activeVinScanIdRef.current !== scanId) return '';
            const detected = typeof scanRes === 'string' ? scanRes : (scanRes?.vin || '');
            if (detected) {
              latestVinRef.current = detected;
              setVinScanSource('ocr');
              setVinPhotoScanFailed(false);
              setFormData(prev => ({ ...prev, vinOrSerial: detected }));
              setVinPhotoItem(prev => (prev && prev.id === mediaId ? { ...prev, detectedVin: detected, unreadableVinTag: false } : prev));
              setPhotos(prev => prev.map(p => (p.id === mediaId ? { ...p, detectedVin: detected, unreadableVinTag: false } : p)));
            } else {
              setVinPhotoScanFailed(true);
              setVinScanSource('manual');
              setVinPhotoItem(prev => (prev && prev.id === mediaId ? { ...prev, detectedVin: '', unreadableVinTag: true } : prev));
              setPhotos(prev => prev.map(p => (p.id === mediaId ? { ...p, detectedVin: '', unreadableVinTag: true } : p)));
            }
            return detected;
          } catch (err) {
            if (activeVinScanIdRef.current === scanId) {
              setVinPhotoScanFailed(true);
              setVinScanSource('manual');
            }
            return '';
          } finally {
            if (activeVinScanIdRef.current === scanId) {
              setScanningVin(false);
            }
          }
        })();

        const [finalPhoto, detectedVin] = await Promise.all([uploadTask, scanTask]);
        if (activeVinScanIdRef.current === scanId && finalPhoto) {
          const updatedPhoto = {
            ...finalPhoto,
            detectedVin: detectedVin || '',
            unreadableVinTag: !detectedVin
          };
          setVinPhotoItem(updatedPhoto);
          setPhotos(prev => prev.map(p => (p.id === mediaId ? updatedPhoto : p)));
        }
      };

      const handleVinPhotoSelect = async (e) => {
        const selectedFile = e.target?.files?.[0];
        if (e.target) e.target.value = '';
        if (selectedFile) {
          await handleVinPhotoFile(selectedFile);
        }
      };

      const handleVinPhotoDrop = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDraggingVinPhoto(false);
        const droppedFile = e.dataTransfer?.files?.[0];
        if (droppedFile) {
          await handleVinPhotoFile(droppedFile);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (photos.length < 3) {
          alert('Please upload at least 3 photos of your unit before submitting.');
          setStep(2);
          return;
        }
        if (category === 'tractor' && !formData.transmissionType) {
          alert('Please select the Transmission Type for your tractor.');
          setStep(3);
          return;
        }
        if (category !== 'container' && (!formData.vinOrSerial || !formData.vinOrSerial.trim())) {
          alert(`Please provide the ${idMeta.label} on the Unit Details step before submitting.`);
          setStep(3);
          return;
        }
        if (!formData.conditionNotes?.trim()) {
          alert('Please describe the condition of the unit and any flaws or issues.');
          setStep(4);
          return;
        }
        if (!formData.titleStatus) {
          alert('Please select your title / loan status to proceed.');
          setStep(5);
          return;
        }
        if (formData.workingWithSalesperson === 'yes') {
          if (!formData.salespersonFirstName?.trim() || !formData.salespersonLastInitial?.trim()) {
            alert(
              formData.intent === 'trade'
                ? "Please enter your SR1 salesperson's first name and last name initial."
                : "Please enter the SR1 team member's first name and last name initial."
            );
            setStep(1);
            return;
          }
        }
        const cleanZip = String(formData.zipCode || '').replace(/\D/g, '').slice(0, 5);
        if (cleanZip.length !== 5) {
          alert('Please enter your 5-digit Zip Code.');
          return;
        }
        if (!formData.preferredLocation) {
          alert(formData.intent === 'trade'
            ? 'Please select your closest SR1 dealership that sells this type of unit (even if the trade is with another segment).'
            : 'Please select your closest SR1 dealership (filtered to locations that deal with this unit type).');
          return;
        }
        if (!formData.consentOptIn) {
          alert('Please agree to the marketing and outreach consent to proceed with your valuation.');
          return;
        }
        if (!formData.resaleAcknowledgement) {
          alert('Please check the Resale Acknowledgement box to proceed with your valuation.');
          return;
        }

    function getPartnerUnitProcessStatus(item, portalTypeOverride) {
      const pType = portalTypeOverride || (item?.submissionSource === 'bank' || item?.partnerType === 'bank' ? 'bank' : 'dealer');
      const manualId = item?.partnerWorkflowStatus || '';
      const manualMeta = PARTNER_WORKFLOW_STATUSES.find(s => s.manualByStaff && s.id === manualId);

      let resolvedMeta = null;
      if (manualMeta) {
        resolvedMeta = manualMeta;
      } else {
        const hasOffer = Array.isArray(item?.offers) && item.offers.length > 0;
        const decision = item?.partnerAcceptance?.decision || '';
        if (hasOffer) {
          if (decision === 'accepted') {
            resolvedMeta = PARTNER_WORKFLOW_STATUSES.find(s => s.id === 'waiting_transaction_plan');
          } else if (decision === 'declined') {
            resolvedMeta = PARTNER_WORKFLOW_STATUSES.find(s => s.id === 'deal_not_made');
          } else {
            resolvedMeta = PARTNER_WORKFLOW_STATUSES.find(s => s.id === 'waiting_partner_acceptance');
          }
        } else {
          resolvedMeta = PARTNER_WORKFLOW_STATUSES.find(s => s.id === 'waiting_sr1_offer');
        }
      }

      const displayLabel = resolvedMeta.id === 'waiting_partner_acceptance'
        ? (pType === 'bank' ? resolvedMeta.bankLabel : resolvedMeta.dealerLabel)
        : resolvedMeta.label;

      return {
        ...resolvedMeta,
        displayLabel,
        isManualOverride: Boolean(manualMeta)
      };
    }

    function calculatePartnerUnitCompleteness(item) {
      if (!item) return { percent: 0, completedChecks: 0, totalChecks: 1, photoCount: 0, missingItems: [] };
      const unit = item.unit || {};
      const financials = item.financials || {};
      const cat = unit.category || '';
      const usageMeta = getPartnerPortalUsageFieldMeta(cat);

      const checks = [];
      const addCheck = (label, ok) => checks.push({ label, ok: Boolean(ok) });

      addCheck('Type', Boolean(cat && CATEGORIES[cat]));
      addCheck('Year', Boolean(String(unit.year || '').trim()));
      const cleanMake = String(unit.make || '').trim();
      addCheck('Make', Boolean(cleanMake && cleanMake !== 'Unspecified Make' && cleanMake !== 'Unknown Make'));
      const cleanModel = String(unit.model || '').trim();
      addCheck('Model', Boolean(cleanModel && cleanModel !== 'Unit' && (cat === 'container' || cleanModel !== 'Container')));

      if (usageMeta.show) {
        addCheck(usageMeta.label, Number(unit.mileageOrHours) > 0);
      }
      if (cat !== 'container') {
        const vinNorm = String(unit.vinOrSerial || '').trim().toUpperCase();
        const hasRealVin = Boolean(
          vinNorm &&
          !['N/A', 'NA', 'NONE', 'PENDING', 'VIN-PENDING', 'SERIAL-PENDING', 'HIN-PENDING', 'UNKNOWN'].includes(vinNorm)
        );
        addCheck(getPartnerPortalIdFieldMeta(cat).label, hasRealVin);
      }

      addCheck('Title / Paperwork', Boolean(String(financials.titleStatus || '').trim()));
      addCheck('Pickup / Drop Off', Boolean(String(item.preferredLocation || '').trim()));
      addCheck('Condition Notes', Boolean(String(unit.conditionNotes || '').trim()));

      // Minimum 3 photos requirement (weighted as 3 checks so 1/3, 2/3, 3/3 progress smoothly)
      const photosArr = Array.isArray(item.photos) ? item.photos : [];
      const photoCount = photosArr.length;
      const photoChecksEarned = Math.min(3, photoCount);
      const fieldChecksEarned = checks.filter(c => c.ok).length;
      const totalChecks = checks.length + 3;
      const completedChecks = fieldChecksEarned + photoChecksEarned;
      const percent = Math.round((completedChecks / totalChecks) * 100);

      const missingItems = checks.filter(c => !c.ok).map(c => c.label);
      if (photoCount < 3) {
        missingItems.push(`${3 - photoCount} more photo${3 - photoCount === 1 ? '' : 's'} (min 3)`);
      }

      return {
        percent,
        completedChecks,
        totalChecks,
        photoCount,
        missingItems
      };
    }

    function getRealUnitChatMessages(item) {
      const raw = Array.isArray(item?.unitMessages) ? item.unitMessages : [];
      return raw.filter((m) => {
        if (!m || !String(m.text || '').trim()) return false;
        // Exclude legacy auto-seeded submission announcement messages so new deals start cleanly with "No messages"
        if (/^Submitted via (Dealer|Bank|Partner).+Portal by /i.test(String(m.text).trim())) {
          return false;
        }
        return true;
      });
    }

    function buildClientChatRecapFallback(item, portalTypeOverride) {
      const msgs = getRealUnitChatMessages(item);
      if (msgs.length === 0) return '';
      const pType = portalTypeOverride || (item?.submissionSource === 'bank' || item?.partnerType === 'bank' ? 'bank' : 'dealer');
      const partnerLabel = pType === 'bank' ? 'Bank' : 'Dealer';
      const last = msgs[msgs.length - 1];
      const lastText = String(last.text || '').trim();
      const isStaff = last.senderRole === 'staff';
      const speaker = isStaff ? 'SR1' : partnerLabel;
      const waitingOn = isStaff ? partnerLabel.toLowerCase() : 'SR1';
      const lastOffer = Array.isArray(item?.offers) && item.offers.length > 0 ? item.offers[item.offers.length - 1] : null;

      if (item?.partnerAcceptance?.decision === 'accepted' && /accepted/i.test(lastText)) {
        return `${partnerLabel} accepted SR1's offer; awaiting SR1 to coordinate pickup & paperwork.`;
      }
      if (item?.partnerAcceptance?.decision === 'declined' && /declined/i.test(lastText)) {
        return `${partnerLabel} declined SR1's offer; deal currently paused unless revised.`;
      }
      if (isStaff && /official sr1 offer recorded/i.test(lastText)) {
        const amt = lastOffer?.amount ? `$${Number(lastOffer.amount).toLocaleString()} ` : '';
        return `SR1 posted a ${amt}offer; waiting on ${partnerLabel.toLowerCase()} response.`;
      }

      const lower = lastText.toLowerCase();
      const hasQ = lastText.includes('?');
      let topic = '';
      if (/\b(pick\s*up|pickup|drop\s*off|transport|deliver|haul|schedule|logistics)\b/i.test(lower)) topic = 'pickup / delivery logistics';
      else if (/\b(title|paperwork|affidavit|lien|payoff|bill of sale|repo)\b/i.test(lower)) topic = 'title & paperwork details';
      else if (/\b(\$|offer|price|counter|bid|amount|number|value)\b/i.test(lower)) topic = 'pricing / offer terms';
      else if (/\b(photo|pic|picture|video|vin|serial|hour|mile|damage|condition)\b/i.test(lower)) topic = 'unit details / photos';

      if (topic) {
        return hasQ
          ? `${speaker} asked about ${topic}; waiting on ${waitingOn} reply.`
          : `${speaker} shared an update on ${topic}; awaiting ${waitingOn} reply.`;
      }
      const snippet = lastText.replace(/\s+/g, ' ').slice(0, 68);
      return `${speaker}: "${snippet}${lastText.length > 68 ? '…' : ''}" — awaiting ${waitingOn} reply.`;
    }

    async function requestUnitChatAiRecap(item, messagesOverride, portalTypeOverride) {
      const msgs = Array.isArray(messagesOverride) ? messagesOverride : getRealUnitChatMessages(item);
      if (msgs.length === 0) return null;
      const pType = portalTypeOverride || (item?.submissionSource === 'bank' || item?.partnerType === 'bank' ? 'bank' : 'dealer');
      const unitTitle = [item?.unit?.year, item?.unit?.make, item?.unit?.model].filter(Boolean).join(' ') || 'Submitted Unit';
      const lastOffer = Array.isArray(item?.offers) && item.offers.length > 0 ? item.offers[item.offers.length - 1] : null;
      const processStatus = getPartnerUnitProcessStatus(item, pType);

      try {
        const res = await fetch('/api/chat-recap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            unitTitle,
            partnerType: pType,
            currentStatus: processStatus.displayLabel,
            offerAmount: Number(lastOffer?.amount) || 0,
            acceptanceDecision: item?.partnerAcceptance?.decision || '',
            messages: msgs.slice(-12).map((m) => ({
              senderRole: m.senderRole,
              senderName: m.senderName,
              text: m.text,
              createdAt: m.createdAt
            }))
          })
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.recap) {
            return {
              text: data.recap,
              messageCount: msgs.length,
              updatedAt: new Date().toISOString(),
              source: data.source || 'ai'
            };
          }
        }
      } catch (err) {
        console.warn('Chat AI recap request fallback:', err);
      }
      const fallback = buildClientChatRecapFallback({ ...item, unitMessages: msgs }, pType);
      return fallback ? { text: fallback, messageCount: msgs.length, updatedAt: new Date().toISOString(), source: 'client_fallback' } : null;
    }

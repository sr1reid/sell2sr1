    const IGNORED_DUPLICATE_VIN_VALUES = new Set([
      '',
      'N/A',
      'NA',
      'NONE',
      'UNKNOWN',
      'PENDING',
      'TBD',
      'VIN-PENDING',
      'SERIAL-PENDING',
      'HIN-PENDING',
      'VIN PENDING',
      'SERIAL PENDING',
      'HIN PENDING',
      'NOT PROVIDED',
      'UNREADABLE'
    ]);

    function normalizeVinOrSerialForDuplicateCheck(rawVal) {
      const cleaned = String(rawVal || '').trim().toUpperCase();
      if (!cleaned || IGNORED_DUPLICATE_VIN_VALUES.has(cleaned)) return '';
      return cleaned;
    }

    function StaffPortalView({ inquiries, partners = [], onSavePartner, onSubmitInquiry, onUpdateInquiry, onDeleteInquiry, selectedInquiryId, setSelectedInquiryId, staffUser, onSignOut, onRefreshPortalData, onSyncSamplesToCloud, emailRoutingConfig, onSaveEmailRoutingConfig, siteAnalytics }) {
      const canManageRouting = isSuperAdmin(staffUser);
      const canDeleteInquiries = isSuperAdmin(staffUser);
      const [refreshingPortal, setRefreshingPortal] = useState(false);

      // Identify exact duplicate units strictly by VIN or Serial Number across all submissions (active & archived)
      const duplicateVinAnalysis = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        const bucketMap = new Map();

        list.forEach((inq) => {
          if (!inq) return;
          const normKey = normalizeVinOrSerialForDuplicateCheck(inq.unit?.vinOrSerial);
          if (!normKey) return;
          if (!bucketMap.has(normKey)) {
            bucketMap.set(normKey, []);
          }
          bucketMap.get(normKey).push(inq);
        });

        const groups = [];
        const byInquiryId = new Map();
        let totalFlaggedSubmissions = 0;

        bucketMap.forEach((items, vin) => {
          if (items.length < 2) return;
          const oldestFirst = [...items].sort((a, b) => {
            const ta = new Date(a.createdAt || 0).getTime() || 0;
            const tb = new Date(b.createdAt || 0).getTime() || 0;
            if (ta !== tb) return ta - tb;
            return String(a.id || '').localeCompare(String(b.id || ''));
          });
          const newestFirst = [...oldestFirst].reverse();
          const originalId = oldestFirst[0].id;
          const hasActive = items.some((x) => !(x.isArchived || x.stage === 'archived'));
          const latestCreatedAt = new Date(newestFirst[0].createdAt || 0).getTime() || 0;

          const ordinalById = new Map();
          oldestFirst.forEach((entry, idx) => {
            ordinalById.set(entry.id, idx + 1);
          });

          totalFlaggedSubmissions += items.length;
          groups.push({
            vin,
            items: newestFirst,
            originalId,
            ordinalById,
            hasActive,
            latestCreatedAt,
            representative: newestFirst[0]
          });

          oldestFirst.forEach((entry, idx) => {
            byInquiryId.set(entry.id, {
              vin,
              count: items.length,
              ordinal: idx + 1,
              isOriginal: entry.id === originalId,
              peers: newestFirst.filter((other) => other.id !== entry.id)
            });
          });
        });

        groups.sort((a, b) => {
          if (a.hasActive !== b.hasActive) return a.hasActive ? -1 : 1;
          return b.latestCreatedAt - a.latestCreatedAt;
        });

        return { groups, byInquiryId, totalFlaggedSubmissions };
      }, [inquiries]);

      const handleManualPortalRefresh = async () => {
        if (refreshingPortal) return;
        setRefreshingPortal(true);
        try {
          if (typeof onRefreshPortalData === 'function') {
            await onRefreshPortalData();
          } else {
            await fetchInquiriesFromCloudRest(true);
          }
        } finally {
          setTimeout(() => setRefreshingPortal(false), 350);
        }
      };
      const incompletePastStep2Count = useMemo(() => {
        const list = Array.isArray(siteAnalytics?.partialForms) ? siteAnalytics.partialForms : [];
        return list.filter(pf => pf && !pf.completed && (Number(pf.maxStepReached) || 0) >= 3).length;
      }, [siteAnalytics]);
      const [portalTab, setPortalTab] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const t = params.get('tab');
          if ((t === 'routing' || t === 'analytics') && isSuperAdmin(staffUser)) return t;
          if (t === 'dealers' || t === 'banks' || t === 'inquiries') return t;
        } catch (e) {}
        return 'inquiries';
      });
      const [partnerSubTab, setPartnerSubTab] = useState('units'); // 'units' | 'chat'
      const [filterPartnerId, setFilterPartnerId] = useState('all');
      const [selectedPartnerId, setSelectedPartnerId] = useState(null);
      const [staffGeneralMsgText, setStaffGeneralMsgText] = useState('');
      const [sendingStaffGeneralMsg, setSendingStaffGeneralMsg] = useState(false);

      const [filterStage, setFilterStage] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          return params.get('stage') || 'all';
        } catch (e) {
          return 'all';
        }
      });
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterLocation, setFilterLocation] = useState('all');
      const [filterIntent, setFilterIntent] = useState('all'); // 'all', 'trade', 'sell'
      const [filterDealStatus, setFilterDealStatus] = useState('all'); // 'all', 'needs_outreach', 'contacted', 'deal_pending', 'deal_complete', 'deal_lost'
      const [filterSr1Rep, setFilterSr1Rep] = useState('all'); // 'all', '__with_rep__', '__no_rep__', or SR1 Rep name
      const [searchTerm, setSearchTerm] = useState('');
      const [mobileLayout, setMobileLayout] = useState(() => {
        try {
          return localStorage.getItem('sell2sr1_mobile_layout') || 'cards';
        } catch (e) {
          return 'cards';
        }
      });
      const [sortField, setSortField] = useState('date'); // 'date', 'ref', 'unit', 'customer', 'location', 'stage', 'offer', 'type'
      const [sortDirection, setSortDirection] = useState('desc'); // 'asc', 'desc'
      const [showInstallGuide, setShowInstallGuide] = useState(false);
      const [copiedLink, setCopiedLink] = useState(false);

      const handleSetMobileLayout = (layout) => {
        setMobileLayout(layout);
        try {
          localStorage.setItem('sell2sr1_mobile_layout', layout);
        } catch (e) {}
      };

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDirection(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDirection(field === 'date' || field === 'offer' ? 'desc' : 'asc');
        }
      };

      // Counts and unread badges across Consumer, Dealer, and Bank sections
      const sectionMetrics = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        const pList = Array.isArray(partners) ? partners : [];
        let consumerActive = 0;
        let dealerActive = 0;
        let bankActive = 0;

        list.forEach(inq => {
          if (!inq) return;
          const isArch = inq.isArchived || inq.stage === 'archived';
          const src = inq.submissionSource || 'consumer';
          if (src === 'dealer') {
            if (!isArch) dealerActive += 1;
          } else if (src === 'bank') {
            if (!isArch) bankActive += 1;
          } else {
            if (!isArch) consumerActive += 1;
          }
        });

        let dealerUnreadGeneral = 0;
        let bankUnreadGeneral = 0;
        let dealerOrgs = 0;
        let bankOrgs = 0;
        pList.forEach(p => {
          if (!p) return;
          const u = Number(p.unreadGeneralForStaff) || 0;
          if (p.partnerType === 'bank') {
            bankOrgs += 1;
            bankUnreadGeneral += u;
          } else {
            dealerOrgs += 1;
            dealerUnreadGeneral += u;
          }
        });

        return {
          consumerActive,
          dealerActive,
          bankActive,
          dealerUnreadGeneral,
          bankUnreadGeneral,
          dealerTotalUnread: dealerUnreadGeneral,
          bankTotalUnread: bankUnreadGeneral,
          dealerOrgs,
          bankOrgs
        };
      }, [inquiries, partners]);

      const activePartnerType = portalTab === 'dealers' ? 'dealer' : portalTab === 'banks' ? 'bank' : null;

      const currentPartnersList = useMemo(() => {
        if (!activePartnerType) return [];
        return (Array.isArray(partners) ? partners : [])
          .filter(p => p && p.partnerType === activePartnerType)
          .sort((a, b) => new Date(b.updatedAt || b.createdAt || 0).getTime() - new Date(a.updatedAt || a.createdAt || 0).getTime());
      }, [partners, activePartnerType]);

      const selectedPartner = useMemo(() => {
        if (!activePartnerType) return null;
        return currentPartnersList.find(p => p.id === selectedPartnerId) || currentPartnersList[0] || null;
      }, [currentPartnersList, selectedPartnerId, activePartnerType]);

      // Clear unreadGeneralForStaff when staff views that partner in the General Relationship Chat tab
      useEffect(() => {
        if (activePartnerType && partnerSubTab === 'chat' && selectedPartner && Number(selectedPartner.unreadGeneralForStaff) > 0 && onSavePartner) {
          onSavePartner({
            ...selectedPartner,
            unreadGeneralForStaff: 0
          });
        }
      }, [activePartnerType, partnerSubTab, selectedPartner?.id, selectedPartner?.unreadGeneralForStaff]);

      const handleSendStaffGeneralMessage = async (e) => {
        e.preventDefault();
        if (!selectedPartner || !staffGeneralMsgText.trim() || sendingStaffGeneralMsg) return;
        setSendingStaffGeneralMsg(true);
        const text = staffGeneralMsgText.trim();
        const nowIso = new Date().toISOString();
        const newMsg = {
          id: 'gmsg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          senderRole: 'staff',
          senderName: staffUser?.name || 'SR1 Buying Team',
          senderEmail: staffUser?.email || '',
          text,
          createdAt: nowIso
        };
        const updatedPartner = {
          ...selectedPartner,
          generalMessages: [...(Array.isArray(selectedPartner.generalMessages) ? selectedPartner.generalMessages : []), newMsg],
          unreadGeneralForPartner: (Number(selectedPartner.unreadGeneralForPartner) || 0) + 1,
          unreadGeneralForStaff: 0,
          updatedAt: nowIso
        };
        if (onSavePartner) {
          await onSavePartner(updatedPartner);
        }
        setStaffGeneralMsgText('');
        setSendingStaffGeneralMsg(false);

        if (selectedPartner.email) {
          dispatchPartnerEmailNotification({
            notificationKind: 'general_chat',
            partnerType: selectedPartner.partnerType,
            organizationName: selectedPartner.organizationName,
            contactName: selectedPartner.contactName,
            partnerEmail: selectedPartner.email,
            partnerPhone: selectedPartner.phone,
            senderName: staffUser?.name || 'SR1 Buying Team',
            senderRole: 'staff',
            messageText: text,
            recipientEmails: [selectedPartner.email],
            portalUrl: `https://selltosr1.com/?view=${selectedPartner.partnerType === 'bank' ? 'bank' : 'dealer'}`
          });
        }
      };

      const handleTogglePartnerStatus = async (partner) => {
        if (!partner || !onSavePartner) return;
        const nextStatus = partner.status === 'disabled' ? 'active' : 'disabled';
        const confirmMsg = nextStatus === 'disabled'
          ? `Disable portal login access for ${partner.organizationName} (${partner.email})?`
          : `Re-enable portal login access for ${partner.organizationName} (${partner.email})?`;
        if (!confirm(confirmMsg)) return;
        await onSavePartner({
          ...partner,
          status: nextStatus,
          updatedAt: new Date().toISOString()
        });
      };

      // Filter inquiries by current tab's submissionSource ('consumer', 'dealer', 'bank')
      const sourceFilteredInquiries = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        return list.filter(inq => {
          if (!inq) return false;
          const src = inq.submissionSource || 'consumer';
          if (portalTab === 'dealers') return src === 'dealer';
          if (portalTab === 'banks') return src === 'bank';
          return src === 'consumer';
        });
      }, [inquiries, portalTab]);

      const stageCounts = useMemo(() => {
        const list = sourceFilteredInquiries;
        let allActive = 0;
        let archived = 0;
        const counts = {};
        Object.keys(STAGES).forEach(k => { counts[k] = 0; });
        list.forEach(inq => {
          if (!inq) return;
          if (activePartnerType && filterPartnerId !== 'all' && inq.partnerId !== filterPartnerId) return;
          const isArch = inq.isArchived || inq.stage === 'archived';
          if (isArch) {
            archived += 1;
            counts.archived = (counts.archived || 0) + 1;
          } else {
            allActive += 1;
            if (inq.stage && counts[inq.stage] !== undefined) {
              counts[inq.stage] += 1;
            }
          }
        });
        counts.all = allActive;
        counts.archived = archived;
        return counts;
      }, [sourceFilteredInquiries, activePartnerType, filterPartnerId]);

      const sr1RepOptions = useMemo(() => {
        const countsMap = new Map();
        sourceFilteredInquiries.forEach(inq => {
          if (!inq) return;
          const isArch = inq.isArchived || inq.stage === 'archived';
          if (filterStage === 'archived' ? !isArch : isArch) return;
          const resolved = resolveSr1RepFromRawName(inq.salespersonName);
          if (!resolved.displayName) return;
          resolved.matchedNames.forEach(name => {
            countsMap.set(name, (countsMap.get(name) || 0) + 1);
          });
        });
        const activeInquiryReps = Array.from(countsMap.entries())
          .map(([name, count]) => ({ name, count }))
          .sort((a, b) => a.name.localeCompare(b.name));
        const activeNamesLower = new Set(activeInquiryReps.map(r => r.name.toLowerCase()));
        const directoryReps = SR1_SALESPERSON_DIRECTORY
          .map(emp => `${emp.first} ${emp.last}`)
          .filter((name, idx, arr) => arr.indexOf(name) === idx && !activeNamesLower.has(name.toLowerCase()))
          .sort((a, b) => a.localeCompare(b));
        return { activeInquiryReps, directoryReps };
      }, [sourceFilteredInquiries, filterStage]);

      const hasActiveFilters = Boolean(
        searchTerm ||
        filterStage !== 'all' ||
        filterPartnerId !== 'all' ||
        filterCategory !== 'all' ||
        filterLocation !== 'all' ||
        filterIntent !== 'all' ||
        filterDealStatus !== 'all' ||
        filterSr1Rep !== 'all'
      );

      const handleResetAllFilters = () => {
        setSearchTerm('');
        setFilterStage('all');
        setFilterPartnerId('all');
        setFilterCategory('all');
        setFilterLocation('all');
        setFilterIntent('all');
        setFilterDealStatus('all');
        setFilterSr1Rep('all');
      };

      const filtered = useMemo(() => {
        const list = sourceFilteredInquiries;
        return list.filter(inq => {
          if (!inq) return false;
          const isArch = inq.isArchived || inq.stage === 'archived';

          if (filterStage === 'archived') {
            if (!isArch) return false;
          } else if (filterStage === 'all') {
            if (isArch) return false;
          } else {
            if (isArch) return false;
            if (inq.stage !== filterStage) return false;
          }

          if (activePartnerType && filterPartnerId !== 'all' && inq.partnerId !== filterPartnerId) return false;
          if (filterCategory !== 'all' && inq.unit?.category !== filterCategory) return false;
          if (filterLocation !== 'all' && inq.preferredLocation !== filterLocation) return false;
          if (!activePartnerType && filterIntent !== 'all') {
            const inqIntent = inq.intent || 'sell';
            if (inqIntent !== filterIntent) return false;
          }
          if (filterDealStatus !== 'all') {
            const statusId = getInquiryDealStatusId(inq);
            if (statusId !== filterDealStatus) return false;
          }
          if (filterSr1Rep !== 'all') {
            const resolvedRep = resolveSr1RepFromRawName(inq.salespersonName);
            if (filterSr1Rep === '__with_rep__') {
              if (!resolvedRep.displayName) return false;
            } else if (filterSr1Rep === '__no_rep__') {
              if (resolvedRep.displayName) return false;
            } else {
              const targetLower = filterSr1Rep.toLowerCase();
              const matchesRep = resolvedRep.matchedNames.some(n => n.toLowerCase() === targetLower) ||
                resolvedRep.displayName.toLowerCase() === targetLower;
              if (!matchesRep) return false;
            }
          }
          if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            const custName = `${inq.customer?.firstName || ''} ${inq.customer?.lastName || ''}`.toLowerCase();
            const orgName = String(inq.partnerOrgName || '').toLowerCase();
            const ref = String(inq.referenceId || '').toLowerCase();
            const unitStr = `${inq.unit?.year || ''} ${inq.unit?.make || ''} ${inq.unit?.model || ''}`.toLowerCase();
            const vinStr = String(inq.unit?.vinOrSerial || '').toLowerCase();
            const salesStr = String(inq.salespersonName || '').toLowerCase();
            const locStr = getLocationName(inq.preferredLocation).toLowerCase();
            const phoneStr = String(inq.customer?.phone || '').toLowerCase();
            const emailStr = String(inq.customer?.email || '').toLowerCase();
            return custName.includes(term) || orgName.includes(term) || ref.includes(term) || unitStr.includes(term) || vinStr.includes(term) || salesStr.includes(term) || locStr.includes(term) || phoneStr.includes(term) || emailStr.includes(term);
          }
          return true;
        });
      }, [sourceFilteredInquiries, filterStage, activePartnerType, filterPartnerId, filterCategory, filterLocation, filterIntent, filterDealStatus, filterSr1Rep, searchTerm]);

      const sorted = useMemo(() => {
        return [...filtered].sort((a, b) => {
          let valA = '';
          let valB = '';
          if (sortField === 'date') {
            valA = new Date(a.createdAt || 0).getTime();
            valB = new Date(b.createdAt || 0).getTime();
          } else if (sortField === 'ref') {
            valA = String(a.referenceId || '');
            valB = String(b.referenceId || '');
          } else if (sortField === 'type') {
            valA = a.intent || 'sell';
            valB = b.intent || 'sell';
          } else if (sortField === 'unit') {
            valA = `${a.unit?.year || ''} ${a.unit?.make || ''} ${a.unit?.model || ''}`.trim().toLowerCase();
            valB = `${b.unit?.year || ''} ${b.unit?.make || ''} ${b.unit?.model || ''}`.trim().toLowerCase();
          } else if (sortField === 'customer') {
            valA = `${a.customer?.lastName || ''} ${a.customer?.firstName || ''}`.trim().toLowerCase();
            valB = `${b.customer?.lastName || ''} ${b.customer?.firstName || ''}`.trim().toLowerCase();
          } else if (sortField === 'location') {
            valA = getLocationName(a.preferredLocation).toLowerCase();
            valB = getLocationName(b.preferredLocation).toLowerCase();
          } else if (sortField === 'stage') {
            valA = a.stage || '';
            valB = b.stage || '';
          } else if (sortField === 'offer') {
            valA = (Array.isArray(a.offers) && a.offers.length > 0) ? (Number(a.offers[a.offers.length - 1].amount) || 0) : -1;
            valB = (Array.isArray(b.offers) && b.offers.length > 0) ? (Number(b.offers[b.offers.length - 1].amount) || 0) : -1;
          }
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filtered, sortField, sortDirection]);

      const handleQuickStatusChange = (inq, rawValue) => {
        if (!inq) return;
        const nextStatus = rawValue || null;
        const effectiveStaffName = (staffUser?.name || inq.outreach?.staffName || (staffUser?.email ? staffUser.email.split('@')[0] : 'SR1 Staff')).trim();
        const now = new Date().toLocaleString();
        const statusObj = STAFF_DEAL_STATUSES.find(s => s.id === nextStatus);

        const newOutreach = {
          reachedOut: Boolean(nextStatus),
          status: nextStatus,
          staffName: nextStatus ? effectiveStaffName : '',
          reachedOutAt: nextStatus ? now : null
        };

        const existingNotes = Array.isArray(inq.notes) ? inq.notes : [];
        const updated = {
          ...inq,
          outreach: newOutreach,
          updatedAt: new Date().toISOString(),
          notes: nextStatus ? [
            ...existingNotes,
            {
              id: 'n-outreach-' + Date.now(),
              authorName: effectiveStaffName,
              authorRole: 'Staff Member',
              createdAt: new Date().toLocaleTimeString(),
              category: 'call_log',
              content: `Staff member ${effectiveStaffName} updated deal status to "${statusObj?.label || nextStatus}".`
            }
          ] : existingNotes
        };

        onUpdateInquiry(updated);
      };

      const handleArchiveInquiry = (inq) => {
        if (!inq) return;
        const confirmMsg = `Archive inquiry #${inq.referenceId} (${inq.unit?.year || ''} ${inq.unit?.make || ''} ${inq.unit?.model || ''})?\n\nIt will be hidden from the active pipeline and moved to the Archived tab.`;
        if (!confirm(confirmMsg)) return;

        const now = new Date().toISOString();
        const prevStage = (inq.stage && inq.stage !== 'archived') ? inq.stage : 'new';
        const archiveNote = {
          id: 'note-' + Date.now(),
          authorName: staffUser?.name || 'SR1 Staff',
          authorRole: 'Appraiser',
          createdAt: new Date().toLocaleTimeString(),
          category: 'general',
          content: 'Inquiry archived.'
        };

        const updated = {
          ...inq,
          isArchived: true,
          stage: 'archived',
          previousStage: prevStage,
          archivedAt: now,
          archivedBy: staffUser?.name || 'Staff Appraiser',
          notes: Array.isArray(inq.notes) ? [...inq.notes, archiveNote] : [archiveNote],
          updatedAt: now
        };

        onUpdateInquiry(updated);
      };

      const handleUnarchiveInquiry = (inq) => {
        if (!inq) return;
        const restoredStage = (inq.previousStage && inq.previousStage !== 'archived') ? inq.previousStage : 'new';
        const now = new Date().toISOString();
        const unarchiveNote = {
          id: 'note-' + Date.now(),
          authorName: staffUser?.name || 'SR1 Staff',
          authorRole: 'Appraiser',
          createdAt: new Date().toLocaleTimeString(),
          category: 'general',
          content: `Inquiry restored from archive back to ${STAGES[restoredStage]?.label || 'active pipeline'}.`
        };

        const updated = {
          ...inq,
          isArchived: false,
          stage: restoredStage,
          archivedAt: null,
          archivedBy: null,
          notes: Array.isArray(inq.notes) ? [...inq.notes, unarchiveNote] : [unarchiveNote],
          updatedAt: now
        };

        onUpdateInquiry(updated);
      };

      const handleConfirmDeleteInquiry = (inq) => {
        if (!inq || !canDeleteInquiries || !onDeleteInquiry) return;
        const unitTitle = [inq.unit?.year, inq.unit?.make, inq.unit?.model].filter(Boolean).join(' ') || 'Unit';
        const customerName = [inq.customer?.firstName, inq.customer?.lastName].filter(Boolean).join(' ') || 'Unknown Customer';
        const confirmMsg = `Permanently delete inquiry #${inq.referenceId} (${unitTitle} — ${customerName})?\n\nThis action cannot be undone and will permanently remove the inquiry from the portal and database.`;
        if (!confirm(confirmMsg)) return;
        onDeleteInquiry(inq);
      };

      const selectedInquiry = (inquiries || []).find(i => i && i.id === selectedInquiryId);
      const lastLoggedOpenRef = useRef(null);

      const recordInquirySeenBy = (inq, user) => {
        if (!inq) return null;
        const email = (user?.email || '').trim().toLowerCase();
        const name = (user?.name || (email ? email.split('@')[0] : '') || 'SR1 Staff').trim();
        const picture = user?.picture || '';
        const nowIso = new Date().toISOString();
        const existingList = Array.isArray(inq.seenBy) ? inq.seenBy : [];

        let matched = false;
        const updatedList = existingList.map(entry => {
          const entryEmail = (entry?.email || '').trim().toLowerCase();
          const entryName = (entry?.name || '').trim().toLowerCase();
          const isSameUser = (email && entryEmail && email === entryEmail) || (!email && name && entryName && name.toLowerCase() === entryName);
          if (isSameUser) {
            matched = true;
            return {
              ...entry,
              email: email || entry.email || '',
              name: name || entry.name || 'SR1 Staff',
              picture: picture || entry.picture || '',
              firstSeenAt: entry.firstSeenAt || entry.seenAt || nowIso,
              lastSeenAt: nowIso,
              viewCount: (Number(entry.viewCount) || 1) + 1
            };
          }
          return entry;
        });

        if (!matched) {
          updatedList.unshift({
            email,
            name,
            picture,
            firstSeenAt: nowIso,
            lastSeenAt: nowIso,
            viewCount: 1
          });
        }

        updatedList.sort((a, b) => new Date(b.lastSeenAt || b.seenAt || 0).getTime() - new Date(a.lastSeenAt || a.seenAt || 0).getTime());

        return {
          ...inq,
          seenBy: updatedList
        };
      };

      const handleOpenInquiry = (inq) => {
        if (!inq) return;
        if (typeof window !== 'undefined' && window.__sr1SuppressRowOpenUntil && Date.now() < window.__sr1SuppressRowOpenUntil) {
          return;
        }
        lastLoggedOpenRef.current = inq.id;
        setSelectedInquiryId(inq.id);
        const updated = recordInquirySeenBy(inq, staffUser);
        if (updated) {
          onUpdateInquiry(updated);
        }
      };

      useEffect(() => {
        if (!selectedInquiryId) {
          lastLoggedOpenRef.current = null;
          return;
        }
        if (lastLoggedOpenRef.current !== selectedInquiryId && selectedInquiry) {
          lastLoggedOpenRef.current = selectedInquiryId;
          const updated = recordInquirySeenBy(selectedInquiry, staffUser);
          if (updated) {
            onUpdateInquiry(updated);
          }
        }
      }, [selectedInquiryId, selectedInquiry?.id, staffUser?.email]);

      return (
        <div className="py-4 sm:py-6 max-w-[1760px] w-full mx-auto px-2 sm:px-6 lg:px-8 space-y-4 sm:space-y-6 overflow-x-hidden">
          
          {/* HEADER */}
          <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-3 sm:gap-4 bg-neutral-900 border border-neutral-800 p-3.5 sm:p-4 rounded-2xl">
            <div className="flex flex-col lg:flex-row lg:items-center gap-3">
              <div>
                <h1 className="text-base sm:text-lg font-bold text-white">Staff Appraisal & Purchasing Desk</h1>
                <p className="text-xs text-neutral-400">Direct mobile & desktop appraisal portal for SR1 Companies</p>
              </div>

              <div className="flex flex-wrap items-center p-1 bg-neutral-950 border border-neutral-800 rounded-xl gap-1 lg:ml-3">
                <button
                  type="button"
                  onClick={() => {
                    setPortalTab('inquiries');
                    setFilterPartnerId('all');
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'inquiries' ? 'bg-neutral-100 text-neutral-950 shadow-sm' : 'text-neutral-400 hover:text-white'}`}
                >
                  <span>👤</span>
                  <span>Consumer Inquiries</span>
                  <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${portalTab === 'inquiries' ? 'bg-neutral-300 text-neutral-900' : 'bg-neutral-800 text-neutral-400'}`}>
                    {sectionMetrics.consumerActive || 0}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    setPortalTab('dealers');
                    setPartnerSubTab('units');
                    setFilterPartnerId('all');
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'dealers' ? 'bg-blue-500 text-neutral-950 shadow-sm' : 'text-blue-300 hover:text-white hover:bg-neutral-900'}`}
                >
                  <span>🤝</span>
                  <span>Dealers (Trade Banking)</span>
                  <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${portalTab === 'dealers' ? 'bg-neutral-950/20 text-neutral-950' : 'bg-blue-950/90 text-blue-300 border border-blue-800/70'}`}>
                    {sectionMetrics.dealerActive || 0}
                  </span>
                  {sectionMetrics.dealerTotalUnread > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full text-[10px] font-black bg-red-500 text-white animate-pulse">
                      💬 {sectionMetrics.dealerTotalUnread}
                    </span>
                  )}
                </button>

                <button
                  type="button"
                  onClick={() => {
                    setPortalTab('banks');
                    setPartnerSubTab('units');
                    setFilterPartnerId('all');
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'banks' ? 'bg-emerald-500 text-neutral-950 shadow-sm' : 'text-emerald-300 hover:text-white hover:bg-neutral-900'}`}
                >
                  <span>🏦</span>
                  <span>Banks / Credit Unions (Repos)</span>
                  <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${portalTab === 'banks' ? 'bg-neutral-950/20 text-neutral-950' : 'bg-emerald-950/90 text-emerald-300 border border-emerald-800/70'}`}>
                    {sectionMetrics.bankActive || 0}
                  </span>
                  {sectionMetrics.bankTotalUnread > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full text-[10px] font-black bg-red-500 text-white animate-pulse">
                      💬 {sectionMetrics.bankTotalUnread}
                    </span>
                  )}
                </button>

                {canManageRouting && (
                  <>
                    <button
                      type="button"
                      onClick={() => setPortalTab('analytics')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'analytics' ? 'bg-amber-400 text-neutral-950 shadow-sm' : 'text-amber-400 hover:text-amber-300 hover:bg-neutral-900'}`}
                      title="Admin: View website traffic and incomplete forms past Step 2"
                    >
                      <span>📊</span>
                      <span>Traffic &amp; Partial Forms</span>
                      {incompletePastStep2Count > 0 && (
                        <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${portalTab === 'analytics' ? 'bg-neutral-950 text-amber-300' : 'bg-amber-500/30 text-amber-200 border border-amber-400/50'}`}>
                          {incompletePastStep2Count}
                        </span>
                      )}
                      <span className="px-1.5 py-0.2 rounded-full text-[9px] font-black uppercase bg-amber-500/30 text-amber-300 border border-amber-400/40">
                        Admin
                      </span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setPortalTab('routing')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'routing' ? 'bg-amber-400 text-neutral-950 shadow-sm' : 'text-amber-400 hover:text-amber-300 hover:bg-neutral-900'}`}
                      title="Admin: Edit where each submission routes"
                    >
                      <span>✉️</span>
                      <span>Email Routing</span>
                      <span className="px-1.5 py-0.2 rounded-full text-[9px] font-black uppercase bg-amber-500/30 text-amber-300 border border-amber-400/40">
                        Admin
                      </span>
                    </button>
                  </>
                )}
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {db && (
                <div className="flex items-center space-x-1.5 px-2.5 py-1 bg-emerald-950/70 border border-emerald-800/80 rounded-lg text-[11px] font-semibold text-emerald-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>Cloud Live</span>
                </div>
              )}

              <button
                type="button"
                onClick={handleManualPortalRefresh}
                disabled={refreshingPortal}
                title="Refresh inquiries and portal data from cloud"
                className="px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-800 disabled:opacity-60 text-neutral-200 hover:text-white border border-neutral-750 font-semibold text-xs flex items-center space-x-1.5 transition-all shadow-sm cursor-pointer"
              >
                <span className={refreshingPortal ? 'inline-block animate-spin' : ''}>↻</span>
                <span>{refreshingPortal ? 'Refreshing...' : 'Refresh'}</span>
              </button>

              {inquiries.length <= 3 && (
                <button
                  onClick={onSyncSamplesToCloud}
                  className="px-2.5 py-1 rounded-lg bg-neutral-850 hover:bg-neutral-800 text-neutral-300 border border-neutral-750 text-[11px] font-semibold transition-all"
                  title="Upload sample inquiries to Firebase Firestore cloud so other devices see them"
                >
                  ⚡ Sync Samples to Cloud
                </button>
              )}

              <button
                onClick={() => setShowInstallGuide(true)}
                className="px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-800 text-neutral-200 border border-neutral-750 font-semibold text-xs flex items-center space-x-1.5 transition-all shadow-sm"
              >
                <span>📱</span>
                <span>Install Mobile App</span>
              </button>

              {/* MOBILE ONLY VIEW TOGGLE: CARDS VS TABLE */}
              <div className="md:hidden bg-neutral-950 p-1 rounded-lg flex items-center space-x-1 border border-neutral-800 text-xs">
                <button
                  type="button"
                  onClick={() => handleSetMobileLayout('cards')}
                  className={`px-2.5 py-1 rounded-md font-semibold text-[11px] transition-all ${mobileLayout === 'cards' ? 'bg-neutral-100 text-neutral-950 shadow-sm' : 'text-neutral-400 hover:text-white'}`}
                  title="Mobile Card Layout"
                >
                  Cards
                </button>
                <button
                  type="button"
                  onClick={() => handleSetMobileLayout('table')}
                  className={`px-2.5 py-1 rounded-md font-semibold text-[11px] transition-all ${mobileLayout === 'table' ? 'bg-neutral-100 text-neutral-950 shadow-sm' : 'text-neutral-400 hover:text-white'}`}
                  title="Compact Table Layout"
                >
                  Table
                </button>
              </div>

              {staffUser && (
                <div className="flex items-center space-x-2 border-l border-neutral-800 pl-2 sm:pl-3">
                  <div className="text-right hidden md:block">
                    <div className="text-xs font-semibold text-white leading-tight">{staffUser.name || 'SR1 Staff'}</div>
                    <div className="text-[10px] text-neutral-400 leading-tight">{staffUser.email}</div>
                  </div>
                  <button
                    onClick={onSignOut}
                    className="px-2.5 py-1 bg-neutral-800 hover:bg-neutral-750 text-neutral-300 hover:text-white rounded text-[11px] font-semibold border border-neutral-700 transition-colors"
                  >
                    Sign Out
                  </button>
                </div>
              )}

      const canDeleteInquiries = isSuperAdmin(staffUser) && typeof onDeleteInquiry === 'function';
      const [currentStage, setCurrentStage] = useState(inquiry.stage);
      const latestOffer = (Array.isArray(inquiry.offers) && inquiry.offers.length > 0)
        ? inquiry.offers[inquiry.offers.length - 1]
        : null;
      const [offerAmount, setOfferAmount] = useState(
        latestOffer?.amount !== undefined && latestOffer?.amount !== null ? String(latestOffer.amount) : ''
      );
      const [offerNotes, setOfferNotes] = useState(latestOffer?.notes || 'Subject to physical inspection and title verification.');
      const [newNoteText, setNewNoteText] = useState('');
      const [staffDealChatInput, setStaffDealChatInput] = useState('');
      const [sendingStaffDealChat, setSendingStaffDealChat] = useState(false);
      const isPartnerDeal = inquiry.submissionSource === 'dealer' || inquiry.submissionSource === 'bank';

      const handleSendStaffDealChat = async (e) => {
        e.preventDefault();
        const text = (staffDealChatInput || '').trim();
        if (!text || sendingStaffDealChat || !isPartnerDeal) return;
        setSendingStaffDealChat(true);
        const nowIso = new Date().toISOString();
        const pType = inquiry.submissionSource === 'bank' ? 'bank' : 'dealer';
        const newMsg = {
          id: 'umsg-staff-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
          senderRole: 'staff',
          senderName: staffUser?.name || 'SR1 Buying Team',
          senderEmail: staffUser?.email || '',
          text,
          createdAt: nowIso
        };
        const updatedBase = {
          ...inquiry,
          unitMessages: [...(Array.isArray(inquiry.unitMessages) ? inquiry.unitMessages : []), newMsg],
          unreadUnitForPartner: (Number(inquiry.unreadUnitForPartner) || 0) + 1,
          unreadUnitForStaff: 0,
          updatedAt: nowIso
        };
        const realMsgsNow = getRealUnitChatMessages(updatedBase);
        const instantRecap = buildClientChatRecapFallback(updatedBase, pType);
        const updated = {
          ...updatedBase,
          chatAiRecap: instantRecap
            ? { text: instantRecap, messageCount: realMsgsNow.length, updatedAt: nowIso, source: 'client_fallback' }
            : updatedBase.chatAiRecap
        };
        setStaffDealChatInput('');
        onUpdateInquiry(updated);

        requestUnitChatAiRecap(updated, realMsgsNow, pType).then((aiRecap) => {
          if (aiRecap && aiRecap.text) {
            onUpdateInquiry({ ...updated, chatAiRecap: aiRecap });
          }
        });

        const targetEmail = (inquiry.partnerEmail || inquiry.customer?.email || '').trim();
        if (targetEmail) {
          const unitTitle = [inquiry.unit?.year, inquiry.unit?.make, inquiry.unit?.model].filter(Boolean).join(' ') || 'Submitted Unit';
          dispatchPartnerEmailNotification({
            notificationKind: 'unit_chat',
            partnerType: pType,
            organizationName: inquiry.partnerOrgName || `${inquiry.customer?.firstName || ''} ${inquiry.customer?.lastName || ''}`.trim(),
            contactName: inquiry.partnerContactName || `${inquiry.customer?.firstName || ''} ${inquiry.customer?.lastName || ''}`.trim(),
            partnerEmail: targetEmail,
            partnerPhone: inquiry.partnerPhone || inquiry.customer?.phone || '',
            referenceId: inquiry.referenceId,
            unitSummary: unitTitle,
            senderName: staffUser?.name || 'SR1 Buying Team',
            senderRole: 'staff',
            messageText: text,
            recipientEmails: [targetEmail],
            portalUrl: `https://selltosr1.com/?view=${pType}`
          });
        }
        setSendingStaffDealChat(false);
      };
      const mediaItems = Array.isArray(inquiry.photos) ? inquiry.photos : [];
      const [activeMediaIndex, setActiveMediaIndex] = useState(0);
      const [isLightboxOpen, setIsLightboxOpen] = useState(false);
      const [isZoomed, setIsZoomed] = useState(false);
      const touchStartXRef = useRef(null);

      const safeMediaIndex = mediaItems.length > 0 ? Math.min(activeMediaIndex, mediaItems.length - 1) : 0;
      const activeMedia = mediaItems[safeMediaIndex] || null;
      const activePhoto = activeMedia ? (activeMedia.url || activeMedia.thumbUrl || '') : '';

      const goToMedia = (idx) => {
        if (mediaItems.length === 0) return;
        const nextIdx = ((idx % mediaItems.length) + mediaItems.length) % mediaItems.length;
        setActiveMediaIndex(nextIdx);
        setIsZoomed(false);
      };

      const handlePrevMedia = (e) => {
        if (e) e.stopPropagation();
        goToMedia(safeMediaIndex - 1);
      };

      const handleNextMedia = (e) => {
        if (e) e.stopPropagation();
        goToMedia(safeMediaIndex + 1);
      };

      const handleTouchStartMedia = (e) => {
        if (e.touches && e.touches.length === 1) {
          touchStartXRef.current = e.touches[0].clientX;
        }
      };

      const handleTouchEndMedia = (e) => {
        if (touchStartXRef.current === null || !e.changedTouches || e.changedTouches.length === 0) return;
        const deltaX = e.changedTouches[0].clientX - touchStartXRef.current;
        touchStartXRef.current = null;
        if (Math.abs(deltaX) > 45 && mediaItems.length > 1) {
          if (deltaX < 0) {
            goToMedia(safeMediaIndex + 1);
          } else {
            goToMedia(safeMediaIndex - 1);
          }
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
          const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
          if (isLightboxOpen) {
            if (e.key === 'Escape') {
              e.preventDefault();
              e.stopPropagation();
              setIsLightboxOpen(false);
              setIsZoomed(false);
            } else if (e.key === 'ArrowLeft' && mediaItems.length > 1) {
              e.preventDefault();
              goToMedia(safeMediaIndex - 1);
            } else if (e.key === 'ArrowRight' && mediaItems.length > 1) {
              e.preventDefault();
              goToMedia(safeMediaIndex + 1);
            }
          } else if (!isTyping && mediaItems.length > 1) {
            if (e.key === 'ArrowLeft') {
              e.preventDefault();
              goToMedia(safeMediaIndex - 1);
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              goToMedia(safeMediaIndex + 1);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isLightboxOpen, safeMediaIndex, mediaItems.length]);

      const [outreachStaffName, setOutreachStaffName] = useState(inquiry.outreach?.staffName || staffUser?.name || '');
      const [dealStatus, setDealStatus] = useState(
        inquiry.outreach?.status || (inquiry.outreach?.reachedOut ? 'contacted' : null)

      const [reachedOutAt, setReachedOutAt] = useState(inquiry.outreach?.reachedOutAt || null);
      const seenByList = useMemo(() => {
        const list = Array.isArray(inquiry.seenBy) ? [...inquiry.seenBy] : [];
        return list.sort((a, b) => new Date(b.lastSeenAt || b.seenAt || 0).getTime() - new Date(a.lastSeenAt || a.seenAt || 0).getTime());
      }, [inquiry.seenBy]);

      useEffect(() => {
        setDealStatus(inquiry.outreach?.status || (inquiry.outreach?.reachedOut ? 'contacted' : null));
        setReachedOutAt(inquiry.outreach?.reachedOutAt || null);

          setOutreachStaffName(inquiry.outreach.staffName);

      // Market Comps Live Search State
      const defaultCompsQuery = [inquiry.unit.year, inquiry.unit.make, inquiry.unit.model].filter(Boolean).join(' ');
      const [fbCompsQuery, setFbCompsQuery] = useState(defaultCompsQuery);

      const parsedOfferAmount = Number(offerAmount) || 0;
      const netEquity = Math.max(0, parsedOfferAmount - (inquiry.financials.estimatedPayoff || 0));

      const handleSelectDealStatus = (statusId) => {
        const nextStatus = dealStatus === statusId ? null : statusId;
        const effectiveStaffName = (outreachStaffName.trim() || staffUser?.name || '').trim();
        if (nextStatus && !effectiveStaffName) {

          return;

        const now = new Date().toLocaleString();

        setReachedOutAt(nextStatus ? now : null);
        if (nextStatus && !outreachStaffName.trim() && effectiveStaffName) {
          setOutreachStaffName(effectiveStaffName);
        }

        const statusObj = STAFF_DEAL_STATUSES.find(s => s.id === nextStatus);
        const newOutreach = {
          reachedOut: Boolean(nextStatus),
          status: nextStatus,
          staffName: nextStatus ? effectiveStaffName : '',
          reachedOutAt: nextStatus ? now : null
        };

        const updated = {
          ...inquiry,
          outreach: newOutreach,
          updatedAt: new Date().toISOString(),
          notes: nextStatus ? [
            ...inquiry.notes,
            {
              id: 'n-outreach-' + Date.now(),
              authorName: effectiveStaffName,
              authorRole: 'Staff Member',
              createdAt: new Date().toLocaleTimeString(),
              category: 'call_log',
              content: `Staff member ${effectiveStaffName} updated deal status to "${statusObj?.label || nextStatus}".`
            }
          ] : inquiry.notes
        };

        onUpdateInquiry(updated);
      };

      const handleSaveStaffName = (name) => {
        setOutreachStaffName(name);
        if (dealStatus) {
          onUpdateInquiry({
            ...inquiry,
            outreach: {
              ...inquiry.outreach,
              reachedOut: true,
              status: dealStatus,
              staffName: name.trim()
            },
            updatedAt: new Date().toISOString()
          });
        }
      };

      const isArchived = Boolean(inquiry.isArchived || currentStage === 'archived' || inquiry.stage === 'archived');

      useEffect(() => {
        setCurrentStage(inquiry.stage);
      }, [inquiry.stage]);

      const handleSaveStage = (newSt) => {
        setCurrentStage(newSt);
        const now = new Date().toISOString();
        if (newSt === 'archived') {
          const prevStage = (inquiry.stage && inquiry.stage !== 'archived') ? inquiry.stage : (inquiry.previousStage || 'new');
          const archiveNote = {
            id: 'note-' + Date.now(),
            authorName: outreachStaffName.trim() || 'Staff Appraiser',
            authorRole: 'Appraiser',
            createdAt: new Date().toLocaleTimeString(),
            category: 'general',
            content: 'Stage set to Archived. Inquiry hidden from active pipeline.'

          onUpdateInquiry({
            ...inquiry,
            stage: 'archived',
            isArchived: true,
            previousStage: prevStage,
            archivedAt: now,
            archivedBy: outreachStaffName.trim() || 'Staff Appraiser',
            notes: Array.isArray(inquiry.notes) ? [...inquiry.notes, archiveNote] : [archiveNote],
            updatedAt: now
          });
        } else if (inquiry.isArchived || inquiry.stage === 'archived') {
          const restoreNote = {
            id: 'note-' + Date.now(),
            authorName: outreachStaffName.trim() || 'Staff Appraiser',
            authorRole: 'Appraiser',
            createdAt: new Date().toLocaleTimeString(),
            category: 'general',
            content: `Stage changed from Archived to ${STAGES[newSt]?.label || newSt}. Inquiry restored to active pipeline.`

          onUpdateInquiry({
            ...inquiry,
            stage: newSt,
            isArchived: false,
            previousStage: null,
            notes: Array.isArray(inquiry.notes) ? [...inquiry.notes, restoreNote] : [restoreNote],
            updatedAt: now
          });
        } else {
          onUpdateInquiry({
            ...inquiry,
            stage: newSt,
            updatedAt: now
          });
        }
      };

      const handleArchiveInModal = () => {
        const confirmMsg = `Archive inquiry #${inquiry.referenceId} (${inquiry.unit?.year || ''} ${inquiry.unit?.make || ''} ${inquiry.unit?.model || ''})?\n\nIt will be hidden from the active pipeline and moved to the Archived tab.`;
        if (!confirm(confirmMsg)) return;
        handleSaveStage('archived');

      const handleUnarchiveInModal = () => {
        const restoredStage = (inquiry.previousStage && inquiry.previousStage !== 'archived') ? inquiry.previousStage : 'new';
        handleSaveStage(restoredStage);
      };

      const handleSendOffer = () => {
        const numericOffer = Number(String(offerAmount).replace(/[^0-9.]/g, ''));
        if (offerAmount === '' || isNaN(numericOffer) || numericOffer <= 0) {

        const nowIso = new Date().toISOString();
        const newOffer = {

        };

        const isPartnerUnit = inquiry.submissionSource === 'dealer' || inquiry.submissionSource === 'bank';
        const offerChatMsg = {
          id: 'umsg-offer-' + Date.now(),
          senderRole: 'staff',
          senderName: staffUser?.name || 'SR1 Appraisal Desk',
          senderEmail: staffUser?.email || '',
          text: `💵 Official SR1 Offer Recorded: $${numericOffer.toLocaleString()}${offerNotes ? ` — ${offerNotes}` : ''}`,
          createdAt: nowIso
        };

        const updated = {
          ...inquiry,
          stage: 'offer_sent',
          updatedAt: nowIso,
          offers: [...(inquiry.offers || []), newOffer],
          ...(isPartnerUnit ? { partnerAcceptance: null, partnerWorkflowStatus: null } : {}),
          unitMessages: isPartnerUnit
            ? [...(Array.isArray(inquiry.unitMessages) ? inquiry.unitMessages : []), offerChatMsg]
            : (inquiry.unitMessages || []),
          unreadUnitForPartner: isPartnerUnit ? (Number(inquiry.unreadUnitForPartner) || 0) + 1 : (inquiry.unreadUnitForPartner || 0),
          notes: [
            ...inquiry.notes,
            {
              id: 'n-off-' + Date.now(),
              authorName: staffUser?.name || 'Appraisal Desk',
              authorRole: 'Buyer',
              createdAt: new Date().toLocaleTimeString(),
              category: 'offer_reason',
              content: `Initial offer of $${numericOffer.toLocaleString()} recorded.`
            }
          ]
        };

        setCurrentStage('offer_sent');
        if (isPartnerUnit) {
          const pTypeOffer = inquiry.submissionSource === 'bank' ? 'bank' : 'dealer';
          const realMsgsOffer = getRealUnitChatMessages(updated);
          const instantOfferRecap = buildClientChatRecapFallback(updated, pTypeOffer);
          const updatedWithOfferRecap = {
            ...updated,
            chatAiRecap: instantOfferRecap
              ? { text: instantOfferRecap, messageCount: realMsgsOffer.length, updatedAt: nowIso, source: 'client_fallback' }
              : updated.chatAiRecap
          };
          onUpdateInquiry(updatedWithOfferRecap);
          requestUnitChatAiRecap(updatedWithOfferRecap, realMsgsOffer, pTypeOffer).then((aiRecap) => {
            if (aiRecap && aiRecap.text) {
              onUpdateInquiry({ ...updatedWithOfferRecap, chatAiRecap: aiRecap });
            }
          });
        } else {
          onUpdateInquiry(updated);
        }

        const targetEmail = (inquiry.partnerEmail || inquiry.customer?.email || '').trim();
        if (isPartnerUnit && targetEmail) {
          const unitTitle = [inquiry.unit?.year, inquiry.unit?.make, inquiry.unit?.model].filter(Boolean).join(' ') || 'Submitted Unit';
          const pType = inquiry.submissionSource === 'bank' ? 'bank' : 'dealer';
          dispatchPartnerEmailNotification({
            notificationKind: 'offer_sent',
            partnerType: pType,
            organizationName: inquiry.partnerOrgName || `${inquiry.customer?.firstName || ''} ${inquiry.customer?.lastName || ''}`.trim(),
            contactName: inquiry.partnerContactName || `${inquiry.customer?.firstName || ''} ${inquiry.customer?.lastName || ''}`.trim(),
            partnerEmail: targetEmail,
            partnerPhone: inquiry.partnerPhone || inquiry.customer?.phone || '',
            referenceId: inquiry.referenceId,
            unitSummary: unitTitle,
            offerAmount: numericOffer,
            senderName: staffUser?.name || 'SR1 Appraisal Desk',
            senderRole: 'staff',
            messageText: offerNotes || 'Subject to physical inspection and title verification.',
            recipientEmails: [targetEmail],
            portalUrl: `https://selltosr1.com/?view=${pType}`
          });
        }

        alert(`Offer of $${numericOffer.toLocaleString()} logged${isPartnerUnit ? ` and sent to ${inquiry.partnerOrgName || inquiry.customer.firstName}` : ` for ${inquiry.customer.firstName}`}.`);
      };

      const handleAddNote = (e) => {
        e.preventDefault();
        if (!newNoteText.trim()) return;

        const newNote = {
          id: 'note-' + Date.now(),
          authorName: 'Staff Buyer',
          authorRole: 'Team Member',
          createdAt: new Date().toLocaleTimeString(),
          category: 'comp',
          content: newNoteText.trim()
        };

        onUpdateInquiry({
          ...inquiry,
          notes: [...inquiry.notes, newNote],
          updatedAt: new Date().toISOString()
        });
        setNewNoteText('');

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 md:p-6 overflow-y-auto">
          <div className="bg-neutral-900 border border-neutral-750 rounded-2xl w-full max-w-6xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden text-xs">
            
            <div className="bg-neutral-950 p-4 border-b border-neutral-800 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                  {inquiry.submissionSource === 'dealer' ? (
                    <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-950 border border-blue-700 text-blue-300 flex items-center gap-1">
                      <span>🤝 Dealer Portal</span>
                      {inquiry.partnerOrgName && (
                        <span className="text-white bg-blue-900/60 px-1.5 py-0.2 rounded text-[10px]">
                          {inquiry.partnerOrgName}
                        </span>
                      )}
                    </span>
                  ) : inquiry.submissionSource === 'bank' ? (
                    <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-950 border border-emerald-700 text-emerald-300 flex items-center gap-1">
                      <span>🏦 Bank / CU Repo</span>
                      {inquiry.partnerOrgName && (

                          {inquiry.partnerOrgName}
                        </span>
                      )}
                    </span>

                  {inquiry.customer.email && (

                <button

              {Array.isArray(duplicateMatches) && duplicateMatches.length > 0 && (

                        {inquiry.archivedBy ? ` by ${inquiry.archivedBy}` : ''}.
                      </div>

                  </div>
                  <button

                </div>
              </div>

              {/* INDIVIDUAL DEAL CHAT BOX (DEALER & BANK PORTAL UNITS ONLY) */}
              {isPartnerDeal && (
                <div className="bg-neutral-950 rounded-xl border border-neutral-800 overflow-hidden flex flex-col">
                  <div className="px-4 py-3 bg-neutral-900 border-b border-neutral-800 flex items-center justify-between gap-2">
                    <div>
                      <span className="text-[11px] font-bold uppercase text-neutral-200 flex items-center gap-1.5">
                        <span>💬</span>
                        <span>Deal Chat with {inquiry.partnerOrgName || (inquiry.submissionSource === 'bank' ? 'Bank Partner' : 'Dealer Partner')}</span>
                      </span>
                      <span className="text-[10px] text-neutral-400">
                        Individual deal conversation — replies automatically update the AI chat recap in the partner portal.
                      </span>
                    </div>
                    <span className="text-[10px] font-bold text-neutral-400">
                      {getRealUnitChatMessages(inquiry).length} {getRealUnitChatMessages(inquiry).length === 1 ? 'message' : 'messages'}
                    </span>
                  </div>
                  <div className="p-3.5 space-y-2.5 max-h-60 overflow-y-auto">
                    {getRealUnitChatMessages(inquiry).length === 0 ? (
                      <div className="py-6 text-center text-neutral-500 text-xs">
                        No messages on this unit yet.
                      </div>
                    ) : (
                      getRealUnitChatMessages(inquiry).map((msg, idx) => {
                        const isStaff = msg.senderRole === 'staff';
                        const tInfo = formatInquiryDate(msg.createdAt);
                        return (
                          <div key={msg.id || idx} className={`flex flex-col ${isStaff ? 'items-end' : 'items-start'}`}>
                            <div className={`max-w-[85%] rounded-2xl px-3.5 py-2 text-xs space-y-1 ${
                              isStaff
                                ? 'bg-neutral-100 text-neutral-950'
                                : 'bg-neutral-900 border border-neutral-750 text-neutral-100'
                            }`}>
                              <div className={`flex items-center gap-1.5 text-[10px] font-bold ${isStaff ? 'text-neutral-600' : 'text-sky-400'}`}>
                                <span>{msg.senderName || (isStaff ? 'SR1 Buying Team' : inquiry.partnerOrgName || 'Partner')}</span>
                                <span>•</span>
                                <span>{tInfo.date} {tInfo.time}</span>
                              </div>
                              <div className="whitespace-pre-wrap leading-relaxed">{msg.text}</div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                  <form onSubmit={handleSendStaffDealChat} className="p-3 bg-neutral-900 border-t border-neutral-800 flex gap-2">
                    <input
                      type="text"
                      value={staffDealChatInput}
                      onChange={(e) => setStaffDealChatInput(e.target.value)}
                      placeholder={`Reply to ${inquiry.partnerOrgName || 'partner'} about this unit...`}
                      className="flex-1 bg-neutral-950 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:outline-none focus:border-neutral-500"
                    />
                    <button
                      type="submit"
                      disabled={!staffDealChatInput.trim() || sendingStaffDealChat}
                      className="px-4 py-2 rounded-lg bg-white hover:bg-neutral-200 disabled:opacity-40 text-neutral-950 font-bold text-xs cursor-pointer shrink-0"
                    >
                      {sendingStaffDealChat ? 'Sending...' : 'Send'}
                    </button>
                  </form>
                </div>
              )}

              {/* NOTES */}
              <div className="space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Team Notes</span>
                <div className="space-y-2 max-h-36 overflow-y-auto">
                  {inquiry.notes.map(note => (
                    <div key={note.id} className="bg-neutral-950 p-2.5 rounded-lg border border-neutral-800 text-[11px]">
                      <div className="flex justify-between text-neutral-500 text-[10px]">
                        <span>{note.authorName} ({note.authorRole})</span>
                        <span>{note.createdAt}</span>
                      </div>
                      <p className="text-neutral-300 mt-1">{note.content}</p>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleAddNote} className="flex gap-2">
                  <input
                    type="text"
                    value={newNoteText}
                    onChange={(e) => setNewNoteText(e.target.value)}
                    placeholder="Add an internal note..."
                    className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-neutral-800 text-white font-semibold rounded-lg text-xs">
                    Post
                  </button>
                </form>
              </div>

            </div>

            <div className="bg-neutral-950 p-3 border-t border-neutral-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white font-semibold rounded-lg text-xs"
              >
                Close
              </button>
            </div>

          </div>

          {/* FULL-SCREEN INTERACTIVE MEDIA LIGHTBOX GALLERY */}
          {isLightboxOpen && activePhoto && (
            <div
              className="fixed inset-0 z-[80] bg-black/95 backdrop-blur-md flex flex-col select-none"
              onClick={() => {
                setIsLightboxOpen(false);
                setIsZoomed(false);
              }}
              onTouchStart={handleTouchStartMedia}
              onTouchEnd={handleTouchEndMedia}
            >
              {/* Top Header Bar */}
              <div
                className="flex items-center justify-between px-4 sm:px-6 py-3 bg-neutral-950/90 border-b border-neutral-800 shrink-0"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center gap-3 min-w-0">
                  <span className="px-2.5 py-1 rounded-md bg-neutral-800 border border-neutral-700 text-xs font-mono font-bold text-white shrink-0">
                    {safeMediaIndex + 1} / {mediaItems.length}
                  </span>
                  <div className="min-w-0">
                    <div className="text-xs sm:text-sm font-bold text-white truncate">
                      {activeMedia?.label || (activeMedia?.isVideo ? `Video ${safeMediaIndex + 1}` : `Photo ${safeMediaIndex + 1}`)}
                    </div>
                    <div className="text-[11px] text-neutral-400 truncate">
                      #{inquiry.referenceId} • {inquiry.unit.year} {inquiry.unit.make} {inquiry.unit.model}
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-2 shrink-0">
                  {!activeMedia?.isVideo && (
                    <button
                      type="button"
                      onClick={() => setIsZoomed((z) => !z)}
                      className="px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-750 border border-neutral-700 text-xs font-semibold text-neutral-200 hover:text-white flex items-center gap-1.5 cursor-pointer transition-colors"
                    >
                      <span>{isZoomed ? '🔍 Reset Zoom' : '🔍 Zoom In'}</span>
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => {
                      const w = window.open('');
                      if (w) {
                        if (activeMedia?.isVideo) {
                          w.document.write(`<!DOCTYPE html><html><head><title>SR1 Video Preview</title></head><body style="margin:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;"><video src="${activePhoto}" controls autoplay style="max-width:95vw;max-height:95vh;border-radius:8px;"></video></body></html>`);
                        } else {
                          w.document.write(`<!DOCTYPE html><html><head><title>SR1 Media Preview</title></head><body style="margin:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${activePhoto}" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8);"/></body></html>`);
                        }
                      }
                    }}
                    className="hidden sm:flex px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-750 border border-neutral-700 text-xs font-semibold text-neutral-300 hover:text-white items-center gap-1 cursor-pointer transition-colors"
                  >
                    <span>↗</span> New Tab
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setIsLightboxOpen(false);
                      setIsZoomed(false);
                    }}
                    className="px-3.5 py-1.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 text-xs font-bold text-white flex items-center gap-1.5 cursor-pointer transition-colors"
                  >
                    <span>✕</span> Close
                  </button>
                </div>
              </div>

              {/* Center Stage with Large Prev / Next Buttons */}
              <div className="flex-1 relative flex items-center justify-center overflow-auto p-3 sm:p-8">
                {mediaItems.length > 1 && (
                  <button
                    type="button"
                    onClick={handlePrevMedia}
                    aria-label="Previous item"
                    title="Previous (Left Arrow)"
                    className="fixed sm:absolute left-2 sm:left-5 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-neutral-900/90 hover:bg-white text-white hover:text-neutral-950 border border-white/25 flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-2xl transition-all cursor-pointer z-20"
                  >
                    ‹
                  </button>
                )}

                <div
                  className="relative flex items-center justify-center max-w-full max-h-full"
                  onClick={(e) => e.stopPropagation()}
                >
                  {activeMedia?.isVideo ? (
                    <video
                      key={activePhoto}
                      src={activePhoto}
                      controls
                      autoPlay
                      playsInline
                      className="max-w-[90vw] max-h-[75vh] rounded-xl shadow-2xl border border-neutral-800 bg-black"
                    />
                  ) : (
                    <img
                      src={activePhoto}
                      alt={activeMedia?.label || `Photo ${safeMediaIndex + 1}`}
                      onClick={() => setIsZoomed((z) => !z)}
                      className={`rounded-lg shadow-2xl transition-transform duration-200 ${
                        isZoomed
                          ? 'scale-150 cursor-zoom-out max-w-[90vw] max-h-[75vh] object-contain'
                          : 'cursor-zoom-in max-w-[90vw] max-h-[75vh] object-contain'
                      }`}
                    />
                  )}
                </div>

                {mediaItems.length > 1 && (
                  <button
                    type="button"
                    onClick={handleNextMedia}
                    aria-label="Next item"
                    title="Next (Right Arrow)"
                    className="fixed sm:absolute right-2 sm:right-5 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-neutral-900/90 hover:bg-white text-white hover:text-neutral-950 border border-white/25 flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-2xl transition-all cursor-pointer z-20"
                  >
                    ›
                  </button>
                )}
              </div>

              {/* Bottom Thumbnail Filmstrip & Keyboard Hint */}
              <div
                className="bg-neutral-950/95 border-t border-neutral-800 px-4 py-3 flex flex-col items-center gap-2 shrink-0"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center gap-2 overflow-x-auto max-w-full pb-1">
                  {mediaItems.map((p, idx) => {
                    const isSelected = idx === safeMediaIndex;
                    return (
                      <button
                        key={p.id || idx}
                        type="button"
                        onClick={() => goToMedia(idx)}
                        className={`flex-shrink-0 w-20 h-14 rounded-lg border relative overflow-hidden bg-neutral-900 cursor-pointer transition-all ${
                          isSelected
                            ? 'border-white ring-2 ring-white scale-105 opacity-100'
                            : 'border-neutral-800 opacity-50 hover:opacity-90'
                        }`}
                      >
                        <img
                          src={p.thumbUrl || p.url}
                          alt={p.label || `Media ${idx + 1}`}
                          className="w-full h-full object-cover"
                        />
                        {p.isVideo && (
                          <span className="absolute inset-0 bg-black/45 flex items-center justify-center text-white text-xs font-bold">
                            ▶
                          </span>
                        )}
                        <span className="absolute bottom-0.5 right-1 px-1 rounded bg-black/80 text-[9px] font-mono text-white">
                          {idx + 1}
                        </span>
                      </button>
                    );
                  })}
                </div>
                <div className="text-[11px] text-neutral-400 flex items-center gap-4">
                  <span>Use <strong className="text-neutral-200">← / → Arrow Keys</strong>, click <strong className="text-neutral-200">‹ / ›</strong>, or swipe to toggle photos</span>
                  <span className="hidden sm:inline">•</span>
                  <span className="hidden sm:inline">Press <strong className="text-neutral-200">Esc</strong> to close</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-neutral-950 text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
              <h2 className="text-xl font-bold">Submission Confirmed</h2>
              <p className="text-xs text-neutral-400 max-w-md">Your inquiry has been received by our appraisal desk. If you need to make changes or submit another unit, click below.</p>
              <button 
                onClick={() => {
                  try { localStorage.removeItem('sell2sr1_inquiries_v2'); } catch(e){}
                  window.location.reload();
                }} 
                className="px-5 py-2.5 bg-neutral-100 text-neutral-950 font-bold rounded-xl text-xs hover:bg-white transition-all shadow-md"
              >
                Return to Home
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

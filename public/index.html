    // Convert JavaScript object to Firestore REST typed format
    function jsonToFirestoreFields(obj) {
      if (obj === null || obj === undefined) return { nullValue: null };
      if (typeof obj === 'string') return { stringValue: obj };
      if (typeof obj === 'number') {
        return Number.isInteger(obj) ? { integerValue: obj.toString() } : { doubleValue: obj };
      }
      if (typeof obj === 'boolean') return { booleanValue: obj };
      if (Array.isArray(obj)) {
        return { arrayValue: { values: obj.map(jsonToFirestoreFields) } };
      }
      if (typeof obj === 'object') {
        const fields = {};
        for (const [k, v] of Object.entries(obj)) {
          if (v !== undefined) {
            fields[k] = jsonToFirestoreFields(v);
          }
        }
        return { mapValue: { fields } };
      }
      return { nullValue: null };
    }

    // Convert Firestore REST typed format back to plain JavaScript object
    function firestoreFieldsToJson(fsVal) {
      if (!fsVal) return null;
      if ('stringValue' in fsVal) return fsVal.stringValue;
      if ('integerValue' in fsVal) return parseInt(fsVal.integerValue, 10);
      if ('doubleValue' in fsVal) return fsVal.doubleValue;
      if ('booleanValue' in fsVal) return fsVal.booleanValue;
      if ('nullValue' in fsVal) return null;
      if ('arrayValue' in fsVal) {
        return (fsVal.arrayValue.values || []).map(firestoreFieldsToJson);
      }
      if ('mapValue' in fsVal) {
        const res = {};
        for (const [k, v] of Object.entries(fsVal.mapValue.fields || {})) {
          res[k] = firestoreFieldsToJson(v);
        }
        return res;
      }
      return null;
    }

          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } catch (e) {

      }
    }

          const item = {};
          for (const [k, v] of Object.entries(doc.fields || {})) {
            item[k] = firestoreFieldsToJson(v);
          }

    function App() {
      const [currentView, setCurrentView] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);

          return !!(saved && JSON.parse(saved)?.email?.endsWith('@sr1companies.com'));
        } catch (e) {

      });
      const [sellFlowKey, setSellFlowKey] = useState(0);

      const handleSignOut = () => {

        } catch (e) {}
        setStaffUser(null);
        setIsAuthenticated(false);
      };

      const goToHome = () => {
        setCurrentView('sell');
        setSelectedInquiryId(null);
        setSellFlowKey(prev => prev + 1);
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      };

      useEffect(() => {
        try {
          // Keep inquiries safe for localStorage (strip heavy base64 strings so mobile never throws QuotaExceeded)
          const safeInquiries = inquiries.map(item => ({
            ...item,
            photos: (item.photos || []).map(p => ({
              id: p.id,
              label: p.label,
              url: (p.url && p.url.startsWith('data:') && p.url.length > 5000)
                ? 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80'
                : p.url
            }))
          }));
          localStorage.setItem('sell2sr1_inquiries_v2', JSON.stringify(safeInquiries));
        } catch (err) {
          console.warn('LocalStorage save skipped (quota limit or private browsing):', err);
        }
      }, [inquiries]);

      // Real-time Cloud Database Sync Engine (SDK onSnapshot + REST Polling)
      useEffect(() => {
        let isMounted = true;

        const mergeInquiries = (cloudList) => {
          if (!cloudList || cloudList.length === 0) return;
          cloudList.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setInquiries(cloudList);
        };

        // 1. Immediate fetch from Cloud REST API on startup
        fetchInquiriesFromCloudRest().then(list => {
          if (isMounted && list && list.length > 0) {
            mergeInquiries(list);
          }
        });

        // 2. Real-time Firebase SDK subscription
        let unsubscribe = null;
        if (db) {
          try {
            unsubscribe = db.collection('inquiries').onSnapshot((snapshot) => {
              const cloudInquiries = [];
              snapshot.forEach((doc) => {
                cloudInquiries.push(doc.data());
              });
              if (isMounted && cloudInquiries.length > 0) {
                mergeInquiries(cloudInquiries);
              }
            }, (err) => {
              console.warn('Firestore onSnapshot sync notice:', err);
            });
          } catch (e) {
            console.warn('Firestore subscription error:', e);
          }
        }

        // 1. Direct REST save (Guaranteed delivery)
        saveInquiryToCloudRest(cleanInquiry);

        // 2. Firebase SDK save
        if (db) {
          try {
            db.collection('inquiries').doc(newInquiry.id).set(cleanInquiry)
              .catch(err => console.warn('Firestore new inquiry save notice:', err));

      const compressImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const maxDim = 1200;
              let width = img.width;
              let height = img.height;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.75));
            };
            img.onerror = () => resolve(e.target.result);
            img.src = e.target.result;
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });
      };

      const handleFileSelect = async (e) => {

                  url: compressedUrl,

    function StaffPortalView({ inquiries, onUpdateInquiry, selectedInquiryId, setSelectedInquiryId, staffUser, onSignOut, onSyncSamplesToCloud }) {
      const [filterStage, setFilterStage] = useState('all');
      const [filterCategory, setFilterCategory] = useState('all');

      const metrics = useMemo(() => {
        const total = inquiries.length;
        const newCount = inquiries.filter(i => i.stage === 'new').length;
        const appraisingCount = inquiries.filter(i => i.stage === 'appraising').length;
        const offersSent = inquiries.filter(i => i.stage === 'offer_sent').length;
        const accepted = inquiries.filter(i => i.stage === 'accepted' || i.stage === 'inspection' || i.stage === 'purchased').length;

        return { total, newCount, appraisingCount, offersSent, accepted };
      }, [inquiries]);

      const filtered = useMemo(() => {
        return inquiries.filter(inq => {
          if (filterStage !== 'all' && inq.stage !== filterStage) return false;
          if (filterCategory !== 'all' && inq.unit.category !== filterCategory) return false;
          if (filterLocation !== 'all' && inq.preferredLocation !== filterLocation) return false;
          if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            const matchesCustomer = `${inq.customer.firstName} ${inq.customer.lastName}`.toLowerCase().includes(term);
            const matchesRef = inq.referenceId.toLowerCase().includes(term);
            const matchesUnit = `${inq.unit.year} ${inq.unit.make} ${inq.unit.model}`.toLowerCase().includes(term);
            const matchesVin = (inq.unit.vinOrSerial || '').toLowerCase().includes(term);
            return matchesCustomer || matchesRef || matchesUnit || matchesVin;
          }
          return true;
        });
      }, [inquiries, filterStage, filterCategory, filterLocation, searchTerm]);

      const selectedInquiry = inquiries.find(i => i.id === selectedInquiryId);

                  <button
                    onClick={() => setShowInstallGuide(false)}
                    className="w-full sm:w-auto px-5 py-2.5 bg-neutral-800 hover:bg-neutral-750 text-neutral-300 text-xs font-semibold rounded-xl"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 4. APPRAISAL WORKSPACE MODAL
    // ==========================================
    function AppraisalWorkspaceModal({ inquiry, onClose, onUpdateInquiry }) {
      const [currentStage, setCurrentStage] = useState(inquiry.stage);
      const [offerAmount, setOfferAmount] = useState(inquiry.offers?.[0]?.amount || 25000);
      const [offerNotes, setOfferNotes] = useState(inquiry.offers?.[0]?.notes || 'Subject to physical inspection and title verification.');
      const [newNoteText, setNewNoteText] = useState('');
      const [activePhoto, setActivePhoto] = useState(inquiry.photos?.[0]?.url);
      const [outreachStaffName, setOutreachStaffName] = useState(inquiry.outreach?.staffName || '');
      const [reachedOut, setReachedOut] = useState(inquiry.outreach?.reachedOut || false);
      const [reachedOutAt, setReachedOutAt] = useState(inquiry.outreach?.reachedOutAt || null);

      const netEquity = Math.max(0, offerAmount - (inquiry.financials.estimatedPayoff || 0));

      const handleToggleOutreach = (checked) => {
        if (checked && !outreachStaffName.trim()) {
          alert('Please enter your staff name before checking off that you reached out.');
          return;
        }
        const now = new Date().toLocaleString();
        setReachedOut(checked);
        setReachedOutAt(checked ? now : null);

        const newOutreach = {
          reachedOut: checked,
          staffName: checked ? outreachStaffName.trim() : '',
          reachedOutAt: checked ? now : null
        };

        const updated = {
          ...inquiry,
          outreach: newOutreach,
          updatedAt: new Date().toISOString(),
          notes: checked ? [
            ...inquiry.notes,
            {
              id: 'n-outreach-' + Date.now(),
              authorName: outreachStaffName.trim(),
              authorRole: 'Staff Member',
              createdAt: new Date().toLocaleTimeString(),
              category: 'call_log',
              content: `Staff member ${outreachStaffName.trim()} confirmed direct outreach to client (${inquiry.customer.phone} / ${inquiry.customer.email}).`
            }
          ] : inquiry.notes
        };

        onUpdateInquiry(updated);
      };

      const handleSaveStaffName = (name) => {
        setOutreachStaffName(name);
        if (reachedOut) {
          onUpdateInquiry({
            ...inquiry,
            outreach: {
              ...inquiry.outreach,
              staffName: name.trim()
            },
            updatedAt: new Date().toISOString()
          });
        }
      };

      const handleSaveStage = (newSt) => {
        setCurrentStage(newSt);
        onUpdateInquiry({
          ...inquiry,
          stage: newSt,
          updatedAt: new Date().toISOString()
        });
      };

      const handleSendOffer = () => {
        const newOffer = {
          id: 'off-' + Date.now(),
          amount: Number(offerAmount),
          expirationDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'sent',
          createdAt: new Date().toLocaleTimeString(),
          createdBy: 'SR1 Appraisal Desk',
          notes: offerNotes,
          customerPayoffEstimate: inquiry.financials.estimatedPayoff || 0,
          calculatedNetEquity: netEquity
        };

        const updated = {
          ...inquiry,
          stage: 'offer_sent',
          updatedAt: new Date().toISOString(),
          offers: [...(inquiry.offers || []), newOffer],
          notes: [
            ...inquiry.notes,
            {
              id: 'n-off-' + Date.now(),
              authorName: 'Appraisal Desk',
              authorRole: 'Buyer',
              createdAt: new Date().toLocaleTimeString(),
              category: 'offer_reason',
              content: `Cash offer of $${Number(offerAmount).toLocaleString()} recorded.`
            }
          ]
        };

        setCurrentStage('offer_sent');
        onUpdateInquiry(updated);
        alert(`Cash offer of $${Number(offerAmount).toLocaleString()} logged for ${inquiry.customer.firstName}.`);
      };

      const handleAddNote = (e) => {
        e.preventDefault();
        if (!newNoteText.trim()) return;

        const newNote = {
          id: 'note-' + Date.now(),
          authorName: 'Staff Buyer',
          authorRole: 'Team Member',
          createdAt: new Date().toLocaleTimeString(),
          category: 'comp',
          content: newNoteText.trim()
        };

        onUpdateInquiry({
          ...inquiry,
          notes: [...inquiry.notes, newNote],
          updatedAt: new Date().toISOString()
        });
        setNewNoteText('');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-neutral-900 border border-neutral-750 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden text-xs">
            
            <div className="bg-neutral-950 p-4 border-b border-neutral-800 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-mono text-neutral-300 font-bold bg-neutral-850 px-2 py-0.5 rounded">
                    {inquiry.referenceId}
                  </span>
                  <h2 className="text-base font-bold text-white">
                    {inquiry.unit.year} {inquiry.unit.make} {inquiry.unit.model}
                  </h2>
                </div>
                <div className="flex flex-wrap items-center gap-2 mt-1.5">
                  <span className="text-[11px] text-neutral-400">
                    Seller: <strong className="text-white">{inquiry.customer.firstName} {inquiry.customer.lastName}</strong>
                  </span>
                  <a
                    href={`tel:${inquiry.customer.phone}`}
                    className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-emerald-950/70 border border-emerald-800 hover:bg-emerald-900 text-emerald-300 font-semibold rounded-md text-[11px] transition-colors"
                  >
                    <span>📞</span> {inquiry.customer.phone}
                  </a>
                  <a
                    href={`sms:${inquiry.customer.phone}`}
                    className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-blue-950/70 border border-blue-800 hover:bg-blue-900 text-blue-300 font-semibold rounded-md text-[11px] transition-colors"
                  >
                    <span>💬</span> Text
                  </a>
                  <a
                    href={`mailto:${inquiry.customer.email}`}
                    className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-neutral-850 border border-neutral-750 hover:bg-neutral-800 text-neutral-300 font-semibold rounded-md text-[11px] transition-colors"
                  >
                    <span>✉️</span> Email
                  </a>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <select
                  value={currentStage}
                  onChange={(e) => handleSaveStage(e.target.value)}
                  className="bg-neutral-850 border border-neutral-750 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-white"
                >
                  {Object.entries(STAGES).map(([k, v]) => (
                    <option key={k} value={k}>{v.label}</option>
                  ))}
                </select>

                <button
                  onClick={onClose}
                  className="w-7 h-7 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-neutral-300 flex items-center justify-center font-bold"
                >
                  ✕
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="space-y-2">
                  <span className="text-[11px] font-bold uppercase text-neutral-400">Photos</span>
                  <div className="rounded-xl overflow-hidden aspect-video bg-black border border-neutral-800">
                    {activePhoto ? (
                      <img src={activePhoto} alt="Inspection" className="w-full h-full object-cover" />
                    ) : (
                      <div className="h-full flex items-center justify-center text-neutral-500">No photos</div>
                    )}
                  </div>
                  <div className="flex space-x-2 overflow-x-auto pb-1">
                    {inquiry.photos.map(p => (
                      <button
                        key={p.id}
                        onClick={() => setActivePhoto(p.url)}
                        className={`flex-shrink-0 w-16 h-12 rounded border ${activePhoto === p.url ? 'border-neutral-200' : 'border-neutral-800 opacity-60'}`}
                      >
                        <img src={p.url} alt={p.label} className="w-full h-full object-cover rounded" />
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-3 bg-neutral-950 p-4 rounded-xl border border-neutral-800">
                  <span className="text-[11px] font-bold uppercase text-neutral-400 block">Unit Details</span>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Category</span>
                      <span className="font-semibold text-neutral-200">{CATEGORIES[inquiry.unit.category]?.label}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Type</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.subcategory}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">VIN / Serial</span>
                      <span className="font-mono text-neutral-200">{inquiry.unit.vinOrSerial || 'N/A'}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">{inquiry.unit.isHours ? 'Hours' : 'Mileage'}</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.mileageOrHours.toLocaleString()}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Condition</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.condition}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Title Status</span>
                      <span className="font-semibold text-neutral-200">{inquiry.financials.titleStatus}</span>
                    </div>
                  </div>

                  {inquiry.financials.estimatedPayoff > 0 && (
                    <div className="pt-2 border-t border-neutral-850">
                      <span className="text-neutral-500 text-[10px] block">Lender Payoff:</span>
                      <span className="text-neutral-200 font-bold">${inquiry.financials.estimatedPayoff.toLocaleString()}</span>
                    </div>
                  )}

                  {inquiry.unit.conditionNotes && (
                    <div className="pt-2 border-t border-neutral-850">
                      <span className="text-neutral-500 text-[10px] block">Disclosures:</span>
                      <p className="text-neutral-300 text-[11px] mt-0.5">{inquiry.unit.conditionNotes}</p>
                    </div>
                  )}
                </div>
              </div>

              {/* STAFF CLIENT OUTREACH CHECK-OFF */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-[11px] font-bold uppercase text-neutral-300">Staff Client Outreach</span>
                    {reachedOut ? (
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 border border-emerald-700 text-emerald-300">
                        ✓ Reached Out
                      </span>
                    ) : (
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 border border-amber-800 text-amber-300">
                        ⏳ Pending Outreach
                      </span>
                    )}
                  </div>
                  {reachedOutAt && (
                    <span className="text-[10px] text-neutral-400">
                      Logged on {reachedOutAt}
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center pt-1">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">Staff Member Name *</label>
                    <input
                      type="text"
                      value={outreachStaffName}
                      onChange={(e) => handleSaveStaffName(e.target.value)}
                      placeholder="Enter staff name..."
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2 sm:pt-4">
                    <label className="flex items-center space-x-2.5 cursor-pointer bg-neutral-900 p-2.5 rounded-lg border border-neutral-750 hover:border-neutral-600 transition-colors">
                      <input
                        type="checkbox"
                        checked={reachedOut}
                        onChange={(e) => handleToggleOutreach(e.target.checked)}
                        className="w-4 h-4 rounded border-neutral-700 text-neutral-100 bg-neutral-950 focus:ring-0 cursor-pointer"
                      />
                      <span className="text-xs font-semibold text-neutral-200 select-none">
                        I have reached out to this client
                      </span>
                    </label>
                  </div>
                </div>
              </div>

              {/* OFFER BUILDER */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Offer Desk</span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">SR1 Buy Offer ($)</label>
                    <input
                      type="number"
                      value={offerAmount}
                      onChange={(e) => setOfferAmount(Number(e.target.value))}
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-1.5 text-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">Loan Payoff ($)</label>
                    <input
                      type="number"
                      readOnly
                      value={inquiry.financials.estimatedPayoff || 0}
                      className="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-1.5 text-neutral-500 font-bold"
                    />
                  </div>
                  <div className="bg-neutral-900 p-2 rounded-lg border border-neutral-800">
                    <span className="text-neutral-400 text-[10px] block">Customer Net Check:</span>
                    <span className="text-lg font-bold text-white mt-0.5 block">${netEquity.toLocaleString()}</span>
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    onClick={handleSendOffer}
                    className="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-950 font-bold rounded-lg text-xs"
                  >
                    Save & Record Offer
                  </button>
                </div>
              </div>

              {/* NOTES */}
              <div className="space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Team Notes</span>
                <div className="space-y-2 max-h-36 overflow-y-auto">
                  {inquiry.notes.map(note => (
                    <div key={note.id} className="bg-neutral-950 p-2.5 rounded-lg border border-neutral-800 text-[11px]">
                      <div className="flex justify-between text-neutral-500 text-[10px]">
                        <span>{note.authorName} ({note.authorRole})</span>
                        <span>{note.createdAt}</span>
                      </div>
                      <p className="text-neutral-300 mt-1">{note.content}</p>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleAddNote} className="flex gap-2">
                  <input
                    type="text"
                    value={newNoteText}
                    onChange={(e) => setNewNoteText(e.target.value)}
                    placeholder="Add an internal note..."
                    className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-neutral-800 text-white font-semibold rounded-lg text-xs">
                    Post
                  </button>
                </form>
              </div>

            </div>

            <div className="bg-neutral-950 p-3 border-t border-neutral-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white font-semibold rounded-lg text-xs"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-neutral-950 text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
              <h2 className="text-xl font-bold">Submission Confirmed</h2>
              <p className="text-xs text-neutral-400 max-w-md">Your inquiry has been received by our appraisal desk. If you need to make changes or submit another unit, click below.</p>
              <button 
                onClick={() => {
                  try { localStorage.removeItem('sell2sr1_inquiries_v2'); } catch(e){}
                  window.location.reload();
                }} 
                className="px-5 py-2.5 bg-neutral-100 text-neutral-950 font-bold rounded-xl text-xs hover:bg-white transition-all shadow-md"
              >
                Return to Home
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

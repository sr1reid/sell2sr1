    // Direct Firebase Cloud Storage upload for raw photos and videos
    async function uploadMediaFileToStorage(file) {
      try {
        if (!storage && typeof firebase !== 'undefined' && firebase.storage) {
          try { storage = firebase.storage(); } catch (e) {}
        }
        if (!storage) {
          throw new Error('Firebase Storage not available');
        }

        const ext = file.name ? file.name.split('.').pop().toLowerCase() : (file.type?.startsWith('video/') ? 'mp4' : 'jpg');
        const cleanName = (file.name || 'upload')
          .replace(/[^a-zA-Z0-9._-]/g, '_')
          .toLowerCase();
        const path = `inquiries/${Date.now()}_${Math.random().toString(36).substr(2, 6)}_${cleanName}`;
        const ref = storage.ref(path);
        
        let contentType = file.type || '';
        if (!contentType) {
          if (ext === 'heic' || ext === 'heif') contentType = 'image/heic';
          else if (ext === 'mov') contentType = 'video/quicktime';
          else if (ext === 'mp4') contentType = 'video/mp4';
          else contentType = 'image/jpeg';
        }

        const metadata = { contentType };
        const snapshot = await ref.put(file, metadata);
        const downloadUrl = await snapshot.ref.getDownloadURL();
        return downloadUrl;
      } catch (err) {
        console.warn('Firebase Storage upload error:', err);
        return null;
      }
    }

    // Convert JavaScript object to Firestore REST typed format
    function jsonToFirestoreFields(obj) {
      if (obj === null || obj === undefined) return { nullValue: null };
      if (typeof obj === 'string') return { stringValue: obj };
      if (typeof obj === 'number') {
        return Number.isInteger(obj) ? { integerValue: obj.toString() } : { doubleValue: obj };
      }
      if (typeof obj === 'boolean') return { booleanValue: obj };
      if (Array.isArray(obj)) {
        return { arrayValue: { values: obj.map(jsonToFirestoreFields) } };
      }
      if (typeof obj === 'object') {
        const fields = {};
        for (const [k, v] of Object.entries(obj)) {
          if (v !== undefined) {
            fields[k] = jsonToFirestoreFields(v);
          }
        }
        return { mapValue: { fields } };
      }
      return { nullValue: null };
    }

    // Convert Firestore REST typed format back to plain JavaScript object
    function firestoreFieldsToJson(fsVal) {
      if (!fsVal) return null;
      if ('stringValue' in fsVal) return fsVal.stringValue;
      if ('integerValue' in fsVal) return parseInt(fsVal.integerValue, 10);
      if ('doubleValue' in fsVal) return fsVal.doubleValue;
      if ('booleanValue' in fsVal) return fsVal.booleanValue;
      if ('nullValue' in fsVal) return null;
      if ('arrayValue' in fsVal) {
        return (fsVal.arrayValue.values || []).map(firestoreFieldsToJson);
      }
      if ('mapValue' in fsVal) {
        const res = {};
        for (const [k, v] of Object.entries(fsVal.mapValue.fields || {})) {
          res[k] = firestoreFieldsToJson(v);
        }
        return res;
      }
      return null;
    }

    // Direct REST API save: 100% reliable across all browsers & phones
    async function saveInquiryToCloudRest(inquiry) {
      try {
        let clean = JSON.parse(JSON.stringify(inquiry));

        // Firestore strictly enforces a 1MB (1,048,576 byte) document limit.
        if (clean.photos && Array.isArray(clean.photos)) {
          clean.photos = clean.photos.slice(0, 12).map(p => {
            const isHttp = (p.url && typeof p.url === 'string' && p.url.startsWith('http'));
            const rawThumb = p.thumbUrl || p.url || '';
            const safeThumb = isHttp 
              ? p.url 
              : (typeof rawThumb === 'string' && rawThumb.length < 75000 ? rawThumb : '');
            return {
              id: p.id || 'p-' + Math.random().toString(36).substr(2, 6),
              label: p.label || 'Unit Media',
              url: isHttp ? p.url : safeThumb,
              thumbUrl: isHttp ? (p.thumbUrl || p.url) : safeThumb,
              isVideo: !!p.isVideo,
              fileSize: p.fileSize || 0,
              fileType: p.fileType || (p.isVideo ? 'video/mp4' : 'image/jpeg'),
              uploadedAt: p.uploadedAt || new Date().toISOString()
            };
          });
        }

        const body = { fields: jsonToFirestoreFields(clean).mapValue.fields };
        const url = `${FS_REST_BASE}/${inquiry.id}?key=${FS_API_KEY}`;
        const res = await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          console.error('Firestore save failed with HTTP', res.status, errData);
          return false;
        } else {
          console.log('Inquiry successfully saved to Firestore:', inquiry.referenceId);
          return true;
        }
      } catch (e) {
        console.error('Cloud REST save notice:', e);
        return false;
      }
    }

              id: p.id,
              label: p.label,
              url: (p.url && p.url.startsWith('data:') && p.url.length > 5000)

                : (p.thumbUrl || p.url),

            }))
          }));
          localStorage.setItem('sell2sr1_inquiries_v2', JSON.stringify(safeInquiries));
        } catch (err) {
          console.warn('LocalStorage save skipped (quota limit or private browsing):', err);
        }

      // Real-time Cloud Database Sync Engine (SDK onSnapshot + REST Polling)
      useEffect(() => {
        let isMounted = true;

        const mergeInquiries = (cloudList) => {
          if (!cloudList || cloudList.length === 0) return;
          cloudList.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setInquiries(cloudList);
        };

        // 1. Immediate fetch from Cloud REST API on startup
        fetchInquiriesFromCloudRest().then(list => {
          if (isMounted && list && list.length > 0) {
            mergeInquiries(list);
          }
        });

        // 2. Real-time Firebase SDK subscription
        let unsubscribe = null;
        if (db) {
          try {
            unsubscribe = db.collection('inquiries').onSnapshot((snapshot) => {
              const cloudInquiries = [];
              snapshot.forEach((doc) => {
                cloudInquiries.push(doc.data());
              });
              if (isMounted && cloudInquiries.length > 0) {
                mergeInquiries(cloudInquiries);
              }
            }, (err) => {
              console.warn('Firestore onSnapshot sync notice:', err);
            });
          } catch (e) {
            console.warn('Firestore subscription error:', e);
          }
        }

        // 3. Fallback continuous polling (every 4 seconds) to ensure 100% sync reliability across all devices
        const pollInterval = setInterval(() => {
          fetchInquiriesFromCloudRest().then(list => {
            if (isMounted && list && list.length > 0) {
              mergeInquiries(list);
            }
          });
        }, 4000);

        return () => {
          isMounted = false;
          if (unsubscribe) unsubscribe();
          clearInterval(pollInterval);
        };

        // 1. Direct REST save (Guaranteed delivery)
        const saved = await saveInquiryToCloudRest(cleanInquiry);

        // 2. Firebase SDK save
        if (db) {
          try {
            let sdkInq = JSON.parse(JSON.stringify(cleanInquiry));
            if (sdkInq.photos && Array.isArray(sdkInq.photos)) {
              sdkInq.photos = sdkInq.photos.slice(0, 8).map(p => {
                const rawThumb = p.thumbUrl || p.url || '';
                const safeThumb = (typeof rawThumb === 'string' && rawThumb.length < 75000)

                return {

                  uploadedAt: p.uploadedAt || new Date().toISOString()

              });
            }
            db.collection('inquiries').doc(newInquiry.id).set(sdkInq)
              .catch(err => console.warn('Firestore SDK save notice:', err));
          } catch (e) {
            console.warn('Firestore write error:', e);
          }
        }
        return saved;
      };

      // Generates a crisp, lightweight JPEG thumbnail (~20KB) directly from a File or Blob
      const compressImageFile = (file, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!file) return resolve('');
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              compressImageToDataUrl(ev.target.result, maxDim, quality).then(resolve);
            };
            reader.onerror = () => resolve('');
            reader.readAsDataURL(file);
            return;
          }

          const img = new Image();
          const cleanup = () => {
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (err) {
              cleanup();
              resolve('');
            }
          };

          img.onerror = () => {
            cleanup();
            try {
              const reader = new FileReader();
              reader.onload = (ev) => {
                const res = ev.target.result;
                if (typeof res === 'string' && res.startsWith('data:image/')) {
                  compressImageToDataUrl(res, maxDim, quality).then(resolve);
                } else {
                  resolve('');
                }
              };
              reader.onerror = () => resolve('');
              reader.readAsDataURL(file);
            } catch (e) {
              resolve('');
            }
          };

          img.src = objectUrl;
        });
      };

      // Extract a lightweight thumbnail preview (~20KB) from a video file
      const extractVideoThumbnail = (file) => {
        return new Promise((resolve) => {
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            return resolve('');
          }

          const video = document.createElement('video');
          video.preload = 'metadata';
          video.muted = true;
          video.playsInline = true;

          let cleaned = false;
          const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          const timer = setTimeout(() => {
            cleanup();
            resolve('');
          }, 6000);

          video.onloadedmetadata = () => {
            video.currentTime = Math.min(1.0, video.duration > 0 ? video.duration * 0.2 : 0.5);
          };

          video.onseeked = () => {
            clearTimeout(timer);
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480;
              let w = video.videoWidth || 480;
              let h = video.videoHeight || 270;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', 0.55));
            } catch (e) {
              cleanup();
              resolve('');
            }
          };

          video.onerror = () => {
            clearTimeout(timer);
            cleanup();
            resolve('');
          };

          video.src = objectUrl;
        });
      };

      // Generate a reduced-size preview blob specifically for email attachments (keeps email fast and lightweight)
      const createEmailPreviewBlob = (dataUrlOrUrl, isVideo = false) => {
        return new Promise((resolve) => {
          if (!dataUrlOrUrl) return resolve(null);
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 480; // Reduced size for fast email delivery
            let w = img.width || 480;
            let h = img.height || 360;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = Math.max(1, w);
            canvas.height = Math.max(1, h);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            if (isVideo) {
              ctx.fillStyle = 'rgba(0,0,0,0.65)';
              ctx.fillRect(8, canvas.height - 30, 130, 22);
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 10px sans-serif';
              ctx.fillText('▶ VIDEO PREVIEW', 14, canvas.height - 15);
            }

            canvas.toBlob((blob) => {
              resolve(blob);
            }, 'image/jpeg', 0.65);
          };
          img.onerror = () => resolve(null);
          img.src = dataUrlOrUrl;
        });
      };

      // Generate optimized lightweight JPEG thumbnail for cloud database sync (~20KB)
      const compressImageToDataUrl = (dataUrl, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!dataUrl) return resolve('');
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');

              canvas.height = Math.max(1, h);

              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (e) {

            }

      const processFiles = async (filesList) => {
        const files = Array.from(filesList || []).filter(file => 
          file.type.startsWith('image/') || 
          file.type.startsWith('video/') ||
          /\.(mp4|mov|webm|m4v|avi|heic|heif|jpg|jpeg|png|webp)$/i.test(file.name)
        );
        if (files.length === 0) return;
        setUploading(true);

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          try {
            setUploadStatus(`Uploading file ${i + 1} of ${files.length}...`);
            const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name);
            const mediaId = 'm-' + Math.random().toString(36).substr(2, 9);
            const label = file.name || (isVideo ? 'Uploaded Video' : 'Uploaded Photo');

            // 1. Direct upload to Firebase Cloud Storage bucket
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(file);
            } catch (storageErr) {
              console.warn('Storage upload notice, falling back:', storageErr);
            }

            if (cloudUrl) {
              setPhotos(prev => [
                ...prev,
                {
                  id: mediaId,
                  url: cloudUrl,
                  thumbUrl: cloudUrl,
                  isVideo: isVideo,
                  fileSize: file.size,
                  fileType: file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
                  label: label,
                  uploadedAt: new Date().toISOString()
                }
              ]);
            } else {
              // 2. Client-side fallback if storage bucket was unreachable
              if (isVideo) {
                const thumbUrl = await extractVideoThumbnail(file);
                if (thumbUrl) {
                  setPhotos(prev => [
                    ...prev,
                    {
                      id: mediaId,
                      url: thumbUrl,
                      thumbUrl: thumbUrl,
                      isVideo: true,
                      fileSize: file.size,
                      fileType: file.type || 'video/mp4',
                      label: label,
                      uploadedAt: new Date().toISOString()

                      id: mediaId,
                      url: thumbUrl,

                      fileSize: file.size,

            }

          }

        setUploadStatus('');

                            setStep(3);

    // ==========================================
    // 4. APPRAISAL WORKSPACE MODAL
    // ==========================================
    function AppraisalWorkspaceModal({ inquiry, onClose, onUpdateInquiry }) {
      const [currentStage, setCurrentStage] = useState(inquiry.stage);
      const [offerAmount, setOfferAmount] = useState(inquiry.offers?.[0]?.amount || 25000);
      const [offerNotes, setOfferNotes] = useState(inquiry.offers?.[0]?.notes || 'Subject to physical inspection and title verification.');
      const [newNoteText, setNewNoteText] = useState('');
      const [activeMedia, setActiveMedia] = useState(inquiry.photos?.[0] || null);
      const [activePhoto, setActivePhoto] = useState(inquiry.photos?.[0]?.url || inquiry.photos?.[0]?.thumbUrl || '');
      const [outreachStaffName, setOutreachStaffName] = useState(inquiry.outreach?.staffName || '');
      const [reachedOut, setReachedOut] = useState(inquiry.outreach?.reachedOut || false);
      const [reachedOutAt, setReachedOutAt] = useState(inquiry.outreach?.reachedOutAt || null);

      // Facebook Marketplace & Apify Comps State
      const defaultCompsQuery = [inquiry.unit.year, inquiry.unit.make, inquiry.unit.model].filter(Boolean).join(' ');
      const [fbCompsQuery, setFbCompsQuery] = useState(defaultCompsQuery);
      const [fbCompsLocation, setFbCompsLocation] = useState('manchester');
      const [fbCompsLoading, setFbCompsLoading] = useState(false);
      const [fbCompsData, setFbCompsData] = useState(null);
      const [fbCompsError, setFbCompsError] = useState(null);
      const [manualToken, setManualToken] = useState(() => {
        try { return localStorage.getItem('sr1_apify_token') || ''; } catch (e) { return ''; }
      });
      const [showTokenInput, setShowTokenInput] = useState(false);

      const handleSaveToken = (val) => {
        setManualToken(val);
        try {
          if (val.trim()) localStorage.setItem('sr1_apify_token', val.trim());
          else localStorage.removeItem('sr1_apify_token');
        } catch (e) {}
      };

      const handleFetchMarketComps = async () => {
        if (!fbCompsQuery.trim()) return;
        setFbCompsLoading(true);
        setFbCompsError(null);
        try {
          const queryParam = encodeURIComponent(fbCompsQuery.trim());
          const locParam = encodeURIComponent(fbCompsLocation.trim());
          
          let res = await fetch(`/api/marketplace-comps?query=${queryParam}&location=${locParam}&maxItems=6`);
          let data = null;

          if (res.ok) {
            data = await res.json();
          } else {
            // Check if manual backup token exists in localStorage
            const tokenToUse = manualToken.trim();
            if (tokenToUse) {
              const fbSearchUrl = `https://www.facebook.com/marketplace/search/?query=${queryParam}`;
              const apifyEndpoint = `https://api.apify.com/v2/acts/apify~facebook-marketplace-scraper/run-sync-get-dataset-items?token=${encodeURIComponent(tokenToUse)}&timeout=45`;
              const apifyRes = await fetch(apifyEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  startUrls: [{ url: fbSearchUrl }],
                  searchQueries: [{ query: fbCompsQuery.trim(), city: fbCompsLocation.trim() }],
                  maxItems: 6
                })
              });
              if (apifyRes.ok) {
                const rawItems = await apifyRes.json();
                const itemsList = Array.isArray(rawItems) ? rawItems : [];
                const normalized = itemsList.slice(0, 6).map((item, idx) => ({
                  id: item.id || `comp-${idx}`,
                  title: item.title || item.name || fbCompsQuery,
                  price: item.formattedPrice || (typeof item.price === 'number' ? `$${item.price.toLocaleString()}` : item.price || 'N/A'),
                  location: item.location?.reverse_geocode?.city || item.locationText || 'Local / Nearby',
                  url: item.url || (item.id ? `https://www.facebook.com/marketplace/item/${item.id}` : '#'),
                  imageUrl: item.primaryImage || item.image || item.thumbnail || null
                }));
                data = {
                  success: true,
                  count: normalized.length,
                  items: normalized,
                  directSearchUrl: fbSearchUrl
                };
              } else {
                const errText = await apifyRes.text();
                throw new Error(`Apify direct call: ${errText}`);
              }
            } else {
              const errBody = await res.json().catch(() => ({}));
              throw new Error(errBody.error || `HTTP ${res.status}: Cloudflare Function not yet reachable or APIFY_TOKEN missing.`);
            }
          }

          if (data && data.success) {
            setFbCompsData(data);
          } else {
            throw new Error(data?.error || 'Failed to retrieve marketplace comps.');
          }

          console.error('Marketplace comps fetch error:', err);
          setFbCompsError(err.message || 'Unable to load comps.');

                      type="text"
                      value={outreachStaffName}
                      onChange={(e) => handleSaveStaffName(e.target.value)}
                      placeholder="Enter staff name..."
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2 sm:pt-4">
                    <label className="flex items-center space-x-2.5 cursor-pointer bg-neutral-900 p-2.5 rounded-lg border border-neutral-750 hover:border-neutral-600 transition-colors">
                      <input
                        type="checkbox"
                        checked={reachedOut}
                        onChange={(e) => handleToggleOutreach(e.target.checked)}
                        className="w-4 h-4 rounded border-neutral-700 text-neutral-100 bg-neutral-950 focus:ring-0 cursor-pointer"
                      />
                      <span className="text-xs font-semibold text-neutral-200 select-none">
                        I have reached out to this client
                      </span>
                    </label>
                  </div>
                </div>
              </div>

              {/* OFFER BUILDER */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Offer Desk</span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">SR1 Buy Offer ($)</label>
                    <input
                      type="number"
                      value={offerAmount}
                      onChange={(e) => setOfferAmount(Number(e.target.value))}
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-1.5 text-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">Loan Payoff ($)</label>
                    <input
                      type="number"
                      readOnly
                      value={inquiry.financials.estimatedPayoff || 0}
                      className="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-1.5 text-neutral-500 font-bold"
                    />
                  </div>
                  <div className="bg-neutral-900 p-2 rounded-lg border border-neutral-800">
                    <span className="text-neutral-400 text-[10px] block">Customer Net Check:</span>
                    <span className="text-lg font-bold text-white mt-0.5 block">${netEquity.toLocaleString()}</span>
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    onClick={handleSendOffer}
                    className="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-950 font-bold rounded-lg text-xs"
                  >
                    Save & Record Offer
                  </button>
                </div>
              </div>

              {/* NOTES */}
              <div className="space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Team Notes</span>
                <div className="space-y-2 max-h-36 overflow-y-auto">
                  {inquiry.notes.map(note => (
                    <div key={note.id} className="bg-neutral-950 p-2.5 rounded-lg border border-neutral-800 text-[11px]">
                      <div className="flex justify-between text-neutral-500 text-[10px]">
                        <span>{note.authorName} ({note.authorRole})</span>
                        <span>{note.createdAt}</span>
                      </div>
                      <p className="text-neutral-300 mt-1">{note.content}</p>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleAddNote} className="flex gap-2">
                  <input
                    type="text"
                    value={newNoteText}
                    onChange={(e) => setNewNoteText(e.target.value)}
                    placeholder="Add an internal note..."
                    className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-neutral-800 text-white font-semibold rounded-lg text-xs">
                    Post
                  </button>
                </form>
              </div>

            </div>

            <div className="bg-neutral-950 p-3 border-t border-neutral-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white font-semibold rounded-lg text-xs"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-neutral-950 text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
              <h2 className="text-xl font-bold">Submission Confirmed</h2>
              <p className="text-xs text-neutral-400 max-w-md">Your inquiry has been received by our appraisal desk. If you need to make changes or submit another unit, click below.</p>
              <button 
                onClick={() => {
                  try { localStorage.removeItem('sell2sr1_inquiries_v2'); } catch(e){}
                  window.location.reload();
                }} 
                className="px-5 py-2.5 bg-neutral-100 text-neutral-950 font-bold rounded-xl text-xs hover:bg-white transition-all shadow-md"
              >
                Return to Home
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

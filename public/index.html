      const [signupState, setSignupState] = useState('ME');
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      // Active portal tab once logged in: 'hub' | 'submit' | 'chat'
      const [activeTab, setActiveTab] = useState('hub');
      const [batchUnits, setBatchUnits] = useState(() => [createBlankBatchUnit('rv', portalType)]);
      const partnerVinScanIdRef = useRef({});
      const [submittingBatch, setSubmittingBatch] = useState(false);
      const [bannerNotice, setBannerNotice] = useState('');

      // Hub filter & detail modal states
      const [hubSearch, setHubSearch] = useState('');
      const [hubStageFilter, setHubStageFilter] = useState('all'); // 'all' | 'waiting_sr1_offer' | 'waiting_partner_acceptance' | 'waiting_transaction_plan' | 'complete' | 'deal_not_made' | 'archived'
      const [hubSeenFilter, setHubSeenFilter] = useState('all'); // 'all' | 'yes' | 'no'
      const [hubCompletenessFilter, setHubCompletenessFilter] = useState('all'); // 'all' | 'complete' | 'incomplete'
      const [selectedUnitId, setSelectedUnitId] = useState(null);
      const [unitChatInput, setUnitChatInput] = useState('');
      const [sendingUnitChat, setSendingUnitChat] = useState(false);
      const [editingUnitDetails, setEditingUnitDetails] = useState(false);
      const [editUnitForm, setEditUnitForm] = useState({});
      const [uploadingExtraPhotos, setUploadingExtraPhotos] = useState(false);
      const chatRecapRequestedRef = useRef(new Set());

      // Live partner record from synced partners list
      const activePartner = useMemo(() => {
        if (!partnerUser) return null;
        const found = (Array.isArray(partners) ? partners : []).find(
          p => p && (p.id === partnerUser.id || (p.email && partnerUser.email && p.email.toLowerCase() === partnerUser.email.toLowerCase()))
        );
        return found || partnerUser;
      }, [partnerUser, partners]);

      // Units belonging to this partner
      const myUnits = useMemo(() => {
        if (!activePartner) return [];
        const pId = activePartner.id;
        const pEmail = (activePartner.email || '').toLowerCase();
        return (Array.isArray(inquiries) ? inquiries : []).filter(inq => {
          if (!inq) return false;
          if (inq.partnerId && inq.partnerId === pId) return true;
          if (pEmail && inq.partnerEmail && inq.partnerEmail.toLowerCase() === pEmail) return true;
          if (pEmail && inq.customer?.email && inq.customer.email.toLowerCase() === pEmail && (inq.submissionSource === 'dealer' || inq.submissionSource === 'bank')) return true;
          return false;
        });
      }, [inquiries, activePartner]);

      const hubStatusCounts = useMemo(() => {
        const counts = {
          active: 0,
          waiting_sr1_offer: 0,
          waiting_partner_acceptance: 0,
          waiting_transaction_plan: 0,
          complete: 0,
          deal_not_made: 0,
          archived: 0
        };
        myUnits.forEach((u) => {
          const isArch = u.isArchived || u.stage === 'archived';
          if (isArch) {
            counts.archived += 1;
            return;
          }
          counts.active += 1;
          const st = getPartnerUnitProcessStatus(u, portalType);
          if (counts[st.id] !== undefined) {
            counts[st.id] += 1;
          }
        });
        return counts;
      }, [myUnits, portalType]);

      const filteredMyUnits = useMemo(() => {
        return myUnits.filter(u => {
          const isArch = u.isArchived || u.stage === 'archived';
          if (hubStageFilter === 'archived') {
            if (!isArch) return false;
          } else if (hubStageFilter === 'all') {
            if (isArch) return false;
          } else {
            if (isArch) return false;
            const st = getPartnerUnitProcessStatus(u, portalType);
            if (st.id !== hubStageFilter) return false;
          }

          if (hubSeenFilter !== 'all') {
            const isSeen = Array.isArray(u.seenBy) && u.seenBy.length > 0;
            if (hubSeenFilter === 'yes' && !isSeen) return false;
            if (hubSeenFilter === 'no' && isSeen) return false;
          }

          if (hubCompletenessFilter !== 'all') {
            const comp = calculatePartnerUnitCompleteness(u);
            if (hubCompletenessFilter === 'complete' && comp.percent < 100) return false;
            if (hubCompletenessFilter === 'incomplete' && comp.percent >= 100) return false;
          }

          if (hubSearch.trim()) {
            const q = hubSearch.toLowerCase().trim();
            const catLabel = (CATEGORIES[u.unit?.category]?.label || '').toLowerCase();
            const title = `${catLabel} ${u.unit?.year || ''} ${u.unit?.make || ''} ${u.unit?.model || ''} ${u.unit?.trimOrFloorplan || ''}`.toLowerCase();
            const vin = String(u.unit?.vinOrSerial || '').toLowerCase();
            const ref = String(u.referenceId || '').toLowerCase();
            return title.includes(q) || vin.includes(q) || ref.includes(q);
          }
          return true;
        });
      }, [myUnits, hubStageFilter, hubSeenFilter, hubCompletenessFilter, hubSearch, portalType]);

      const handlePartnerOfferDecision = (item, decision) => {
        if (!item || !activePartner) return;
        const lastOffer = (Array.isArray(item.offers) && item.offers.length > 0)
          ? item.offers[item.offers.length - 1]
          : null;
        if (!lastOffer) return;

        if (decision === 'declined') {
          const confirmed = confirm(
            `Decline SR1's $${Number(lastOffer.amount || 0).toLocaleString()} offer for ${[item.unit?.year, item.unit?.make, item.unit?.model].filter(Boolean).join(' ') || 'this unit'}?`
          );
          if (!confirmed) return;
        }

        const nowIso = new Date().toISOString();
        const actorName = activePartner.contactName || activePartner.organizationName || (isBankPortal ? 'Bank Partner' : 'Dealer Partner');
        const unitTitle = [item.unit?.year, item.unit?.make, item.unit?.model].filter(Boolean).join(' ') || 'Submitted Unit';
        const decisionText = decision === 'accepted'
          ? `✓ ${actorName} (${activePartner.organizationName}) ACCEPTED SR1's $${Number(lastOffer.amount || 0).toLocaleString()} subject-to-inspection offer.`
          : `✕ ${actorName} (${activePartner.organizationName}) DECLINED SR1's $${Number(lastOffer.amount || 0).toLocaleString()} offer.`;

        const msgObj = {
          id: 'umsg-dec-' + Date.now(),
          senderRole: 'partner',
          senderName: actorName,
          senderEmail: activePartner.email || '',
          text: decisionText,
          createdAt: nowIso
        };

        const noteObj = {
          id: 'n-dec-' + Date.now(),
          authorName: actorName,
          authorRole: isBankPortal ? 'Bank Partner' : 'Dealer Partner',
          createdAt: new Date().toLocaleTimeString(),
          category: 'offer_reason',
          content: decisionText
        };

        const updatedWithDecision = {
          ...item,
          stage: decision === 'accepted' ? 'accepted' : 'lost',
          partnerAcceptance: {
            decision,
            decidedAt: nowIso,
            decidedBy: actorName,
            offerAmount: Number(lastOffer.amount || 0)
          },
          partnerWorkflowStatus: null,
          unitMessages: [...(Array.isArray(item.unitMessages) ? item.unitMessages : []), msgObj],
          notes: [...(Array.isArray(item.notes) ? item.notes : []), noteObj],
          unreadUnitForStaff: (Number(item.unreadUnitForStaff) || 0) + 1,
          updatedAt: nowIso
        };
        const immediateRecap = buildClientChatRecapFallback(updatedWithDecision, portalType);
        const updatedWithRecap = {
          ...updatedWithDecision,
          chatAiRecap: immediateRecap
            ? { text: immediateRecap, messageCount: getRealUnitChatMessages(updatedWithDecision).length, updatedAt: nowIso, source: 'client_fallback' }
            : updatedWithDecision.chatAiRecap
        };
        onUpdateInquiry(updatedWithRecap);
        requestUnitChatAiRecap(updatedWithRecap, getRealUnitChatMessages(updatedWithRecap), portalType).then((aiRecap) => {
          if (aiRecap && aiRecap.text) {
            onUpdateInquiry({ ...updatedWithRecap, chatAiRecap: aiRecap });
          }
        });

        setBannerNotice(
          decision === 'accepted'
            ? `✓ Offer accepted for ${unitTitle}! Status updated to "Waiting for SR1 to Coordinate Transaction Plan".`
            : `Offer declined for ${unitTitle}. Status updated to "Deal Not Made".`
        );

        const sr1Recipients = getPartnerPortalNotificationEmails(portalType, emailRoutingConfig);
        dispatchPartnerEmailNotification({
          notificationKind: 'unit_chat',
          partnerType: portalType,
          organizationName: activePartner.organizationName,
          contactName: activePartner.contactName,
          partnerEmail: activePartner.email,
          partnerPhone: activePartner.phone,
          referenceId: item.referenceId,
          unitSummary: unitTitle,
          offerAmount: Number(lastOffer.amount || 0),
          senderName: actorName,
          senderRole: 'partner',
          messageText: decisionText,
          recipientEmails: sr1Recipients,
          portalUrl: `https://selltosr1.com/?view=portal&inquiry=${encodeURIComponent(item.id)}`
        });
      };

      const totalUnreadUnitMsgs = useMemo(() => {
        return myUnits.reduce((acc, u) => acc + (Number(u.unreadUnitForPartner) || 0), 0);
      }, [myUnits]);

      const selectedUnit = useMemo(() => {
        if (!selectedUnitId) return null;
        return myUnits.find(u => u.id === selectedUnitId) || null;
      }, [myUnits, selectedUnitId]);

      // Lazily generate & cache AI chat recaps for any units with messages missing an up-to-date recap
      useEffect(() => {
        if (activeTab !== 'hub' || !myUnits.length) return;
        myUnits.forEach((u) => {
          const realMsgs = getRealUnitChatMessages(u);
          if (realMsgs.length === 0) return;
          const cachedCount = Number(u.chatAiRecap?.messageCount) || 0;
          const alreadyAi = u.chatAiRecap?.source === 'workers_ai' || u.chatAiRecap?.source === 'openai';
          const reqKey = `${u.id}:${realMsgs.length}`;
          if ((cachedCount === realMsgs.length && alreadyAi) || chatRecapRequestedRef.current.has(reqKey)) {
            return;
          }
          chatRecapRequestedRef.current.add(reqKey);
          requestUnitChatAiRecap(u, realMsgs, portalType).then((aiRecap) => {
            if (aiRecap && aiRecap.text && aiRecap.text !== u.chatAiRecap?.text) {
              onUpdateInquiry({ ...u, chatAiRecap: aiRecap });
            }
          });
        });
      }, [activeTab, myUnits, portalType]);

      // Clear unread unit messages when partner opens a unit modal
      useEffect(() => {
        if (selectedUnit && Number(selectedUnit.unreadUnitForPartner) > 0) {
          onUpdateInquiry({
            ...selectedUnit,
            unreadUnitForPartner: 0
          });
        }
      }, [selectedUnit?.id, selectedUnit?.unreadUnitForPartner]);

      const handleSignInSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        const emailClean = (authEmail || '').trim().toLowerCase();
        const passClean = (authPassword || '').trim();
        if (!emailClean || !passClean) {
          setAuthError('Please enter your email address and password.');
          return;
        }
        setAuthLoading(true);
        try {
          let pool = Array.isArray(partners) ? [...partners] : [];
          let matched = pool.find(p => p && p.email === emailClean);
          if (!matched) {
            const cloudPool = await fetchPartnersFromCloudRest();
            if (Array.isArray(cloudPool) && cloudPool.length > 0) {
              pool = cloudPool;
              matched = pool.find(p => p && p.email === emailClean);
            }
          }
          if (!matched || matched.password !== passClean) {
            setAuthError('Invalid email or password. If you do not have an account yet, click "Create Account" above.');
            setAuthLoading(false);
            return;
          }
          if (matched.status === 'disabled') {
            setAuthError('This partner account has been disabled by SR1 Administration. Please contact appraisals@sr1companies.com.');
            setAuthLoading(false);
            return;
          }
          const updatedPartner = {
            ...matched,
            lastLoginAt: new Date().toISOString()
          };
          await onSavePartner(updatedPartner);
          onSetPartnerUser(updatedPartner);
          if (updatedPartner.partnerType && updatedPartner.partnerType !== portalType) {
            onSwitchPortalType(updatedPartner.partnerType);
          }
        } catch (err) {
          setAuthError('Unable to sign in right now. Please try again.');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignUpSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        const orgClean = (signupOrg || '').trim();
        const contactClean = (signupContact || '').trim();
        const emailClean = (authEmail || '').trim().toLowerCase();
        const phoneClean = (signupPhone || '').trim();
        const cityClean = (signupCity || '').trim();
        const stateClean = (signupState || 'ME').trim();
        const passClean = (authPassword || '').trim();

        if (!orgClean || !contactClean || !emailClean || !phoneClean || !cityClean || !passClean) {
          setAuthError('Please fill in all fields to create your partner portal account.');
          return;
        }
        if (passClean.length < 4) {
          setAuthError('Please choose a password of at least 4 characters.');
          return;
        }

        setAuthLoading(true);
        try {
          let pool = Array.isArray(partners) ? [...partners] : [];
          const cloudPool = await fetchPartnersFromCloudRest();
          if (Array.isArray(cloudPool)) {
            pool = [...pool, ...cloudPool];
          }
          const existing = pool.find(p => p && p.email === emailClean);
          if (existing) {
            setAuthError('An account with this email address already exists. Please switch to Sign In.');
            setAuthLoading(false);
            return;
          }

          const newPartnerId = 'prt-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 5);
          const nowIso = new Date().toISOString();
          const welcomeMsg = {
            id: 'gmsg-' + Date.now(),
            senderRole: 'staff',
            senderName: 'SR1 Purchasing Desk',
            senderEmail: 'appraisals@sr1companies.com',
            text: isBankPortal
              ? `Welcome to the SR1 Bank & Credit Union Repo Liquidation Portal, ${contactClean}! Submit single or multiple repo units anytime, and use this General Chat or any Unit Chat to reach our buyers directly.`
              : `Welcome to the SR1 Dealer Portal, ${contactClean}! Submit single or multiple trade-in units anytime for wholesale buy offers, and use this General Chat or any Unit Chat to reach our buyers directly.`,
            createdAt: nowIso
          };

          const newPartner = normalizePartner({
            id: newPartnerId,
            partnerType: portalType,
            organizationName: orgClean,
            contactName: contactClean,
            email: emailClean,
            phone: phoneClean,
            city: cityClean,
            state: stateClean,
            password: passClean,
            status: 'active',
            createdAt: nowIso,
            updatedAt: nowIso,
            lastLoginAt: nowIso,
            generalMessages: [welcomeMsg],
            unreadGeneralForStaff: 0,
            unreadGeneralForPartner: 1
          });

          await onSavePartner(newPartner);
          onSetPartnerUser(newPartner);

          // Notify SR1 team of new partner registration
          const recipients = getPartnerPortalNotificationEmails(portalType, emailRoutingConfig);
          dispatchPartnerEmailNotification({
            recipients,
            partnerType: portalType,
            subject: `New ${isBankPortal ? 'Bank / Credit Union' : 'Dealer'} Portal Registration: ${orgClean}`,
            heading: `New ${isBankPortal ? 'Bank / Credit Union' : 'Dealer'} Partner Registered`,
            partnerOrgName: orgClean,
            partnerContactName: contactClean,
            partnerEmail: emailClean,
            partnerPhone: phoneClean,
            extraRows: [
              { label: 'Location', value: `${cityClean}, ${stateClean}` },
              { label: 'Portal Type', value: portalTitle }
            ],
            messageText: `${orgClean} (${contactClean}) has registered an account in the ${portalTitle}.`,
            ctaLabel: 'Open SR1 Staff Portal →',
            ctaUrl: 'https://selltosr1.com/?view=portal'
          });
        } catch (err) {
          setAuthError('Error creating account. Please try again.');
        } finally {
          setAuthLoading(false);
        }
      };

      // Batch unit helpers
      const updateBatchUnit = (tempId, patch) => {
        setBatchUnits(prev => prev.map(u => (u.tempId === tempId ? { ...u, ...patch } : u)));
      };

      const handleAddBatchUnit = () => {
        setBatchUnits(prev => [...prev, createBlankBatchUnit('rv', portalType)]);
      };

      const handleDuplicateBatchUnit = (unitToCopy) => {
        const copy = {
          ...unitToCopy,
          tempId: 'u-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
          vinOrSerial: '',
          vinScanSource: '',
          vinPhotoChoice: '',
          vinPhotoItem: null,
          vinPhotoUploading: false,
          scanningVin: false,
          vinPhotoScanFailed: false,
          isEditingDetectedVin: false,
          overrideVinInput: '',
          isDraggingVinPhoto: false,
          photos: []
        };
        setBatchUnits(prev => [...prev, copy]);
      };

      const handleRemoveBatchUnit = (tempId) => {
        setBatchUnits(prev => (prev.length <= 1 ? prev : prev.filter(u => u.tempId !== tempId)));
      };

      const handleSelectBatchVinPhotoChoice = (tempId, choice) => {
        partnerVinScanIdRef.current[tempId] = (partnerVinScanIdRef.current[tempId] || 0) + 1;
        setBatchUnits(prev => prev.map(u => {
          if (u.tempId !== tempId) return u;
          if (choice === 'no_photo') {
            return {
              ...u,
              vinPhotoChoice: 'no_photo',
              vinPhotoItem: null,
              vinPhotoUploading: false,
              scanningVin: false,
              vinPhotoScanFailed: false,
              isEditingDetectedVin: false,
              overrideVinInput: '',
              vinScanSource: 'manual',
              photos: (u.photos || []).filter(p => !p.isVinPhoto)
            };
          }
          return {
            ...u,
            vinPhotoChoice: 'has_photo',
            vinPhotoScanFailed: false,
            isEditingDetectedVin: false
          };
        }));
      };

      const handleRemoveBatchVinPhoto = (tempId) => {
        partnerVinScanIdRef.current[tempId] = (partnerVinScanIdRef.current[tempId] || 0) + 1;
        setBatchUnits(prev => prev.map(u => {
          if (u.tempId !== tempId) return u;
          return {
            ...u,
            vinPhotoItem: null,
            vinPhotoUploading: false,
            scanningVin: false,
            vinPhotoScanFailed: false,
            isEditingDetectedVin: false,
            overrideVinInput: '',
            vinScanSource: '',
            vinOrSerial: '',
            photos: (u.photos || []).filter(p => !p.isVinPhoto)
          };
        }));
      };

      const handleBatchUnitVinPhoto = async (tempId, file, unitCategory) => {
        if (!file) return;
        const isImage = file.type?.startsWith('image/') || /\.(heic|heif|jpg|jpeg|png|webp)$/i.test(file.name || '');
        if (!isImage) {
          alert('Please select a photo image file.');
          return;
        }

        const scanId = (partnerVinScanIdRef.current[tempId] || 0) + 1;
        partnerVinScanIdRef.current[tempId] = scanId;
        const mediaId = 'pm-vin-' + Math.random().toString(36).substr(2, 9);
        const idMeta = getPartnerPortalIdFieldMeta(unitCategory);
        const photoLabel = idMeta.tagLabel || 'VIN / Serial Tag';

        updateBatchUnit(tempId, {
          vinPhotoChoice: 'has_photo',
          vinPhotoUploading: true,
          scanningVin: true,
          vinPhotoScanFailed: false,
          isEditingDetectedVin: false,
          overrideVinInput: '',
          vinScanSource: '',
          vinOrSerial: ''
        });

        let uploadedPhotoObj = null;

        const uploadTask = (async () => {
          try {
            const uploadableFile = (await ensureDecodableImageBlob(file)) || file;
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(uploadableFile);
            } catch (storageErr) {
              console.warn('Partner VIN photo storage upload notice, falling back:', storageErr);
            }
            if (!cloudUrl) {
              cloudUrl = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (ev) => resolve(ev.target.result || '');
                reader.onerror = () => resolve('');
                reader.readAsDataURL(uploadableFile);
              });
            }
            if (partnerVinScanIdRef.current[tempId] !== scanId) return null;
            if (cloudUrl) {
              uploadedPhotoObj = {
                id: mediaId,
                url: cloudUrl,
                thumbUrl: cloudUrl,
                isVideo: false,
                isVinPhoto: true,
                fileSize: uploadableFile.size || file.size,
                fileType: uploadableFile.type || file.type || 'image/jpeg',
                label: photoLabel,
                detectedVin: '',
                unreadableVinTag: false,
                uploadedAt: new Date().toISOString()
              };
              setBatchUnits(prev => prev.map(u => {
                if (u.tempId !== tempId) return u;
                return {
                  ...u,
                  vinPhotoItem: uploadedPhotoObj,
                  photos: [...(u.photos || []).filter(p => !p.isVinPhoto), uploadedPhotoObj]
                };
              }));
            }
          } catch (err) {
            console.error('Partner VIN photo upload error:', err);
          } finally {
            if (partnerVinScanIdRef.current[tempId] === scanId) {
              updateBatchUnit(tempId, { vinPhotoUploading: false });
            }
          }
          return uploadedPhotoObj;
        })();

        const scanTask = (async () => {
          try {
            const scanRes = await scanImageFileForVin(
              file,
              unitCategory,
              () => partnerVinScanIdRef.current[tempId] !== scanId,
              null,
              { directVinTagPhoto: true }
            );
            if (partnerVinScanIdRef.current[tempId] !== scanId) return '';
            const detected = typeof scanRes === 'string' ? scanRes : (scanRes?.vin || '');
            if (detected) {
              setBatchUnits(prev => prev.map(u => {
                if (u.tempId !== tempId) return u;
                return {
                  ...u,
                  vinOrSerial: detected,
                  vinScanSource: 'ocr',
                  vinPhotoScanFailed: false,
                  vinPhotoItem: u.vinPhotoItem && u.vinPhotoItem.id === mediaId
                    ? { ...u.vinPhotoItem, detectedVin: detected, unreadableVinTag: false }
                    : u.vinPhotoItem,
                  photos: (u.photos || []).map(p => (p.id === mediaId ? { ...p, detectedVin: detected, unreadableVinTag: false } : p))
                };
              }));
            } else {
              setBatchUnits(prev => prev.map(u => {
                if (u.tempId !== tempId) return u;
                return {
                  ...u,
                  vinPhotoScanFailed: true,
                  vinScanSource: 'manual',
                  vinPhotoItem: u.vinPhotoItem && u.vinPhotoItem.id === mediaId
                    ? { ...u.vinPhotoItem, detectedVin: '', unreadableVinTag: true }
                    : u.vinPhotoItem,
                  photos: (u.photos || []).map(p => (p.id === mediaId ? { ...p, detectedVin: '', unreadableVinTag: true } : p))
                };
              }));
            }
            return detected;
          } catch (err) {
            if (partnerVinScanIdRef.current[tempId] === scanId) {
              updateBatchUnit(tempId, { vinPhotoScanFailed: true, vinScanSource: 'manual' });
            }
            return '';
          } finally {
            if (partnerVinScanIdRef.current[tempId] === scanId) {
              updateBatchUnit(tempId, { scanningVin: false });
            }
          }
        })();

        const [finalPhoto, detectedVin] = await Promise.all([uploadTask, scanTask]);
        if (partnerVinScanIdRef.current[tempId] === scanId && finalPhoto) {
          const updatedPhoto = {
            ...finalPhoto,
            detectedVin: detectedVin || '',
            unreadableVinTag: !detectedVin
          };
          setBatchUnits(prev => prev.map(u => {
            if (u.tempId !== tempId) return u;
            return {
              ...u,
              vinPhotoItem: updatedPhoto,
              photos: (u.photos || []).map(p => (p.id === mediaId ? updatedPhoto : p))
            };
          }));
        }
      };

      const handleBatchUnitPhotos = async (tempId, fileList) => {
        const files = Array.from(fileList || []).filter(file =>
          file.type.startsWith('image/') ||
          file.type.startsWith('video/') ||
          /\.(mp4|mov|webm|m4v|avi|heic|heif|jpg|jpeg|png|webp)$/i.test(file.name)
        );
        if (files.length === 0) return;

        updateBatchUnit(tempId, { uploadingPhotos: true });

        const batchEntries = files.map((file) => {
          const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name);
          return {
            file,
            isVideo,
            mediaId: 'pm-' + Math.random().toString(36).substr(2, 9),
            label: file.name || (isVideo ? 'Uploaded Video' : 'Uploaded Photo')
          };
        });

        for (let i = 0; i < batchEntries.length; i++) {
          const entry = batchEntries[i];
          const { file, isVideo, mediaId, label } = entry;
          try {
            const uploadableFile = !isVideo ? (await ensureDecodableImageBlob(file)) || file : file;
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(uploadableFile);
            } catch (e) {}

            if (!cloudUrl) {
              // Lightweight dataURL fallback
              cloudUrl = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (ev) => resolve(ev.target.result || '');
                reader.onerror = () => resolve('');
                reader.readAsDataURL(uploadableFile);
              });
            }

            if (cloudUrl) {
              setBatchUnits(prev => prev.map(u => {
                if (u.tempId !== tempId) return u;
                return {
                  ...u,
                  photos: [
                    ...(u.photos || []),
                    {
                      id: mediaId,
                      url: cloudUrl,
                      thumbUrl: cloudUrl,
                      isVideo,
                      fileSize: uploadableFile.size || file.size,
                      fileType: uploadableFile.type || file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
                      label,
                      uploadedAt: new Date().toISOString()
                    }
                  ]
                };
              }));
            }
          } catch (err) {
            console.warn('Batch unit photo upload notice:', err);
          }
        }

        updateBatchUnit(tempId, { uploadingPhotos: false });
      };

      const handleSubmitBatchUnits = async (e) => {
        e.preventDefault();
        if (!activePartner) return;
        const anyUploading = batchUnits.some(u => u.uploadingPhotos || u.vinPhotoUploading || u.scanningVin);

          alert('Please wait a moment for photos and VIN/Serial scans to finish before submitting.');
          return;

        setSubmittingBatch(true);
        try {
          const submittedSummaryRows = [];
          const nameParts = (activePartner.contactName || 'Partner').trim().split(/\s+/);

          const lastName = nameParts.slice(1).join(' ') || `(${activePartner.organizationName})`;

          for (let idx = 0; idx < batchUnits.length; idx++) {

            const cleanVin = (u.vinOrSerial || '').trim().toUpperCase() || (u.category === 'container' ? 'N/A' : idMeta.defaultPending);
            const cleanMileageOrHours = usageMeta.show ? (Number(u.mileageOrHours) || 0) : 0;
            const initialMsgText = [
              `Submitted via ${portalTitle} by ${activePartner.organizationName} (${activePartner.contactName}).`,
              u.askingPrice ? `Asking / Reserve: $${Number(u.askingPrice).toLocaleString()}.` : '',
              u.conditionNotes ? `Notes: ${u.conditionNotes}` : ''

            const newInq = {
              id: `inq-${refId}-${Date.now().toString(36).slice(-3)}${idx}`,
              referenceId: refId,
              createdAt: nowIso,
              updatedAt: nowIso,
              stage: 'new',
              intent: isBankPortal ? 'sell' : 'trade',
              submissionSource: portalType, // 'dealer' | 'bank'
              partnerId: activePartner.id,
              partnerType: portalType,
              partnerOrgName: activePartner.organizationName,
              partnerContactName: activePartner.contactName,
              partnerEmail: activePartner.email,
              partnerPhone: activePartner.phone,
              workingWithSalesperson: u.salespersonName?.trim() ? 'yes' : 'no',
              salespersonName: (u.salespersonName || '').trim(),
              preferredLocation: u.preferredLocation || 'pickup_requested',
              customer: {
                firstName: `${activePartner.organizationName} — ${firstName}`,

                email: activePartner.email,
                phone: activePartner.phone,
                preferredContact: 'email',
                city: activePartner.city,
                state: activePartner.state,
                zipCode: ''
              },
              unit: {
                category: u.category || 'rv',
                subcategory: catConfig?.label || CATEGORIES[u.category]?.label || 'Unit',
                year: unitYear,
                make: unitMake,
                model: unitModel,
                trimOrFloorplan: (u.trimOrFloorplan || '').trim(),
                vinOrSerial: cleanVin,
                mileageOrHours: cleanMileageOrHours,
                isHours: Boolean(usageMeta.isHours),
                specs: {

                  slidesCount: u.slidesCount !== '' ? Number(u.slidesCount) : undefined,

              const reader = new FileReader();
              reader.onload = (ev) => resolve(ev.target.result || '');

              url: cloudUrl,
              thumbUrl: cloudUrl,
              isVideo,
              label: file.name || 'Additional Media',
              uploadedAt: new Date().toISOString()

    // ==========================================
    // 3. EMAIL ROUTING MANAGER (ADMIN ONLY)
    // ==========================================
    function EmailRoutingManager({ emailRoutingConfig, onSaveEmailRoutingConfig, staffUser, onBackToInquiries }) {
      if (!isSuperAdmin(staffUser)) {
        return (
          <div className="py-16 max-w-lg mx-auto text-center space-y-4">
            <div className="w-16 h-16 bg-neutral-900 border border-neutral-800 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
              🔒
            </div>
            <h2 className="text-xl font-bold text-white">Access Restricted to Admin</h2>
            <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
              Only authorized SR1 Admins have permission to configure where appraisal submissions are routed.
            </p>
            <div className="pt-2">
              <button
                type="button"
                onClick={onBackToInquiries}
                className="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded-xl text-xs font-semibold cursor-pointer transition-colors"
              >
                ← Return to Inquiries Workspace
              </button>
            </div>
          </div>
        );
      }

      const initialRouting = useMemo(() => {
        const merged = { ...DEALERSHIP_NOTIFICATION_EMAILS };
        if (emailRoutingConfig && typeof emailRoutingConfig === 'object') {
          Object.assign(merged, emailRoutingConfig);
        }
        return merged;
      }, [emailRoutingConfig]);

      const [routingState, setRoutingState] = useState(() => initialRouting);
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [isSaving, setIsSaving] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [newEmailInputs, setNewEmailInputs] = useState({});

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Unsaved changes check
      const hasUnsavedChanges = useMemo(() => {
        return JSON.stringify(routingState) !== JSON.stringify(initialRouting);
      }, [routingState, initialRouting]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4500);
      };

      const handleAddEmail = (locId, emailInput) => {
        const raw = (emailInput || '').trim();
        if (!raw) return;
        const splitEmails = raw.split(/[,;\s]+/).map(e => e.trim().toLowerCase()).filter(Boolean);
        if (splitEmails.length === 0) return;

        const currentList = Array.isArray(routingState[locId]) ? routingState[locId] : [];
        const toAdd = splitEmails.filter(e => !currentList.includes(e));

        if (toAdd.length === 0) {
          showToast('Email already added for this store.');
          return;
        }

        setRoutingState(prev => ({
          ...prev,
          [locId]: [...currentList, ...toAdd]
        }));
        setNewEmailInputs(prev => ({ ...prev, [locId]: '' }));
      };

      const handleRemoveEmail = (locId, emailToRemove) => {
        const currentList = Array.isArray(routingState[locId]) ? routingState[locId] : [];
        if (currentList.length <= 1) {
          if (!window.confirm('Warning: Removing all recipients means this store location will fall back to appraisals@sr1companies.com. Remove anyway?')) {
            return;
          }
        }
        setRoutingState(prev => ({
          ...prev,
          [locId]: currentList.filter(e => e !== emailToRemove)
        }));
      };

      const handleResetLocation = (locId) => {
        const defaultEmails = DEALERSHIP_NOTIFICATION_EMAILS[locId] || ['appraisals@sr1companies.com'];
        setRoutingState(prev => ({
          ...prev,
          [locId]: [...defaultEmails]
        }));
        showToast('Reset store to factory defaults.');
      };

      const handleResetAllToDefaults = () => {
        if (window.confirm('Are you sure you want to reset ALL 18 store locations to system default routing? Click "Save Routing Changes" afterwards to commit to Firestore cloud.')) {
          setRoutingState({ ...DEALERSHIP_NOTIFICATION_EMAILS });
          showToast('Reset all locations to factory defaults.');
        }
      };

      const handleSave = async () => {
        setIsSaving(true);
        try {
          const ok = await onSaveEmailRoutingConfig(routingState);
          if (ok) {
            showToast('✓ Email routing saved successfully to Cloud Firestore! All future customer submissions will route to these recipients.');
          } else {
            showToast('Saved locally in browser storage.');
          }
        } catch (e) {
          showToast('Saved locally in browser storage.');
        } finally {
          setIsSaving(false);
        }
      };

      // Filter locations & partner portal channels
      const allRoutingEntries = useMemo(() => {
        return [...PARTNER_ROUTING_CHANNELS, ...LOCATIONS];
      }, []);

      const filteredLocations = useMemo(() => {
        return allRoutingEntries.filter(loc => {
          if (categoryFilter !== 'all') {
            if (categoryFilter === 'pickup') {
              if (loc.id !== 'pickup_requested') return false;
            } else if (categoryFilter === 'partner_portal') {
              if (loc.category !== 'partner_portal') return false;
            } else if (loc.category !== categoryFilter) {
              return false;
            }
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const nameMatch = loc.name.toLowerCase().includes(q);
            const idMatch = loc.id.toLowerCase().includes(q);
            const emails = routingState[loc.id] || [];
            const emailMatch = emails.some(e => e.toLowerCase().includes(q));
            return nameMatch || idMatch || emailMatch;
          }
          return true;
        });
      }, [allRoutingEntries, categoryFilter, searchQuery, routingState]);

      // Category counts for filter tabs
      const categoryCounts = useMemo(() => {
        const counts = { all: allRoutingEntries.length, partner_portal: PARTNER_ROUTING_CHANNELS.length, trailer: 0, rv: 0, equipment: 0, powersports: 0, container: 0, pickup: 0 };
        LOCATIONS.forEach(l => {
          if (l.id === 'pickup_requested') counts.pickup += 1;
          else if (counts[l.category] !== undefined) counts[l.category] += 1;
        });
        return counts;
      }, [allRoutingEntries]);

      return (
        <div className="space-y-6">
          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 max-w-md bg-neutral-900 border border-amber-500/60 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
              <span className="text-amber-400 text-lg">🔔</span>
              <div className="text-xs font-semibold leading-relaxed">{toastMsg}</div>
            </div>
          )}

          {/* ADMIN SUB-HEADER & ACTIONS BAR */}
          <div className="bg-neutral-900 border border-neutral-800 p-4 sm:p-5 rounded-2xl space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-400/20 text-amber-300 border border-amber-400/30">
                    Admin Mode
                  </span>
                  <span className="text-[11px] text-neutral-400">
                    Logged in as <strong className="text-white">{staffUser?.email || 'Admin'}</strong>
                  </span>
                </div>
                <h2 className="text-lg sm:text-xl font-bold text-white">
                  Email Submission Routing Configuration
                </h2>
                <p className="text-xs text-neutral-400 mt-0.5">
                  Configure where customer valuation and trade-in submissions are delivered across all 18 store locations.
                </p>
              </div>

              {/* SAVE / RESET ACTIONS */}
              <div className="flex flex-wrap items-center gap-2.5">
                <button
                  type="button"
                  onClick={onBackToInquiries}
                  className="px-3 py-2 bg-neutral-850 hover:bg-neutral-800 text-neutral-300 hover:text-white rounded-xl text-xs font-semibold border border-neutral-750 transition-colors cursor-pointer"
                >
                  ← Inquiries Pipeline
                </button>

                <button
                  type="button"
                  onClick={handleResetAllToDefaults}
                  className="px-3 py-2 bg-neutral-950 hover:bg-neutral-900 text-neutral-400 hover:text-rose-300 rounded-xl text-xs font-semibold border border-neutral-800 transition-colors cursor-pointer"
                  title="Revert all store recipients to default"
                >
                  Reset All Defaults
                </button>

                <button
                  type="button"
                  onClick={handleSave}
                  disabled={isSaving}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-2 cursor-pointer ${
                    hasUnsavedChanges
                      ? 'bg-amber-400 hover:bg-amber-300 text-neutral-950'
                      : 'bg-white hover:bg-neutral-200 text-neutral-950'
                  }`}
                >
                  {isSaving ? (
                    <>
                      <span className="w-3.5 h-3.5 border-2 border-neutral-950 border-t-transparent rounded-full animate-spin"></span>
                      <span>Saving to Cloud...</span>
                    </>
                  ) : (
                    <>
                      <span>💾</span>
                      <span>{hasUnsavedChanges ? 'Save Routing Changes *' : 'Save Routing Changes'}</span>
                    </>
                  )}
                </button>
              </div>
            </div>

            {/* LIVE STATUS BANNER */}
            <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-neutral-850 text-xs">
              <div className="flex items-center gap-2 text-neutral-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Real-Time Cloud Firestore Sync Active</span>
                <span className="text-neutral-600">•</span>
                <span className="text-[11px] text-neutral-400">
                  {hasUnsavedChanges ? (
                    <strong className="text-amber-400">● Unsaved edits pending save</strong>
                  ) : (
                    'All store routing up to date with cloud'
                  )}
                </span>
              </div>
              <div className="text-[11px] text-neutral-400">
                Central routing: <span className="text-neutral-300">All Inquiries →</span> <code className="text-neutral-200 bg-neutral-950 px-1.5 py-0.5 rounded border border-neutral-800">appraisals@sr1companies.com</code>
              </div>
            </div>
          </div>

          {/* FILTER & SEARCH BAR */}
          <div className="bg-neutral-900 border border-neutral-800 p-3.5 sm:p-4 rounded-2xl space-y-3">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
              {/* Category Filter Tabs */}
              <div className="flex flex-wrap items-center gap-1.5 text-xs">
                {[
                  { id: 'all', label: `All Channels (${categoryCounts.all})` },
                  { id: 'partner_portal', label: `🤝🏦 Partner Portals (${categoryCounts.partner_portal})` },
                  { id: 'trailer', label: `Trailers (${categoryCounts.trailer})` },
                  { id: 'rv', label: `RV (${categoryCounts.rv})` },
                  { id: 'equipment', label: `Equipment (${categoryCounts.equipment})` },
                  { id: 'powersports', label: `Powersports (${categoryCounts.powersports})` },
                  { id: 'container', label: `Containers (${categoryCounts.container})` },
                  { id: 'pickup', label: `Pickup (${categoryCounts.pickup})` }
                ].map(tab => (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => setCategoryFilter(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                      categoryFilter === tab.id
                        ? 'bg-neutral-100 text-neutral-950 font-bold shadow-sm'
                        : 'bg-neutral-950/80 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              {/* Search input */}
              <div className="w-full md:w-72 relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search store name, town, or email..."
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-lg pl-8 pr-7 py-1.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500"
                />
                <span className="absolute left-2.5 top-2 text-neutral-500 text-xs">🔍</span>
                {searchQuery && (
                  <button
                    type="button"
                    onClick={() => setSearchQuery('')}
                    className="absolute right-2 top-1.5 text-neutral-400 hover:text-white text-xs cursor-pointer"
                  >
                    ✕
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* STORE LOCATIONS LIST */}
          <div className="space-y-3">
            {filteredLocations.length === 0 ? (
              <div className="bg-neutral-900 border border-neutral-800 p-8 rounded-2xl text-center space-y-2">
                <div className="text-xl">🔍</div>
                <div className="text-sm font-bold text-white">No store locations match your filter</div>
                <p className="text-xs text-neutral-400">Try clearing your search term or selecting All Locations.</p>
                <button
                  type="button"
                  onClick={() => { setCategoryFilter('all'); setSearchQuery(''); }}
                  className="mt-2 px-3 py-1.5 bg-neutral-800 hover:bg-neutral-750 text-white rounded-lg text-xs font-semibold cursor-pointer"
                >
                  Clear Filters
                </button>
              </div>
            ) : (
              filteredLocations.map(loc => {
                const emails = Array.isArray(routingState[loc.id]) && routingState[loc.id].length > 0
                  ? routingState[loc.id]
                  : (DEALERSHIP_NOTIFICATION_EMAILS[loc.id] || ['appraisals@sr1companies.com']);
                
                const defaultEmails = DEALERSHIP_NOTIFICATION_EMAILS[loc.id] || ['appraisals@sr1companies.com'];
                const isCustomized = JSON.stringify(emails) !== JSON.stringify(defaultEmails);

                const getCategoryBadge = (cat) => {
                  switch (cat) {
                    case 'partner_portal':
                      return { label: 'Partner Portal', color: 'bg-indigo-950/80 border-indigo-700 text-indigo-300' };
                    case 'rv':
                      return { label: 'SR1 RV', color: 'bg-amber-950/70 border-amber-800/80 text-amber-300' };
                    case 'trailer':
                      return { label: 'SR1 Trailers', color: 'bg-blue-950/70 border-blue-800/80 text-blue-300' };
                    case 'equipment':
                      return { label: 'SR1 Equipment', color: 'bg-emerald-950/70 border-emerald-800/80 text-emerald-300' };
                    case 'powersports':
                      return { label: 'SR1 Powersports', color: 'bg-purple-950/70 border-purple-800/80 text-purple-300' };
                    case 'container':
                      return { label: 'SR1 Containers', color: 'bg-cyan-950/70 border-cyan-800/80 text-cyan-300' };
                    default:
                      return { label: 'On-Site Pickup', color: 'bg-neutral-800 border-neutral-700 text-neutral-300' };
                  }
                };
                const badge = getCategoryBadge(loc.category);

                return (
                  <div
                    key={loc.id}
                    className="bg-neutral-900 border border-neutral-800 hover:border-neutral-750 p-4 sm:p-5 rounded-2xl space-y-3.5 transition-all"
                  >
                    {/* Top Row: Store Title, Division Badge & Status */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-neutral-850">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold uppercase border ${badge.color}`}>
                          {badge.label}
                        </span>
                        <h4 className="text-sm sm:text-base font-bold text-white">
                          {loc.name}
                        </h4>
                        <code className="text-[10px] text-neutral-500 font-mono bg-neutral-950 px-1.5 py-0.5 rounded border border-neutral-850">
                          {loc.id}
                        </code>
                      </div>

                      <div className="flex items-center gap-2 self-start sm:self-auto">
                        {isCustomized ? (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-950/70 border border-amber-800 text-amber-300">
                            Customized ({emails.length})
                          </span>
                        ) : (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-neutral-950 border border-neutral-800 text-neutral-400">
                            System Default ({emails.length})
                          </span>
                        )}

                        {isCustomized && (
                          <button
                            type="button"
                            onClick={() => handleResetLocation(loc.id)}
                            className="text-[11px] text-neutral-400 hover:text-white underline cursor-pointer"
                            title="Reset this store to default recipients"
                          >
                            Reset Store
                          </button>
                        )}
                      </div>
                    </div>

                    {/* Email Chips / Recipient Tags */}
                    <div className="space-y-2">
                      <label className="block text-[11px] font-semibold text-neutral-400 uppercase tracking-wide">
                        Notification Recipients:
                      </label>

                      <div className="flex flex-wrap items-center gap-2">
                        {emails.map((email, idx) => {
                          const isValid = emailRegex.test(email);
                          return (
                            <span
                              key={email + idx}
                              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-mono transition-all border ${
                                isValid
                                  ? idx === 0
                                    ? 'bg-neutral-850 border-neutral-700 text-white font-bold'
                                    : 'bg-neutral-950 border-neutral-800 text-neutral-300'
                                  : 'bg-rose-950/80 border-rose-800 text-rose-200'
                              }`}
                            >
                              <span className="text-[10px] opacity-70">
                                {idx === 0 ? '👑 Primary' : '📧 CC'}
                              </span>
                              <span>{email}</span>
                              {!isValid && (
                                <span className="text-rose-400 text-[10px] font-sans font-bold" title="Invalid email syntax">
                                  ⚠️
                                </span>
                              )}
                              <button
                                type="button"
                                onClick={() => handleRemoveEmail(loc.id, email)}
                                className="ml-1 text-neutral-400 hover:text-rose-300 font-sans text-xs cursor-pointer p-0.5 hover:bg-neutral-800 rounded"
                                title={`Remove ${email}`}
                              >
                                ✕
                              </button>
                            </span>
                          );
                        })}
                      </div>
                    </div>

                    {/* Add Recipient Form Input */}
                    <div className="pt-2 flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                      <div className="flex-1 relative">
                        <input
                          type="email"
                          value={newEmailInputs[loc.id] || ''}
                          onChange={(e) => setNewEmailInputs(prev => ({ ...prev, [loc.id]: e.target.value }))}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter') {
                              e.preventDefault();
                              handleAddEmail(loc.id, newEmailInputs[loc.id]);
                            }
                          }}
                          placeholder="Add email address (e.g. employee@sr1companies.com) or paste comma-separated list..."
                          className="w-full bg-neutral-950 border border-neutral-800 focus:border-amber-400 text-white placeholder-neutral-500 rounded-xl px-3 py-2 text-xs focus:outline-none"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={() => handleAddEmail(loc.id, newEmailInputs[loc.id])}
                        className="px-4 py-2 bg-neutral-800 hover:bg-neutral-750 text-white font-bold rounded-xl text-xs transition-colors cursor-pointer shrink-0 flex items-center justify-center gap-1.5"
                      >
                        <span>+</span>
                        <span>Add Recipient</span>
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function SuperAdminAnalyticsView({ siteAnalytics, staffUser, onBackToInquiries, onConvertPartialToInquiry }) {
      const [subView, setSubView] = useState('partials'); // 'partials' | 'traffic'
      const [stepFilter, setStepFilter] = useState('all'); // 'all' | 3 | 4 | 5 | 6
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [linkGroupFilter, setLinkGroupFilter] = useState('all'); // 'all' | 'footer_portals' | 'footer_websites' | 'footer_links' | 'pages_header'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedPartial, setSelectedPartial] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      if (!isSuperAdmin(staffUser)) {
        return (
          <div className="py-16 max-w-lg mx-auto text-center space-y-4">
            <div className="w-16 h-16 bg-neutral-900 border border-neutral-800 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
              🔒
            </div>
            <h2 className="text-xl font-bold text-white">Access Restricted to Admin</h2>
            <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
              Only authorized SR1 Admins have permission to view website traffic analytics and incomplete form submissions.
            </p>
            <div className="pt-2">
              <button
                type="button"
                onClick={onBackToInquiries}
                className="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded-xl text-xs font-semibold cursor-pointer transition-colors"
              >
                ← Return to Inquiries Workspace
              </button>
            </div>
          </div>
        );
      }

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      const handleManualRefresh = async () => {
        setRefreshing(true);
        await fetchSiteAnalyticsFromCloudRest();
        setRefreshing(false);
        showToast('✓ Synced latest website traffic & partial forms from Cloud Firestore.');
      };

      const data = siteAnalytics || createEmptyAnalyticsState();

      // Strictly only show partial forms that made it past Step 2 (maxStepReached >= 3) and are not completed
      const partialFormsList = useMemo(() => {
        return (Array.isArray(data.partialForms) ? data.partialForms : [])
          .filter(pf => pf && !pf.completed && (Number(pf.maxStepReached) || 0) >= 3)
          .sort((a, b) => new Date(b.updatedAt || b.startedAt || 0).getTime() - new Date(a.updatedAt || a.startedAt || 0).getTime());
      }, [data.partialForms]);

      const stepDropOffCounts = useMemo(() => {
        const counts = { all: partialFormsList.length, 3: 0, 4: 0, 5: 0, 6: 0 };
        partialFormsList.forEach(pf => {
          const st = Math.min(6, Math.max(3, Number(pf.maxStepReached) || 3));
          counts[st] = (counts[st] || 0) + 1;
        });
        return counts;
      }, [partialFormsList]);

      const filteredPartials = useMemo(() => {
        return partialFormsList.filter(pf => {
          const maxSt = Math.min(6, Math.max(3, Number(pf.maxStepReached) || 3));
          if (stepFilter !== 'all' && maxSt !== Number(stepFilter)) return false;
          if (categoryFilter !== 'all' && pf.category !== categoryFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const unitStr = `${pf.unit?.year || ''} ${pf.unit?.make || ''} ${pf.unit?.model || ''} ${pf.categoryLabel || ''}`.toLowerCase();
            const vinStr = String(pf.unit?.vinOrSerial || '').toLowerCase();
            const custStr = `${pf.customer?.firstName || ''} ${pf.customer?.lastName || ''} ${pf.customer?.email || ''} ${pf.customer?.phone || ''} ${pf.customer?.city || ''}`.toLowerCase();
            const notesStr = `${pf.unit?.conditionNotes || ''} ${pf.unit?.extrasOrUpgrades || ''}`.toLowerCase();
            const spStr = String(pf.salespersonName || '').toLowerCase();
            return unitStr.includes(q) || vinStr.includes(q) || custStr.includes(q) || notesStr.includes(q) || spStr.includes(q);
          }
          return true;
        });
      }, [partialFormsList, stepFilter, categoryFilter, searchQuery]);

      // Traffic summary metrics & Link Click Breakdown
      const trafficSummary = useMemo(() => {
        const todayKey = getLocalDateKey();
        const dailyObj = data.dailyStats || {};
        const todayEntry = dailyObj[todayKey] || { visits: 0, mobile: 0, desktop: 0, reachedStep3: 0, completed: 0, linkClicks: 0 };

        // Last 7 days & Last 14 days rows
        const daysList = [];
        let last7Visits = 0;
        let last7Step3 = 0;
        let last7Completed = 0;

        for (let i = 0; i < 14; i++) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const k = getLocalDateKey(d);
          const row = dailyObj[k] || { visits: 0, mobile: 0, desktop: 0, reachedStep3: 0, completed: 0, linkClicks: 0 };
          if (i < 7) {
            last7Visits += Number(row.visits) || 0;
            last7Step3 += Number(row.reachedStep3) || 0;
            last7Completed += Number(row.completed) || 0;
          }
          daysList.push({
            dateKey: k,
            label: i === 0 ? 'Today' : i === 1 ? 'Yesterday' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' }),
            visits: Number(row.visits) || 0,
            mobile: Number(row.mobile) || 0,
            desktop: Number(row.desktop) || 0,
            reachedStep3: Number(row.reachedStep3) || 0,
            completed: Number(row.completed) || 0,
            linkClicks: Number(row.linkClicks) || 0
          });
        }

        const totalVisits = Math.max(Number(data.totalVisits) || 0, last7Visits);
        const mobileVisits = Number(data.mobileVisits) || 0;
        const desktopVisits = Number(data.desktopVisits) || 0;
        const mobilePct = totalVisits > 0 ? Math.round((mobileVisits / totalVisits) * 100) : 0;

        const rawLinkMap = data.linkClicks || {};
        const linkClickRows = TRACKED_LINKS_CATALOG.map(item => {
          const stat = rawLinkMap[item.id] || { total: 0, mobile: 0, desktop: 0, daily: {}, lastClickedAt: null };
          const todayCount = (stat.daily && Number(stat.daily[todayKey])) || 0;
          return {
            ...item,
            total: Number(stat.total) || 0,
            todayCount,
            mobile: Number(stat.mobile) || 0,
            desktop: Number(stat.desktop) || 0,
            lastClickedAt: stat.lastClickedAt || null
          };
        });

        const sumCatalogClicks = linkClickRows.reduce((acc, r) => acc + r.total, 0);
        const sumTodayClicks = linkClickRows.reduce((acc, r) => acc + r.todayCount, 0);
        const totalLinkClicks = Math.max(Number(data.totalLinkClicks) || 0, sumCatalogClicks);
        const todayLinkClicks = Math.max(Number(todayEntry.linkClicks) || 0, sumTodayClicks);

        return {
          totalVisits,
          todayVisits: Number(todayEntry.visits) || 0,
          last7Visits,
          mobileVisits,
          desktopVisits,
          mobilePct,
          reachedStep3Count: Math.max(Number(data.reachedStep3Count) || 0, partialFormsList.length + (Number(data.completedCount) || 0)),
          completedCount: Number(data.completedCount) || 0,
          totalLinkClicks,
          todayLinkClicks,
          linkClickRows,
          daysList
        };
      }, [data, partialFormsList.length]);

      const filteredLinkRows = useMemo(() => {
        const list = trafficSummary.linkClickRows || [];
        const byGroup = linkGroupFilter === 'all' ? list : list.filter(r => r.group === linkGroupFilter);
        return [...byGroup].sort((a, b) => {
          if (b.total !== a.total) return b.total - a.total;
          return 0;
        });
      }, [trafficSummary.linkClickRows, linkGroupFilter]);

      const handleDeletePartial = async (pf) => {
        if (!pf || !pf.sessionId) return;
        const unitDesc = [pf.unit?.year, pf.unit?.make, pf.unit?.model].filter(Boolean).join(' ') || pf.categoryLabel || 'Partial Form';
        if (!window.confirm(`Remove this incomplete form (${unitDesc} — stopped at Step ${pf.maxStepReached} of 6)?`)) return;
        await deletePartialFormFromCloud(pf.sessionId);
        if (selectedPartial?.sessionId === pf.sessionId) setSelectedPartial(null);
        showToast('Removed partial form entry.');
      };

      const handleConvertPartial = async (pf) => {
        if (!pf || !onConvertPartialToInquiry) return;
        const unitDesc = [pf.unit?.year, pf.unit?.make, pf.unit?.model].filter(Boolean).join(' ') || pf.categoryLabel || 'Unit';
        if (!window.confirm(`Convert this partial form (${unitDesc}) into an active inquiry in the Consumer Inquiries pipeline?`)) return;

        const refId = String(Math.floor(1000 + Math.random() * 9000));
        const nowIso = new Date().toISOString();
        const newInquiry = {
          id: 'inq-' + Date.now(),
          referenceId: refId,
          createdAt: pf.startedAt || nowIso,
          updatedAt: nowIso,
          stage: 'new',
          preferredLocation: pf.preferredLocation || 'pickup_requested',
          intent: pf.intent || 'sell',
          workingWithSalesperson: pf.workingWithSalesperson || 'no',
          salespersonName: pf.salespersonName || '',
          assignedStaffName: pf.salespersonName || 'Appraisal Desk Queue',
          customer: {
            firstName: pf.customer?.firstName || 'Partial Form',
            lastName: pf.customer?.lastName || `(Stopped at Step ${pf.maxStepReached})`,
            email: pf.customer?.email || 'No email entered yet',
            phone: pf.customer?.phone || 'No phone entered yet',
            preferredContact: pf.customer?.preferredContact || 'text',
            city: pf.customer?.city || '',
            state: pf.customer?.state || 'ME',
            zipCode: pf.customer?.zipCode || ''
          },
          unit: {
            category: pf.category || 'rv',
            subcategory: pf.categoryLabel || 'Unit',
            year: Number(pf.unit?.year) || 2022,
            make: pf.unit?.make || 'Unknown Make',
            model: pf.unit?.model || 'Unknown Model',
            trimOrFloorplan: '',
            vinOrSerial: pf.unit?.vinOrSerial || (pf.category === 'container' ? 'N/A' : 'VIN-PENDING'),
            mileageOrHours: Number(pf.unit?.mileageOrHours) || 0,
            isHours: !!pf.unit?.isHours,
            transmissionType: pf.unit?.transmissionType || '',
            specs: {
              ...(pf.unit?.transmissionType ? { transmissionType: pf.unit.transmissionType } : {})
            },
            extrasOrUpgrades: pf.unit?.extrasOrUpgrades || '',
            condition: 'Good',
            conditionNotes: pf.unit?.conditionNotes || `Converted from incomplete form (visitor stopped at ${STEP_NAME_MAP[pf.maxStepReached] || `Step ${pf.maxStepReached}`}).`,
            tireOrTrackCondition: 'good',
            knownIssuesOrDamage: ''
          },
          financials: {
            titleStatus: pf.financials?.titleStatus || 'Not specified',
            lienHolderName: pf.financials?.lienHolderName || '',
            estimatedPayoff: Number(pf.financials?.estimatedPayoff) || 0,
            askingPrice: 0
          },
          photos: Array.isArray(pf.photos) && pf.photos.length > 0 ? pf.photos : [],
          offers: [],
          notes: [
            {
              id: 'n-conv-' + Date.now(),
              authorName: staffUser?.name || 'Admin',
              authorRole: 'Partial Form Recovery',
              createdAt: new Date().toLocaleTimeString(),
              category: 'general',
              content: `Converted from partial form session (${pf.device || 'Web'}). Visitor reached ${STEP_NAME_MAP[pf.maxStepReached] || `Step ${pf.maxStepReached}`} before leaving.`
            }
          ]
        };

        await onConvertPartialToInquiry(newInquiry);
        await deletePartialFormFromCloud(pf.sessionId);
        setSelectedPartial(null);
        showToast(`✓ Converted to Inquiry #${refId} in Consumer Inquiries!`);
      };

      const getStepBadgeStyle = (stepNum) => {
        switch (Number(stepNum)) {
          case 3:
            return 'bg-amber-950/80 border-amber-700/80 text-amber-300';
          case 4:
            return 'bg-orange-950/80 border-orange-700/80 text-orange-300';
          case 5:
            return 'bg-purple-950/80 border-purple-700/80 text-purple-300';
          case 6:
            return 'bg-rose-950/80 border-rose-700/80 text-rose-300';
          default:
            return 'bg-neutral-800 border-neutral-700 text-neutral-300';
        }
      };

      return (
        <div className="space-y-5">
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 max-w-md bg-neutral-900 border border-amber-500/60 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
              <span className="text-amber-400 text-lg">📊</span>
              <div className="text-xs font-semibold leading-relaxed">{toastMsg}</div>
            </div>
          )}

          {/* ADMIN HEADER BAR */}
          <div className="bg-neutral-900 border border-neutral-800 p-4 sm:p-5 rounded-2xl space-y-4">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div>
                <div className="flex flex-wrap items-center gap-2 mb-1">
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-400/20 text-amber-300 border border-amber-400/30">
                    Admin Analytics
                  </span>
                  <span className="text-[11px] text-neutral-400">
                    Logged in as <strong className="text-white">{staffUser?.email || 'Admin'}</strong>
                  </span>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-950/80 border border-emerald-800 text-emerald-300">
                    Rule Active: Only Documenting Forms Past Step 2 (Step 3+)
                  </span>
                </div>
                <h2 className="text-lg sm:text-xl font-bold text-white">
                  Website Traffic &amp; Incomplete Forms Tracker
                </h2>
                <p className="text-xs text-neutral-400 mt-0.5">
                  Monitor live website visits, conversion funnel performance, and every form that makes it past Step 2 (Steps 3–6) without completing submission.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center p-1 bg-neutral-950 border border-neutral-800 rounded-xl gap-1">
                  <button
                    type="button"
                    onClick={() => setSubView('partials')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 ${
                      subView === 'partials' ? 'bg-amber-400 text-neutral-950 shadow-sm' : 'text-neutral-400 hover:text-white'
                    }`}
                  >
                    <span>📝</span>
                    <span>Incomplete Forms (Past Step 2)</span>
                    <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${
                      subView === 'partials' ? 'bg-neutral-950/20 text-neutral-950' : 'bg-neutral-800 text-amber-300'
                    }`}>
                      {partialFormsList.length}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setSubView('traffic')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 ${
                      subView === 'traffic' ? 'bg-amber-400 text-neutral-950 shadow-sm' : 'text-neutral-400 hover:text-white'
                    }`}
                  >
                    <span>📈</span>
                    <span>Website Traffic Log</span>
                  </button>
                </div>

                <button
                  type="button"
                  onClick={handleManualRefresh}
                  disabled={refreshing}
                  className="px-3 py-2 bg-neutral-850 hover:bg-neutral-800 text-neutral-200 rounded-xl text-xs font-semibold border border-neutral-750 cursor-pointer"
                >
                  {refreshing ? 'Syncing...' : '↻ Refresh'}
                </button>

                <button
                  type="button"
                  onClick={onBackToInquiries}
                  className="px-3 py-2 bg-neutral-850 hover:bg-neutral-800 text-neutral-300 hover:text-white rounded-xl text-xs font-semibold border border-neutral-750 cursor-pointer"
                >
                  ← Inquiries Pipeline
                </button>
              </div>
            </div>
          </div>

          {/* TOP KPI STRIP */}
          <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-1">
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Website Visits</span>
                <span className="text-xs text-emerald-400 font-bold">{trafficSummary.todayVisits} today</span>
              </div>
              <div className="text-2xl font-black text-white font-mono">
                {trafficSummary.totalVisits.toLocaleString()}
              </div>
              <div className="text-[11px] text-neutral-400">
                Last 7 days: <strong className="text-neutral-200">{trafficSummary.last7Visits.toLocaleString()}</strong> • {trafficSummary.mobilePct}% Mobile
              </div>
            </div>

            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-1">
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Made It Past Step 2</span>
                <span className="text-[10px] font-semibold text-blue-300">Reached Step 3+</span>
              </div>
              <div className="text-2xl font-black text-blue-300 font-mono">
                {trafficSummary.reachedStep3Count.toLocaleString()}
              </div>
              <div className="text-[11px] text-neutral-400">
                Entered unit details &amp; reached Photos (Step 3+)

    // ==========================================
    // 3. EMAIL ROUTING MANAGER (SUPER ADMIN: reid@sr1companies.com ONLY)
    // ==========================================
    function EmailRoutingManager({ emailRoutingConfig, onSaveEmailRoutingConfig, staffUser, onBackToInquiries }) {
      if (!isSuperAdmin(staffUser)) {
        return (
          <div className="py-16 max-w-lg mx-auto text-center space-y-4">
            <div className="w-16 h-16 bg-neutral-900 border border-neutral-800 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
              🔒
            </div>
            <h2 className="text-xl font-bold text-white">Access Restricted to Super Admin</h2>
            <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
              Only authorized administrator <strong className="text-white">reid@sr1companies.com</strong> has permission to configure where appraisal submissions are routed.
            </p>
            <div className="pt-2">
              <button
                type="button"
                onClick={onBackToInquiries}
                className="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded-xl text-xs font-semibold cursor-pointer transition-colors"
              >
                ← Return to Inquiries Workspace
              </button>
            </div>
          </div>
        );
      }

      const initialRouting = useMemo(() => {
        const merged = { ...DEALERSHIP_NOTIFICATION_EMAILS };
        if (emailRoutingConfig && typeof emailRoutingConfig === 'object') {
          Object.assign(merged, emailRoutingConfig);
        }
        return merged;
      }, [emailRoutingConfig]);

      const [routingState, setRoutingState] = useState(() => initialRouting);
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [isSaving, setIsSaving] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [newEmailInputs, setNewEmailInputs] = useState({});

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Unsaved changes check
      const hasUnsavedChanges = useMemo(() => {
        return JSON.stringify(routingState) !== JSON.stringify(initialRouting);
      }, [routingState, initialRouting]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4500);
      };

      const handleAddEmail = (locId, emailInput) => {
        const raw = (emailInput || '').trim();
        if (!raw) return;
        const splitEmails = raw.split(/[,;\s]+/).map(e => e.trim().toLowerCase()).filter(Boolean);
        if (splitEmails.length === 0) return;

        const currentList = Array.isArray(routingState[locId]) ? routingState[locId] : [];
        const toAdd = splitEmails.filter(e => !currentList.includes(e));

        if (toAdd.length === 0) {
          showToast('Email already added for this store.');
          return;
        }

        setRoutingState(prev => ({
          ...prev,
          [locId]: [...currentList, ...toAdd]
        }));
        setNewEmailInputs(prev => ({ ...prev, [locId]: '' }));
      };

      const handleRemoveEmail = (locId, emailToRemove) => {
        const currentList = Array.isArray(routingState[locId]) ? routingState[locId] : [];
        if (currentList.length <= 1) {
          if (!window.confirm('Warning: Removing all recipients means this store location will fall back to appraisals@sr1companies.com. Remove anyway?')) {
            return;
          }
        }
        setRoutingState(prev => ({
          ...prev,
          [locId]: currentList.filter(e => e !== emailToRemove)
        }));
      };

      const handleResetLocation = (locId) => {
        const defaultEmails = DEALERSHIP_NOTIFICATION_EMAILS[locId] || ['appraisals@sr1companies.com'];
        setRoutingState(prev => ({
          ...prev,
          [locId]: [...defaultEmails]
        }));
        showToast('Reset store to factory defaults.');
      };

      const handleResetAllToDefaults = () => {
        if (window.confirm('Are you sure you want to reset ALL 18 store locations to system default routing? Click "Save Routing Changes" afterwards to commit to Firestore cloud.')) {
          setRoutingState({ ...DEALERSHIP_NOTIFICATION_EMAILS });
          showToast('Reset all locations to factory defaults.');
        }
      };

      const handleSave = async () => {
        setIsSaving(true);
        try {
          const ok = await onSaveEmailRoutingConfig(routingState);
          if (ok) {
            showToast('✓ Email routing saved successfully to Cloud Firestore! All future customer submissions will route to these recipients.');
          } else {
            showToast('Saved locally in browser storage.');
          }
        } catch (e) {
          showToast('Saved locally in browser storage.');
        } finally {
          setIsSaving(false);
        }
      };

      // Filter locations
      const filteredLocations = useMemo(() => {
        return LOCATIONS.filter(loc => {
          if (categoryFilter !== 'all') {
            if (categoryFilter === 'pickup') {
              if (loc.id !== 'pickup_requested') return false;
            } else if (loc.category !== categoryFilter) {
              return false;
            }
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const nameMatch = loc.name.toLowerCase().includes(q);
            const idMatch = loc.id.toLowerCase().includes(q);
            const emails = routingState[loc.id] || [];
            const emailMatch = emails.some(e => e.toLowerCase().includes(q));
            return nameMatch || idMatch || emailMatch;
          }
          return true;
        });
      }, [categoryFilter, searchQuery, routingState]);

      // Category counts for filter tabs
      const categoryCounts = useMemo(() => {
        const counts = { all: LOCATIONS.length, trailer: 0, rv: 0, equipment: 0, powersports: 0, container: 0, pickup: 0 };
        LOCATIONS.forEach(l => {
          if (l.id === 'pickup_requested') counts.pickup += 1;
          else if (counts[l.category] !== undefined) counts[l.category] += 1;
        });
        return counts;
      }, []);

      return (
        <div className="space-y-6">
          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 max-w-md bg-neutral-900 border border-amber-500/60 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
              <span className="text-amber-400 text-lg">🔔</span>

            ) : (

                  : (DEALERSHIP_NOTIFICATION_EMAILS[loc.id] || ['appraisals@sr1companies.com']);
                
                const defaultEmails = DEALERSHIP_NOTIFICATION_EMAILS[loc.id] || ['appraisals@sr1companies.com'];
                const isCustomized = JSON.stringify(emails) !== JSON.stringify(defaultEmails);

                const getCategoryBadge = (cat) => {

                      <div className="flex flex-wrap items-center gap-2">

                          const isValid = emailRegex.test(email);
                          return (

                    {/* Add Recipient Form Input */}
                    <div className="pt-2 flex flex-col sm:flex-row items-stretch sm:items-center gap-2">

                          value={newEmailInputs[loc.id] || ''}
                          onChange={(e) => setNewEmailInputs(prev => ({ ...prev, [loc.id]: e.target.value }))}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter') {
                              e.preventDefault();
                              handleAddEmail(loc.id, newEmailInputs[loc.id]);
                            }
                          }}
                          placeholder="Add email address (e.g. employee@sr1companies.com) or paste comma-separated list..."
                          className="w-full bg-neutral-950 border border-neutral-800 focus:border-amber-400 text-white placeholder-neutral-500 rounded-xl px-3 py-2 text-xs focus:outline-none"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={() => handleAddEmail(loc.id, newEmailInputs[loc.id])}
                        className="px-4 py-2 bg-neutral-800 hover:bg-neutral-750 text-white font-bold rounded-xl text-xs transition-colors cursor-pointer shrink-0 flex items-center justify-center gap-1.5"

        </div>
      );
    }

    function StaffPortalView({ inquiries, onUpdateInquiry, onDeleteInquiry, selectedInquiryId, setSelectedInquiryId, staffUser, onSignOut, onSyncSamplesToCloud, emailRoutingConfig, onSaveEmailRoutingConfig }) {
      const canManageRouting = isSuperAdmin(staffUser);
      const canDeleteInquiries = isSuperAdmin(staffUser);
      const [portalTab, setPortalTab] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('tab') === 'routing' && isSuperAdmin(staffUser)) return 'routing';
        } catch (e) {}
        return 'inquiries';
      });
      const [filterStage, setFilterStage] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          return params.get('stage') || 'all';
        } catch (e) {
          return 'all';
        }
      });
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterLocation, setFilterLocation] = useState('all');
      const [filterIntent, setFilterIntent] = useState('all'); // 'all', 'trade', 'sell'
      const [searchTerm, setSearchTerm] = useState('');
      const [mobileLayout, setMobileLayout] = useState(() => {
        try {
          return localStorage.getItem('sell2sr1_mobile_layout') || 'cards';
        } catch (e) {
          return 'cards';
        }
      });
      const [sortField, setSortField] = useState('date'); // 'date', 'ref', 'unit', 'customer', 'location', 'stage', 'offer', 'type'
      const [sortDirection, setSortDirection] = useState('desc'); // 'asc', 'desc'
      const [showInstallGuide, setShowInstallGuide] = useState(false);
      const [copiedLink, setCopiedLink] = useState(false);

      const handleSetMobileLayout = (layout) => {
        setMobileLayout(layout);
        try {
          localStorage.setItem('sell2sr1_mobile_layout', layout);
        } catch (e) {}
      };

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDirection(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDirection(field === 'date' || field === 'offer' ? 'desc' : 'asc');
        }
      };

      const stageCounts = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        let allActive = 0;
        let archived = 0;
        const counts = {};
        Object.keys(STAGES).forEach(k => { counts[k] = 0; });
        list.forEach(inq => {
          if (!inq) return;
          const isArch = inq.isArchived || inq.stage === 'archived';
          if (isArch) {
            archived += 1;
            counts.archived = (counts.archived || 0) + 1;
          } else {
            allActive += 1;
            if (inq.stage && counts[inq.stage] !== undefined) {
              counts[inq.stage] += 1;
            }
          }
        });
        counts.all = allActive;
        counts.archived = archived;
        return counts;
      }, [inquiries]);

      const filtered = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        return list.filter(inq => {
          if (!inq) return false;
          const isArch = inq.isArchived || inq.stage === 'archived';

          if (filterStage === 'archived') {
            if (!isArch) return false;
          } else if (filterStage === 'all') {
            if (isArch) return false;
          } else {
            if (isArch) return false;
            if (inq.stage !== filterStage) return false;
          }

          if (filterCategory !== 'all' && inq.unit?.category !== filterCategory) return false;
          if (filterLocation !== 'all' && inq.preferredLocation !== filterLocation) return false;
          if (filterIntent !== 'all') {
            const inqIntent = inq.intent || 'sell';
            if (inqIntent !== filterIntent) return false;
          }
          if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            const custName = `${inq.customer?.firstName || ''} ${inq.customer?.lastName || ''}`.toLowerCase();
            const ref = String(inq.referenceId || '').toLowerCase();
            const unitStr = `${inq.unit?.year || ''} ${inq.unit?.make || ''} ${inq.unit?.model || ''}`.toLowerCase();
            const vinStr = String(inq.unit?.vinOrSerial || '').toLowerCase();
            const salesStr = String(inq.salespersonName || '').toLowerCase();
            const locStr = getLocationName(inq.preferredLocation).toLowerCase();
            const phoneStr = String(inq.customer?.phone || '').toLowerCase();
            const emailStr = String(inq.customer?.email || '').toLowerCase();
            return custName.includes(term) || ref.includes(term) || unitStr.includes(term) || vinStr.includes(term) || salesStr.includes(term) || locStr.includes(term) || phoneStr.includes(term) || emailStr.includes(term);
          }
          return true;
        });
      }, [inquiries, filterStage, filterCategory, filterLocation, filterIntent, searchTerm]);

      const sorted = useMemo(() => {
        return [...filtered].sort((a, b) => {
          let valA = '';
          let valB = '';
          if (sortField === 'date') {
            valA = new Date(a.createdAt || 0).getTime();
            valB = new Date(b.createdAt || 0).getTime();
          } else if (sortField === 'ref') {
            valA = String(a.referenceId || '');
            valB = String(b.referenceId || '');
          } else if (sortField === 'type') {
            valA = a.intent || 'sell';
            valB = b.intent || 'sell';
          } else if (sortField === 'unit') {
            valA = `${a.unit?.year || ''} ${a.unit?.make || ''} ${a.unit?.model || ''}`.trim().toLowerCase();
            valB = `${b.unit?.year || ''} ${b.unit?.make || ''} ${b.unit?.model || ''}`.trim().toLowerCase();
          } else if (sortField === 'customer') {
            valA = `${a.customer?.lastName || ''} ${a.customer?.firstName || ''}`.trim().toLowerCase();
            valB = `${b.customer?.lastName || ''} ${b.customer?.firstName || ''}`.trim().toLowerCase();
          } else if (sortField === 'location') {
            valA = getLocationName(a.preferredLocation).toLowerCase();
            valB = getLocationName(b.preferredLocation).toLowerCase();
          } else if (sortField === 'stage') {
            valA = a.stage || '';
            valB = b.stage || '';
          } else if (sortField === 'offer') {
            valA = (Array.isArray(a.offers) && a.offers.length > 0) ? (Number(a.offers[a.offers.length - 1].amount) || 0) : -1;
            valB = (Array.isArray(b.offers) && b.offers.length > 0) ? (Number(b.offers[b.offers.length - 1].amount) || 0) : -1;
          }
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filtered, sortField, sortDirection]);

      const handleArchiveInquiry = (inq) => {
        if (!inq) return;
        const confirmMsg = `Archive inquiry #${inq.referenceId} (${inq.unit?.year || ''} ${inq.unit?.make || ''} ${inq.unit?.model || ''})?\n\nIt will be hidden from the active pipeline and moved to the Archived tab.`;
        if (!confirm(confirmMsg)) return;

        const now = new Date().toISOString();
        const prevStage = (inq.stage && inq.stage !== 'archived') ? inq.stage : 'new';
        const archiveNote = {
          id: 'note-' + Date.now(),
          authorName: staffUser?.name || 'SR1 Staff',
          authorRole: 'Appraiser',
          createdAt: new Date().toLocaleTimeString(),
          category: 'general',
          content: 'Inquiry archived.'
        };

        const updated = {
          ...inq,
          isArchived: true,
          stage: 'archived',
          previousStage: prevStage,
          archivedAt: now,
          archivedBy: staffUser?.name || 'Staff Appraiser',
          notes: Array.isArray(inq.notes) ? [...inq.notes, archiveNote] : [archiveNote],
          updatedAt: now
        };

        onUpdateInquiry(updated);
      };

      const handleUnarchiveInquiry = (inq) => {
        if (!inq) return;
        const restoredStage = (inq.previousStage && inq.previousStage !== 'archived') ? inq.previousStage : 'new';
        const now = new Date().toISOString();
        const unarchiveNote = {
          id: 'note-' + Date.now(),
          authorName: staffUser?.name || 'SR1 Staff',
          authorRole: 'Appraiser',
          createdAt: new Date().toLocaleTimeString(),
          category: 'general',
          content: `Inquiry restored from archive back to ${STAGES[restoredStage]?.label || 'active pipeline'}.`
        };

        const updated = {
          ...inq,
          isArchived: false,
          stage: restoredStage,
          archivedAt: null,
          archivedBy: null,
          notes: Array.isArray(inq.notes) ? [...inq.notes, unarchiveNote] : [unarchiveNote],
          updatedAt: now
        };

        onUpdateInquiry(updated);
      };

      const handleConfirmDeleteInquiry = (inq) => {
        if (!inq || !canDeleteInquiries || !onDeleteInquiry) return;
        const unitTitle = [inq.unit?.year, inq.unit?.make, inq.unit?.model].filter(Boolean).join(' ') || 'Unit';
        const customerName = [inq.customer?.firstName, inq.customer?.lastName].filter(Boolean).join(' ') || 'Unknown Customer';
        const confirmMsg = `Permanently delete inquiry #${inq.referenceId} (${unitTitle} — ${customerName})?\n\nThis action cannot be undone and will permanently remove the inquiry from the portal and database.`;
        if (!confirm(confirmMsg)) return;
        onDeleteInquiry(inq);
      };

      const selectedInquiry = (inquiries || []).find(i => i && i.id === selectedInquiryId);
      const lastLoggedOpenRef = useRef(null);

      const recordInquirySeenBy = (inq, user) => {
        if (!inq) return null;
        const email = (user?.email || '').trim().toLowerCase();
        const name = (user?.name || (email ? email.split('@')[0] : '') || 'SR1 Staff').trim();
        const picture = user?.picture || '';
        const nowIso = new Date().toISOString();
        const existingList = Array.isArray(inq.seenBy) ? inq.seenBy : [];

        let matched = false;
        const updatedList = existingList.map(entry => {
          const entryEmail = (entry?.email || '').trim().toLowerCase();
          const entryName = (entry?.name || '').trim().toLowerCase();
          const isSameUser = (email && entryEmail && email === entryEmail) || (!email && name && entryName && name.toLowerCase() === entryName);
          if (isSameUser) {
            matched = true;
            return {
              ...entry,
              email: email || entry.email || '',
              name: name || entry.name || 'SR1 Staff',
              picture: picture || entry.picture || '',
              firstSeenAt: entry.firstSeenAt || entry.seenAt || nowIso,
              lastSeenAt: nowIso,
              viewCount: (Number(entry.viewCount) || 1) + 1
            };
          }
          return entry;
        });

        if (!matched) {
          updatedList.unshift({
            email,
            name,
            picture,
            firstSeenAt: nowIso,
            lastSeenAt: nowIso,
            viewCount: 1
          });
        }

        updatedList.sort((a, b) => new Date(b.lastSeenAt || b.seenAt || 0).getTime() - new Date(a.lastSeenAt || a.seenAt || 0).getTime());

        return {
          ...inq,
          seenBy: updatedList
        };
      };

      const handleOpenInquiry = (inq) => {
        if (!inq) return;
        lastLoggedOpenRef.current = inq.id;
        setSelectedInquiryId(inq.id);
        const updated = recordInquirySeenBy(inq, staffUser);
        if (updated) {
          onUpdateInquiry(updated);
        }
      };

      useEffect(() => {
        if (!selectedInquiryId) {
          lastLoggedOpenRef.current = null;
          return;
        }
        if (lastLoggedOpenRef.current !== selectedInquiryId && selectedInquiry) {
          lastLoggedOpenRef.current = selectedInquiryId;
          const updated = recordInquirySeenBy(selectedInquiry, staffUser);
          if (updated) {
            onUpdateInquiry(updated);
          }
        }

          {/* APPRAISAL MODAL */}

                    </div>

    // ==========================================
    // 4. APPRAISAL WORKSPACE MODAL
    // ==========================================
    function AppraisalWorkspaceModal({ inquiry, staffUser, onClose, onUpdateInquiry, onDeleteInquiry }) {
      const canDeleteInquiries = isSuperAdmin(staffUser) && typeof onDeleteInquiry === 'function';
      const [currentStage, setCurrentStage] = useState(inquiry.stage);
      const latestOffer = (Array.isArray(inquiry.offers) && inquiry.offers.length > 0)
        ? inquiry.offers[inquiry.offers.length - 1]
        : null;
      const [offerAmount, setOfferAmount] = useState(
        latestOffer?.amount !== undefined && latestOffer?.amount !== null ? String(latestOffer.amount) : ''
      );
      const [offerNotes, setOfferNotes] = useState(latestOffer?.notes || 'Subject to physical inspection and title verification.');
      const [newNoteText, setNewNoteText] = useState('');
      const mediaItems = Array.isArray(inquiry.photos) ? inquiry.photos : [];
      const [activeMediaIndex, setActiveMediaIndex] = useState(0);
      const [isLightboxOpen, setIsLightboxOpen] = useState(false);
      const [isZoomed, setIsZoomed] = useState(false);
      const touchStartXRef = useRef(null);

      const safeMediaIndex = mediaItems.length > 0 ? Math.min(activeMediaIndex, mediaItems.length - 1) : 0;
      const activeMedia = mediaItems[safeMediaIndex] || null;
      const activePhoto = activeMedia ? (activeMedia.url || activeMedia.thumbUrl || '') : '';

      const goToMedia = (idx) => {
        if (mediaItems.length === 0) return;
        const nextIdx = ((idx % mediaItems.length) + mediaItems.length) % mediaItems.length;
        setActiveMediaIndex(nextIdx);
        setIsZoomed(false);
      };

      const handlePrevMedia = (e) => {
        if (e) e.stopPropagation();
        goToMedia(safeMediaIndex - 1);
      };

      const handleNextMedia = (e) => {
        if (e) e.stopPropagation();
        goToMedia(safeMediaIndex + 1);
      };

      const handleTouchStartMedia = (e) => {
        if (e.touches && e.touches.length === 1) {
          touchStartXRef.current = e.touches[0].clientX;
        }
      };

      const handleTouchEndMedia = (e) => {
        if (touchStartXRef.current === null || !e.changedTouches || e.changedTouches.length === 0) return;
        const deltaX = e.changedTouches[0].clientX - touchStartXRef.current;
        touchStartXRef.current = null;
        if (Math.abs(deltaX) > 45 && mediaItems.length > 1) {
          if (deltaX < 0) {
            goToMedia(safeMediaIndex + 1);
          } else {
            goToMedia(safeMediaIndex - 1);
          }
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
          const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
          if (isLightboxOpen) {
            if (e.key === 'Escape') {
              e.preventDefault();
              e.stopPropagation();
              setIsLightboxOpen(false);
              setIsZoomed(false);
            } else if (e.key === 'ArrowLeft' && mediaItems.length > 1) {
              e.preventDefault();
              goToMedia(safeMediaIndex - 1);
            } else if (e.key === 'ArrowRight' && mediaItems.length > 1) {
              e.preventDefault();
              goToMedia(safeMediaIndex + 1);
            }
          } else if (!isTyping && mediaItems.length > 1) {
            if (e.key === 'ArrowLeft') {
              e.preventDefault();
              goToMedia(safeMediaIndex - 1);
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              goToMedia(safeMediaIndex + 1);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isLightboxOpen, safeMediaIndex, mediaItems.length]);

      const [outreachStaffName, setOutreachStaffName] = useState(inquiry.outreach?.staffName || staffUser?.name || '');
      const [reachedOut, setReachedOut] = useState(inquiry.outreach?.reachedOut || false);
      const [reachedOutAt, setReachedOutAt] = useState(inquiry.outreach?.reachedOutAt || null);
      const seenByList = useMemo(() => {
        const list = Array.isArray(inquiry.seenBy) ? [...inquiry.seenBy] : [];
        return list.sort((a, b) => new Date(b.lastSeenAt || b.seenAt || 0).getTime() - new Date(a.lastSeenAt || a.seenAt || 0).getTime());
      }, [inquiry.seenBy]);

      // Market Comps Live Search State
      const defaultCompsQuery = [inquiry.unit.year, inquiry.unit.make, inquiry.unit.model].filter(Boolean).join(' ');
      const [fbCompsQuery, setFbCompsQuery] = useState(defaultCompsQuery);

      const parsedOfferAmount = Number(offerAmount) || 0;
      const netEquity = Math.max(0, parsedOfferAmount - (inquiry.financials.estimatedPayoff || 0));

      const handleToggleOutreach = (checked) => {
        if (checked && !outreachStaffName.trim()) {
          alert('Please enter your staff name before checking off that you reached out.');
          return;
        }
        const now = new Date().toLocaleString();
        setReachedOut(checked);
        setReachedOutAt(checked ? now : null);

        const newOutreach = {
          reachedOut: checked,
          staffName: checked ? outreachStaffName.trim() : '',
          reachedOutAt: checked ? now : null
        };

        const updated = {
          ...inquiry,
          outreach: newOutreach,
          updatedAt: new Date().toISOString(),
          notes: checked ? [
            ...inquiry.notes,
            {
              id: 'n-outreach-' + Date.now(),
              authorName: outreachStaffName.trim(),
              authorRole: 'Staff Member',
              createdAt: new Date().toLocaleTimeString(),
              category: 'call_log',
              content: `Staff member ${outreachStaffName.trim()} confirmed direct outreach to client (${inquiry.customer.phone} / ${inquiry.customer.email}).`
            }
          ] : inquiry.notes
        };

        onUpdateInquiry(updated);
      };

      const handleSaveStaffName = (name) => {
        setOutreachStaffName(name);
        if (reachedOut) {
          onUpdateInquiry({
            ...inquiry,
            outreach: {
              ...inquiry.outreach,
              staffName: name.trim()
            },
            updatedAt: new Date().toISOString()
          });
        }
      };

      const isArchived = Boolean(inquiry.isArchived || currentStage === 'archived' || inquiry.stage === 'archived');

      useEffect(() => {
        setCurrentStage(inquiry.stage);
      }, [inquiry.stage]);

      const handleSaveStage = (newSt) => {
        setCurrentStage(newSt);
        const now = new Date().toISOString();
        if (newSt === 'archived') {
          const prevStage = (inquiry.stage && inquiry.stage !== 'archived') ? inquiry.stage : (inquiry.previousStage || 'new');
          const archiveNote = {
            id: 'note-' + Date.now(),
            authorName: outreachStaffName.trim() || 'Staff Appraiser',
            authorRole: 'Appraiser',
            createdAt: new Date().toLocaleTimeString(),
            category: 'general',
            content: 'Stage set to Archived. Inquiry hidden from active pipeline.'
          };
          onUpdateInquiry({
            ...inquiry,
            stage: 'archived',
            isArchived: true,
            previousStage: prevStage,
            archivedAt: now,
            archivedBy: outreachStaffName.trim() || 'Staff Appraiser',
            notes: Array.isArray(inquiry.notes) ? [...inquiry.notes, archiveNote] : [archiveNote],
            updatedAt: now
          });
        } else if (inquiry.isArchived || inquiry.stage === 'archived') {
          const restoreNote = {
            id: 'note-' + Date.now(),
            authorName: outreachStaffName.trim() || 'Staff Appraiser',
            authorRole: 'Appraiser',
            createdAt: new Date().toLocaleTimeString(),
            category: 'general',
            content: `Stage changed from Archived to ${STAGES[newSt]?.label || newSt}. Inquiry restored to active pipeline.`
          };
          onUpdateInquiry({
            ...inquiry,
            stage: newSt,
            isArchived: false,
            previousStage: null,

                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* STAFF CLIENT OUTREACH CHECK-OFF */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-[11px] font-bold uppercase text-neutral-300">Staff Client Outreach</span>
                    {reachedOut ? (
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 border border-emerald-700 text-emerald-300">
                        ✓ Reached Out
                      </span>
                    ) : (
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 border border-amber-800 text-amber-300">
                        ⏳ Pending Outreach
                      </span>
                    )}
                  </div>
                  {reachedOutAt && (
                    <span className="text-[10px] text-neutral-400">
                      Logged on {reachedOutAt}
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center pt-1">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">Staff Member Name *</label>
                    <input
                      type="text"
                      value={outreachStaffName}
                      onChange={(e) => handleSaveStaffName(e.target.value)}
                      placeholder="Enter staff name..."
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2 sm:pt-4">
                    <label className="flex items-center space-x-2.5 cursor-pointer bg-neutral-900 p-2.5 rounded-lg border border-neutral-750 hover:border-neutral-600 transition-colors">
                      <input
                        type="checkbox"
                        checked={reachedOut}
                        onChange={(e) => handleToggleOutreach(e.target.checked)}
                        className="w-4 h-4 rounded border-neutral-700 text-neutral-100 bg-neutral-950 focus:ring-0 cursor-pointer"
                      />
                      <span className="text-xs font-semibold text-neutral-200 select-none">
                        I have reached out to this client
                      </span>
                    </label>
                  </div>
                </div>
              </div>

              {/* OFFER BUILDER */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Offer Desk</span>
                <div>
                  <label className="text-neutral-400 text-[10px] block mb-1">SR1 Initial Offer Sent ($)</label>
                  <input
                    type="number"
                    min="0"
                    value={offerAmount}
                    onChange={(e) => setOfferAmount(e.target.value)}
                    className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white font-bold text-sm focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                  />
                </div>

                <div className="pt-1">
                  <button
                    onClick={handleSendOffer}
                    className="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-950 font-bold rounded-lg text-xs"
                  >
                    Save & Record Offer
                  </button>
                </div>
              </div>

              {/* NOTES */}
              <div className="space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Team Notes</span>
                <div className="space-y-2 max-h-36 overflow-y-auto">
                  {inquiry.notes.map(note => (
                    <div key={note.id} className="bg-neutral-950 p-2.5 rounded-lg border border-neutral-800 text-[11px]">
                      <div className="flex justify-between text-neutral-500 text-[10px]">
                        <span>{note.authorName} ({note.authorRole})</span>
                        <span>{note.createdAt}</span>
                      </div>
                      <p className="text-neutral-300 mt-1">{note.content}</p>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleAddNote} className="flex gap-2">
                  <input
                    type="text"
                    value={newNoteText}
                    onChange={(e) => setNewNoteText(e.target.value)}
                    placeholder="Add an internal note..."
                    className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-neutral-800 text-white font-semibold rounded-lg text-xs">
                    Post
                  </button>
                </form>
              </div>

            </div>

            <div className="bg-neutral-950 p-3 border-t border-neutral-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white font-semibold rounded-lg text-xs"
              >
                Close
              </button>
            </div>

          </div>

          {/* FULL-SCREEN INTERACTIVE MEDIA LIGHTBOX GALLERY */}
          {isLightboxOpen && activePhoto && (
            <div
              className="fixed inset-0 z-[80] bg-black/95 backdrop-blur-md flex flex-col select-none"
              onClick={() => {
                setIsLightboxOpen(false);
                setIsZoomed(false);
              }}
              onTouchStart={handleTouchStartMedia}
              onTouchEnd={handleTouchEndMedia}
            >
              {/* Top Header Bar */}
              <div
                className="flex items-center justify-between px-4 sm:px-6 py-3 bg-neutral-950/90 border-b border-neutral-800 shrink-0"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center gap-3 min-w-0">
                  <span className="px-2.5 py-1 rounded-md bg-neutral-800 border border-neutral-700 text-xs font-mono font-bold text-white shrink-0">
                    {safeMediaIndex + 1} / {mediaItems.length}
                  </span>
                  <div className="min-w-0">
                    <div className="text-xs sm:text-sm font-bold text-white truncate">
                      {activeMedia?.label || (activeMedia?.isVideo ? `Video ${safeMediaIndex + 1}` : `Photo ${safeMediaIndex + 1}`)}
                    </div>
                    <div className="text-[11px] text-neutral-400 truncate">
                      #{inquiry.referenceId} • {inquiry.unit.year} {inquiry.unit.make} {inquiry.unit.model}
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-2 shrink-0">
                  {!activeMedia?.isVideo && (
                    <button
                      type="button"
                      onClick={() => setIsZoomed((z) => !z)}
                      className="px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-750 border border-neutral-700 text-xs font-semibold text-neutral-200 hover:text-white flex items-center gap-1.5 cursor-pointer transition-colors"
                    >
                      <span>{isZoomed ? '🔍 Reset Zoom' : '🔍 Zoom In'}</span>
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => {
                      const w = window.open('');
                      if (w) {
                        if (activeMedia?.isVideo) {
                          w.document.write(`<!DOCTYPE html><html><head><title>SR1 Video Preview</title></head><body style="margin:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;"><video src="${activePhoto}" controls autoplay style="max-width:95vw;max-height:95vh;border-radius:8px;"></video></body></html>`);
                        } else {
                          w.document.write(`<!DOCTYPE html><html><head><title>SR1 Media Preview</title></head><body style="margin:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${activePhoto}" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8);"/></body></html>`);
                        }
                      }
                    }}
                    className="hidden sm:flex px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-750 border border-neutral-700 text-xs font-semibold text-neutral-300 hover:text-white items-center gap-1 cursor-pointer transition-colors"
                  >
                    <span>↗</span> New Tab
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setIsLightboxOpen(false);
                      setIsZoomed(false);
                    }}
                    className="px-3.5 py-1.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 text-xs font-bold text-white flex items-center gap-1.5 cursor-pointer transition-colors"
                  >
                    <span>✕</span> Close
                  </button>
                </div>
              </div>

              {/* Center Stage with Large Prev / Next Buttons */}
              <div className="flex-1 relative flex items-center justify-center overflow-auto p-3 sm:p-8">
                {mediaItems.length > 1 && (
                  <button
                    type="button"
                    onClick={handlePrevMedia}
                    aria-label="Previous item"
                    title="Previous (Left Arrow)"
                    className="fixed sm:absolute left-2 sm:left-5 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-neutral-900/90 hover:bg-white text-white hover:text-neutral-950 border border-white/25 flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-2xl transition-all cursor-pointer z-20"
                  >
                    ‹
                  </button>
                )}

                <div
                  className="relative flex items-center justify-center max-w-full max-h-full"
                  onClick={(e) => e.stopPropagation()}
                >
                  {activeMedia?.isVideo ? (
                    <video
                      key={activePhoto}
                      src={activePhoto}
                      controls
                      autoPlay
                      playsInline
                      className="max-w-[90vw] max-h-[75vh] rounded-xl shadow-2xl border border-neutral-800 bg-black"
                    />
                  ) : (
                    <img
                      src={activePhoto}
                      alt={activeMedia?.label || `Photo ${safeMediaIndex + 1}`}
                      onClick={() => setIsZoomed((z) => !z)}
                      className={`rounded-lg shadow-2xl transition-transform duration-200 ${
                        isZoomed
                          ? 'scale-150 cursor-zoom-out max-w-[90vw] max-h-[75vh] object-contain'
                          : 'cursor-zoom-in max-w-[90vw] max-h-[75vh] object-contain'
                      }`}
                    />
                  )}
                </div>

                {mediaItems.length > 1 && (
                  <button
                    type="button"
                    onClick={handleNextMedia}
                    aria-label="Next item"
                    title="Next (Right Arrow)"
                    className="fixed sm:absolute right-2 sm:right-5 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-neutral-900/90 hover:bg-white text-white hover:text-neutral-950 border border-white/25 flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-2xl transition-all cursor-pointer z-20"
                  >
                    ›
                  </button>
                )}
              </div>

              {/* Bottom Thumbnail Filmstrip & Keyboard Hint */}
              <div
                className="bg-neutral-950/95 border-t border-neutral-800 px-4 py-3 flex flex-col items-center gap-2 shrink-0"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center gap-2 overflow-x-auto max-w-full pb-1">
                  {mediaItems.map((p, idx) => {
                    const isSelected = idx === safeMediaIndex;
                    return (
                      <button
                        key={p.id || idx}
                        type="button"
                        onClick={() => goToMedia(idx)}
                        className={`flex-shrink-0 w-20 h-14 rounded-lg border relative overflow-hidden bg-neutral-900 cursor-pointer transition-all ${
                          isSelected
                            ? 'border-white ring-2 ring-white scale-105 opacity-100'
                            : 'border-neutral-800 opacity-50 hover:opacity-90'
                        }`}
                      >
                        <img
                          src={p.thumbUrl || p.url}
                          alt={p.label || `Media ${idx + 1}`}
                          className="w-full h-full object-cover"
                        />
                        {p.isVideo && (
                          <span className="absolute inset-0 bg-black/45 flex items-center justify-center text-white text-xs font-bold">
                            ▶
                          </span>
                        )}
                        <span className="absolute bottom-0.5 right-1 px-1 rounded bg-black/80 text-[9px] font-mono text-white">
                          {idx + 1}
                        </span>
                      </button>
                    );
                  })}
                </div>
                <div className="text-[11px] text-neutral-400 flex items-center gap-4">
                  <span>Use <strong className="text-neutral-200">← / → Arrow Keys</strong>, click <strong className="text-neutral-200">‹ / ›</strong>, or swipe to toggle photos</span>
                  <span className="hidden sm:inline">•</span>
                  <span className="hidden sm:inline">Press <strong className="text-neutral-200">Esc</strong> to close</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-neutral-950 text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
              <h2 className="text-xl font-bold">Submission Confirmed</h2>
              <p className="text-xs text-neutral-400 max-w-md">Your inquiry has been received by our appraisal desk. If you need to make changes or submit another unit, click below.</p>
              <button 
                onClick={() => {
                  try { localStorage.removeItem('sell2sr1_inquiries_v2'); } catch(e){}
                  window.location.reload();
                }} 
                className="px-5 py-2.5 bg-neutral-100 text-neutral-950 font-bold rounded-xl text-xs hover:bg-white transition-all shadow-md"
              >
                Return to Home
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

      // 3c. Check non-spec lines where OCR split a 17-char VIN across exactly 2 alphanumeric chunks (e.g. "5NHUPAZ29 GW059298" or "IMDAHAR10DAS 12575")
      // Never glue 3+ short crack/noise tokens together on an unlabeled line
      const twoChunkRe = /\b([A-Z0-9]{5,12})[\s\-]+([A-Z0-9]{5,12})\b/g;
      let tc;
      while ((tc = twoChunkRe.exec(upper)) !== null) {
        const joined = tc[1] + tc[2];
        if (joined.length === 17 && hasCredibleRawVinDigits(joined, false)) {
          const norm = posNormalizeVin17(joined);
          if (isValidNorthAmericanVin(norm)) return norm;
          const repaired = tryRepairSingleOcrSlipVin(joined, false);
          if (repaired) return repaired;
        }
      }

      // 5. Shipping Container ISO 6346 Box ID (e.g. MSCU 123456 7)
      const containerMatch = upper.match(/\b([A-Z]{3}[UJZ])\s*[- ]?\s*(\d{6})\s*[- ]?\s*(\d)\b/);
      if (containerMatch) {
        return `${containerMatch[1]}${containerMatch[2]}${containerMatch[3]}`;
      }

      // 6. Boat / PWC 12-char USCG Hull Identification Number (HIN)
      if (categoryKey === 'boat_pwc' || /\b(H\.?I\.?N\.?|HULL)\b/.test(upper)) {
        const hinMatch = upper.match(/\b(?:US\s*[- ]?\s*)?([A-Z]{3}[A-HJ-NPR-Z0-9]{5}[A-L]\d{3})\b/);
        if (hinMatch) return hinMatch[1];
      }

      // 7. Explicitly labeled Serial Number on Tractor / Equipment / Trailer plates
      const serialRegex = /(?:SERIAL\s*(?:NO\.?|NUMBER|#)|S\/N)\s*[:#.\-]?\s*([A-Z0-9][A-Z0-9\-]{5,17})/g;
      while ((m = serialRegex.exec(upper)) !== null) {
        const candidate = m[1].replace(/^-+|-+$/g, '');
        const cleanAlnum = candidate.replace(/[^A-Z0-9]/g, '');
        const digits = (cleanAlnum.match(/\d/g) || []).length;
        if (
          cleanAlnum.length >= 6 &&
          cleanAlnum.length <= 17 &&
          digits >= 3 &&
          !/^(207|603|800|888)\d{7}$/.test(cleanAlnum)
        ) {
          return candidate;
        }
      }

      return '';
    };

    // Detect whether a File/Blob is an Apple HEIC/HEIF image (by extension, MIME, or ISO base media magic bytes)
    const isHeicOrHeifFile = async (file) => {
      if (!file) return false;
      const name = String(file.name || '').toLowerCase();
      const type = String(file.type || '').toLowerCase();
      if (name.endsWith('.heic') || name.endsWith('.heif') || type.includes('heic') || type.includes('heif')) {
        return true;
      }
      try {
        const headerBuf = await file.slice(0, 16).arrayBuffer();
        const bytes = new Uint8Array(headerBuf);
        if (bytes.length >= 12) {
          const ascii = String.fromCharCode(...bytes);
          if (ascii.includes('ftyp') && /(heic|heix|hevc|heim|heis|hevm|hevs|mif1|msf1)/i.test(ascii)) {
            return true;
          }
        }
      } catch (e) {}
      return false;
    };

    // Convert HEIC/HEIF File/Blob to a universally decodable JPEG File/Blob (works in Chrome, Edge, Firefox & Safari)
    const ensureDecodableImageBlob = (file) => {
      if (!file) return Promise.resolve(file);
      if (file._decodedBlobPromise) return file._decodedBlobPromise;

      file._decodedBlobPromise = (async () => {
        const isHeic = await isHeicOrHeifFile(file);
        if (!isHeic) return file;

        const baseName = String(file.name || 'photo').replace(/\.(heic|heif)$/i, '') + '.jpg';
        const wrapAsFile = (blob) => {
          if (!blob) return null;
          try {
            return new File([blob], baseName, { type: 'image/jpeg', lastModified: Date.now() });
          } catch (e) {
            return blob;
          }
        };

        // 1. If running on local preview server, try fast native macOS sips conversion endpoint first (<100ms)
        if (
          typeof window !== 'undefined' &&
          (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ) {
          try {
            const resp = await fetch('/api/convert-heic', {
              method: 'POST',
              headers: { 'Content-Type': 'application/octet-stream' },
              body: file
            });
            if (resp.ok && (resp.headers.get('content-type') || '').includes('image/jpeg')) {
              const jpegBlob = await resp.blob();
              if (jpegBlob && jpegBlob.size > 1000) {
                return wrapAsFile(jpegBlob);
              }
            }
          } catch (localErr) {
            // Fall through to in-browser WASM HEIC decoders
          }
        }

        // 2. Modern heic-to (libheif 1.18+ WASM — supports iPhone 15/16/17 Pro Max grid HEICs)
        try {
          for (let tries = 0; tries < 12 && !window.HeicTo && !window.heicTo; tries++) {
            await new Promise((r) => setTimeout(r, 150));
          }
          let heicToFn =
            typeof window.HeicTo === 'function'
              ? window.HeicTo
              : typeof window.HeicTo?.heicTo === 'function'
              ? window.HeicTo.heicTo
              : typeof window.heicTo === 'function'
              ? window.heicTo
              : null;

          if (!heicToFn) {
            try {
              const mod = await import('https://cdn.jsdelivr.net/npm/heic-to@1/+esm');
              heicToFn = mod?.heicTo || mod?.default?.heicTo || (typeof mod?.default === 'function' ? mod.default : null);
            } catch (esmErr) {}
          }

          if (heicToFn) {
            const converted = await heicToFn({
              blob: file,
              type: 'image/jpeg',
              quality: 0.92
            });
            const outBlob = Array.isArray(converted) ? converted[0] : converted;
            if (outBlob && outBlob.size > 1000) {
              return wrapAsFile(outBlob);
            }
          }
        } catch (heicToErr) {
          console.warn('heic-to conversion notice, trying fallback:', heicToErr);
        }

        // 3. Fallback to heic2any if available
        try {
          if (typeof window.heic2any === 'function') {
            const converted = await window.heic2any({
              blob: file,
              toType: 'image/jpeg',
              quality: 0.9
            });
            const outBlob = Array.isArray(converted) ? converted[0] : converted;
            if (outBlob && outBlob.size > 1000) {
              return wrapAsFile(outBlob);
            }
          }
        } catch (heic2anyErr) {
          console.warn('heic2any fallback notice:', heic2anyErr);
        }

        // 4. Safari native HEIC decode fallback (ensure explicit image/heic MIME type)
        try {
          return new Blob([file], { type: 'image/heic' });
        } catch (e) {
          return file;
        }
      })();

      return file._decodedBlobPromise;
    };

    // Multi-worker Tesseract.js pool (up to 2 parallel WASM workers) + priority queue so likely VIN tags scan first
    // and non-VIN photos skip in ~150-250ms (or abort in 0ms as soon as any photo finds a VIN)
    const MAX_OCR_WORKERS = 2;
    const ocrWorkerSlots = [];
    const ocrPriorityQueue = [];
    let ocrSeqCounter = 0;

    const createSingleTesseractWorker = async () => {
      if (typeof window === 'undefined') return null;
      for (let tries = 0; tries < 25 && !window.Tesseract; tries++) {
        await new Promise((r) => setTimeout(r, 200));
      }
      if (!window.Tesseract) return null;
      try {
        return await window.Tesseract.createWorker('eng');
      } catch (err) {
        console.warn('Tesseract worker init error:', err);
        return null;
      }
    };

    const pumpOcrQueue = () => {
      // Immediately flush any queued tasks whose batch already found a VIN (0ms abort)
      for (let i = ocrPriorityQueue.length - 1; i >= 0; i--) {
        const item = ocrPriorityQueue[i];
        if (typeof item.shouldAbortScan === 'function' && item.shouldAbortScan()) {
          ocrPriorityQueue.splice(i, 1);
          item.resolve({ vin: '', unreadableVinTag: false });
        }
      }
      if (ocrPriorityQueue.length === 0) return;

      // Find an idle initialized worker
      let freeSlot = ocrWorkerSlots.find((s) => !s.busy && s.worker);
      if (freeSlot) {
        const nextTask = ocrPriorityQueue.shift();
        if (!nextTask) return;
        if (typeof nextTask.shouldAbortScan === 'function' && nextTask.shouldAbortScan()) {
          nextTask.resolve({ vin: '', unreadableVinTag: false });
          pumpOcrQueue();
          return;
        }
        freeSlot.busy = true;
        Promise.resolve()
          .then(() => nextTask.runFn(freeSlot.worker))
          .then(
            (res) => nextTask.resolve(res),
            () => nextTask.resolve({ vin: '', unreadableVinTag: false })
          )
          .finally(() => {
            freeSlot.busy = false;
            pumpOcrQueue();
          });
        // If more tasks are still waiting and we have room for a 2nd worker, spin it up too
        if (ocrPriorityQueue.length > 0 && ocrWorkerSlots.length < MAX_OCR_WORKERS) {
          ensureOcrWorkerCapacity();
        }
        return;
      }

      // Spin up a worker slot if pool has capacity
      if (ocrWorkerSlots.length < MAX_OCR_WORKERS) {
        ensureOcrWorkerCapacity();
      }
    };

    const ensureOcrWorkerCapacity = () => {
      if (ocrWorkerSlots.length >= MAX_OCR_WORKERS) return;
      const slot = { worker: null, busy: true, initPromise: null };
      ocrWorkerSlots.push(slot);
      slot.initPromise = createSingleTesseractWorker().then((w) => {
        if (!w) {
          const idx = ocrWorkerSlots.indexOf(slot);
          if (idx !== -1) ocrWorkerSlots.splice(idx, 1);
          // Resolve remaining queue safely if Tesseract couldn't load at all
          if (ocrWorkerSlots.length === 0) {
            while (ocrPriorityQueue.length > 0) {
              const t = ocrPriorityQueue.shift();
              t.resolve({ vin: '', unreadableVinTag: Boolean(t.fallbackUnreadable) });
            }
          }
          return null;
        }
        slot.worker = w;
        slot.busy = false;
        pumpOcrQueue();
        return w;
      });
    };

    const enqueuePrioritizedOcrTask = (priority, shouldAbortScan, fallbackUnreadable, runFn) => {
      if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
        return Promise.resolve({ vin: '', unreadableVinTag: false });
      }
      return new Promise((resolve) => {
        const entry = {
          priority: Number(priority) || 0,
          seq: ++ocrSeqCounter,
          shouldAbortScan,
          fallbackUnreadable: Boolean(fallbackUnreadable),
          runFn,
          resolve
        };
        // Insert ordered by highest priority first (ties broken FIFO)
        let inserted = false;
        for (let i = 0; i < ocrPriorityQueue.length; i++) {
          if (entry.priority > ocrPriorityQueue[i].priority) {
            ocrPriorityQueue.splice(i, 0, entry);
            inserted = true;
            break;
          }
        }
        if (!inserted) ocrPriorityQueue.push(entry);
        pumpOcrQueue();
      });
    };

    // Limit concurrent full-image decodes during large multi-photo drops so mobile RAM stays smooth
    const MAX_CONCURRENT_SCAN_DECODES = 3;
    let activeScanDecodes = 0;
    const pendingScanDecodeQueue = [];
    const withScanDecodeSlot = (fn) =>
      new Promise((resolve, reject) => {
        const start = () => {
          activeScanDecodes++;
          Promise.resolve()
            .then(fn)
            .then(resolve, reject)
            .finally(() => {
              activeScanDecodes = Math.max(0, activeScanDecodes - 1);
              if (pendingScanDecodeQueue.length > 0) {
                const next = pendingScanDecodeQueue.shift();
                next();
              }
            });
        };
        if (activeScanDecodes < MAX_CONCURRENT_SCAN_DECODES) {
          start();
        } else {
          pendingScanDecodeQueue.push(start);
        }
      });

    // Pre-warm primary Tesseract worker in background after initial page render
    if (typeof window !== 'undefined') {
      setTimeout(() => {
        if (window.Tesseract && ocrWorkerSlots.length === 0) ensureOcrWorkerCapacity();
      }, 1000);
    }

    // Fast natural-scale canvas builder for Step 1 Gate (downscales huge camera photos to ~1000px while upscaling small cropped photos so text stays crisp)
    const createQuickGateCanvasFromImage = (img, rx, ry, rw, rh, maxLongSide = 1000) => {
      const natW = img.naturalWidth || img.width || 1200;
      const natH = img.naturalHeight || img.height || 900;
      const sx = Math.max(0, Math.round(natW * rx));
      const sy = Math.max(0, Math.round(natH * ry));
      const sw = Math.max(1, Math.min(natW - sx, Math.round(natW * rw)));
      const sh = Math.max(1, Math.min(natH - sy, Math.round(natH * rh)));

      const longSide = Math.max(sw, sh);
      const shortSide = Math.min(sw, sh);
      let scale = 1;
      if (longSide > maxLongSide) {
        scale = maxLongSide / longSide;
      } else if ((longSide < 950 || shortSide < 280) && longSide > 80) {
        scale = Math.min(2.2, Math.max(1050 / longSide, 300 / Math.max(1, shortSide)));
      }

      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(sw * scale));
      canvas.height = Math.max(1, Math.round(sh * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas;
    };

    // Pure-JS <3ms visual analyzer: scores how strongly a photo resembles a compliance sticker / VIN plate
    // and immediately flags blank/blurry/smooth non-text photos so they skip WASM OCR in <5ms
    const analyzeVisualVinTagSignal = (sourceCanvas) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) {
        return { hasPlausibleText: false, looksLikeCloseUpLabel: false, priorityScore: 0 };
      }
      const sw = sourceCanvas.width;
      const sh = sourceCanvas.height;
      const maxSide = 480;
      const scale = Math.min(1, maxSide / Math.max(sw, sh));
      const tw = Math.max(32, Math.round(sw * scale));
      const th = Math.max(32, Math.round(sh * scale));

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, sw, sh).data;
      } catch (e) {
        return { hasPlausibleText: true, looksLikeCloseUpLabel: false, priorityScore: 20 };
      }

      const gray = new Uint8Array(tw * th);
      for (let ty = 0; ty < th; ty++) {
        const iy = Math.min(sh - 1, (ty / scale) | 0);
        const srcRow = iy * sw;
        const dstRow = ty * tw;
        for (let tx = 0; tx < tw; tx++) {
          const ix = Math.min(sw - 1, (tx / scale) | 0);
          const p = (srcRow + ix) << 2;
          gray[dstRow + tx] = (srcData[p] * 77 + srcData[p + 1] * 150 + srcData[p + 2] * 29) >> 8;
        }
      }

      const cell = 16;
      const cw = Math.max(1, (tw / cell) | 0);
      const ch = Math.max(1, (th / cell) | 0);
      const grid = new Uint8Array(cw * ch);
      let textCells = 0;
      let barcodeCells = 0;
      let maxRowRun = 0;
      let maxColRun = 0;

      for (let cy = 0; cy < ch; cy++) {
        let run = 0;
        const y0 = cy * cell;
        for (let cx = 0; cx < cw; cx++) {
          const x0 = cx * cell;
          let lo = 255;
          let hi = 0;
          let htrans = 0;
          let vtrans = 0;
          for (let y = y0 + 2; y < y0 + cell; y += 2) {
            const ro = y * tw;
            let prevH = gray[ro + x0];
            for (let x = x0 + 2; x < x0 + cell; x += 2) {
              const g = gray[ro + x];
              if (g < lo) lo = g;
              if (g > hi) hi = g;
              if (Math.abs(g - prevH) >= 28) htrans++;
              prevH = g;
              if (Math.abs(g - gray[(y - 2) * tw + x]) >= 28) vtrans++;
            }
          }
          const contrast = hi - lo;
          if (contrast >= 34 && (htrans >= 5 || vtrans >= 5)) {
            textCells++;
            grid[cy * cw + cx] = 1;
            run++;
            if (run > maxRowRun) maxRowRun = run;
            if (contrast >= 40 && htrans >= 14 && htrans > vtrans * 1.8) {
              barcodeCells++;
            }
          } else {
            run = 0;
          }
        }
      }

      for (let cx = 0; cx < cw; cx++) {
        let run = 0;
        for (let cy = 0; cy < ch; cy++) {
          if (grid[cy * cw + cx]) {
            run++;
            if (run > maxColRun) maxColRun = run;
          } else {
            run = 0;
          }
        }
      }

      // Measure peak local label density in any 8x5 (or 5x8) cell window so small close-up plates also score high
      let peakWindowCells = 0;
      const winW = Math.min(cw, 8);
      const winH = Math.min(ch, 5);
      for (let wy = 0; wy <= ch - winH; wy += 2) {
        for (let wx = 0; wx <= cw - winW; wx += 2) {
          let sum = 0;
          for (let dy = 0; dy < winH; dy++) {
            const ro = (wy + dy) * cw + wx;
            for (let dx = 0; dx < winW; dx++) sum += grid[ro + dx];
          }
          if (sum > peakWindowCells) peakWindowCells = sum;
        }
      }

      const totalCells = Math.max(1, cw * ch);
      const pct = (textCells * 100) / totalCells;
      const maxRun = Math.max(maxRowRun, maxColRun);
      const hasPlausibleText = textCells >= 6 && maxRun >= 2;
      const looksLikeCloseUpLabel = pct >= 28 || peakWindowCells >= 24 || barcodeCells >= 3;
      const priorityScore = hasPlausibleText
        ? Math.min(99, Math.round(pct * 0.85 + peakWindowCells * 1.15 + Math.min(28, barcodeCells * 4)))
        : 0;

      return { hasPlausibleText, looksLikeCloseUpLabel, priorityScore };
    };

    const createCroppedCanvasFromImage = (img, rx, ry, rw, rh, maxWidth = 1800, enhanceContrast = false) => {
      const natW = img.naturalWidth || img.width || 1200;
      const natH = img.naturalHeight || img.height || 900;
      const sx = Math.max(0, Math.round(natW * rx));
      const sy = Math.max(0, Math.round(natH * ry));
      const sw = Math.max(1, Math.min(natW - sx, Math.round(natW * rw)));
      const sh = Math.max(1, Math.min(natH - sy, Math.round(natH * rh)));

      let dw = sw;
      let dh = sh;
      if (dw > maxWidth) {
        dh = Math.max(1, Math.round((dh * maxWidth) / dw));
        dw = maxWidth;
      } else if ((Math.max(dw, dh) < 1200 || Math.min(dw, dh) < 300) && Math.max(sw, sh) > 120) {
        // Upscale small or short banner/vertical crops for sharper OCR recognition
        const scale = Math.min(2.4, Math.max(1250 / Math.max(1, Math.max(dw, dh)), 320 / Math.max(1, Math.min(dw, dh))));
        dw = Math.round(dw * scale);
        dh = Math.round(dh * scale);
      }

      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, dw);
      canvas.height = Math.max(1, dh);
      const ctx = canvas.getContext('2d');
      if (enhanceContrast) {
        try {
          ctx.filter = 'grayscale(100%) contrast(135%)';
        } catch (e) {}
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas;
    };

    // Isolates true black printed ink while erasing medium-gray scrapes, mildew, smudges, and optional thin horizontal lines
    const createInkIsolatedCanvas = (sourceCanvas, thresholdRatio = 0.42, removeThinHorizontalLines = false) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) return sourceCanvas;
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = w;
      outCanvas.height = h;
      const outCtx = outCanvas.getContext('2d');

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, w, h);
      } catch (e) {
        return sourceCanvas;
      }

      const data = srcData.data;
      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
        gray[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
      }

      // Compute 85th-percentile local background luminance in 128x128 blocks (clamped >= 125 so mildew patches don't lower bg)
      const blockSize = 128;
      const bw = Math.ceil(w / blockSize);
      const bh = Math.ceil(h / blockSize);
      const bgGrid = new Uint8Array(bw * bh);
      const hist = new Int32Array(256);

      for (let by = 0; by < bh; by++) {
        const y0 = by * blockSize;
        const y1 = Math.min(h, y0 + blockSize);
        for (let bx = 0; bx < bw; bx++) {
          const x0 = bx * blockSize;
          const x1 = Math.min(w, x0 + blockSize);
          hist.fill(0);
          let count = 0;
          for (let y = y0; y < y1; y += 2) {
            const rowOff = y * w;
            for (let x = x0; x < x1; x += 2) {
              hist[gray[rowOff + x]]++;
              count++;
            }
          }
          const target = Math.floor(count * 0.85);
          let acc = 0;
          let p85 = 200;
          for (let v = 0; v < 256; v++) {
            acc += hist[v];
            if (acc >= target) {
              p85 = Math.max(125, v);
              break;
            }
          }
          bgGrid[by * bw + bx] = p85;
        }
      }

      // Threshold at true ink (lum < localBg * thresholdRatio), turning medium-gray scrapes & mildew (85..150) into pure white
      const mask = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        const by = Math.min(bh - 1, (y / blockSize) | 0);
        const rowOff = y * w;
        for (let x = 0; x < w; x++) {
          const bx = Math.min(bw - 1, (x / blockSize) | 0);
          const bg = bgGrid[by * bw + bx];
          if (gray[rowOff + x] < bg * thresholdRatio) {
            mask[rowOff + x] = 1;
          }
        }
      }

      // Optional: erase 1-2px thin horizontal laminate tear lines where vertical black run in [y-4..y+4] is <= 2px
      const outData = outCtx.createImageData(w, h);
      const outPixels = outData.data;
      for (let y = 0; y < h; y++) {
        const rowOff = y * w;
        const yMin = Math.max(0, y - 4);
        const yMax = Math.min(h - 1, y + 4);
        for (let x = 0; x < w; x++) {
          let isInk = mask[rowOff + x] === 1;
          if (isInk && removeThinHorizontalLines) {
            let vCount = 0;
            for (let yy = yMin; yy <= yMax; yy++) {
              vCount += mask[yy * w + x];
            }
            if (vCount <= 2) {
              isInk = false;
            }
          }
          const val = isInk ? 0 : 255;
          const p = (rowOff + x) << 2;
          outPixels[p] = val;
          outPixels[p + 1] = val;
          outPixels[p + 2] = val;
          outPixels[p + 3] = 255;
        }
      }

      outCtx.putImageData(outData, 0, 0);
      return outCanvas;
    };

    // Local 32x32 tile adaptive contrast normalization (CLAHE-like) that restores faded/rubbed-off thermal print
    // on metallic silver stickers (e.g. IMG_2044) and sharpens low-contrast Code 39 barcodes
    const createLocalContrastCanvas = (sourceCanvas) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) return sourceCanvas;
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = w;
      outCanvas.height = h;
      const outCtx = outCanvas.getContext('2d');

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, w, h);
      } catch (e) {
        return sourceCanvas;
      }

      const data = srcData.data;
      const gray = new Uint8Array(w * h);
      const globalHist = new Int32Array(256);
      for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
        const g = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
        gray[i] = g;
        globalHist[g]++;
      }
      let gAcc = 0;
      let globalInk = 50;
      const gTarget = Math.floor(gray.length * 0.05);
      for (let v = 0; v < 256; v++) {
        gAcc += globalHist[v];
        if (gAcc >= gTarget) {
          globalInk = v;
          break;
        }
      }

      const tile = 32;
      const gw = Math.ceil(w / tile) + 1;
      const gh = Math.ceil(h / tile) + 1;
      const pLow = new Uint8Array(gw * gh);
      const pHigh = new Uint8Array(gw * gh);
      const hist = new Int32Array(256);

      for (let ty = 0; ty < gh; ty++) {
        const y0 = Math.max(0, Math.min(h - tile, ty * tile - (tile >> 1)));
        const y1 = Math.min(h, y0 + tile);
        for (let tx = 0; tx < gw; tx++) {
          const x0 = Math.max(0, Math.min(w - tile, tx * tile - (tile >> 1)));
          const x1 = Math.min(w, x0 + tile);
          hist.fill(0);
          let cnt = 0;
          for (let y = y0; y < y1; y += 2) {
            const ro = y * w;
            for (let x = x0; x < x1; x += 2) {
              hist[gray[ro + x]]++;
              cnt++;
            }
          }
          const tLo = Math.floor(cnt * 0.08);
          const tHi = Math.floor(cnt * 0.85);
          let acc = 0;
          let lo = 0;
          let hi = 255;
          let gotLo = false;
          for (let v = 0; v < 256; v++) {
            acc += hist[v];
            if (!gotLo && acc >= tLo) {
              lo = v;
              gotLo = true;
            }
            if (acc >= tHi) {
              hi = v;
              break;
            }
          }
          if (hi - lo < 16) lo = Math.max(0, hi - 60);
          // When the sticker already has dark ink globally, prevent mildew-only tiles from stretching gray mildew (lum 90+) to black
          if (globalInk < 70) {
            lo = Math.min(lo, Math.max(globalInk + 35, 65));
          }
          pLow[ty * gw + tx] = lo;
          pHigh[ty * gw + tx] = hi;
        }
      }

      const outData = outCtx.createImageData(w, h);
      const outPixels = outData.data;
      for (let y = 0; y < h; y++) {
        const fy = y / tile;
        const ty0 = Math.min(gh - 2, fy | 0);
        const wy = fy - ty0;
        const ro = y * w;
        for (let x = 0; x < w; x++) {
          const fx = x / tile;
          const tx0 = Math.min(gw - 2, fx | 0);
          const wx = fx - tx0;
          const i00 = ty0 * gw + tx0;
          const lo =
            pLow[i00] * (1 - wx) * (1 - wy) +
            pLow[i00 + 1] * wx * (1 - wy) +
            pLow[i00 + gw] * (1 - wx) * wy +
            pLow[i00 + gw + 1] * wx * wy;
          const hi =
            pHigh[i00] * (1 - wx) * (1 - wy) +
            pHigh[i00 + 1] * wx * (1 - wy) +
            pHigh[i00 + gw] * (1 - wx) * wy +
            pHigh[i00 + gw + 1] * wx * wy;
          const norm = Math.max(0, Math.min(255, ((gray[ro + x] - lo) * 255) / Math.max(18, hi - lo)));
          const val = norm < 135 ? 0 : norm | 0;
          const p = (ro + x) << 2;
          outPixels[p] = val;
          outPixels[p + 1] = val;
          outPixels[p + 2] = val;
          outPixels[p + 3] = 255;
        }
      }

      outCtx.putImageData(outData, 0, 0);
      return outCanvas;
    };

    // Detects severely spiderweb-cracked / crazed sticker surfaces (e.g. 20261009_163835.jpg where >=78% of bright sticker tiles
    // have dense intersecting horizontal & vertical narrow crack valleys)
    const isSeverelyCrazedStickerCanvas = (sourceCanvas) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) return false;
      const sw = sourceCanvas.width;
      const sh = sourceCanvas.height;
      const targetW = 600;
      const scale = targetW / sw;
      const targetH = Math.max(48, Math.round(sh * scale));

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, sw, sh).data;
      } catch (e) {
        return false;
      }

      const gray = new Uint8Array(targetW * targetH);
      for (let ty = 0; ty < targetH; ty++) {
        const iy = Math.min(sh - 1, Math.floor(ty / scale));
        const srcRow = iy * sw;
        const dstRow = ty * targetW;
        for (let tx = 0; tx < targetW; tx++) {
          const ix = Math.min(sw - 1, Math.floor(tx / scale));
          const p = (srcRow + ix) << 2;
          gray[dstRow + tx] = (srcData[p] * 77 + srcData[p + 1] * 150 + srcData[p + 2] * 29) >> 8;
        }
      }

      const tile = 24;
      let crazedTiles = 0;
      let brightTiles = 0;
      for (let ty = 4; ty < targetH - tile - 4; ty += tile) {
        for (let tx = 4; tx < targetW - tile - 4; tx += tile) {
          let hc = 0;
          let vc = 0;
          let maxL = 0;
          for (let y = ty; y < ty + tile; y += 2) {
            const ro = y * targetW;
            for (let x = tx; x < tx + tile; x += 2) {
              const c = gray[ro + x];
              if (c > maxL) maxL = c;
              const lr = (gray[ro + x - 2] + gray[ro + x + 2]) >> 1;
              const tb = (gray[(y - 2) * targetW + x] + gray[(y + 2) * targetW + x]) >> 1;
              if (lr > 135 && lr - c > 22 && c > 60) hc++;
              if (tb > 135 && tb - c > 22 && c > 60) vc++;
            }
          }
          if (maxL > 150) {
            brightTiles++;
            if (hc >= 5 && vc >= 5) {
              crazedTiles++;
            }
          }
        }
      }

      if (brightTiles < 25) return false;
      return crazedTiles / brightTiles >= 0.78;
    };

    // Creates a rotated (90 deg CW or CCW) canvas from a vertical strip (for vertical backup VINs printed on trailer tags)
    const createRotatedCropCanvasFromImage = (img, rx, ry, rw, rh, clockwise = false, maxLongSide = 1600) => {
      const baseCrop = createCroppedCanvasFromImage(img, rx, ry, rw, rh, maxLongSide, false);
      const cw = baseCrop.width;
      const ch = baseCrop.height;
      const rotCanvas = document.createElement('canvas');
      rotCanvas.width = ch;
      rotCanvas.height = cw;
      const ctx = rotCanvas.getContext('2d');
      ctx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
      ctx.rotate((clockwise ? 90 : -90) * (Math.PI / 180));
      ctx.drawImage(baseCrop, -cw / 2, -ch / 2);
      return rotCanvas;
    };

    // Reads the HEIF 'irot' box (90° CCW steps: 1=90° CCW, 2=180°, 3=270° CCW / 90° CW) from the first 32 KB of a .heic file
    const readHeicIrotSteps = async (file) => {
      try {
        if (!file || typeof file.slice !== 'function') return 0;
        const isHeic = await isHeicOrHeifFile(file);
        if (!isHeic) return 0;
        const buf = await file.slice(0, 32768).arrayBuffer();
        const b = new Uint8Array(buf);
        for (let i = 0; i <= b.length - 9; i++) {
          if (
            b[i] === 0x00 &&
            b[i + 1] === 0x00 &&
            b[i + 2] === 0x00 &&
            b[i + 3] === 0x09 &&
            b[i + 4] === 0x69 && // 'i'
            b[i + 5] === 0x72 && // 'r'
            b[i + 6] === 0x6f && // 'o'
            b[i + 7] === 0x74    // 't'
          ) {
            return b[i + 8] & 0x03;
          }
        }
      } catch (e) {}
      return 0;
    };

    // Rotates a decoded HEIC image if the decoder (e.g. sips -s format jpeg or heic2any) stripped the HEIF irot orientation tag
    const normalizeHeicOrientationCanvas = (rawImg, irotSteps) => {
      const natW = rawImg.naturalWidth || rawImg.width || 1200;
      const natH = rawImg.naturalHeight || rawImg.height || 900;
      if ((irotSteps === 3 || irotSteps === 1) && natW > natH) {
        const scale = Math.min(1, 2600 / Math.max(natW, natH));
        const sw = Math.round(natW * scale);
        const sh = Math.round(natH * scale);
        const rotCanvas = document.createElement('canvas');
        rotCanvas.width = sh;
        rotCanvas.height = sw;
        const ctx = rotCanvas.getContext('2d');
        ctx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
        // irotSteps === 3 is 270° CCW = 90° CW; irotSteps === 1 is 90° CCW
        ctx.rotate((irotSteps === 3 ? 90 : -90) * (Math.PI / 180));
        ctx.drawImage(rawImg, 0, 0, natW, natH, -sw / 2, -sh / 2, sw, sh);
        return rotCanvas;
      }
      return rawImg;
    };

    // Fast pre-screening gate: ONLY decides if a photo shows ANY sign of a VIN, Serial, HIN, PIN, or compliance sticker
    // Avoids single exterior brand words ("TRAILERS", "TIRE", "MODEL") while keeping high sensitivity for any real tag
    const doesOcrTextLookLikeVinOrTag = (rawText) => {
      if (!rawText) return false;
      const upper = String(rawText)
        .replace(/(?<=[A-Za-z0-9])[l|!]|[l|!](?=[A-Za-z0-9])/g, '1')
        .toUpperCase();

      // 1A. Compliance sticker / VIN / Serial / HIN / PIN keywords (1 match promotes to full-accuracy Stage 2 scan)
      if (
        /(?:V\.?\s*[IJL1]\.?\s*N|N\.?\s*[IJL1]\.?\s*V|\bVJN\b|\bNJV\b|VEHICLE\s+ID|IDENTIFICATION|\bGVWR\b|\bGAWR\b|\bPNBV\b|\bPNBE\b|\bKPA\b|\bPSI\b|\bMFD\b|\bMFG\b|DATE\s+OF|MANUFACTUR|FABRIQUE|CONFORMS|MOTOR\s+VEHICLE|\bSERIAL\b|\bS\/N\b|\bP\.?\s*I\.?\s*N\.?\b|\bHULL\b|\bST2\d\d|FOREST\s+RIVER,?\s+INC|TRIPLE\s+CROWN|TIRE\s+AND\s+LOADING)/i.test(
          upper
        )
      ) {
        return true;
      }

      // 1B. Secondary spec terms: require at least 2 distinct compliance spec indicators together
      // so a single brand decal ("BIG TEX TRAILERS") never triggers a deep scan
      let secondarySpecHits = 0;
      const secondaryPatterns = [
        /\bLBS?\.?\b/i,
        /\b\d+\s*KG\b/i,
        /\bAXLE\b|\bESSIEU\b/i,
        /\bRIMS?\b|\bJANTE\b/i,
        /\bCOLD\b|\bFROID\b/i,
        /\bTRA\/REM\b|\bREMORQUE\b/i,
        /1[456]\s*[X"']/i
      ];
      for (let p = 0; p < secondaryPatterns.length; p++) {
        if (secondaryPatterns[p].test(upper)) {
          secondarySpecHits++;
          if (secondarySpecHits >= 2) return true;
        }
      }

      // Strip standard US/Canada phone numbers on dealer decals (e.g. "(207) 555-0199" or "18005551234") before alphanumeric run checks
      const strippedPhones = upper.replace(
        /(?:\b1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b|\b1?(?:800|888|877|866|855|844|833)\d{7}\b/g,
        ' '
      );

      // 2. Check for any standalone or contiguous VIN/Serial-like alphanumeric run (7+ chars with letters & digits, or 6+ contiguous digits)
      const runs = strippedPhones.match(/[A-Z0-9]{7,28}/g) || [];
      for (let i = 0; i < runs.length; i++) {
        const r = runs[i];
        const digits = (r.match(/\d/g) || []).length;
        const letters = (r.match(/[A-Z]/g) || []).length;
        if (letters === 0 && (r.length === 10 || (r.length === 11 && r[0] === '1'))) continue;
        if ((digits >= 2 && letters >= 1) || digits >= 6) {
          return true;
        }
      }

      // 3. Check if any single line has 11+ alphanumeric chars with both letters and digits when spaces/hyphens are removed
      const lines = strippedPhones.split(/\r?\n/);
      for (let l = 0; l < lines.length; l++) {
        const compact = lines[l].replace(/[^A-Z0-9]/g, '');
        if (compact.length >= 11 && compact.length <= 28) {
          const digits = (compact.match(/\d/g) || []).length;
          const letters = (compact.match(/[A-Z]/g) || []).length;
          if (digits >= 2 && letters >= 2) {
            return true;
          }
        }
      }

      return false;
    };

    // Positive confirmation that a photo actually shows a VIN / Serial / HIN / PIN / compliance tag
    // (excludes exterior model decals like "COUGAR 29RKS" or normal UI/English sentences with numbers)
    const doesTextConfirmActualVinTag = (rawText) => {
      if (!rawText) return false;
      const upper = String(rawText)
        .replace(/(?<=[A-Za-z0-9])[l|!]|[l|!](?=[A-Za-z0-9])/g, '1')
        .toUpperCase();

      if (
        /(?:\bV\.?\s*[IJL1]\.?\s*N\.?\b|\bN\.?\s*[IJL1]\.?\s*V\.?\b|\bVJN\b|\bNJV\b|VEHICLE\s+ID|IDENTIFICATION|FOREST\s+RIVER,?\s+INC|\bGVWR\b|\bGAWR\b|\bPNBV\b|\bPNBE\b|\bMFD\.?\s+BY\b|\bMFG\.?\s+BY\b|FABRIQUE|MANUFACTURED|CONFORMS\s+TO|MOTOR\s+VEHICLE|\bSERIAL\b|\bS\/N\b|\bP\.?\s*I\.?\s*N\.?\b|\bHULL\b|\bST[12]\d\d|\bKPA\b|\bPSI\b|TIRE\s+AND\s+LOADING)/i.test(
          upper
        )
      ) {
        return true;
      }

      let specHits = 0;
      const specPatterns = [
        /\b\d{3,5}\s*LBS?\.?\b/i,
        /\b\d{3,5}\s*KG\b/i,
        /\bAXLE\b|\bESSIEU\b/i,
        /\bRIMS?\b|\bJANTE\b/i,
        /\bTRA\/REM\b|\bREMORQUE\b/i
      ];
      for (let p = 0; p < specPatterns.length; p++) {
        if (specPatterns[p].test(upper)) {
          specHits++;
          if (specHits >= 2) return true;
        }
      }

      // Contiguous 15-17 char VIN-like token (not separate words with spaces) containing >= 5 digits
      const contiguousTokens = upper.match(/\b[A-HJ-NPR-Z0-9]{15,17}\b/g) || [];
      for (let t = 0; t < contiguousTokens.length; t++) {
        if ((contiguousTokens[t].match(/\d/g) || []).length >= 5) {
          return true;
        }
      }

      return false;
    };

    const loadImageCanvasesForScan = (file, shouldAbortScan = null) =>
      withScanDecodeSlot(async () => {
        if (!file) return null;
        if (typeof shouldAbortScan === 'function' && shouldAbortScan()) return null;
        const [decodableBlob, irotSteps] = await Promise.all([
          ensureDecodableImageBlob(file),
          readHeicIrotSteps(file)
        ]);
        if (!decodableBlob) return null;
        if (typeof shouldAbortScan === 'function' && shouldAbortScan()) return null;

        return new Promise((resolve) => {
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(decodableBlob);
          } catch (e) {
            return resolve(null);
          }

          const rawImg = new Image();
          let settled = false;
          const finish = (val) => {
            if (settled) return;
            settled = true;
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
            resolve(val);
          };

          const timer = setTimeout(() => finish(null), 10000);

          rawImg.onload = () => {
            clearTimeout(timer);
            if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
              return finish(null);
            }
            try {
              // Ensure upright orientation for portrait HEIC photos (e.g. 590211518R0030952.HEIC, 5JW1U1827T1494127.heic)
              const img = normalizeHeicOrientationCanvas(rawImg, irotSteps);
              const natW = img.naturalWidth || img.width || 1200;
              const natH = img.naturalHeight || img.height || 900;
              const isWideBanner = natW / Math.max(1, natH) >= 2.2;
              const isPortrait = natW < natH * 0.95;

              // STEP 1 FAST IDENTIFICATION GATE CANVASES:
              // Used ONLY to quickly determine whether this photo contains a VIN/tag or is a normal non-VIN unit photo.
              const quickScreenCanvas = createQuickGateCanvasFromImage(img, 0, 0, 1, 1, 1050);
              const visualSignal = analyzeVisualVinTagSignal(quickScreenCanvas);
              const gateCrazedProbeCanvas = createQuickGateCanvasFromImage(img, 0.06, 0.34, 0.58, 0.32, 600);
              const quickIsCrazed = isSeverelyCrazedStickerCanvas(gateCrazedProbeCanvas);
              const gateBandCanvas = createQuickGateCanvasFromImage(img, 0.05, 0.30, 0.90, 0.44, 1400);
              // On portrait photos (like 1XNBU0816N2024607.jpg), also check a clean 90°-CW rotated tongue-tag strip if upright screening sees no tag
              const quickVerticalCWCanvas = (isPortrait && !irotSteps)
                ? createRotatedCropCanvasFromImage(img, 0.22, 0.16, 0.35, 0.80, true, 1250)
                : null;

              const fastGateOcrCanvases = quickVerticalCWCanvas
                ? [quickScreenCanvas, quickVerticalCWCanvas]
                : [quickScreenCanvas];

              let cachedFullAccuracySuite = null;
              const getFullAccuracySuite = () => {
                if (cachedFullAccuracySuite) return cachedFullAccuracySuite;

                // STEP 2 FULL-ACCURACY SUITE:
                // Built as soon as Step 1 identifies that this photo has a VIN / Serial / Compliance Tag.
                // Runs highest-DPI zoomed sticker crops FIRST so full-frame downscales never preempt crisp VIN band reads.
                const gateFullCanvas = createCroppedCanvasFromImage(img, 0, 0, 1, 1, 1350, false);
                const vinBandCanvas = createCroppedCanvasFromImage(img, 0.06, 0.34, 0.88, 0.36, 1800, false);
                const vinLeftTextCanvas = createCroppedCanvasFromImage(img, 0.06, 0.34, 0.58, 0.32, 1600, false);
                const isCrazedSticker = isSeverelyCrazedStickerCanvas(vinLeftTextCanvas);
                const inkIsolatedLeftLineErased = createInkIsolatedCanvas(vinLeftTextCanvas, 0.42, true);
                const verticalStickerZoomCW = (isPortrait && !irotSteps)
                  ? createRotatedCropCanvasFromImage(img, 0.34, 0.14, 0.32, 0.82, true, 1600)
                  : null;

                const fullCanvas = createCroppedCanvasFromImage(img, 0, 0, 1, 1, 2000, false);
                const strictInkFullCanvas = createInkIsolatedCanvas(fullCanvas, 0.28, false);
                const inkIsolatedFullCanvas = createInkIsolatedCanvas(fullCanvas, 0.42, false);
                const vinTopBannerCanvas = createCroppedCanvasFromImage(img, 0.02, 0.05, 0.96, 0.68, 1800, false);
                const strictInkTopBannerCanvas = createInkIsolatedCanvas(vinTopBannerCanvas, 0.28, false);
                // Dual-placard wide banners (e.g. 1MDAHAR10DA512875 ShoreLand'r tire placard + silver compliance tag + vertical divider VIN)
                const wideComplianceZoomCanvas = isWideBanner
                  ? createCroppedCanvasFromImage(img, 0.31, 0.34, 0.52, 0.38, 1800, false)
                  : null;
                const wideVerticalDividerCCW = isWideBanner
                  ? createRotatedCropCanvasFromImage(img, 0.27, 0.20, 0.08, 0.52, false, 1600)
                  : null;

                const stickerCenterCanvas = createCroppedCanvasFromImage(img, 0.06, 0.14, 0.88, 0.72, 1800, false);
                // Bottom compliance band crop captures VINs printed near the bottom of stickers (e.g. 2NEB212B5PN037870, 5JW1U1827T1494127, IMG_1689)
                const vinBottomBandCanvas = createCroppedCanvasFromImage(img, 0.06, 0.54, 0.84, 0.36, 1800, false);
                const inkIsolatedBottomBandCanvas = createInkIsolatedCanvas(vinBottomBandCanvas, 0.42, false);

                const inkIsolatedLeftCanvas = createInkIsolatedCanvas(vinLeftTextCanvas, 0.42, false);
                const inkIsolatedCenterCanvas = createInkIsolatedCanvas(stickerCenterCanvas, 0.42, false);
                const inkIsolatedBandCanvas = createInkIsolatedCanvas(vinBandCanvas, 0.42, true);
                // Local contrast-normalized crops restore faded thermal print on metallic tags (IMG_2044) & boost barcodes
                const localContrastLeftCanvas = createLocalContrastCanvas(vinLeftTextCanvas);
                const localContrastBandCanvas = createLocalContrastCanvas(vinBandCanvas);
                // Right/middle and left/middle native-res barcode crops cover both right-side (IMG_2270, 5JW) and left-side (IMG_4623, IMG_2044) barcodes
                const barcodeRightZoomCanvas = createCroppedCanvasFromImage(img, 0.42, 0.32, 0.54, 0.40, 1800, false);
                const barcodeLeftZoomCanvas = createCroppedCanvasFromImage(img, 0.06, 0.36, 0.56, 0.30, 1800, false);
                const barcodeLeftContrastCanvas = createLocalContrastCanvas(barcodeLeftZoomCanvas);
                // Vertical sticker / vertical backup VIN crops rotated 90° CW and 90° CCW (handles 1XNBU0816N2024607 & 2NEB212B5PN037870)
                // verticalStickerOnlyCW & verticalTightVinLineCW isolate the tongue tag itself without adjacent diagonal deck planks
                const verticalStickerOnlyCW = createRotatedCropCanvasFromImage(img, 0.23, 0.18, 0.31, 0.80, true, 1800);
                const verticalTightVinLineCW = createRotatedCropCanvasFromImage(img, 0.43, 0.18, 0.12, 0.78, true, 1800);
                const deepVerticalZoomCW = verticalStickerZoomCW || createRotatedCropCanvasFromImage(img, 0.34, 0.14, 0.32, 0.82, true, 1600);
                const verticalStickerFullCW = createRotatedCropCanvasFromImage(img, 0.20, 0.04, 0.52, 0.92, true, 1600);
                const verticalStickerFullCCW = createRotatedCropCanvasFromImage(img, 0.20, 0.04, 0.52, 0.92, false, 1600);

                const deepCrops = isCrazedSticker
                  ? [
                      vinLeftTextCanvas,
                      stickerCenterCanvas,
                      fullCanvas
                    ]
                  : isWideBanner
                  ? [
                      wideComplianceZoomCanvas,
                      vinLeftTextCanvas,
                      wideVerticalDividerCCW,
                      vinBandCanvas,
                      fullCanvas,
                      vinTopBannerCanvas,
                      strictInkFullCanvas,
                      strictInkTopBannerCanvas,
                      inkIsolatedFullCanvas,
                      gateFullCanvas
                    ]
                  : isPortrait && !irotSteps
                  ? [
                      verticalStickerOnlyCW,
                      verticalTightVinLineCW,
                      deepVerticalZoomCW,
                      verticalStickerFullCW,
                      verticalStickerFullCCW,
                      inkIsolatedLeftLineErased,
                      vinLeftTextCanvas,
                      vinBottomBandCanvas,
                      inkIsolatedBottomBandCanvas,
                      inkIsolatedCenterCanvas,
                      stickerCenterCanvas,
                      fullCanvas,
                      gateFullCanvas
                    ]
                  : [
                      inkIsolatedLeftLineErased,
                      vinLeftTextCanvas,
                      vinBottomBandCanvas,
                      inkIsolatedBottomBandCanvas,
                      verticalStickerFullCW,
                      verticalStickerFullCCW,
                      deepVerticalZoomCW,
                      inkIsolatedCenterCanvas,
                      localContrastLeftCanvas,
                      vinBandCanvas,
                      inkIsolatedBandCanvas,
                      localContrastBandCanvas,
                      stickerCenterCanvas,
                      inkIsolatedLeftCanvas,
                      fullCanvas,
                      gateFullCanvas
                    ];

                cachedFullAccuracySuite = {
                  isCrazedSticker,
                  barcodeCanvases: [
                    barcodeLeftZoomCanvas,
                    barcodeLeftContrastCanvas,
                    barcodeRightZoomCanvas,
                    vinBandCanvas,
                    stickerCenterCanvas,
                    fullCanvas,
                    gateFullCanvas,
                    ...(verticalStickerZoomCW ? [verticalStickerZoomCW] : []),
                    verticalStickerFullCW
                  ],
                  zxingCanvases: [
                    barcodeLeftZoomCanvas,
                    barcodeLeftContrastCanvas,
                    barcodeRightZoomCanvas
                  ],
                  code39Canvases: [
                    barcodeLeftContrastCanvas,
                    barcodeLeftZoomCanvas,
                    localContrastBandCanvas,
                    vinBandCanvas,
                    barcodeRightZoomCanvas,
                    gateFullCanvas
                  ],
                  ocrCanvases: deepCrops
                };
                return cachedFullAccuracySuite;
              };

              finish({
                quickIsCrazed,
                isWideBanner,
                visualSignal,
                fastGateBarcodeCanvases: [gateBandCanvas, quickScreenCanvas],
                fastGateCode39Canvases: [gateBandCanvas, quickScreenCanvas],
                fastGateOcrCanvases,
                getFullAccuracySuite
              });
            } catch (err) {
              finish(null);
            }
          };

          rawImg.onerror = () => {
            clearTimeout(timer);
            finish(null);
          };

          rawImg.src = objectUrl;
        });
      });

    const STEP2_CONFIDENCE_TIMEOUT_MS = 8000;

    const scanImageFileForVin = async (file, categoryKey, shouldAbortScan = null, onVinTagIdentified = null, options = null) => {
      if (!file) return { vin: '', unreadableVinTag: false };
      const isVideo = file.type?.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name || '');
      if (isVideo) return { vin: '', unreadableVinTag: false };
      if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
        return { vin: '', unreadableVinTag: false };
      }

      try {
        const canvases = await loadImageCanvasesForScan(file, shouldAbortScan);
        if (!canvases) return { vin: '', unreadableVinTag: false };
        if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
          return { vin: '', unreadableVinTag: false };
        }

        const quickIsCrazed = Boolean(canvases.quickIsCrazed);
        const isWideBanner = Boolean(canvases.isWideBanner);
        const visualSignal = canvases.visualSignal || { hasPlausibleText: true, looksLikeCloseUpLabel: false, priorityScore: 20 };
        const isDirectVinTagPhoto = Boolean(options && options.directVinTagPhoto);

        // =========================================================================
        // STEP 1: FAST IDENTIFICATION GATE ("Does this photo have a VIN/tag on it?")
        // Never returns a low-res guess — if ANY sign of a barcode, tag, or VIN is
        // detected (or if uploaded directly as a VIN/Serial tag photo), the photo is
        // handed to Step 2 for 100% full-accuracy scanning with a strict 8-second
        // deadline before requiring manual entry!
        // =========================================================================
        let confirmedVinTagEvidence = isDirectVinTagPhoto || quickIsCrazed;
        let hasPotentialVinOrTag = isDirectVinTagPhoto || quickIsCrazed || isWideBanner;
        const barcodeSerial6HintsSet = new Set();
        const recordBarcodeSerialHint = (rawVal) => {
          if (!rawVal) return;
          const cleanDigits = String(rawVal).trim().replace(/^\*+|\*+$/g, '').replace(/\s+/g, '');
          if (/^\d{6}$/.test(cleanDigits)) {
            barcodeSerial6HintsSet.add(cleanDigits);
          }
        };

        // Fast Gate 1A: Native BarcodeDetector quick check (<20ms)
        let detector = null;
        if (typeof window !== 'undefined' && 'BarcodeDetector' in window) {
          try {
            let formats = ['code_39', 'code_128', 'codabar', 'itf', 'data_matrix', 'pdf417', 'qr_code'];
            if (typeof window.BarcodeDetector.getSupportedFormats === 'function') {
              const supported = await window.BarcodeDetector.getSupportedFormats();
              formats = formats.filter((f) => supported.includes(f));
            }
            if (formats.length > 0) {
              detector = new window.BarcodeDetector({ formats });
              if (!quickIsCrazed) {
                for (let c = 0; c < (canvases.fastGateBarcodeCanvases || []).length; c++) {
                  try {
                    const barcodes = await detector.detect(canvases.fastGateBarcodeCanvases[c]);
                    if (barcodes && barcodes.length > 0) {
                      for (let b = 0; b < barcodes.length; b++) {
                        recordBarcodeSerialHint(barcodes[b]?.rawValue);
                      }
                      confirmedVinTagEvidence = true;
                      hasPotentialVinOrTag = true;
                      break;
                    }
                  } catch (e) {}
                }
              }
            }
          } catch (barcodeErr) {}
        }

        // Fast Gate 1B: Quick Code 39 scanline check (<15ms)
        if (!confirmedVinTagEvidence) {
          for (let c = 0; c < (canvases.fastGateCode39Canvases || []).length; c++) {
            const c39 = scanCanvasForCode39(canvases.fastGateCode39Canvases[c], categoryKey);
            if (c39.fullVin || (c39.fragments && c39.fragments.length > 0)) {
              confirmedVinTagEvidence = true;
              hasPotentialVinOrTag = true;
              break;
            }
          }
        }

        const queuePriority = hasPotentialVinOrTag ? 100 : (visualSignal.priorityScore || 0);

        return await new Promise((resolveOuter) => {
          let outerSettled = false;
          let vinTagIdentified = false;
          let step2DeadlineAt = 0;
          let step2TimeoutId = null;
          let wideBannerCapAt = 0;
          let wideBannerTimeoutId = null;
          let preStep2SafetyTimeoutId = null;

          const clearAllTimers = () => {
            if (step2TimeoutId) {
              clearTimeout(step2TimeoutId);
              step2TimeoutId = null;
            }
            if (wideBannerTimeoutId) {
              clearTimeout(wideBannerTimeoutId);
              wideBannerTimeoutId = null;
            }
            if (preStep2SafetyTimeoutId) {
              clearTimeout(preStep2SafetyTimeoutId);
              preStep2SafetyTimeoutId = null;
            }
          };

          const finishOuter = (resObj) => {
            if (outerSettled) return resObj;
            outerSettled = true;
            clearAllTimers();
            resolveOuter(resObj);
            return resObj;
          };

          // Starts the strict 8.0-second full-confidence countdown the instant a photo is identified as having a VIN/tag
          const markVinTagIdentified = () => {
            if (vinTagIdentified) return;
            vinTagIdentified = true;
            confirmedVinTagEvidence = true;
            if (preStep2SafetyTimeoutId) {
              clearTimeout(preStep2SafetyTimeoutId);
              preStep2SafetyTimeoutId = null;
            }
            const now = performance.now();
            const targetDeadline = now + STEP2_CONFIDENCE_TIMEOUT_MS;
            step2DeadlineAt = wideBannerCapAt > 0 ? Math.min(wideBannerCapAt, targetDeadline) : targetDeadline;
            const remainingMs = Math.max(0, Math.round(step2DeadlineAt - now));
            if (typeof onVinTagIdentified === 'function') {
              try {
                onVinTagIdentified();
              } catch (cbErr) {}
            }
            step2TimeoutId = setTimeout(() => {
              finishOuter({ vin: '', unreadableVinTag: true, timedOutVinTag: true });
            }, remainingMs);
          };

          if (confirmedVinTagEvidence) {
            markVinTagIdentified();
          } else {
            preStep2SafetyTimeoutId = setTimeout(() => {
              finishOuter({ vin: '', unreadableVinTag: false });
            }, 15000);
          }

          const effectiveShouldAbort = () =>
            outerSettled || (typeof shouldAbortScan === 'function' && Boolean(shouldAbortScan()));

          enqueuePrioritizedOcrTask(queuePriority, effectiveShouldAbort, quickIsCrazed, async (worker) => {
            if (outerSettled) {
              return { vin: '', unreadableVinTag: Boolean(confirmedVinTagEvidence) };
            }
            if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
              return finishOuter({ vin: '', unreadableVinTag: false });
            }
            try {
              if (!worker) {
                return finishOuter({ vin: '', unreadableVinTag: Boolean(confirmedVinTagEvidence) });
              }

              let stickerHeaderContext = '';

              // Fast Gate 1C: Lightweight OCR screening check (~200ms) ONLY to decide if photo has a VIN/tag
              if (!hasPotentialVinOrTag) {
                const gateOcrList = canvases.fastGateOcrCanvases || [];
                let totalGateAlnum = 0;
                for (let g = 0; g < gateOcrList.length; g++) {
                  if (outerSettled) return { vin: '', unreadableVinTag: Boolean(confirmedVinTagEvidence) };
                  if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
                    return finishOuter({ vin: '', unreadableVinTag: false });
                  }
                  const gCanvas = gateOcrList[g];
                  if (!gCanvas) continue;
                  const gateRes = await worker.recognize(gCanvas);
                  if (outerSettled) return { vin: '', unreadableVinTag: Boolean(confirmedVinTagEvidence) };
                  const gateText = gateRes?.data?.text || '';
                  totalGateAlnum += (gateText.match(/[A-Za-z0-9]/g) || []).length;
                  if (gateText) {
                    stickerHeaderContext += '\n' + gateText;
                    if (
                      doesOcrTextLookLikeVinOrTag(gateText) ||
                      Boolean(extractVinOrSerialFromOcrText(gateText, categoryKey, [], false))
                    ) {
                      // Candidate identified! Do NOT return the low-res screening string — proceed to full-accuracy Step 2 below!
                      hasPotentialVinOrTag = true;
                      if (
                        doesTextConfirmActualVinTag(gateText) ||
                        Boolean(extractVinOrSerialFromOcrText(gateText, categoryKey, [], false))
                      ) {
                        confirmedVinTagEvidence = true;
                      }
                      break;
                    }
                  }
                }

                if (!hasPotentialVinOrTag && visualSignal.looksLikeCloseUpLabel && totalGateAlnum < 8) {
                  // Close-up metallic/faded plate where quick natural grayscale saw very few chars: promote to Step 2!
                  hasPotentialVinOrTag = true;
                }

                // If Step 1 confirms this photo does NOT have a VIN or compliance tag, skip it immediately!
                if (!hasPotentialVinOrTag) {
                  return finishOuter({ vin: '', unreadableVinTag: false });
                }
              }

              // =========================================================================
              // STEP 2: FULL-ACCURACY SCAN (8.0s max after identifying which photo has a VIN)
              // =========================================================================
              if (confirmedVinTagEvidence) {
                markVinTagIdentified();
              } else {
                if (preStep2SafetyTimeoutId) {
                  clearTimeout(preStep2SafetyTimeoutId);
                  preStep2SafetyTimeoutId = null;
                }
                wideBannerCapAt = performance.now() + STEP2_CONFIDENCE_TIMEOUT_MS;
                wideBannerTimeoutId = setTimeout(() => {
                  finishOuter({
                    vin: '',
                    unreadableVinTag: Boolean(confirmedVinTagEvidence),
                    timedOutVinTag: Boolean(confirmedVinTagEvidence)
                  });
                }, STEP2_CONFIDENCE_TIMEOUT_MS);
              }

              const checkStep2Stop = () => {
                if (outerSettled) return true;
                if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
                  finishOuter({ vin: '', unreadableVinTag: false });
                  return true;
                }
                const now = performance.now();
                if (step2DeadlineAt > 0 && now >= step2DeadlineAt) {
                  finishOuter({ vin: '', unreadableVinTag: true, timedOutVinTag: true });
                  return true;
                }
                if (wideBannerCapAt > 0 && now >= wideBannerCapAt) {
                  finishOuter({
                    vin: '',
                    unreadableVinTag: Boolean(confirmedVinTagEvidence),
                    timedOutVinTag: Boolean(confirmedVinTagEvidence)
                  });
                  return true;
                }
                return false;
              };

              if (checkStep2Stop()) {
                return { vin: '', unreadableVinTag: Boolean(confirmedVinTagEvidence) };
              }

              const full = canvases.getFullAccuracySuite();
              const isCrazed = Boolean(full.isCrazedSticker);
              if (isCrazed && !vinTagIdentified) {
                markVinTagIdentified();
              }
              let combinedText = '';
              const recognizedCanvases = new Set();

              // Full Pass 2A: Native BarcodeDetector across all full-resolution & zoomed barcode canvases
              if (detector && full.barcodeCanvases) {
                for (let c = 0; c < full.barcodeCanvases.length; c++) {
                  if (checkStep2Stop()) break;
                  try {
                    const barcodes = await detector.detect(full.barcodeCanvases[c]);
                    if (barcodes && barcodes.length > 0 && !vinTagIdentified) {
                      markVinTagIdentified();
                    }
                    for (let i = 0; i < (barcodes || []).length; i++) {
                      const rawBc = barcodes[i]?.rawValue;
                      recordBarcodeSerialHint(rawBc);
                      const found = extractVinFromBarcodeValue(rawBc, categoryKey);
                      if (found) {
                        return finishOuter({ vin: found, unreadableVinTag: false });
                      }
                    }
                  } catch (e) {}
                }
              }

              // Full Pass 2B: ZXing Multi-Format Barcode Reader fallback on zoomed 1800px barcode canvases
              if (!outerSettled && typeof window !== 'undefined' && window.ZXing && typeof window.ZXing.BrowserMultiFormatReader === 'function') {
                try {
                  const zxingReader = new window.ZXing.BrowserMultiFormatReader();
                  const zxingTargets = full.zxingCanvases || [];
                  for (let c = 0; c < zxingTargets.length; c++) {
                    if (checkStep2Stop()) break;
                    try {
                      const dataUrl = zxingTargets[c].toDataURL('image/jpeg', 0.92);
                      const res = await zxingReader.decodeFromImageUrl(dataUrl);
                      if (outerSettled) break;
                      if (res && res.getText) {
                        if (!vinTagIdentified) markVinTagIdentified();
                        const rawZx = res.getText();
                        recordBarcodeSerialHint(rawZx);
                        const found = extractVinFromBarcodeValue(rawZx, categoryKey);
                        if (found) {
                          return finishOuter({ vin: found, unreadableVinTag: false });
                        }
                      }
                    } catch (zErr) {}
                  }
                } catch (zxingInitErr) {}
              }

              // Full Pass 2C: Custom multi-scanline Code 39 decoder across all 1800px zoomed & local-contrast barcode crops
              const barcodeFragmentsMap = new Map();
              if (!outerSettled) {
                for (let c = 0; c < (full.code39Canvases || []).length; c++) {
                  if (checkStep2Stop()) break;
                  const c39 = scanCanvasForCode39(full.code39Canvases[c], categoryKey);
                  if (c39.fullVin) {
                    return finishOuter({ vin: c39.fullVin, unreadableVinTag: false });
                  }
                  if (c39.fragments && c39.fragments.length > 0 && !vinTagIdentified) {
                    markVinTagIdentified();
                  }
                  for (let f = 0; f < c39.fragments.length; f++) {
                    const frag = c39.fragments[f];
                    const prev = barcodeFragmentsMap.get(frag.text);
                    barcodeFragmentsMap.set(frag.text, {
                      text: frag.text,
                      hasStartStar: Boolean(prev?.hasStartStar || frag.hasStartStar),
                      hasStopStar: Boolean(prev?.hasStopStar || frag.hasStopStar),
                      hits: (prev?.hits || 0) + (frag.hits || 1)
                    });
                  }
                }
              }
              const barcodeFragments = Array.from(barcodeFragmentsMap.values());
              if (!outerSettled) {
                const crossStitched = stitchBarcodeFragments(barcodeFragments);
                if (crossStitched) {
                  return finishOuter({ vin: crossStitched, unreadableVinTag: false });
                }
              }

              const barcodeSerial6Hints = Array.from(barcodeSerial6HintsSet);

              // Full Pass 2D: Full-Resolution Multi-Crop Tesseract.js OCR across ALL zoomed & enhanced canvases (up to 8.0s deadline)
              const allFullAccuracyOcrCrops = full.ocrCanvases || [];
              for (let c = 0; c < allFullAccuracyOcrCrops.length; c++) {
                if (checkStep2Stop()) break;
                const targetCanvas = allFullAccuracyOcrCrops[c];
                if (!targetCanvas || recognizedCanvases.has(targetCanvas)) continue;
                recognizedCanvases.add(targetCanvas);
                const res = await worker.recognize(targetCanvas);
                if (outerSettled) break;
                const text = res?.data?.text || '';
                if (text) {
                  if (!vinTagIdentified && doesTextConfirmActualVinTag(text)) {
                    markVinTagIdentified();
                  }
                  stickerHeaderContext += '\n' + text;
                  const found = extractVinOrSerialFromOcrText(
                    text,
                    categoryKey,
                    barcodeFragments,
                    isCrazed,
                    barcodeSerial6Hints,
                    stickerHeaderContext
                  );
                  if (found) {
                    return finishOuter({ vin: found, unreadableVinTag: false });
                  }
                  combinedText += '\n' + text;
                  const combinedFound = extractVinOrSerialFromOcrText(
                    combinedText,
                    categoryKey,
                    barcodeFragments,
                    isCrazed,
                    barcodeSerial6Hints,
                    stickerHeaderContext
                  );
                  if (combinedFound) {
                    return finishOuter({ vin: combinedFound, unreadableVinTag: false });
                  }
                }
              }

              if (outerSettled) {
                return { vin: '', unreadableVinTag: Boolean(confirmedVinTagEvidence) };
              }

              const finalVin = extractVinOrSerialFromOcrText(
                combinedText,
                categoryKey,
                barcodeFragments,
                isCrazed,
                barcodeSerial6Hints,
                stickerHeaderContext
              );
              if (finalVin) {
                return finishOuter({ vin: finalVin, unreadableVinTag: false });
              }
              const sawStickerContext =
                confirmedVinTagEvidence ||
                isCrazed ||
                barcodeFragments.length > 0 ||
                doesTextConfirmActualVinTag(combinedText) ||
                /(?:\bV\.?\s*I\.?\s*N\.?\b|\bN\.?\s*I\.?\s*V\.?\b|IDENTIFICATION|FOREST\s+RIVER,?\s+INC|\bGVWR\b|\bGAWR\b|\bPNBV\b|\bPNBE\b|\bMFD\.?\s+BY\b|\bMFG\.?\s+BY\b|FABRIQUE|MANUFACTURED|CONFORMS\s+TO|\bST2\d\d|\bKPA\b|\bPSI\b)/i.test(
                  combinedText
                );
              return finishOuter({ vin: '', unreadableVinTag: Boolean(sawStickerContext) });
            } catch (ocrErr) {
              return finishOuter({ vin: '', unreadableVinTag: Boolean(confirmedVinTagEvidence) });
            }
          }).then((taskRes) => {
            if (!outerSettled) {
              finishOuter(taskRes || { vin: '', unreadableVinTag: Boolean(confirmedVinTagEvidence) });
            }
          });
        });
      } catch (err) {
        console.warn('VIN scan error:', err);
        return { vin: '', unreadableVinTag: false };
      }
    };

    function InlineDealStatusSelect({ item, onChangeStatus }) {
      const propStatus = item?.outreach?.status || (item?.outreach?.reachedOut ? 'contacted' : '');
      const [localStatus, setLocalStatus] = useState(propStatus);
      const [isOpen, setIsOpen] = useState(false);
      const [menuCoords, setMenuCoords] = useState({ top: 0, left: 0, openUp: false });
      const btnRef = useRef(null);
      const menuRef = useRef(null);
      const lockUntilRef = useRef(0);

      useEffect(() => {
        if (Date.now() >= lockUntilRef.current) {
          setLocalStatus(propStatus);
        }
      }, [propStatus]);

      useEffect(() => {
        if (!isOpen) return;
        const handleOutside = (e) => {
          if (
            btnRef.current && !btnRef.current.contains(e.target) &&
            menuRef.current && !menuRef.current.contains(e.target)
          ) {
            setIsOpen(false);
          }
        };
        const handleKeyOrScroll = (e) => {
          if (e.type === 'keydown' && e.key !== 'Escape') return;
          setIsOpen(false);
        };
        document.addEventListener('mousedown', handleOutside, true);
        document.addEventListener('touchstart', handleOutside, true);
        window.addEventListener('scroll', handleKeyOrScroll, true);
        window.addEventListener('resize', handleKeyOrScroll);
        window.addEventListener('keydown', handleKeyOrScroll);
        return () => {
          document.removeEventListener('mousedown', handleOutside, true);
          document.removeEventListener('touchstart', handleOutside, true);
          window.removeEventListener('scroll', handleKeyOrScroll, true);
          window.removeEventListener('resize', handleKeyOrScroll);
          window.removeEventListener('keydown', handleKeyOrScroll);
        };
      }, [isOpen]);

      const statusMeta = getInquiryDealStatusMeta(item, localStatus || null);

      const suppressRowOpen = () => {
        if (typeof window !== 'undefined') {
          window.__sr1SuppressRowOpenUntil = Date.now() + 650;
        }
      };

      const handleToggleMenu = (e) => {
        e.preventDefault();
        e.stopPropagation();
        suppressRowOpen();
        if (!isOpen && btnRef.current) {
          const rect = btnRef.current.getBoundingClientRect();
          const spaceBelow = window.innerHeight - rect.bottom;
          const openUp = spaceBelow < 190 && rect.top > 190;
          const left = Math.min(Math.max(8, rect.left), Math.max(8, window.innerWidth - 176));
          setMenuCoords({
            top: openUp ? rect.top - 6 : rect.bottom + 6,
            left,
            openUp
          });
        }
        setIsOpen(prev => !prev);
      };

      const handlePick = (e, nextVal) => {
        e.preventDefault();
        e.stopPropagation();
        suppressRowOpen();
        setIsOpen(false);
        if (nextVal === localStatus) return;
        lockUntilRef.current = Date.now() + 12000;
        setLocalStatus(nextVal);
        if (onChangeStatus) {
          onChangeStatus(nextVal);
        }
      };

      const stopBubble = (e) => {
        e.stopPropagation();
        suppressRowOpen();
      };

      const allOptions = [
        { id: '', label: 'Needs Outreach', shortIcon: '⏳', dotClass: 'text-amber-300' },
        ...STAFF_DEAL_STATUSES.map(st => ({
          id: st.id,
          label: st.label,
          shortIcon: st.shortIcon,
          dotClass: st.mobileTextClass
        }))
      ];

      return (
        <div
          className="inline-flex items-center"
          onClick={stopBubble}
          onMouseDown={stopBubble}
          onTouchStart={stopBubble}
        >
          <button
            ref={btnRef}
            type="button"
            onClick={handleToggleMenu}
            className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md text-[10px] font-bold border shadow-sm cursor-pointer select-none focus:outline-none transition-colors duration-150 ${statusMeta.badgeClass}`}
            title={statusMeta.staffName ? `Updated by ${statusMeta.staffName}` : 'Click to change deal status'}
          >
            <span>{statusMeta.shortIcon}</span>
            <span>{statusMeta.label}</span>
            <span className="text-[9px] opacity-75 ml-0.5">▾</span>
          </button>

          {isOpen && typeof ReactDOM !== 'undefined' && ReactDOM.createPortal(
            <div
              ref={menuRef}
              onClick={stopBubble}
              onMouseDown={stopBubble}
              onTouchStart={stopBubble}
              style={{
                position: 'fixed',
                top: `${menuCoords.top}px`,
                left: `${menuCoords.left}px`,
                transform: menuCoords.openUp ? 'translateY(-100%)' : 'none',
                zIndex: 99999
              }}
              className="w-40 bg-neutral-900 border border-neutral-700 rounded-xl shadow-2xl py-1 overflow-hidden"
            >
              {allOptions.map(opt => {
                const isActive = localStatus === opt.id;
                return (
                  <button
                    key={opt.id || 'needs_outreach'}
                    type="button"
                    onClick={(e) => handlePick(e, opt.id)}
                    className={`w-full px-3 py-1.5 text-left text-[11px] font-semibold flex items-center justify-between transition-colors cursor-pointer ${
                      isActive
                        ? 'bg-neutral-800 text-white'
                        : 'text-neutral-300 hover:bg-neutral-850 hover:text-white'
                    }`}
                  >
                    <span className="flex items-center gap-1.5">
                      <span className={opt.dotClass}>{opt.shortIcon}</span>
                      <span>{opt.label}</span>
                    </span>
                    {isActive && <span className="text-emerald-400 text-[10px] font-bold">✓</span>}
                  </button>
                );
              })}
            </div>,
            document.body
          )}
        </div>
      );
    }

    const ZIP_CITY_STATE_CACHE = (() => {
      try {
        const raw = localStorage.getItem('sell2sr1_zip_cache_v1');
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    })();

    async function lookupZipCityState(rawZip) {
      const clean = String(rawZip || '').replace(/\D/g, '').slice(0, 5);
      if (clean.length !== 5) return null;
      if (ZIP_CITY_STATE_CACHE[clean]) {
        return ZIP_CITY_STATE_CACHE[clean];
      }
      try {
        const res = await fetch(`https://api.zippopotam.us/us/${clean}`);
        if (res.ok) {
          const data = await res.json();
          const place = Array.isArray(data?.places) && data.places[0] ? data.places[0] : null;
          if (place && place['place name'] && place['state abbreviation']) {
            const entry = {
              zip: clean,
              city: place['place name'],
              state: place['state abbreviation']
            };
            ZIP_CITY_STATE_CACHE[clean] = entry;
            try {
              localStorage.setItem('sell2sr1_zip_cache_v1', JSON.stringify(ZIP_CITY_STATE_CACHE));
            } catch (e) {}
            return entry;
          }
        }
      } catch (e) {}
      return null;
    }

    function hasGenuineCustomerZip(customer) {
      if (!customer) return false;
      if (customer.zipVerified) return true;
      const cleanZip = String(customer.zipCode || '').replace(/\D/g, '').slice(0, 5);
      if (cleanZip.length !== 5) return false;
      // Ignore legacy hardcoded fallback ("Manchester, ME 04351") on pre-zip inquiries
      if (cleanZip === '04351' && customer.city === 'Manchester' && customer.state === 'ME' && !customer.zipVerified) {
        return false;
      }
      return true;
    }

    function CustomerZipLocation({ customer, prefix = '', showZip = false, className = '' }) {
      const isGenuine = hasGenuineCustomerZip(customer);
      const cleanZip = isGenuine ? String(customer?.zipCode || '').replace(/\D/g, '').slice(0, 5) : '';
      const initialCity = isGenuine ? (customer?.city || ZIP_CITY_STATE_CACHE[cleanZip]?.city || '') : '';
      const initialState = isGenuine ? (customer?.state || ZIP_CITY_STATE_CACHE[cleanZip]?.state || '') : '';
      const [resolved, setResolved] = useState({ city: initialCity, state: initialState });

      useEffect(() => {
        if (!isGenuine || !cleanZip) {
          setResolved({ city: '', state: '' });
          return;
        }
        if (customer?.city && customer?.state) {
          setResolved({ city: customer.city, state: customer.state });
          return;
        }
        let cancelled = false;
        lookupZipCityState(cleanZip).then(res => {
          if (!cancelled && res) {
            setResolved({ city: res.city, state: res.state });
          }
        });
        return () => { cancelled = true; };
      }, [isGenuine, cleanZip, customer?.city, customer?.state]);

      if (!isGenuine) return null;
      const label = (resolved.city && resolved.state)
        ? `${resolved.city}, ${resolved.state}${showZip && cleanZip ? ` (${cleanZip})` : ''}`
        : (cleanZip ? `Zip: ${cleanZip}` : '');
      if (!label) return null;

      return (
        <span className={className} title={cleanZip ? `Customer Zip Code: ${cleanZip}` : undefined}>
          {prefix}{label}
        </span>
      );
    }

    function CopyPhoneButton({ phone, className = '' }) {
      const [copied, setCopied] = useState(false);
      if (!phone) return null;

      const handleCopy = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (typeof window !== 'undefined') {
          window.__sr1SuppressRowOpenUntil = Date.now() + 650;
        }
        const raw = String(phone).trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(raw).catch(() => {});
        } else {
          try {
            const ta = document.createElement('textarea');
            ta.value = raw;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          } catch (err) {}
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      };

      const stopBubble = (e) => {
        e.stopPropagation();
        if (typeof window !== 'undefined') {
          window.__sr1SuppressRowOpenUntil = Date.now() + 650;
        }
      };

      return (
        <button
          type="button"
          onClick={handleCopy}
          onMouseDown={stopBubble}
          onTouchStart={stopBubble}
          title="Click to copy phone number"
          className={`inline-flex items-center gap-1 font-mono transition-colors cursor-pointer select-none focus:outline-none ${

          }`}
        >

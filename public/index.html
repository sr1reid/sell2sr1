    // Direct Firebase Cloud Storage upload for raw photos and videos
    async function uploadMediaFileToStorage(file) {
      try {
        if (!storage && typeof firebase !== 'undefined' && firebase.storage) {
          try { storage = firebase.storage(); } catch (e) {}
        }
        if (!storage) {
          throw new Error('Firebase Storage not available');
        }

        const ext = file.name ? file.name.split('.').pop().toLowerCase() : (file.type?.startsWith('video/') ? 'mp4' : 'jpg');
        const cleanName = (file.name || 'upload')
          .replace(/[^a-zA-Z0-9._-]/g, '_')
          .toLowerCase();
        const path = `inquiries/${Date.now()}_${Math.random().toString(36).substr(2, 6)}_${cleanName}`;
        const ref = storage.ref(path);
        
        let contentType = file.type || '';
        if (!contentType) {
          if (ext === 'heic' || ext === 'heif') contentType = 'image/heic';
          else if (ext === 'mov') contentType = 'video/quicktime';
          else if (ext === 'mp4') contentType = 'video/mp4';
          else contentType = 'image/jpeg';
        }

        const metadata = { contentType };
        const snapshot = await ref.put(file, metadata);
        const downloadUrl = await snapshot.ref.getDownloadURL();
        return downloadUrl;
      } catch (err) {
        console.warn('Firebase Storage upload error:', err);
        return null;
      }
    }

    // Convert JavaScript object to Firestore REST typed format
    function jsonToFirestoreFields(obj) {
      if (obj === null || obj === undefined) return { nullValue: null };
      if (typeof obj === 'string') return { stringValue: obj };
      if (typeof obj === 'number') {
        return Number.isInteger(obj) ? { integerValue: obj.toString() } : { doubleValue: obj };
      }
      if (typeof obj === 'boolean') return { booleanValue: obj };
      if (Array.isArray(obj)) {
        return { arrayValue: { values: obj.map(jsonToFirestoreFields) } };
      }
      if (typeof obj === 'object') {
        const fields = {};
        for (const [k, v] of Object.entries(obj)) {
          if (v !== undefined) {
            fields[k] = jsonToFirestoreFields(v);
          }
        }
        return { mapValue: { fields } };
      }
      return { nullValue: null };
    }

    // Convert Firestore REST typed format back to plain JavaScript object
    function firestoreFieldsToJson(fsVal) {
      if (!fsVal) return null;
      if ('stringValue' in fsVal) return fsVal.stringValue;
      if ('integerValue' in fsVal) return parseInt(fsVal.integerValue, 10);
      if ('doubleValue' in fsVal) return fsVal.doubleValue;
      if ('booleanValue' in fsVal) return fsVal.booleanValue;
      if ('nullValue' in fsVal) return null;
      if ('arrayValue' in fsVal) {
        return (fsVal.arrayValue.values || []).map(firestoreFieldsToJson);
      }
      if ('mapValue' in fsVal) {
        const res = {};
        for (const [k, v] of Object.entries(fsVal.mapValue.fields || {})) {
          res[k] = firestoreFieldsToJson(v);
        }
        return res;
      }
      return null;
    }

    // Direct REST API save: 100% reliable across all browsers & phones
    async function saveInquiryToCloudRest(inquiry) {
      try {
        let clean = JSON.parse(JSON.stringify(inquiry));

        // Firestore strictly enforces a 1MB (1,048,576 byte) document limit.
        if (clean.photos && Array.isArray(clean.photos)) {
          clean.photos = clean.photos.slice(0, 12).map(p => {
            const isHttp = (p.url && typeof p.url === 'string' && p.url.startsWith('http'));
            const rawThumb = p.thumbUrl || p.url || '';
            const safeThumb = isHttp 
              ? p.url 
              : (typeof rawThumb === 'string' && rawThumb.length < 75000 ? rawThumb : '');
            return {
              id: p.id || 'p-' + Math.random().toString(36).substr(2, 6),
              label: p.label || 'Unit Media',
              url: isHttp ? p.url : safeThumb,
              thumbUrl: isHttp ? (p.thumbUrl || p.url) : safeThumb,
              isVideo: !!p.isVideo,
              fileSize: p.fileSize || 0,
              fileType: p.fileType || (p.isVideo ? 'video/mp4' : 'image/jpeg'),
              uploadedAt: p.uploadedAt || new Date().toISOString()
            };
          });
        }

        const body = { fields: jsonToFirestoreFields(clean).mapValue.fields };
        const url = `${FS_REST_BASE}/${inquiry.id}?key=${FS_API_KEY}`;
        const res = await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          console.error('Firestore save failed with HTTP', res.status, errData);
          return false;
        } else {
          console.log('Inquiry successfully saved to Firestore:', inquiry.referenceId);
          return true;
        }
      } catch (e) {
        console.error('Cloud REST save notice:', e);
        return false;
      }
    }

    function normalizeInquiry(inq) {
      if (!inq || typeof inq !== 'object') return null;
      if (inq.id === '_config_email_routing' || inq.isConfigDoc) return null;
      const rawRef = inq.referenceId || inq.id || '';
      const cleanRef = String(rawRef).replace(/^SR1-SELL-/i, '') || String(Math.floor(1000 + Math.random() * 9000));
      const id = inq.id || `inq-${cleanRef}`;
      
      const unit = inq.unit && typeof inq.unit === 'object' ? inq.unit : {};
      const customer = inq.customer && typeof inq.customer === 'object' ? inq.customer : {};
      const financials = inq.financials && typeof inq.financials === 'object' ? inq.financials : {};

      const isArchived = inq.isArchived !== undefined ? !!inq.isArchived : (inq.stage === 'archived');
      const stage = inq.stage && STAGES[inq.stage] ? inq.stage : (isArchived ? 'archived' : 'new');

      return {
        ...inq,
        id,
        referenceId: cleanRef,
        createdAt: inq.createdAt || new Date().toISOString(),
        updatedAt: inq.updatedAt || new Date().toISOString(),
        stage,
        isArchived,
        archivedAt: inq.archivedAt || null,
        archivedBy: inq.archivedBy || null,
        previousStage: inq.previousStage || (stage !== 'archived' ? stage : 'new'),
        intent: inq.intent === 'trade' ? 'trade' : 'sell',
        workingWithSalesperson: inq.workingWithSalesperson || 'no',
        salespersonName: inq.salespersonName || '',
        assignedStaffName: inq.assignedStaffName || '',
        preferredLocation: inq.preferredLocation || inq.dealershipLocation || 'turner_me',
        customer: {
          firstName: customer.firstName || 'Client',
          lastName: customer.lastName || '',
          email: customer.email || '',
          phone: customer.phone || '',
          preferredContact: customer.preferredContact || 'phone',
          city: customer.city || '',
          state: customer.state || '',
          zipCode: customer.zipCode || ''
        },
        unit: {
          category: unit.category || 'other',
          subcategory: unit.subcategory || 'Equipment',
          year: unit.year || '',
          make: unit.make || 'Unknown Make',
          model: unit.model || '',
          trimOrFloorplan: unit.trimOrFloorplan || '',
          vinOrSerial: unit.vinOrSerial || 'VIN-PENDING',
          mileageOrHours: Number(unit.mileageOrHours) || 0,
          isHours: !!unit.isHours,
          specs: unit.specs && typeof unit.specs === 'object' ? unit.specs : {},
          condition: unit.condition || 'Good',
          conditionNotes: unit.conditionNotes || '',
          tireOrTrackCondition: unit.tireOrTrackCondition || '',
          knownIssuesOrDamage: unit.knownIssuesOrDamage || ''
        },
        financials: {
          titleStatus: financials.titleStatus || 'Owned outright',
          lienHolderName: financials.lienHolderName || financials.lienHolder || inq.lienHolderName || inq.lienHolder || '',
          estimatedPayoff: Number(financials.estimatedPayoff) || 0,
          askingPrice: Number(financials.askingPrice) || 0
        },
        photos: Array.isArray(inq.photos) ? inq.photos : [],
        offers: Array.isArray(inq.offers) ? inq.offers : [],
        notes: Array.isArray(inq.notes) ? inq.notes : [],
        outreach: (inq.outreach && typeof inq.outreach === 'object') ? {
          reachedOut: !!inq.outreach.reachedOut,
          staffName: inq.outreach.staffName || '',
          reachedOutAt: inq.outreach.reachedOutAt || null
        } : { reachedOut: false, staffName: '', reachedOutAt: null }
      };
    }

    function getLocationName(locId) {
      if (!locId) return 'SR1 Turner, ME';
      const found = LOCATIONS.find(l => l.id === locId || l.name === locId);
      if (found) return found.name;
      const legacyMap = {
        'turner_me': 'SR1 Turner, ME',
        'manchester_me': 'SR1 Manchester, ME',
        'hermon_me': 'SR1 Hermon, ME',
        'loudon_nh': 'SR1 Loudon, NH',
        'epsom_nh': 'SR1 Epsom, NH',
        'orono_me': 'SR1 Orono, ME',
        'houlton_me': 'SR1 Houlton, ME',
        'caribou_me': 'SR1 Caribou, ME'
      };
      return legacyMap[locId] || locId;
    }

    function formatInquiryDate(dateStr) {
      if (!dateStr) return { date: 'Recently', time: '' };
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return { date: 'Recently', time: '' };
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const dateFormatted = isToday 
          ? 'Today' 
          : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
        const timeFormatted = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return { date: dateFormatted, time: timeFormatted };
      } catch (e) {
        return { date: 'Recently', time: '' };
      }
    }

    function App() {
      const [currentView, setCurrentView] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const v = params.get('view');
          if (v === 'portal' || v === 'staff' || window.location.hash === '#portal' || window.location.hash === '#staff') {
            return 'portal';
          }
        } catch (e) {}
        return 'sell';
      });
      const [inquiries, setInquiries] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('reset') === '1') {
            try { localStorage.removeItem('sell2sr1_inquiries_v2'); } catch (e) {}
            return INITIAL_INQUIRIES_DATA.map(normalizeInquiry).filter(Boolean);
          }
          const saved = localStorage.getItem('sell2sr1_inquiries_v2');
          const list = saved ? JSON.parse(saved) : INITIAL_INQUIRIES_DATA;
          return (Array.isArray(list) ? list : INITIAL_INQUIRIES_DATA).map(normalizeInquiry).filter(Boolean);
        } catch (e) {
          console.warn('LocalStorage read error:', e);
          return INITIAL_INQUIRIES_DATA.map(normalizeInquiry).filter(Boolean);
        }
      });
      const [selectedInquiryId, setSelectedInquiryId] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          return params.get('inquiry') || null;
        } catch (e) {
          return null;
        }
      });
      const [lastSubmittedRef, setLastSubmittedRef] = useState(null);
      const [staffUser, setStaffUser] = useState(() => {
        try {
          const saved = localStorage.getItem('sell2sr1_staff_user');
          if (saved) return JSON.parse(saved);
          const params = new URLSearchParams(window.location.search);
          if (params.get('demo') === 'reid' || params.get('user') === 'reid') {
            return { email: 'reid@sr1companies.com', name: 'Reid Lanpher' };
          }
          if (params.get('demo') === '1') return { email: 'appraiser@sr1companies.com', name: 'SR1 Appraiser' };
          return null;
        } catch (e) {
          return null;
        }
      });
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try {
          const saved = localStorage.getItem('sell2sr1_staff_user');
          if (saved && JSON.parse(saved)?.email?.endsWith('@sr1companies.com')) return true;
          const params = new URLSearchParams(window.location.search);
          return params.get('demo') === '1' || params.get('demo') === 'reid' || params.get('user') === 'reid';
        } catch (e) {
          return false;

      });
      const [emailRoutingConfig, setEmailRoutingConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('sell2sr1_email_routing');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed === 'object') return { ...DEALERSHIP_NOTIFICATION_EMAILS, ...parsed };
          }
        } catch (e) {}
        return DEALERSHIP_NOTIFICATION_EMAILS;
      });
      const [sellFlowKey, setSellFlowKey] = useState(0);

      // Synchronize dynamic email routing config from Firestore REST
      useEffect(() => {
        fetchEmailRoutingConfigFromCloudRest().then(remoteConfig => {
          if (remoteConfig && typeof remoteConfig === 'object') {
            setEmailRoutingConfig(prev => ({
              ...prev,
              ...remoteConfig
            }));
            try {
              localStorage.setItem('sell2sr1_email_routing', JSON.stringify({
                ...DEALERSHIP_NOTIFICATION_EMAILS,
                ...remoteConfig
              }));
            } catch (e) {}
          }
        }).catch(err => {
          console.warn('Could not sync email routing config:', err);
        });
      }, []);

      const handleSaveEmailRoutingConfig = async (newRouting) => {
        setEmailRoutingConfig(newRouting);
        try {
          localStorage.setItem('sell2sr1_email_routing', JSON.stringify(newRouting));
        } catch (e) {}
        const ok = await saveEmailRoutingConfigToCloudRest(newRouting, staffUser?.email);
        return ok;
      };

      const handleSignOut = () => {
        try {
          localStorage.removeItem('sell2sr1_staff_user');
        } catch (e) {}
        setStaffUser(null);
        setIsAuthenticated(false);
      };

      const goToHome = () => {
        setCurrentView('sell');
        setSelectedInquiryId(null);
        setSellFlowKey(prev => prev + 1);
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      };

      useEffect(() => {
        try {
          // Keep inquiries safe for localStorage (strip heavy base64 strings so mobile never throws QuotaExceeded)
          const safeInquiries = (inquiries || []).map(normalizeInquiry).filter(Boolean).map(item => ({
            ...item,
            photos: (item.photos || []).map(p => ({
              id: p.id,
              label: p.label,
              url: (p.url && typeof p.url === 'string' && p.url.startsWith('data:') && p.url.length > 5000)
                ? 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80'
                : p.url,
              thumbUrl: (p.thumbUrl && typeof p.thumbUrl === 'string' && p.thumbUrl.startsWith('data:') && p.thumbUrl.length > 5000)
                ? 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80'
                : (p.thumbUrl || p.url),
              isVideo: !!p.isVideo
            }))
          }));
          localStorage.setItem('sell2sr1_inquiries_v2', JSON.stringify(safeInquiries));
        } catch (err) {
          console.warn('LocalStorage save skipped (quota limit or private browsing):', err);
        }
      }, [inquiries]);

      // Real-time Cloud Database Sync Engine (SDK onSnapshot + REST Polling)
      useEffect(() => {
        let isMounted = true;

        const mergeInquiries = (cloudList) => {
          if (!cloudList || cloudList.length === 0) return;
          const normalized = cloudList.map(normalizeInquiry).filter(Boolean);
          normalized.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setInquiries(normalized);
        };

        // 1. Immediate fetch from Cloud REST API on startup
        fetchInquiriesFromCloudRest().then(list => {
          if (isMounted && list && list.length > 0) {
            mergeInquiries(list);
          }
        });

        // 2. Real-time Firebase SDK subscription
        let unsubscribe = null;
        if (db) {
          try {
            unsubscribe = db.collection('inquiries').onSnapshot((snapshot) => {
              const cloudInquiries = [];
              snapshot.forEach((doc) => {
                cloudInquiries.push(doc.data());
              });
              if (isMounted && cloudInquiries.length > 0) {
                mergeInquiries(cloudInquiries);
              }
            }, (err) => {
              console.warn('Firestore onSnapshot sync notice:', err);
            });
          } catch (e) {
            console.warn('Firestore subscription error:', e);
          }
        }

        // 3. Fallback continuous polling (every 4 seconds) to ensure 100% sync reliability across all devices
        const pollInterval = setInterval(() => {
          fetchInquiriesFromCloudRest().then(list => {
            if (isMounted && list && list.length > 0) {
              mergeInquiries(list);
            }
          });
        }, 4000);

        return () => {
          isMounted = false;
          if (unsubscribe) unsubscribe();
          clearInterval(pollInterval);
        };
      }, []);

      const handleNewInquiry = async (newInquiry) => {
        const normalized = normalizeInquiry(newInquiry);
        setInquiries(prev => [normalized, ...(prev || []).filter(i => i.id !== normalized.id)]);
        setLastSubmittedRef(normalized.referenceId);

        // Sanitize object (strips undefined values that Firestore rejects)
        const cleanInquiry = JSON.parse(JSON.stringify(normalized));

        // 1. Direct REST save (Guaranteed delivery)
        const saved = await saveInquiryToCloudRest(cleanInquiry);

        // 2. Firebase SDK save
        if (db) {
          try {
            let sdkInq = JSON.parse(JSON.stringify(cleanInquiry));
            if (sdkInq.photos && Array.isArray(sdkInq.photos)) {
              sdkInq.photos = sdkInq.photos.slice(0, 8).map(p => {
                const rawThumb = p.thumbUrl || p.url || '';
                const safeThumb = (typeof rawThumb === 'string' && rawThumb.length < 75000)
                  ? rawThumb
                  : '';
                return {

          } catch (e) {

          }
        }

      // Generates a crisp, lightweight JPEG thumbnail (~20KB) directly from a File or Blob
      const compressImageFile = (file, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!file) return resolve('');
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              compressImageToDataUrl(ev.target.result, maxDim, quality).then(resolve);
            };
            reader.onerror = () => resolve('');
            reader.readAsDataURL(file);
            return;
          }

          const img = new Image();
          const cleanup = () => {
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (err) {
              cleanup();
              resolve('');
            }
          };

          img.onerror = () => {
            cleanup();
            try {
              const reader = new FileReader();
              reader.onload = (ev) => {
                const res = ev.target.result;
                if (typeof res === 'string' && res.startsWith('data:image/')) {
                  compressImageToDataUrl(res, maxDim, quality).then(resolve);
                } else {
                  resolve('');
                }
              };
              reader.onerror = () => resolve('');
              reader.readAsDataURL(file);
            } catch (e) {
              resolve('');
            }
          };

          img.src = objectUrl;
        });
      };

      // Extract a lightweight thumbnail preview (~20KB) from a video file
      const extractVideoThumbnail = (file) => {
        return new Promise((resolve) => {
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            return resolve('');
          }

          const video = document.createElement('video');
          video.preload = 'metadata';
          video.muted = true;
          video.playsInline = true;

          let cleaned = false;
          const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          const timer = setTimeout(() => {
            cleanup();
            resolve('');
          }, 6000);

          video.onloadedmetadata = () => {
            video.currentTime = Math.min(1.0, video.duration > 0 ? video.duration * 0.2 : 0.5);
          };

          video.onseeked = () => {
            clearTimeout(timer);
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480;
              let w = video.videoWidth || 480;
              let h = video.videoHeight || 270;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', 0.55));
            } catch (e) {
              cleanup();
              resolve('');
            }
          };

          video.onerror = () => {
            clearTimeout(timer);
            cleanup();
            resolve('');
          };

          video.src = objectUrl;
        });
      };

      // Generate a reduced-size preview base64 JPEG specifically for Resend email attachments
      const createEmailPreviewBase64 = (dataUrlOrUrl, isVideo = false) => {
        return new Promise((resolve) => {
          if (!dataUrlOrUrl) return resolve(null);
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480; // Reduced size for fast email delivery
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

              if (isVideo) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(8, canvas.height - 30, 130, 22);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('▶ VIDEO PREVIEW', 14, canvas.height - 15);
              }

              const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.65);
              const base64Content = jpegDataUrl.includes(',') ? jpegDataUrl.split(',')[1] : null;
              resolve(base64Content);
            } catch (err) {
              resolve(null);
            }
          };
          img.onerror = () => resolve(null);
          img.src = dataUrlOrUrl;
        });
      };

      const compressImageToDataUrl = (dataUrl, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!dataUrl) return resolve('');
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (e) {

            }

          img.onerror = () => resolve('');

      const processFiles = async (filesList) => {
        const files = Array.from(filesList || []).filter(file =>

          file.type.startsWith('video/') ||
          /\.(mp4|mov|webm|m4v|avi|heic|heif|jpg|jpeg|png|webp)$/i.test(file.name)
        );
        if (files.length === 0) return;
        setUploading(true);

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          try {
            setUploadStatus(`Uploading file ${i + 1} of ${files.length}...`);
            const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name);
            const mediaId = 'm-' + Math.random().toString(36).substr(2, 9);
            const label = file.name || (isVideo ? 'Uploaded Video' : 'Uploaded Photo');

            // 1. Direct upload to Firebase Cloud Storage bucket
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(file);
            } catch (storageErr) {
              console.warn('Storage upload notice, falling back:', storageErr);
            }

            if (cloudUrl) {
              setPhotos(prev => [
                ...prev,
                {
                  id: mediaId,
                  url: cloudUrl,
                  thumbUrl: cloudUrl,
                  isVideo: isVideo,
                  fileSize: file.size,
                  fileType: file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
                  label: label,
                  uploadedAt: new Date().toISOString()
                }

                      id: mediaId,
                      url: thumbUrl,

                      fileSize: file.size,
                      fileType: 'image/jpeg',
                      label: label,
                      uploadedAt: new Date().toISOString()
                    }
                  ]);
                }

            }
          } catch (err) {
            console.error('Photo/Video processing error:', err);
          }

    function EmailRoutingManager({ emailRoutingConfig, onSaveEmailRoutingConfig, staffUser, onBackToInquiries }) {
      if (!isSuperAdmin(staffUser)) {
        return (
          <div className="py-16 max-w-lg mx-auto text-center space-y-4">

              Only authorized administrator <strong className="text-white">reid@sr1companies.com</strong> has permission to configure where appraisal submissions are routed.
            </p>
            <div className="pt-2">
              <button
                type="button"
                onClick={onBackToInquiries}
                className="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded-xl text-xs font-semibold cursor-pointer transition-colors"
              >
                ← Return to Inquiries Workspace
              </button>
            </div>
          </div>
        );
      }

      const initialRouting = useMemo(() => {
        const merged = { ...DEALERSHIP_NOTIFICATION_EMAILS };
        if (emailRoutingConfig && typeof emailRoutingConfig === 'object') {
          Object.assign(merged, emailRoutingConfig);
        }
        return merged;
      }, [emailRoutingConfig]);

      const [routingState, setRoutingState] = useState(() => initialRouting);
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [isSaving, setIsSaving] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [testLocationId, setTestLocationId] = useState('powersports_epsom_nh');
      const [newEmailInputs, setNewEmailInputs] = useState({});

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Unsaved changes check
      const hasUnsavedChanges = useMemo(() => {
        return JSON.stringify(routingState) !== JSON.stringify(initialRouting);
      }, [routingState, initialRouting]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4500);
      };

      const handleAddEmail = (locId, emailInput) => {
        const raw = (emailInput || '').trim();
        if (!raw) return;
        const splitEmails = raw.split(/[,;\s]+/).map(e => e.trim().toLowerCase()).filter(Boolean);
        if (splitEmails.length === 0) return;

        const currentList = Array.isArray(routingState[locId]) ? routingState[locId] : [];
        const toAdd = splitEmails.filter(e => !currentList.includes(e));

        if (toAdd.length === 0) {
          showToast('Email already added for this store.');
          return;
        }

        setRoutingState(prev => ({
          ...prev,
          [locId]: [...currentList, ...toAdd]
        }));
        setNewEmailInputs(prev => ({ ...prev, [locId]: '' }));
      };

      const handleRemoveEmail = (locId, emailToRemove) => {
        const currentList = Array.isArray(routingState[locId]) ? routingState[locId] : [];
        if (currentList.length <= 1) {
          if (!window.confirm('Warning: Removing all recipients means this store location will fall back to appraisals@sr1companies.com. Remove anyway?')) {
            return;
          }
        }
        setRoutingState(prev => ({
          ...prev,
          [locId]: currentList.filter(e => e !== emailToRemove)
        }));
      };

      const handleResetLocation = (locId) => {
        const defaultEmails = DEALERSHIP_NOTIFICATION_EMAILS[locId] || ['appraisals@sr1companies.com'];
        setRoutingState(prev => ({
          ...prev,
          [locId]: [...defaultEmails]
        }));
        showToast('Reset store to factory defaults.');
      };

      const handleResetAllToDefaults = () => {
        if (window.confirm('Are you sure you want to reset ALL 18 store locations to system default routing? Click "Save Routing Changes" afterwards to commit to Firestore cloud.')) {
          setRoutingState({ ...DEALERSHIP_NOTIFICATION_EMAILS });
          showToast('Reset all locations to factory defaults.');
        }
      };

      const handleSave = async () => {
        setIsSaving(true);
        try {
          const ok = await onSaveEmailRoutingConfig(routingState);
          if (ok) {
            showToast('✓ Email routing saved successfully to Cloud Firestore! All future customer submissions will route to these recipients.');
          } else {
            showToast('Saved locally in browser storage.');
          }
        } catch (e) {
          showToast('Saved locally in browser storage.');
        } finally {
          setIsSaving(false);
        }
      };

      // Filter locations
      const filteredLocations = useMemo(() => {
        return LOCATIONS.filter(loc => {
          if (categoryFilter !== 'all') {
            if (categoryFilter === 'pickup') {
              if (loc.id !== 'pickup_requested') return false;
            } else if (loc.category !== categoryFilter) {
              return false;
            }
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const nameMatch = loc.name.toLowerCase().includes(q);
            const idMatch = loc.id.toLowerCase().includes(q);
            const emails = routingState[loc.id] || [];
            const emailMatch = emails.some(e => e.toLowerCase().includes(q));
            return nameMatch || idMatch || emailMatch;
          }
          return true;
        });
      }, [categoryFilter, searchQuery, routingState]);

      // Category counts for filter tabs
      const categoryCounts = useMemo(() => {
        const counts = { all: LOCATIONS.length, trailer: 0, rv: 0, equipment: 0, powersports: 0, container: 0, pickup: 0 };
        LOCATIONS.forEach(l => {
          if (l.id === 'pickup_requested') counts.pickup += 1;
          else if (counts[l.category] !== undefined) counts[l.category] += 1;
        });
        return counts;
      }, []);

      const testRecipients = useMemo(() => {
        return routingState[testLocationId] || DEALERSHIP_NOTIFICATION_EMAILS[testLocationId] || ['appraisals@sr1companies.com'];
      }, [testLocationId, routingState]);

      return (
        <div className="space-y-6">
          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 max-w-md bg-neutral-900 border border-amber-500/60 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3">

              <div className="text-xs font-semibold leading-relaxed">{toastMsg}</div>
            </div>
          )}

          <div className="bg-neutral-900 border border-neutral-800 p-4 sm:p-5 rounded-2xl space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-400/20 text-amber-300 border border-amber-400/30">
                    Super Admin Mode
                  </span>
                  <span className="text-[11px] text-neutral-400">
                    Logged in as <strong className="text-white">reid@sr1companies.com</strong>
                  </span>
                </div>
                <h2 className="text-lg sm:text-xl font-bold text-white">

                </h2>
                <p className="text-xs text-neutral-400 mt-0.5">

              </div>

              {/* SAVE / RESET ACTIONS */}

                </button>

                <button
                  type="button"

                  title="Revert all store recipients to default"
                >

                </button>

                <button
                  type="button"
                  onClick={handleSave}
                  disabled={isSaving}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-2 cursor-pointer ${
                    hasUnsavedChanges
                      ? 'bg-amber-400 hover:bg-amber-300 text-neutral-950'
                      : 'bg-white hover:bg-neutral-200 text-neutral-950'
                  }`}
                >
                  {isSaving ? (
                    <>
                      <span className="w-3.5 h-3.5 border-2 border-neutral-950 border-t-transparent rounded-full animate-spin"></span>
                      <span>Saving to Cloud...</span>
                    </>
                  ) : (
                    <>
                      <span>💾</span>
                      <span>{hasUnsavedChanges ? 'Save Routing Changes *' : 'Save Routing Changes'}</span>
                    </>
                  )}
                </button>
              </div>
            </div>

            {/* LIVE STATUS BANNER */}
            <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-neutral-850 text-xs">
              <div className="flex items-center gap-2 text-neutral-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Real-Time Cloud Firestore Sync Active</span>
                <span className="text-neutral-600">•</span>
                <span className="text-[11px] text-neutral-400">
                  {hasUnsavedChanges ? (
                    <strong className="text-amber-400">● Unsaved edits pending save</strong>

                    'All store routing up to date with cloud'

              </div>
              <div className="text-[11px] text-neutral-400">
                Centralized appraisal desk: <code className="text-neutral-300 bg-neutral-950 px-1.5 py-0.5 rounded border border-neutral-800">appraisals@sr1companies.com</code>

          {/* INTERACTIVE ROUTING SIMULATOR */}
          <div className="bg-neutral-900 border border-neutral-800 p-4 sm:p-5 rounded-2xl space-y-3">

          {/* FILTER & SEARCH BAR */}
          <div className="bg-neutral-900 border border-neutral-800 p-3.5 sm:p-4 rounded-2xl space-y-3">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">

              <div className="flex flex-wrap items-center gap-1.5 text-xs">
                {[
                  { id: 'all', label: `All Locations (${categoryCounts.all})` },

                  { id: 'equipment', label: `Equipment (${categoryCounts.equipment})` },
                  { id: 'powersports', label: `Powersports (${categoryCounts.powersports})` },

                    key={tab.id}

                    onClick={() => setCategoryFilter(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                      categoryFilter === tab.id
                        ? 'bg-neutral-100 text-neutral-950 font-bold shadow-sm'
                        : 'bg-neutral-950/80 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800'

              </div>

              {/* Search input */}
              <div className="w-full md:w-72 relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search store name, town, or email..."
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-lg pl-8 pr-7 py-1.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500"
                />
                <span className="absolute left-2.5 top-2 text-neutral-500 text-xs">🔍</span>
                {searchQuery && (

          {/* STORE LOCATIONS LIST */}
          <div className="space-y-3">
            {filteredLocations.length === 0 ? (
              <div className="bg-neutral-900 border border-neutral-800 p-8 rounded-2xl text-center space-y-2">
                <div className="text-xl">🔍</div>
                <div className="text-sm font-bold text-white">No store locations match your filter</div>
                <p className="text-xs text-neutral-400">Try clearing your search term or selecting All Locations.</p>
                <button
                  type="button"
                  onClick={() => { setCategoryFilter('all'); setSearchQuery(''); }}
                  className="mt-2 px-3 py-1.5 bg-neutral-800 hover:bg-neutral-750 text-white rounded-lg text-xs font-semibold cursor-pointer"
                >
                  Clear Filters
                </button>
              </div>
            ) : (
              filteredLocations.map(loc => {
                const emails = Array.isArray(routingState[loc.id]) && routingState[loc.id].length > 0
                  ? routingState[loc.id]
                  : (DEALERSHIP_NOTIFICATION_EMAILS[loc.id] || ['appraisals@sr1companies.com']);
                
                const defaultEmails = DEALERSHIP_NOTIFICATION_EMAILS[loc.id] || ['appraisals@sr1companies.com'];
                const isCustomized = JSON.stringify(emails) !== JSON.stringify(defaultEmails);

                const getCategoryBadge = (cat) => {
                  switch (cat) {
                    case 'rv':
                      return { label: 'SR1 RV', color: 'bg-amber-950/70 border-amber-800/80 text-amber-300' };
                    case 'trailer':
                      return { label: 'SR1 Trailers', color: 'bg-blue-950/70 border-blue-800/80 text-blue-300' };
                    case 'equipment':
                      return { label: 'SR1 Equipment', color: 'bg-emerald-950/70 border-emerald-800/80 text-emerald-300' };
                    case 'powersports':
                      return { label: 'SR1 Powersports', color: 'bg-purple-950/70 border-purple-800/80 text-purple-300' };
                    case 'container':
                      return { label: 'SR1 Containers', color: 'bg-cyan-950/70 border-cyan-800/80 text-cyan-300' };
                    default:
                      return { label: 'On-Site Pickup', color: 'bg-neutral-800 border-neutral-700 text-neutral-300' };
                  }
                };
                const badge = getCategoryBadge(loc.category);

                return (
                  <div
                    key={loc.id}
                    className="bg-neutral-900 border border-neutral-800 hover:border-neutral-750 p-4 sm:p-5 rounded-2xl space-y-3.5 transition-all"
                  >
                    {/* Top Row: Store Title, Division Badge & Status */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-neutral-850">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold uppercase border ${badge.color}`}>
                          {badge.label}
                        </span>
                        <h4 className="text-sm sm:text-base font-bold text-white">
                          {loc.name}
                        </h4>
                        <code className="text-[10px] text-neutral-500 font-mono bg-neutral-950 px-1.5 py-0.5 rounded border border-neutral-850">
                          {loc.id}
                        </code>
                      </div>

                      <div className="flex items-center gap-2 self-start sm:self-auto">
                        {isCustomized ? (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-950/70 border border-amber-800 text-amber-300">
                            Customized ({emails.length})
                          </span>
                        ) : (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-neutral-950 border border-neutral-800 text-neutral-400">
                            System Default ({emails.length})
                          </span>
                        )}

                        {isCustomized && (
                          <button
                            type="button"
                            onClick={() => handleResetLocation(loc.id)}
                            className="text-[11px] text-neutral-400 hover:text-white underline cursor-pointer"
                            title="Reset this store to default recipients"
                          >
                            Reset Store
                          </button>
                        )}
                      </div>
                    </div>

                    {/* Email Chips / Recipient Tags */}
                    <div className="space-y-2">
                      <label className="block text-[11px] font-semibold text-neutral-400 uppercase tracking-wide">
                        Notification Recipients:
                      </label>

                      <div className="flex flex-wrap items-center gap-2">
                        {emails.map((email, idx) => {
                          const isValid = emailRegex.test(email);
                          return (
                            <span
                              key={email + idx}
                              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-mono transition-all border ${
                                isValid
                                  ? idx === 0
                                    ? 'bg-neutral-850 border-neutral-700 text-white font-bold'
                                    : 'bg-neutral-950 border-neutral-800 text-neutral-300'
                                  : 'bg-rose-950/80 border-rose-800 text-rose-200'
                              }`}
                            >
                              <span className="text-[10px] opacity-70">
                                {idx === 0 ? '👑 Primary' : '📧 CC'}
                              </span>
                              <span>{email}</span>
                              {!isValid && (
                                <span className="text-rose-400 text-[10px] font-sans font-bold" title="Invalid email syntax">
                                  ⚠️
                                </span>
                              )}
                              <button
                                type="button"
                                onClick={() => handleRemoveEmail(loc.id, email)}
                                className="ml-1 text-neutral-400 hover:text-rose-300 font-sans text-xs cursor-pointer p-0.5 hover:bg-neutral-800 rounded"
                                title={`Remove ${email}`}
                              >
                                ✕
                              </button>
                            </span>
                          );
                        })}
                      </div>
                    </div>

                    {/* Add Recipient Form Input */}
                    <div className="pt-2 flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                      <div className="flex-1 relative">
                        <input
                          type="email"
                          value={newEmailInputs[loc.id] || ''}
                          onChange={(e) => setNewEmailInputs(prev => ({ ...prev, [loc.id]: e.target.value }))}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter') {
                              e.preventDefault();
                              handleAddEmail(loc.id, newEmailInputs[loc.id]);
                            }
                          }}
                          placeholder="Add email address (e.g. employee@sr1companies.com) or paste comma-separated list..."
                          className="w-full bg-neutral-950 border border-neutral-800 focus:border-amber-400 text-white placeholder-neutral-500 rounded-xl px-3 py-2 text-xs focus:outline-none"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={() => handleAddEmail(loc.id, newEmailInputs[loc.id])}
                        className="px-4 py-2 bg-neutral-800 hover:bg-neutral-750 text-white font-bold rounded-xl text-xs transition-colors cursor-pointer shrink-0 flex items-center justify-center gap-1.5"
                      >
                        <span>+</span>
                        <span>Add Recipient</span>
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function StaffPortalView({ inquiries, onUpdateInquiry, selectedInquiryId, setSelectedInquiryId, staffUser, onSignOut, onSyncSamplesToCloud, emailRoutingConfig, onSaveEmailRoutingConfig }) {
      const canManageRouting = isSuperAdmin(staffUser);
      const [portalTab, setPortalTab] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('tab') === 'routing' && isSuperAdmin(staffUser)) return 'routing';
        } catch (e) {}
        return 'inquiries';
      });
      const [filterStage, setFilterStage] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          return params.get('stage') || 'all';
        } catch (e) {
          return 'all';
        }
      });
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterLocation, setFilterLocation] = useState('all');
      const [filterIntent, setFilterIntent] = useState('all'); // 'all', 'trade', 'sell'
      const [searchTerm, setSearchTerm] = useState('');
      const [mobileLayout, setMobileLayout] = useState(() => {
        try {
          return localStorage.getItem('sell2sr1_mobile_layout') || 'cards';
        } catch (e) {
          return 'cards';
        }
      });
      const [sortField, setSortField] = useState('date'); // 'date', 'ref', 'unit', 'customer', 'location', 'stage', 'offer', 'type'
      const [sortDirection, setSortDirection] = useState('desc'); // 'asc', 'desc'
      const [showInstallGuide, setShowInstallGuide] = useState(false);
      const [copiedLink, setCopiedLink] = useState(false);

      const handleSetMobileLayout = (layout) => {
        setMobileLayout(layout);
        try {
          localStorage.setItem('sell2sr1_mobile_layout', layout);
        } catch (e) {}
      };

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDirection(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDirection(field === 'date' || field === 'offer' ? 'desc' : 'asc');
        }
      };

      const stageCounts = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        let allActive = 0;
        let archived = 0;
        const counts = {};
        Object.keys(STAGES).forEach(k => { counts[k] = 0; });
        list.forEach(inq => {
          if (!inq) return;
          const isArch = inq.isArchived || inq.stage === 'archived';
          if (isArch) {
            archived += 1;
            counts.archived = (counts.archived || 0) + 1;
          } else {
            allActive += 1;
            if (inq.stage && counts[inq.stage] !== undefined) {
              counts[inq.stage] += 1;
            }
          }
        });
        counts.all = allActive;
        counts.archived = archived;
        return counts;
      }, [inquiries]);

      const filtered = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        return list.filter(inq => {
          if (!inq) return false;
          const isArch = inq.isArchived || inq.stage === 'archived';

          if (filterStage === 'archived') {
            if (!isArch) return false;
          } else if (filterStage === 'all') {
            if (isArch) return false;
          } else {
            if (isArch) return false;
            if (inq.stage !== filterStage) return false;
          }

          if (filterCategory !== 'all' && inq.unit?.category !== filterCategory) return false;
          if (filterLocation !== 'all' && inq.preferredLocation !== filterLocation) return false;
          if (filterIntent !== 'all') {
            const inqIntent = inq.intent || 'sell';
            if (inqIntent !== filterIntent) return false;
          }
          if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            const custName = `${inq.customer?.firstName || ''} ${inq.customer?.lastName || ''}`.toLowerCase();
            const ref = String(inq.referenceId || '').toLowerCase();
            const unitStr = `${inq.unit?.year || ''} ${inq.unit?.make || ''} ${inq.unit?.model || ''}`.toLowerCase();
            const vinStr = String(inq.unit?.vinOrSerial || '').toLowerCase();
            const salesStr = String(inq.salespersonName || '').toLowerCase();
            const locStr = getLocationName(inq.preferredLocation).toLowerCase();
            const phoneStr = String(inq.customer?.phone || '').toLowerCase();
            const emailStr = String(inq.customer?.email || '').toLowerCase();
            return custName.includes(term) || ref.includes(term) || unitStr.includes(term) || vinStr.includes(term) || salesStr.includes(term) || locStr.includes(term) || phoneStr.includes(term) || emailStr.includes(term);
          }
          return true;
        });
      }, [inquiries, filterStage, filterCategory, filterLocation, filterIntent, searchTerm]);

      const sorted = useMemo(() => {
        return [...filtered].sort((a, b) => {
          let valA = '';
          let valB = '';
          if (sortField === 'date') {
            valA = new Date(a.createdAt || 0).getTime();
            valB = new Date(b.createdAt || 0).getTime();
          } else if (sortField === 'ref') {
            valA = String(a.referenceId || '');
            valB = String(b.referenceId || '');
          } else if (sortField === 'type') {
            valA = a.intent || 'sell';
            valB = b.intent || 'sell';
          } else if (sortField === 'unit') {
            valA = `${a.unit?.year || ''} ${a.unit?.make || ''} ${a.unit?.model || ''}`.trim().toLowerCase();
            valB = `${b.unit?.year || ''} ${b.unit?.make || ''} ${b.unit?.model || ''}`.trim().toLowerCase();
          } else if (sortField === 'customer') {
            valA = `${a.customer?.lastName || ''} ${a.customer?.firstName || ''}`.trim().toLowerCase();
            valB = `${b.customer?.lastName || ''} ${b.customer?.firstName || ''}`.trim().toLowerCase();
          } else if (sortField === 'location') {
            valA = getLocationName(a.preferredLocation).toLowerCase();
            valB = getLocationName(b.preferredLocation).toLowerCase();
          } else if (sortField === 'stage') {
            valA = a.stage || '';
            valB = b.stage || '';
          } else if (sortField === 'offer') {
            valA = (Array.isArray(a.offers) && a.offers.length > 0) ? (Number(a.offers[a.offers.length - 1].amount) || 0) : -1;
            valB = (Array.isArray(b.offers) && b.offers.length > 0) ? (Number(b.offers[b.offers.length - 1].amount) || 0) : -1;
          }
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filtered, sortField, sortDirection]);

      const handleArchiveInquiry = (inq) => {
        if (!inq) return;
        const confirmMsg = `Archive inquiry #${inq.referenceId} (${inq.unit?.year || ''} ${inq.unit?.make || ''} ${inq.unit?.model || ''})?\n\nIt will be hidden from the active pipeline and moved to the Archived tab.`;
        if (!confirm(confirmMsg)) return;

        const now = new Date().toISOString();
        const prevStage = (inq.stage && inq.stage !== 'archived') ? inq.stage : 'new';
        const archiveNote = {
          id: 'note-' + Date.now(),
          authorName: staffUser?.name || 'SR1 Staff',
          authorRole: 'Appraiser',
          createdAt: new Date().toLocaleTimeString(),
          category: 'general',
          content: 'Inquiry archived.'
        };

        const updated = {
          ...inq,
          isArchived: true,
          stage: 'archived',
          previousStage: prevStage,
          archivedAt: now,
          archivedBy: staffUser?.name || 'Staff Appraiser',
          notes: Array.isArray(inq.notes) ? [...inq.notes, archiveNote] : [archiveNote],
          updatedAt: now
        };

        onUpdateInquiry(updated);
      };

      const handleUnarchiveInquiry = (inq) => {
        if (!inq) return;
        const restoredStage = (inq.previousStage && inq.previousStage !== 'archived') ? inq.previousStage : 'new';
        const now = new Date().toISOString();
        const unarchiveNote = {
          id: 'note-' + Date.now(),
          authorName: staffUser?.name || 'SR1 Staff',
          authorRole: 'Appraiser',
          createdAt: new Date().toLocaleTimeString(),
          category: 'general',
          content: `Inquiry restored from archive back to ${STAGES[restoredStage]?.label || 'active pipeline'}.`
        };

        const updated = {
          ...inq,
          isArchived: false,
          stage: restoredStage,
          archivedAt: null,
          archivedBy: null,
          notes: Array.isArray(inq.notes) ? [...inq.notes, unarchiveNote] : [unarchiveNote],
          updatedAt: now
        };

        onUpdateInquiry(updated);
      };

      const selectedInquiry = (inquiries || []).find(i => i && i.id === selectedInquiryId);

      return (
        <div className="py-4 sm:py-6 max-w-[1760px] w-full mx-auto px-2 sm:px-6 lg:px-8 space-y-4 sm:space-y-6 overflow-x-hidden">
          
          {/* HEADER */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 bg-neutral-900 border border-neutral-800 p-3.5 sm:p-4 rounded-2xl">
            <div className="flex flex-col sm:flex-row sm:items-center gap-3">
              <div>
                <h1 className="text-base sm:text-lg font-bold text-white">Staff Appraisal & Purchasing Desk</h1>
                <p className="text-xs text-neutral-400">Direct mobile & desktop appraisal portal for SR1 Companies</p>
              </div>

              {canManageRouting && (
                <div className="flex items-center p-1 bg-neutral-950 border border-neutral-800 rounded-xl space-x-1 sm:ml-4">
                  <button
                    type="button"
                    onClick={() => setPortalTab('inquiries')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'inquiries' ? 'bg-neutral-100 text-neutral-950 shadow-sm' : 'text-neutral-400 hover:text-white'}`}
                  >
                    <span>📋</span>
                    <span>Inquiries Pipeline</span>
                    <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${portalTab === 'inquiries' ? 'bg-neutral-300 text-neutral-900' : 'bg-neutral-800 text-neutral-400'}`}>
                      {stageCounts.all || 0}
                    </span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setPortalTab('routing')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'routing' ? 'bg-amber-400 text-neutral-950 shadow-sm' : 'text-amber-400 hover:text-amber-300 hover:bg-neutral-900'}`}
                    title="Exclusive to reid@sr1companies.com: Edit where each submission routes"
                  >

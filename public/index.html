                                {item.salespersonName && <span>• {item.salespersonName.split(' ')[0]}</span>}
                              </span>
                            ) : (
                              <span className="px-2 py-0.5 rounded text-[10px] font-semibold bg-neutral-800 text-neutral-300 border border-neutral-700 inline-block">
                                💵 Sell
                              </span>
                            )}
                          </td>

                          {/* Unit Details + Thumbnail */}
                          <td className="p-3.5">
                            <div className="flex items-center gap-3">
                              {firstThumb ? (
                                <div className="relative w-12 h-12 rounded-lg overflow-hidden bg-black border border-neutral-800 shrink-0 group-hover:border-neutral-700 transition-colors">
                                  <img src={firstThumb} alt="" className="w-full h-full object-cover" />
                                  <span className="absolute bottom-0.5 right-0.5 bg-black/85 text-[8px] text-white px-1 rounded font-bold">
                                    📷{item.photos.length}
                                  </span>
                                </div>
                              ) : (
                                <div className="w-12 h-12 rounded-lg bg-neutral-950 border border-neutral-800 flex items-center justify-center shrink-0 text-base text-neutral-500">
                                  {item.unit.category === 'rv' ? '🏕️' : item.unit.category === 'powersports' ? '🏍️' : item.unit.category === 'trailer' ? '🚛' : item.unit.category === 'tractor' ? '🚜' : '📦'}
                                </div>
                              )}
                              <div className="min-w-0 flex-1">
                                <div className="font-bold text-white text-xs group-hover:text-blue-300 transition-colors">
                                  {item.unit?.year} {item.unit?.make} {item.unit?.model} {item.unit?.trimOrFloorplan || ''}
                                </div>
                                <div className="text-[11px] text-neutral-400 mt-0.5 flex items-center space-x-2">
                                  <span>{item.unit?.subcategory || CATEGORIES[item.unit?.category]?.label || 'Unit'}</span>
                                  {item.unit?.mileageOrHours > 0 && (
                                    <>
                                      <span>•</span>
                                      <span>{item.unit.mileageOrHours.toLocaleString()} {item.unit.isHours ? 'hrs' : 'mi'}</span>
                                    </>
                                  )}
                                  {item.financials?.lienHolderName && (
                                    <>
                                      <span>•</span>
                                      <span className="text-amber-400 font-medium" title={`Lien Holder: ${item.financials.lienHolderName}${item.financials.estimatedPayoff ? ` (Est. Payoff: $${item.financials.estimatedPayoff.toLocaleString()})` : ''}`}>
                                        Lien: {item.financials.lienHolderName}
                                      </span>
                                    </>
                                  )}
                                </div>
                                {item.unit?.vinOrSerial && (
                                  <div className="text-[10px] text-neutral-500 font-mono mt-0.5 truncate">
                                    VIN: {item.unit.vinOrSerial}
                                  </div>
                                )}
                              </div>
                            </div>
                          </td>

                          {/* Customer */}
                          <td className="p-3.5">
                            <div className="font-bold text-neutral-200">
                              {item.customer?.firstName} {item.customer?.lastName}
                            </div>
                            <div className="text-[11px] text-neutral-400 font-mono mt-0.5">
                              {item.customer?.phone || item.customer?.email || 'No contact'}
                            </div>
                            {item.customer?.phone && (
                              <div className="flex items-center gap-1.5 mt-1.5" onClick={e => e.stopPropagation()}>
                                <a
                                  href={`tel:${item.customer.phone}`}
                                  className="px-2 py-0.5 bg-neutral-950 hover:bg-neutral-800 text-neutral-300 hover:text-white rounded text-[10px] border border-neutral-800 font-semibold transition-colors"
                                  title="Call client"
                                >
                                  📞 Call
                                </a>
                                <a
                                  href={`sms:${item.customer.phone}`}
                                  className="px-2 py-0.5 bg-neutral-950 hover:bg-neutral-800 text-neutral-300 hover:text-white rounded text-[10px] border border-neutral-800 font-semibold transition-colors"
                                  title="Text client"
                                >
                                  💬 Text
                                </a>
                              </div>
                            )}
                          </td>

                          {/* Store Location */}
                          <td className="p-3.5 text-neutral-300 text-xs">
                            <div className="font-medium">{getLocationName(item.preferredLocation)}</div>
                            {item.customer?.city && (
                              <div className="text-[10px] text-neutral-500 mt-0.5">
                                Client: {item.customer.city}, {item.customer.state}
                              </div>
                            )}
                          </td>

                          {/* Outreach */}
                          <td className="p-3.5 whitespace-nowrap">
                            {item.outreach?.reachedOut ? (
                              <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-950/80 border border-emerald-800/80 text-emerald-300 shadow-sm">
                                <span>✓</span>
                                <span>{item.outreach.staffName || 'Contacted'}</span>
                              </span>
                            ) : (
                              <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded text-[10px] font-semibold bg-amber-950/60 border border-amber-800/60 text-amber-300">
                                <span>⏳ Needs Outreach</span>
                              </span>
                            )}
                          </td>

                          {/* Stage */}
                          <td className="p-3.5 whitespace-nowrap">
                            <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold border inline-block ${stageConfig.color}`}>
                              {stageConfig.label}
                            </span>
                          </td>

                          {/* Offer */}
                          <td className="p-3.5 whitespace-nowrap">
                            {lastOffer && typeof lastOffer.amount === 'number' ? (
                              <div>
                                <span className="font-bold text-white font-mono text-sm">
                                  ${lastOffer.amount.toLocaleString()}
                                </span>
                                {item.offers.length > 1 && (
                                  <div className="text-[9px] text-neutral-400">
                                    {item.offers.length} offers logged
                                  </div>
                                )}
                              </div>
                            ) : (
                              <span className="text-neutral-500 font-mono text-xs">—</span>
                            )}
                          </td>

                          {/* Action */}
                          <td className="p-3.5 text-right whitespace-nowrap" onClick={e => e.stopPropagation()}>
                            <div className="flex items-center justify-end gap-1.5">
                              <button
                                onClick={() => setSelectedInquiryId(item.id)}
                                className="px-3.5 py-1.5 bg-neutral-100 hover:bg-white text-neutral-950 font-bold rounded-lg text-xs shadow-sm transition-all"
                              >
                                Appraise →
                              </button>
                              {item.isArchived || item.stage === 'archived' ? (
                                <button
                                  type="button"
                                  onClick={() => handleUnarchiveInquiry(item)}
                                  className="px-2.5 py-1.5 bg-neutral-900 hover:bg-neutral-800 text-amber-400 hover:text-amber-300 border border-neutral-800 hover:border-amber-700/60 font-semibold rounded-lg text-xs transition-all"
                                  title="Restore to active pipeline"
                                >
                                  ↩️ Restore
                                </button>
                              ) : (
                                <button
                                  type="button"
                                  onClick={() => handleArchiveInquiry(item)}
                                  className="px-2.5 py-1.5 bg-neutral-900 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800 hover:border-neutral-700 font-semibold rounded-lg text-xs transition-all"
                                  title="Archive inquiry"
                                >
                                  📦 Archive
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
            </>
          )}

          {/* APPRAISAL MODAL */}
          {selectedInquiry && (
            <AppraisalWorkspaceModal
              inquiry={selectedInquiry}
              onClose={() => setSelectedInquiryId(null)}
              onUpdateInquiry={onUpdateInquiry}
            />
          )}

          {/* MOBILE APP INSTALLATION MODAL */}
          {showInstallGuide && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-750 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-5 text-neutral-200">
                <div className="flex items-center justify-between pb-3 border-b border-neutral-800">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-xl bg-neutral-800 border border-neutral-700 flex items-center justify-center text-lg">
                      📱
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-white">Install SR1 Staff App</h3>
                      <p className="text-xs text-neutral-400">Direct standalone access on iPhone & Android</p>
                    </div>
                  </div>
                  <button onClick={() => setShowInstallGuide(false)} className="text-neutral-400 hover:text-white text-lg font-bold">✕</button>
                </div>

                {/* iPhone instructions */}
                <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-2.5">
                  <div className="flex items-center space-x-2 text-white font-bold text-xs uppercase tracking-wide">
                    <span>🍏</span>
                    <span>For iPhone (Apple Safari)</span>
                  </div>
                  <ol className="list-decimal list-inside space-y-1.5 text-xs text-neutral-300">
                    <li>Open <strong>sell2sr1.com/?view=portal</strong> in Safari.</li>
                    <li>Tap the <strong>Share button (↑)</strong> at the bottom center of Safari.</li>
                    <li>Scroll down and select <strong>"Add to Home Screen"</strong>.</li>
                    <li>Tap <strong>"Add"</strong> in the top right. The <strong>SR1 Staff</strong> app icon will appear directly on your home screen and open full-screen!</li>
                  </ol>
                </div>

                {/* Android instructions */}
                <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-2.5">
                  <div className="flex items-center space-x-2 text-white font-bold text-xs uppercase tracking-wide">
                    <span>🤖</span>
                    <span>For Android (Google Chrome)</span>
                  </div>
                  <ol className="list-decimal list-inside space-y-1.5 text-xs text-neutral-300">
                    <li>Open <strong>sell2sr1.com/?view=portal</strong> in Chrome.</li>
                    <li>Tap the <strong>three dots (⋮)</strong> menu in the upper right.</li>
                    <li>Select <strong>"Install app"</strong> or <strong>"Add to Home screen"</strong>.</li>
                    <li>Confirm installation. The app will launch in full-screen standalone mode.</li>
                  </ol>
                </div>

                {/* Direct Link Actions */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText('https://sell2sr1.com/?view=portal');
                      setCopiedLink(true);
                      setTimeout(() => setCopiedLink(false), 2500);
                    }}
                    className="w-full sm:w-auto px-4 py-2.5 bg-neutral-100 hover:bg-white text-neutral-950 font-bold text-xs rounded-xl transition-all"
                  >
                    {copiedLink ? '✓ Portal Link Copied to Clipboard!' : 'Copy Direct App Link'}
                  </button>
                  <button
                    onClick={() => setShowInstallGuide(false)}
                    className="w-full sm:w-auto px-5 py-2.5 bg-neutral-800 hover:bg-neutral-750 text-neutral-300 text-xs font-semibold rounded-xl"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 4. APPRAISAL WORKSPACE MODAL
    // ==========================================
    function AppraisalWorkspaceModal({ inquiry, onClose, onUpdateInquiry }) {
      const [currentStage, setCurrentStage] = useState(inquiry.stage);
      const [offerAmount, setOfferAmount] = useState(inquiry.offers?.[0]?.amount || 25000);
      const [offerNotes, setOfferNotes] = useState(inquiry.offers?.[0]?.notes || 'Subject to physical inspection and title verification.');
      const [newNoteText, setNewNoteText] = useState('');
      const [activeMedia, setActiveMedia] = useState(inquiry.photos?.[0] || null);
      const [activePhoto, setActivePhoto] = useState(inquiry.photos?.[0]?.url || inquiry.photos?.[0]?.thumbUrl || '');
      const [outreachStaffName, setOutreachStaffName] = useState(inquiry.outreach?.staffName || '');
      const [reachedOut, setReachedOut] = useState(inquiry.outreach?.reachedOut || false);
      const [reachedOutAt, setReachedOutAt] = useState(inquiry.outreach?.reachedOutAt || null);

      // Market Comps Live Search State
      const defaultCompsQuery = [inquiry.unit.year, inquiry.unit.make, inquiry.unit.model].filter(Boolean).join(' ');
      const [fbCompsQuery, setFbCompsQuery] = useState(defaultCompsQuery);

      const netEquity = Math.max(0, offerAmount - (inquiry.financials.estimatedPayoff || 0));

      const handleToggleOutreach = (checked) => {
        if (checked && !outreachStaffName.trim()) {
          alert('Please enter your staff name before checking off that you reached out.');
          return;
        }
        const now = new Date().toLocaleString();
        setReachedOut(checked);
        setReachedOutAt(checked ? now : null);

        const newOutreach = {
          reachedOut: checked,
          staffName: checked ? outreachStaffName.trim() : '',
          reachedOutAt: checked ? now : null
        };

        const updated = {
          ...inquiry,
          outreach: newOutreach,
          updatedAt: new Date().toISOString(),
          notes: checked ? [
            ...inquiry.notes,
            {
              id: 'n-outreach-' + Date.now(),
              authorName: outreachStaffName.trim(),
              authorRole: 'Staff Member',
              createdAt: new Date().toLocaleTimeString(),
              category: 'call_log',
              content: `Staff member ${outreachStaffName.trim()} confirmed direct outreach to client (${inquiry.customer.phone} / ${inquiry.customer.email}).`
            }
          ] : inquiry.notes
        };

        onUpdateInquiry(updated);
      };

      const handleSaveStaffName = (name) => {
        setOutreachStaffName(name);
        if (reachedOut) {
          onUpdateInquiry({
            ...inquiry,
            outreach: {
              ...inquiry.outreach,
              staffName: name.trim()
            },
            updatedAt: new Date().toISOString()
          });
        }
      };

      const isArchived = Boolean(inquiry.isArchived || currentStage === 'archived' || inquiry.stage === 'archived');

      useEffect(() => {
        setCurrentStage(inquiry.stage);
      }, [inquiry.stage]);

      const handleSaveStage = (newSt) => {
        setCurrentStage(newSt);
        const now = new Date().toISOString();
        if (newSt === 'archived') {
          const prevStage = (inquiry.stage && inquiry.stage !== 'archived') ? inquiry.stage : (inquiry.previousStage || 'new');
          const archiveNote = {
            id: 'note-' + Date.now(),
            authorName: outreachStaffName.trim() || 'Staff Appraiser',
            authorRole: 'Appraiser',
            createdAt: new Date().toLocaleTimeString(),
            category: 'general',
            content: 'Stage set to Archived. Inquiry hidden from active pipeline.'
          };
          onUpdateInquiry({
            ...inquiry,
            stage: 'archived',
            isArchived: true,
            previousStage: prevStage,
            archivedAt: now,
            archivedBy: outreachStaffName.trim() || 'Staff Appraiser',
            notes: Array.isArray(inquiry.notes) ? [...inquiry.notes, archiveNote] : [archiveNote],
            updatedAt: now
          });
        } else if (inquiry.isArchived || inquiry.stage === 'archived') {
          const restoreNote = {
            id: 'note-' + Date.now(),
            authorName: outreachStaffName.trim() || 'Staff Appraiser',
            authorRole: 'Appraiser',
            createdAt: new Date().toLocaleTimeString(),
            category: 'general',
            content: `Stage changed from Archived to ${STAGES[newSt]?.label || newSt}. Inquiry restored to active pipeline.`
          };
          onUpdateInquiry({
            ...inquiry,
            stage: newSt,
            isArchived: false,
            previousStage: null,
            notes: Array.isArray(inquiry.notes) ? [...inquiry.notes, restoreNote] : [restoreNote],
            updatedAt: now
          });
        } else {
          onUpdateInquiry({
            ...inquiry,
            stage: newSt,
            updatedAt: now
          });
        }
      };

      const handleArchiveInModal = () => {
        const confirmMsg = `Archive inquiry #${inquiry.referenceId} (${inquiry.unit?.year || ''} ${inquiry.unit?.make || ''} ${inquiry.unit?.model || ''})?\n\nIt will be hidden from the active pipeline and moved to the Archived tab.`;
        if (!confirm(confirmMsg)) return;
        handleSaveStage('archived');
      };

      const handleUnarchiveInModal = () => {
        const restoredStage = (inquiry.previousStage && inquiry.previousStage !== 'archived') ? inquiry.previousStage : 'new';
        handleSaveStage(restoredStage);
      };

      const handleSendOffer = () => {
        const newOffer = {
          id: 'off-' + Date.now(),
          amount: Number(offerAmount),
          expirationDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'sent',
          createdAt: new Date().toLocaleTimeString(),
          createdBy: 'SR1 Appraisal Desk',
          notes: offerNotes,
          customerPayoffEstimate: inquiry.financials.estimatedPayoff || 0,
          calculatedNetEquity: netEquity
        };

        const updated = {
          ...inquiry,
          stage: 'offer_sent',
          updatedAt: new Date().toISOString(),
          offers: [...(inquiry.offers || []), newOffer],
          notes: [
            ...inquiry.notes,
            {
              id: 'n-off-' + Date.now(),
              authorName: 'Appraisal Desk',
              authorRole: 'Buyer',
              createdAt: new Date().toLocaleTimeString(),
              category: 'offer_reason',
              content: `Cash offer of $${Number(offerAmount).toLocaleString()} recorded.`
            }
          ]
        };

        setCurrentStage('offer_sent');
        onUpdateInquiry(updated);
        alert(`Cash offer of $${Number(offerAmount).toLocaleString()} logged for ${inquiry.customer.firstName}.`);
      };

      const handleAddNote = (e) => {
        e.preventDefault();
        if (!newNoteText.trim()) return;

        const newNote = {
          id: 'note-' + Date.now(),
          authorName: 'Staff Buyer',
          authorRole: 'Team Member',
          createdAt: new Date().toLocaleTimeString(),
          category: 'comp',
          content: newNoteText.trim()
        };

        onUpdateInquiry({
          ...inquiry,
          notes: [...inquiry.notes, newNote],
          updatedAt: new Date().toISOString()
        });
        setNewNoteText('');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 md:p-6 overflow-y-auto">
          <div className="bg-neutral-900 border border-neutral-750 rounded-2xl w-full max-w-6xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden text-xs">
            
            <div className="bg-neutral-950 p-4 border-b border-neutral-800 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-mono text-neutral-300 font-bold bg-neutral-850 px-2 py-0.5 rounded">
                    {inquiry.referenceId}
                  </span>
                  {inquiry.intent === 'trade' ? (
                    <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-950 border border-blue-700 text-blue-300 flex items-center gap-1">
                      <span>🔄 Trade-In</span>
                      {inquiry.salespersonName && (
                        <span className="text-white bg-blue-900/60 px-1.5 py-0.2 rounded text-[10px]">
                          Salesperson: {inquiry.salespersonName}
                        </span>
                      )}
                    </span>
                  ) : (
                    <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-neutral-850 border border-neutral-750 text-neutral-300">
                      💵 Outright Sale
                    </span>
                  )}
                  <h2 className="text-base font-bold text-white">
                    {inquiry.unit.year} {inquiry.unit.make} {inquiry.unit.model}
                  </h2>
                </div>
                <div className="flex flex-wrap items-center gap-2 mt-1.5">
                  <span className="text-[11px] text-neutral-400">
                    Seller: <strong className="text-white">{inquiry.customer.firstName} {inquiry.customer.lastName}</strong>
                  </span>
                  <a
                    href={`tel:${inquiry.customer.phone}`}
                    className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-emerald-950/70 border border-emerald-800 hover:bg-emerald-900 text-emerald-300 font-semibold rounded-md text-[11px] transition-colors"
                  >
                    <span>📞</span> {inquiry.customer.phone}
                  </a>
                  <a
                    href={`sms:${inquiry.customer.phone}`}
                    className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-blue-950/70 border border-blue-800 hover:bg-blue-900 text-blue-300 font-semibold rounded-md text-[11px] transition-colors"
                  >
                    <span>💬</span> Text
                  </a>
                  <a
                    href={`mailto:${inquiry.customer.email}`}
                    className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-neutral-850 border border-neutral-750 hover:bg-neutral-800 text-neutral-300 font-semibold rounded-md text-[11px] transition-colors"
                  >
                    <span>✉️</span> Email
                  </a>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                {isArchived ? (
                  <button
                    type="button"
                    onClick={handleUnarchiveInModal}
                    className="px-2.5 py-1.5 bg-amber-950/70 hover:bg-amber-900 border border-amber-800 text-amber-300 font-semibold rounded-lg text-xs flex items-center gap-1 transition-colors cursor-pointer"
                    title="Restore to active pipeline"
                  >
                    <span>↩️</span> Restore
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={handleArchiveInModal}
                    className="px-2.5 py-1.5 bg-neutral-850 hover:bg-neutral-800 border border-neutral-750 text-neutral-300 hover:text-white font-semibold rounded-lg text-xs flex items-center gap-1 transition-colors cursor-pointer"
                    title="Archive inquiry"
                  >
                    <span>📦</span> Archive
                  </button>
                )}

                <select
                  value={currentStage}
                  onChange={(e) => handleSaveStage(e.target.value)}
                  className="bg-neutral-850 border border-neutral-750 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-white"
                >
                  {Object.entries(STAGES).map(([k, v]) => (
                    <option key={k} value={k}>{v.label}</option>
                  ))}
                </select>

                <button
                  onClick={onClose}
                  className="w-7 h-7 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-neutral-300 flex items-center justify-center font-bold"
                >
                  ✕
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
              {isArchived && (
                <div className="bg-amber-950/40 border border-amber-800/80 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-amber-200">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">📦</span>
                    <div>
                      <div className="font-bold text-xs text-amber-300 flex items-center gap-2">
                        <span>This inquiry is archived</span>
                        <span className="px-1.5 py-0.2 rounded text-[10px] font-semibold bg-amber-900/60 border border-amber-700 text-amber-200">
                          Hidden from active pipeline
                        </span>
                      </div>
                      <div className="text-[11px] text-amber-200/80 mt-0.5">
                        {inquiry.archivedAt ? `Archived on ${new Date(inquiry.archivedAt).toLocaleDateString()} at ${new Date(inquiry.archivedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'Archived'}
                        {inquiry.archivedBy ? ` by ${inquiry.archivedBy}` : ''}.
                        {inquiry.previousStage ? ` Previous stage was ${STAGES[inquiry.previousStage]?.label || inquiry.previousStage}.` : ''}
                      </div>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={handleUnarchiveInModal}
                    className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold rounded-lg text-xs shadow-sm transition-colors whitespace-nowrap self-start sm:self-auto cursor-pointer"
                  >
                    ↩️ Restore to Active Pipeline
                  </button>
                </div>
              )}
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-bold uppercase text-neutral-400">
                      Photos & Videos ({inquiry.photos?.length || 0})
                    </span>
                    {activePhoto && (
                      <button
                        type="button"
                        onClick={() => {
                          if (activePhoto) {
                            const w = window.open('');
                            if (w) {
                              w.document.write(`<!DOCTYPE html><html><head><title>SR1 Media Preview</title></head><body style="margin:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${activePhoto}" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8);"/></body></html>`);
                            }
                          }
                        }}
                        className="text-[10px] text-neutral-400 hover:text-white underline flex items-center gap-1 cursor-pointer bg-transparent border-0 p-0"
                      >
                        View Full Size ↗
                      </button>
                    )}
                  </div>
                  <div className="rounded-xl overflow-hidden aspect-video bg-black border border-neutral-800 flex items-center justify-center relative">
                    {activePhoto ? (
                      activeMedia?.isVideo ? (
                        <video
                          key={activePhoto}
                          src={activePhoto}
                          controls
                          playsInline
                          className="w-full h-full object-contain"
                        />
                      ) : (
                        <img src={activePhoto} alt="Inspection" className="w-full h-full object-contain" />
                      )
                    ) : (
                      <div className="h-full flex items-center justify-center text-neutral-500">No media uploaded</div>
                    )}
                  </div>
                  <div className="flex space-x-2 overflow-x-auto pb-1">
                    {(inquiry.photos || []).map(p => {
                      const currentSrc = p.url || p.thumbUrl;
                      const isSelected = activePhoto === currentSrc;
                      return (
                        <button
                          key={p.id}
                          onClick={() => {
                            setActivePhoto(currentSrc);
                            setActiveMedia(p);
                          }}
                          className={`flex-shrink-0 w-16 h-12 rounded border relative overflow-hidden bg-neutral-900 ${isSelected ? 'border-neutral-200 ring-1 ring-white' : 'border-neutral-800 opacity-60'}`}
                        >
                          <img src={p.thumbUrl || p.url} alt={p.label} className="w-full h-full object-cover rounded" />
                          {p.isVideo && (
                            <span className="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-[10px] font-bold">
                              ▶
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="space-y-3 bg-neutral-950 p-4 rounded-xl border border-neutral-800">
                  <span className="text-[11px] font-bold uppercase text-neutral-400 block">Unit Details</span>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Category</span>
                      <span className="font-semibold text-neutral-200">{CATEGORIES[inquiry.unit.category]?.label}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Type</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.subcategory}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">VIN / Serial</span>
                      <span className="font-mono text-neutral-200">{inquiry.unit.vinOrSerial || 'N/A'}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">{inquiry.unit.isHours ? 'Hours' : 'Mileage'}</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.mileageOrHours.toLocaleString()}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Condition</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.condition}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Title Status</span>
                      <span className="font-semibold text-neutral-200">{inquiry.financials.titleStatus}</span>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-neutral-850 flex items-center justify-between text-xs">
                    <div>
                      <span className="text-neutral-500 text-[10px] block">Transaction Intent</span>
                      <span className="font-semibold text-white">
                        {inquiry.intent === 'trade' ? '🔄 Trade-In' : '💵 Outright Sale to SR1'}
                      </span>
                    </div>
                    {inquiry.intent === 'trade' && (
                      <div className="text-right">
                        <span className="text-neutral-500 text-[10px] block">Assigned Salesperson</span>
                        <span className="font-semibold text-emerald-300">
                          {inquiry.salespersonName || 'Unassigned / Not listed'}
                        </span>
                      </div>
                    )}
                  </div>

                  {(inquiry.financials.estimatedPayoff > 0 || inquiry.financials.lienHolderName) && (
                    <div className="pt-2 border-t border-neutral-850 grid grid-cols-2 gap-2 text-xs">
                      <div>
                        <span className="text-neutral-500 text-[10px] block">Lien Holder</span>
                        <span className="font-semibold text-amber-300">{inquiry.financials.lienHolderName || 'Not specified'}</span>
                      </div>
                      <div className="text-right">
                        <span className="text-neutral-500 text-[10px] block">Estimated Payoff</span>
                        <span className="text-neutral-200 font-bold">${(inquiry.financials.estimatedPayoff || 0).toLocaleString()}</span>
                      </div>
                    </div>
                  )}

                  {inquiry.unit.conditionNotes && (
                    <div className="pt-2 border-t border-neutral-850">
                      <span className="text-neutral-500 text-[10px] block">Disclosures:</span>
                      <p className="text-neutral-300 text-[11px] mt-0.5">{inquiry.unit.conditionNotes}</p>
                    </div>
                  )}
                </div>
              </div>

              {/* 1-CLICK LIVE MARKETPLACE COMPS */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center space-x-2">
                    <span className="text-[11px] font-bold uppercase tracking-wider text-neutral-300">
                      Live Market Comps
                    </span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-950/80 border border-blue-800/60 text-blue-300">
                      1-Click Live Search
                    </span>
                  </div>
                  <span className="text-[10px] text-neutral-500">
                    Instant real-time listings in new tab
                  </span>
                </div>

                <div className="flex flex-col sm:flex-row gap-2 items-stretch sm:items-end">
                  <div className="flex-1">
                    <label className="text-[10px] text-neutral-400 block mb-1">Search Keywords</label>
                    <input
                      type="text"
                      value={fbCompsQuery}
                      onChange={(e) => setFbCompsQuery(e.target.value)}
                      placeholder="e.g. 2021 Keystone Cougar..."
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <a
                      href={`https://www.facebook.com/marketplace/search/?query=${encodeURIComponent(fbCompsQuery || defaultCompsQuery)}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 border border-blue-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors shadow-sm"
                    >
                      <span>🔵 Facebook Marketplace ↗</span>
                    </a>

                    {inquiry.unit.category === 'rv' && (
                      <a
                        href={`https://www.rvtrader.com/rvs-for-sale?keyword=${encodeURIComponent(fbCompsQuery || defaultCompsQuery)}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-3 py-2 bg-neutral-900 hover:bg-neutral-800 border border-neutral-750 hover:border-emerald-600/50 rounded-lg text-xs text-emerald-400 font-semibold flex items-center gap-1.5 transition-colors"
                      >
                        <span>🟢 RV Trader ↗</span>
                      </a>
                    )}

                    {(inquiry.unit.category === 'tractor' || inquiry.unit.category === 'heavy_equipment') && (
                      <a
                        href={`https://www.tractorhouse.com/listings/for-sale?q=${encodeURIComponent(fbCompsQuery || defaultCompsQuery)}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-3 py-2 bg-neutral-900 hover:bg-neutral-800 border border-neutral-750 hover:border-amber-600/50 rounded-lg text-xs text-amber-400 font-semibold flex items-center gap-1.5 transition-colors"
                      >
                        <span>🚜 TractorHouse ↗</span>
                      </a>
                    )}

                    <a
                      href={`https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(fbCompsQuery || defaultCompsQuery)}&LH_Complete=1&LH_Sold=1`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3 py-2 bg-neutral-900 hover:bg-neutral-800 border border-neutral-750 hover:border-yellow-600/50 rounded-lg text-xs text-yellow-400 font-semibold flex items-center gap-1.5 transition-colors"
                    >
                      <span>🟡 eBay Sold Comps ↗</span>
                    </a>
                  </div>
                </div>
              </div>

              {/* STAFF CLIENT OUTREACH CHECK-OFF */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-[11px] font-bold uppercase text-neutral-300">Staff Client Outreach</span>
                    {reachedOut ? (
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 border border-emerald-700 text-emerald-300">
                        ✓ Reached Out
                      </span>
                    ) : (
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 border border-amber-800 text-amber-300">
                        ⏳ Pending Outreach
                      </span>
                    )}
                  </div>
                  {reachedOutAt && (
                    <span className="text-[10px] text-neutral-400">
                      Logged on {reachedOutAt}
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center pt-1">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">Staff Member Name *</label>
                    <input
                      type="text"
                      value={outreachStaffName}
                      onChange={(e) => handleSaveStaffName(e.target.value)}
                      placeholder="Enter staff name..."
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2 sm:pt-4">
                    <label className="flex items-center space-x-2.5 cursor-pointer bg-neutral-900 p-2.5 rounded-lg border border-neutral-750 hover:border-neutral-600 transition-colors">
                      <input
                        type="checkbox"
                        checked={reachedOut}
                        onChange={(e) => handleToggleOutreach(e.target.checked)}
                        className="w-4 h-4 rounded border-neutral-700 text-neutral-100 bg-neutral-950 focus:ring-0 cursor-pointer"
                      />
                      <span className="text-xs font-semibold text-neutral-200 select-none">
                        I have reached out to this client
                      </span>
                    </label>
                  </div>
                </div>
              </div>

              {/* OFFER BUILDER */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Offer Desk</span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">SR1 Buy Offer ($)</label>
                    <input
                      type="number"
                      value={offerAmount}
                      onChange={(e) => setOfferAmount(Number(e.target.value))}
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-1.5 text-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">
                      Loan Payoff {inquiry.financials.lienHolderName ? `(${inquiry.financials.lienHolderName})` : ''} ($)
                    </label>
                    <input
                      type="number"
                      readOnly
                      value={inquiry.financials.estimatedPayoff || 0}
                      className="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-1.5 text-neutral-500 font-bold"
                    />
                  </div>
                  <div className="bg-neutral-900 p-2 rounded-lg border border-neutral-800">
                    <span className="text-neutral-400 text-[10px] block">Customer Net Check:</span>
                    <span className="text-lg font-bold text-white mt-0.5 block">${netEquity.toLocaleString()}</span>
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    onClick={handleSendOffer}
                    className="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-950 font-bold rounded-lg text-xs"
                  >
                    Save & Record Offer
                  </button>
                </div>
              </div>

              {/* NOTES */}
              <div className="space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Team Notes</span>
                <div className="space-y-2 max-h-36 overflow-y-auto">
                  {inquiry.notes.map(note => (
                    <div key={note.id} className="bg-neutral-950 p-2.5 rounded-lg border border-neutral-800 text-[11px]">
                      <div className="flex justify-between text-neutral-500 text-[10px]">
                        <span>{note.authorName} ({note.authorRole})</span>
                        <span>{note.createdAt}</span>
                      </div>
                      <p className="text-neutral-300 mt-1">{note.content}</p>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleAddNote} className="flex gap-2">
                  <input
                    type="text"
                    value={newNoteText}
                    onChange={(e) => setNewNoteText(e.target.value)}
                    placeholder="Add an internal note..."
                    className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-neutral-800 text-white font-semibold rounded-lg text-xs">
                    Post
                  </button>
                </form>
              </div>

            </div>

            <div className="bg-neutral-950 p-3 border-t border-neutral-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white font-semibold rounded-lg text-xs"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-neutral-950 text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
              <h2 className="text-xl font-bold">Submission Confirmed</h2>
              <p className="text-xs text-neutral-400 max-w-md">Your inquiry has been received by our appraisal desk. If you need to make changes or submit another unit, click below.</p>
              <button 
                onClick={() => {
                  try { localStorage.removeItem('sell2sr1_inquiries_v2'); } catch(e){}
                  window.location.reload();
                }} 
                className="px-5 py-2.5 bg-neutral-100 text-neutral-950 font-bold rounded-xl text-xs hover:bg-white transition-all shadow-md"
              >
                Return to Home
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

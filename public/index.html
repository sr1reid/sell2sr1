    };

    // Pre-warm Tesseract worker in background after initial page render
    if (typeof window !== 'undefined') {
      setTimeout(() => {
        if (window.Tesseract) getSharedTesseractWorker();
      }, 1200);
    }

    const createCroppedCanvasFromImage = (img, rx, ry, rw, rh, maxWidth = 1800, enhanceContrast = false) => {
      const natW = img.naturalWidth || img.width || 1200;
      const natH = img.naturalHeight || img.height || 900;
      const sx = Math.max(0, Math.round(natW * rx));
      const sy = Math.max(0, Math.round(natH * ry));
      const sw = Math.max(1, Math.min(natW - sx, Math.round(natW * rw)));
      const sh = Math.max(1, Math.min(natH - sy, Math.round(natH * rh)));

      let dw = sw;
      let dh = sh;
      if (dw > maxWidth) {
        dh = Math.max(1, Math.round((dh * maxWidth) / dw));
        dw = maxWidth;
      } else if ((Math.max(dw, dh) < 1200 || Math.min(dw, dh) < 300) && Math.max(sw, sh) > 120) {
        // Upscale small or short banner/vertical crops for sharper OCR recognition
        const scale = Math.min(2.4, Math.max(1250 / Math.max(1, Math.max(dw, dh)), 320 / Math.max(1, Math.min(dw, dh))));
        dw = Math.round(dw * scale);
        dh = Math.round(dh * scale);
      }

      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, dw);
      canvas.height = Math.max(1, dh);
      const ctx = canvas.getContext('2d');
      if (enhanceContrast) {
        try {
          ctx.filter = 'grayscale(100%) contrast(135%)';
        } catch (e) {}
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas;
    };

    // Isolates true black printed ink while erasing medium-gray scrapes, mildew, smudges, and optional thin horizontal lines
    const createInkIsolatedCanvas = (sourceCanvas, thresholdRatio = 0.42, removeThinHorizontalLines = false) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) return sourceCanvas;
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = w;
      outCanvas.height = h;
      const outCtx = outCanvas.getContext('2d');

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, w, h);
      } catch (e) {
        return sourceCanvas;
      }

      const data = srcData.data;
      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
        gray[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
      }

      // Compute 85th-percentile local background luminance in 128x128 blocks (clamped >= 125 so mildew patches don't lower bg)
      const blockSize = 128;
      const bw = Math.ceil(w / blockSize);
      const bh = Math.ceil(h / blockSize);
      const bgGrid = new Uint8Array(bw * bh);
      const hist = new Int32Array(256);

      for (let by = 0; by < bh; by++) {
        const y0 = by * blockSize;
        const y1 = Math.min(h, y0 + blockSize);
        for (let bx = 0; bx < bw; bx++) {
          const x0 = bx * blockSize;
          const x1 = Math.min(w, x0 + blockSize);
          hist.fill(0);
          let count = 0;
          for (let y = y0; y < y1; y += 2) {
            const rowOff = y * w;
            for (let x = x0; x < x1; x += 2) {
              hist[gray[rowOff + x]]++;
              count++;
            }
          }
          const target = Math.floor(count * 0.85);
          let acc = 0;
          let p85 = 200;
          for (let v = 0; v < 256; v++) {
            acc += hist[v];
            if (acc >= target) {
              p85 = Math.max(125, v);
              break;
            }
          }
          bgGrid[by * bw + bx] = p85;
        }
      }

      // Threshold at true ink (lum < localBg * thresholdRatio), turning medium-gray scrapes & mildew (85..150) into pure white
      const mask = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        const by = Math.min(bh - 1, (y / blockSize) | 0);
        const rowOff = y * w;
        for (let x = 0; x < w; x++) {
          const bx = Math.min(bw - 1, (x / blockSize) | 0);
          const bg = bgGrid[by * bw + bx];
          if (gray[rowOff + x] < bg * thresholdRatio) {
            mask[rowOff + x] = 1;
          }
        }
      }

      // Optional: erase 1-2px thin horizontal laminate tear lines where vertical black run in [y-4..y+4] is <= 2px
      const outData = outCtx.createImageData(w, h);
      const outPixels = outData.data;
      for (let y = 0; y < h; y++) {
        const rowOff = y * w;
        const yMin = Math.max(0, y - 4);
        const yMax = Math.min(h - 1, y + 4);
        for (let x = 0; x < w; x++) {
          let isInk = mask[rowOff + x] === 1;
          if (isInk && removeThinHorizontalLines) {
            let vCount = 0;
            for (let yy = yMin; yy <= yMax; yy++) {
              vCount += mask[yy * w + x];
            }
            if (vCount <= 2) {
              isInk = false;
            }
          }
          const val = isInk ? 0 : 255;
          const p = (rowOff + x) << 2;
          outPixels[p] = val;
          outPixels[p + 1] = val;
          outPixels[p + 2] = val;
          outPixels[p + 3] = 255;
        }
      }

      outCtx.putImageData(outData, 0, 0);
      return outCanvas;
    };

    // Local 32x32 tile adaptive contrast normalization (CLAHE-like) that restores faded/rubbed-off thermal print
    // on metallic silver stickers (e.g. IMG_2044) and sharpens low-contrast Code 39 barcodes
    const createLocalContrastCanvas = (sourceCanvas) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) return sourceCanvas;
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = w;
      outCanvas.height = h;
      const outCtx = outCanvas.getContext('2d');

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, w, h);
      } catch (e) {
        return sourceCanvas;
      }

      const data = srcData.data;
      const gray = new Uint8Array(w * h);
      const globalHist = new Int32Array(256);
      for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
        const g = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
        gray[i] = g;
        globalHist[g]++;
      }
      let gAcc = 0;
      let globalInk = 50;
      const gTarget = Math.floor(gray.length * 0.05);
      for (let v = 0; v < 256; v++) {
        gAcc += globalHist[v];
        if (gAcc >= gTarget) {
          globalInk = v;
          break;
        }
      }

      const tile = 32;
      const gw = Math.ceil(w / tile) + 1;
      const gh = Math.ceil(h / tile) + 1;
      const pLow = new Uint8Array(gw * gh);
      const pHigh = new Uint8Array(gw * gh);
      const hist = new Int32Array(256);

      for (let ty = 0; ty < gh; ty++) {
        const y0 = Math.max(0, Math.min(h - tile, ty * tile - (tile >> 1)));
        const y1 = Math.min(h, y0 + tile);
        for (let tx = 0; tx < gw; tx++) {
          const x0 = Math.max(0, Math.min(w - tile, tx * tile - (tile >> 1)));
          const x1 = Math.min(w, x0 + tile);
          hist.fill(0);
          let cnt = 0;
          for (let y = y0; y < y1; y += 2) {
            const ro = y * w;
            for (let x = x0; x < x1; x += 2) {
              hist[gray[ro + x]]++;
              cnt++;
            }
          }
          const tLo = Math.floor(cnt * 0.08);
          const tHi = Math.floor(cnt * 0.85);
          let acc = 0;
          let lo = 0;
          let hi = 255;
          let gotLo = false;
          for (let v = 0; v < 256; v++) {
            acc += hist[v];
            if (!gotLo && acc >= tLo) {
              lo = v;
              gotLo = true;
            }
            if (acc >= tHi) {
              hi = v;
              break;
            }
          }
          if (hi - lo < 16) lo = Math.max(0, hi - 60);
          // When the sticker already has dark ink globally, prevent mildew-only tiles from stretching gray mildew (lum 90+) to black
          if (globalInk < 70) {
            lo = Math.min(lo, Math.max(globalInk + 35, 65));
          }
          pLow[ty * gw + tx] = lo;
          pHigh[ty * gw + tx] = hi;
        }
      }

      const outData = outCtx.createImageData(w, h);
      const outPixels = outData.data;
      for (let y = 0; y < h; y++) {
        const fy = y / tile;
        const ty0 = Math.min(gh - 2, fy | 0);
        const wy = fy - ty0;
        const ro = y * w;
        for (let x = 0; x < w; x++) {
          const fx = x / tile;
          const tx0 = Math.min(gw - 2, fx | 0);
          const wx = fx - tx0;
          const i00 = ty0 * gw + tx0;
          const lo =
            pLow[i00] * (1 - wx) * (1 - wy) +
            pLow[i00 + 1] * wx * (1 - wy) +
            pLow[i00 + gw] * (1 - wx) * wy +
            pLow[i00 + gw + 1] * wx * wy;
          const hi =
            pHigh[i00] * (1 - wx) * (1 - wy) +
            pHigh[i00 + 1] * wx * (1 - wy) +
            pHigh[i00 + gw] * (1 - wx) * wy +
            pHigh[i00 + gw + 1] * wx * wy;
          const norm = Math.max(0, Math.min(255, ((gray[ro + x] - lo) * 255) / Math.max(18, hi - lo)));
          const val = norm < 135 ? 0 : norm | 0;
          const p = (ro + x) << 2;
          outPixels[p] = val;
          outPixels[p + 1] = val;
          outPixels[p + 2] = val;
          outPixels[p + 3] = 255;
        }
      }

      outCtx.putImageData(outData, 0, 0);
      return outCanvas;
    };

    // Detects severely spiderweb-cracked / crazed sticker surfaces (e.g. 20261009_163835.jpg where >=78% of bright sticker tiles
    // have dense intersecting horizontal & vertical narrow crack valleys)
    const isSeverelyCrazedStickerCanvas = (sourceCanvas) => {
      if (!sourceCanvas || !sourceCanvas.width || !sourceCanvas.height) return false;
      const sw = sourceCanvas.width;
      const sh = sourceCanvas.height;
      const targetW = 600;
      const scale = targetW / sw;
      const targetH = Math.max(48, Math.round(sh * scale));

      let srcData;
      try {
        srcData = sourceCanvas.getContext('2d').getImageData(0, 0, sw, sh).data;
      } catch (e) {
        return false;
      }

      const gray = new Uint8Array(targetW * targetH);
      for (let ty = 0; ty < targetH; ty++) {
        const iy = Math.min(sh - 1, Math.floor(ty / scale));
        const srcRow = iy * sw;
        const dstRow = ty * targetW;
        for (let tx = 0; tx < targetW; tx++) {
          const ix = Math.min(sw - 1, Math.floor(tx / scale));
          const p = (srcRow + ix) << 2;
          gray[dstRow + tx] = (srcData[p] * 77 + srcData[p + 1] * 150 + srcData[p + 2] * 29) >> 8;
        }
      }

      const tile = 24;
      let crazedTiles = 0;
      let brightTiles = 0;
      for (let ty = 4; ty < targetH - tile - 4; ty += tile) {
        for (let tx = 4; tx < targetW - tile - 4; tx += tile) {
          let hc = 0;
          let vc = 0;
          let maxL = 0;
          for (let y = ty; y < ty + tile; y += 2) {
            const ro = y * targetW;
            for (let x = tx; x < tx + tile; x += 2) {
              const c = gray[ro + x];
              if (c > maxL) maxL = c;
              const lr = (gray[ro + x - 2] + gray[ro + x + 2]) >> 1;
              const tb = (gray[(y - 2) * targetW + x] + gray[(y + 2) * targetW + x]) >> 1;
              if (lr > 135 && lr - c > 22 && c > 60) hc++;
              if (tb > 135 && tb - c > 22 && c > 60) vc++;
            }
          }
          if (maxL > 150) {
            brightTiles++;
            if (hc >= 5 && vc >= 5) {
              crazedTiles++;
            }
          }
        }
      }

      if (brightTiles < 25) return false;
      return crazedTiles / brightTiles >= 0.78;
    };

    // Creates a rotated (90 deg CW or CCW) canvas from a vertical strip (for vertical backup VINs printed on trailer tags)
    const createRotatedCropCanvasFromImage = (img, rx, ry, rw, rh, clockwise = false, maxLongSide = 1600) => {
      const baseCrop = createCroppedCanvasFromImage(img, rx, ry, rw, rh, maxLongSide, false);
      const cw = baseCrop.width;
      const ch = baseCrop.height;
      const rotCanvas = document.createElement('canvas');
      rotCanvas.width = ch;
      rotCanvas.height = cw;
      const ctx = rotCanvas.getContext('2d');
      ctx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
      ctx.rotate((clockwise ? 90 : -90) * (Math.PI / 180));
      ctx.drawImage(baseCrop, -cw / 2, -ch / 2);
      return rotCanvas;
    };

    // Reads the HEIF 'irot' box (90° CCW steps: 1=90° CCW, 2=180°, 3=270° CCW / 90° CW) from the first 32 KB of a .heic file
    const readHeicIrotSteps = async (file) => {
      try {
        if (!file || typeof file.slice !== 'function') return 0;
        const isHeic = await isHeicOrHeifFile(file);
        if (!isHeic) return 0;
        const buf = await file.slice(0, 32768).arrayBuffer();
        const b = new Uint8Array(buf);
        for (let i = 0; i <= b.length - 9; i++) {
          if (
            b[i] === 0x00 &&
            b[i + 1] === 0x00 &&
            b[i + 2] === 0x00 &&
            b[i + 3] === 0x09 &&
            b[i + 4] === 0x69 && // 'i'
            b[i + 5] === 0x72 && // 'r'
            b[i + 6] === 0x6f && // 'o'
            b[i + 7] === 0x74    // 't'
          ) {
            return b[i + 8] & 0x03;
          }
        }
      } catch (e) {}
      return 0;
    };

    // Rotates a decoded HEIC image if the decoder (e.g. sips -s format jpeg or heic2any) stripped the HEIF irot orientation tag
    const normalizeHeicOrientationCanvas = (rawImg, irotSteps) => {
      const natW = rawImg.naturalWidth || rawImg.width || 1200;
      const natH = rawImg.naturalHeight || rawImg.height || 900;
      if ((irotSteps === 3 || irotSteps === 1) && natW > natH) {
        const scale = Math.min(1, 2600 / Math.max(natW, natH));
        const sw = Math.round(natW * scale);
        const sh = Math.round(natH * scale);
        const rotCanvas = document.createElement('canvas');
        rotCanvas.width = sh;
        rotCanvas.height = sw;
        const ctx = rotCanvas.getContext('2d');
        ctx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
        // irotSteps === 3 is 270° CCW = 90° CW; irotSteps === 1 is 90° CCW
        ctx.rotate((irotSteps === 3 ? 90 : -90) * (Math.PI / 180));
        ctx.drawImage(rawImg, 0, 0, natW, natH, -sw / 2, -sh / 2, sw, sh);
        return rotCanvas;
      }
      return rawImg;
    };

    // Fast pre-screening gate: determines if quick OCR text shows any sign of a VIN tag, compliance sticker, or 17-digit VIN string
    const doesOcrTextLookLikeVinOrTag = (rawText) => {
      if (!rawText) return false;
      const upper = String(rawText)
        .replace(/(?<=[A-Za-z0-9])[l|!]|[l|!](?=[A-Za-z0-9])/g, '1')
        .toUpperCase();

      // 1. Check for any VIN tag / compliance label / trailer or equipment spec plate keywords
      if (
        /(?:V\.?\s*[IJL1]\.?\s*N|N\.?\s*[IJL1]\.?\s*V|VJN|NJV|VEHICLE\s+ID|IDENTIFICATION|GVWR|GAWR|PNBV|PNBE|KPA|PSI|\bLBS?\.?\b|\d+\s*KG\b|COLD|TIRE|RIMS?\b|AXLE|TRAILER|REMORQUE|MFD\b|MFG\b|DATE\s+OF|MANUFACTUR|FABRIQUE|CONFORMS|FEDERAL|SAFETY|MODEL|SERIAL|S\/N|P\.?\s*I\.?\s*N|HULL|FOREST\s+RIVER|TRIPLE\s+CROWN|ST2\d\d|15\s*[X"'])/i.test(
          upper
        )
      ) {
        return true;
      }

      // 2. Check for any standalone or contiguous VIN-like alphanumeric run (8+ chars with letters & digits, or 6+ digits)
      // Handles plain 17-digit VIN stickers that have no "VIN" label (e.g. 5WFBU2424PW126186.jpg)
      const runs = upper.match(/[A-Z0-9]{8,28}/g) || [];
      for (let i = 0; i < runs.length; i++) {
        const r = runs[i];
        const digits = (r.match(/\d/g) || []).length;
        const letters = (r.match(/[A-Z]/g) || []).length;
        if ((digits >= 2 && letters >= 1) || digits >= 6) {
          return true;
        }
      }

      // 3. Check if any single line has 11+ alphanumeric chars with at least 3 digits when spaces/hyphens are removed
      const lines = upper.split(/\r?\n/);
      for (let l = 0; l < lines.length; l++) {
        const compact = lines[l].replace(/[^A-Z0-9]/g, '');
        if (compact.length >= 11 && compact.length <= 28) {
          const digits = (compact.match(/\d/g) || []).length;
          const letters = (compact.match(/[A-Z]/g) || []).length;
          if (digits >= 3 && letters >= 2) {
            return true;
          }
        }
      }

      return false;
    };

    const loadImageCanvasesForScan = async (file) => {
      if (!file) return null;
      const [decodableBlob, irotSteps] = await Promise.all([
        ensureDecodableImageBlob(file),
        readHeicIrotSteps(file)
      ]);
      if (!decodableBlob) return null;

      return new Promise((resolve) => {
        let objectUrl = '';
        try {
          objectUrl = URL.createObjectURL(decodableBlob);
        } catch (e) {
          return resolve(null);
        }

        const rawImg = new Image();
        let settled = false;
        const finish = (val) => {
          if (settled) return;
          settled = true;
          if (objectUrl) {
            try { URL.revokeObjectURL(objectUrl); } catch (e) {}
          }
          resolve(val);
        };

        const timer = setTimeout(() => finish(null), 10000);

        rawImg.onload = () => {
          clearTimeout(timer);
          try {
            // Ensure upright orientation for portrait HEIC photos (e.g. 590211518R0030952.HEIC, 5JW1U1827T1494127.heic)
            const img = normalizeHeicOrientationCanvas(rawImg, irotSteps);
            const natW = img.naturalWidth || img.width || 1200;
            const natH = img.naturalHeight || img.height || 900;
            const isWideBanner = natW / Math.max(1, natH) >= 2.2;
            const isPortrait = natW < natH * 0.95;

            // STAGE 1 FAST GATE CANVASES: Only build lightweight screening canvases upfront so normal unit photos don't pay for 18 heavy crops
            const gateFullCanvas = createCroppedCanvasFromImage(img, 0, 0, 1, 1, 1350, false);
            const vinBandCanvas = createCroppedCanvasFromImage(img, 0.06, 0.34, 0.88, 0.36, 1800, false);
            const vinLeftTextCanvas = createCroppedCanvasFromImage(img, 0.06, 0.34, 0.58, 0.32, 1600, false);
            const isCrazedSticker = isSeverelyCrazedStickerCanvas(vinLeftTextCanvas);
            const inkIsolatedLeftLineErased = createInkIsolatedCanvas(vinLeftTextCanvas, 0.42, true);
            const verticalStickerZoomCW = (isPortrait && !irotSteps)
              ? createRotatedCropCanvasFromImage(img, 0.34, 0.14, 0.32, 0.82, true, 1600)
              : null;

            const gateOcrCanvases = isCrazedSticker
              ? [vinLeftTextCanvas]
              : isWideBanner
              ? [gateFullCanvas, inkIsolatedLeftLineErased]
              : (isPortrait && !irotSteps && verticalStickerZoomCW)
              ? [verticalStickerZoomCW, gateFullCanvas]
              : [gateFullCanvas, inkIsolatedLeftLineErased];

            let cachedDeepCanvases = null;
            const getDeepCanvases = () => {
              if (cachedDeepCanvases) return cachedDeepCanvases;

              // STAGE 2 DEEP SCAN CANVASES: Built ONLY after Stage 1 confirms this photo looks like a VIN number or VIN tag
              const fullCanvas = createCroppedCanvasFromImage(img, 0, 0, 1, 1, 2000, false);
              const strictInkFullCanvas = createInkIsolatedCanvas(fullCanvas, 0.28, false);
              const inkIsolatedFullCanvas = createInkIsolatedCanvas(fullCanvas, 0.42, false);
              const vinTopBannerCanvas = createCroppedCanvasFromImage(img, 0.02, 0.05, 0.96, 0.68, 1800, false);
              const strictInkTopBannerCanvas = createInkIsolatedCanvas(vinTopBannerCanvas, 0.28, false);

              const stickerCenterCanvas = createCroppedCanvasFromImage(img, 0.06, 0.14, 0.88, 0.72, 1800, false);
              // Bottom compliance band crop captures VINs printed near the bottom of stickers (e.g. 2NEB212B5PN037870, 5JW1U1827T1494127, IMG_1689)
              const vinBottomBandCanvas = createCroppedCanvasFromImage(img, 0.06, 0.54, 0.84, 0.36, 1800, false);
              const inkIsolatedBottomBandCanvas = createInkIsolatedCanvas(vinBottomBandCanvas, 0.42, false);

              const inkIsolatedLeftCanvas = createInkIsolatedCanvas(vinLeftTextCanvas, 0.42, false);
              const inkIsolatedCenterCanvas = createInkIsolatedCanvas(stickerCenterCanvas, 0.42, false);
              const inkIsolatedBandCanvas = createInkIsolatedCanvas(vinBandCanvas, 0.42, true);
              // Local contrast-normalized crops restore faded thermal print on metallic tags (IMG_2044) & boost barcodes
              const localContrastLeftCanvas = createLocalContrastCanvas(vinLeftTextCanvas);
              const localContrastBandCanvas = createLocalContrastCanvas(vinBandCanvas);
              // Right/middle and left/middle native-res barcode crops cover both right-side (IMG_2270, 5JW) and left-side (IMG_4623, IMG_2044) barcodes
              const barcodeRightZoomCanvas = createCroppedCanvasFromImage(img, 0.42, 0.32, 0.54, 0.40, 1800, false);
              const barcodeLeftZoomCanvas = createCroppedCanvasFromImage(img, 0.06, 0.36, 0.56, 0.30, 1800, false);
              const barcodeLeftContrastCanvas = createLocalContrastCanvas(barcodeLeftZoomCanvas);
              // Vertical sticker / vertical backup VIN crops rotated 90° CW and 90° CCW (handles 1XNBU0816N2024607 & 2NEB212B5PN037870)
              const deepVerticalZoomCW = verticalStickerZoomCW || createRotatedCropCanvasFromImage(img, 0.34, 0.14, 0.32, 0.82, true, 1600);
              const verticalStickerFullCW = createRotatedCropCanvasFromImage(img, 0.20, 0.04, 0.52, 0.92, true, 1600);
              const verticalStickerFullCCW = createRotatedCropCanvasFromImage(img, 0.20, 0.04, 0.52, 0.92, false, 1600);

              cachedDeepCanvases = {
                barcodeCanvases: [
                  barcodeLeftZoomCanvas,
                  barcodeLeftContrastCanvas,
                  barcodeRightZoomCanvas,
                  vinBandCanvas,
                  stickerCenterCanvas,
                  fullCanvas,
                  verticalStickerFullCW
                ],
                code39Canvases: [
                  barcodeLeftContrastCanvas,
                  barcodeLeftZoomCanvas,
                  localContrastBandCanvas,
                  vinBandCanvas,
                  barcodeRightZoomCanvas
                ],
                ocrCanvases: isCrazedSticker
                  ? [
                      vinLeftTextCanvas,
                      stickerCenterCanvas,
                      fullCanvas
                    ]
                  : isWideBanner
                  ? [
                      strictInkFullCanvas,
                      fullCanvas,
                      strictInkTopBannerCanvas,
                      vinTopBannerCanvas,
                      inkIsolatedFullCanvas,
                      vinBandCanvas,
                      vinLeftTextCanvas
                    ]
                  : isPortrait && !irotSteps
                  ? [
                      deepVerticalZoomCW,
                      verticalStickerFullCW,
                      inkIsolatedLeftLineErased,
                      vinLeftTextCanvas,
                      vinBottomBandCanvas,
                      inkIsolatedBottomBandCanvas,
                      inkIsolatedCenterCanvas,
                      stickerCenterCanvas,
                      verticalStickerFullCCW,
                      fullCanvas
                    ]
                  : [
                      inkIsolatedLeftLineErased,
                      vinLeftTextCanvas,
                      vinBottomBandCanvas,
                      inkIsolatedBottomBandCanvas,
                      deepVerticalZoomCW,
                      verticalStickerFullCW,
                      inkIsolatedCenterCanvas,
                      localContrastLeftCanvas,
                      vinBandCanvas,
                      inkIsolatedBandCanvas,
                      localContrastBandCanvas,
                      stickerCenterCanvas,
                      inkIsolatedLeftCanvas,
                      verticalStickerFullCCW,
                      fullCanvas
                    ]
              };
              return cachedDeepCanvases;
            };

            finish({
              isCrazedSticker,
              gateBarcodeCanvases: verticalStickerZoomCW
                ? [vinBandCanvas, gateFullCanvas, verticalStickerZoomCW]
                : [vinBandCanvas, gateFullCanvas],
              gateCode39Canvases: [vinBandCanvas, gateFullCanvas],
              gateOcrCanvases,
              getDeepCanvases
            });
          } catch (err) {
            finish(null);
          }
        };

        rawImg.onerror = () => {
          clearTimeout(timer);
          finish(null);
        };

        rawImg.src = objectUrl;
      });
    };

    const scanImageFileForVin = async (file, categoryKey, shouldAbortScan = null) => {
      if (!file) return { vin: '', unreadableVinTag: false };
      const isVideo = file.type?.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name || '');
      if (isVideo) return { vin: '', unreadableVinTag: false };
      if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
        return { vin: '', unreadableVinTag: false };
      }

      try {
        const canvases = await loadImageCanvasesForScan(file);
        if (!canvases) return { vin: '', unreadableVinTag: false };
        if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
          return { vin: '', unreadableVinTag: false };
        }

        // Fast Gate Step 1A: Quick native BarcodeDetector on gate canvases (<25ms)
        let detector = null;
        if (typeof window !== 'undefined' && 'BarcodeDetector' in window) {
          try {
            let formats = ['code_39', 'code_128', 'codabar', 'itf', 'data_matrix', 'pdf417', 'qr_code'];
            if (typeof window.BarcodeDetector.getSupportedFormats === 'function') {
              const supported = await window.BarcodeDetector.getSupportedFormats();
              formats = formats.filter((f) => supported.includes(f));
            }
            if (formats.length > 0) {
              detector = new window.BarcodeDetector({ formats });
              for (let c = 0; c < (canvases.gateBarcodeCanvases || []).length; c++) {
                try {
                  const barcodes = await detector.detect(canvases.gateBarcodeCanvases[c]);
                  for (let i = 0; i < (barcodes || []).length; i++) {
                    const found = extractVinFromBarcodeValue(barcodes[i]?.rawValue, categoryKey);
                    if (found) return { vin: found, unreadableVinTag: false };
                  }
                } catch (e) {}
              }
            }
          } catch (barcodeErr) {}
        }

        // Fast Gate Step 1B: Quick Code 39 scanline check on gate canvases (<15ms)
        const barcodeFragmentsMap = new Map();
        for (let c = 0; c < (canvases.gateCode39Canvases || []).length; c++) {
          const c39 = scanCanvasForCode39(canvases.gateCode39Canvases[c], categoryKey);
          if (c39.fullVin) return { vin: c39.fullVin, unreadableVinTag: false };
          for (let f = 0; f < c39.fragments.length; f++) {
            const frag = c39.fragments[f];
            const prev = barcodeFragmentsMap.get(frag.text);
            barcodeFragmentsMap.set(frag.text, {
              text: frag.text,
              hasStartStar: Boolean(prev?.hasStartStar || frag.hasStartStar),
              hasStopStar: Boolean(prev?.hasStopStar || frag.hasStopStar),
              hits: (prev?.hits || 0) + (frag.hits || 1)
            });
          }
        }
        let barcodeFragments = Array.from(barcodeFragmentsMap.values());
        const gateStitched = stitchBarcodeFragments(barcodeFragments);
        if (gateStitched) return { vin: gateStitched, unreadableVinTag: false };

        const isCrazed = Boolean(canvases.isCrazedSticker);
        // If we already detected barcode fragments or a crazed compliance sticker surface, it's confirmed as a VIN tag
        let confirmedVinOrTag = isCrazed || barcodeFragments.length > 0;

        // Stage 1C (Fast OCR Gate) -> Stage 2 (Full Deep Scan ONLY if photo clearly looks like a VIN number or VIN tag)
        const runOcr = () =>
          new Promise(async (resolve) => {
            if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
              return resolve({ vin: '', unreadableVinTag: false });
            }
            const timeout = setTimeout(() => resolve({ vin: '', unreadableVinTag: isCrazed }), 28000);
            try {
              const worker = await getSharedTesseractWorker();
              if (!worker) {
                clearTimeout(timeout);
                return resolve({ vin: '', unreadableVinTag: isCrazed });
              }

              let combinedText = '';
              const recognizedCanvases = new Set();

              // STAGE 1C: Fast Pre-Screening OCR Gate (1-2 lightweight crops)
              if (!confirmedVinOrTag) {
                const gateCrops = canvases.gateOcrCanvases || [];
                for (let g = 0; g < gateCrops.length; g++) {
                  if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
                    clearTimeout(timeout);
                    return resolve({ vin: '', unreadableVinTag: false });
                  }
                  const gCanvas = gateCrops[g];
                  if (!gCanvas) continue;
                  const res = await worker.recognize(gCanvas);
                  recognizedCanvases.add(gCanvas);
                  const text = res?.data?.text || '';
                  if (text) {
                    const immediateVin = extractVinOrSerialFromOcrText(text, categoryKey, barcodeFragments, isCrazed);
                    if (immediateVin) {
                      clearTimeout(timeout);
                      return resolve({ vin: immediateVin, unreadableVinTag: false });
                    }
                    combinedText += '\n' + text;
                    const combinedImmediate = extractVinOrSerialFromOcrText(combinedText, categoryKey, barcodeFragments, isCrazed);
                    if (combinedImmediate) {
                      clearTimeout(timeout);
                      return resolve({ vin: combinedImmediate, unreadableVinTag: false });
                    }
                    if (doesOcrTextLookLikeVinOrTag(text) || doesOcrTextLookLikeVinOrTag(combinedText)) {
                      confirmedVinOrTag = true;
                      break;
                    }
                  }
                }

                // If Stage 1 Gate determines this photo is NOT a VIN number or VIN tag (e.g. normal RV/trailer/tractor photo), exit immediately!
                if (!confirmedVinOrTag) {
                  clearTimeout(timeout);
                  return resolve({ vin: '', unreadableVinTag: false });
                }
              }

              // STAGE 2: Photo is confirmed to look like a VIN number or VIN tag!
              // Now build the full suite of deep-scan canvases and run all established barcode + multi-crop OCR steps.
              const deep = canvases.getDeepCanvases();

              // Deep Pass 2A: Native BarcodeDetector on zoomed left/right/contrast barcode crops
              if (detector && deep.barcodeCanvases) {
                for (let c = 0; c < deep.barcodeCanvases.length; c++) {
                  try {
                    const barcodes = await detector.detect(deep.barcodeCanvases[c]);
                    for (let i = 0; i < (barcodes || []).length; i++) {
                      const found = extractVinFromBarcodeValue(barcodes[i]?.rawValue, categoryKey);
                      if (found) {
                        clearTimeout(timeout);
                        return resolve({ vin: found, unreadableVinTag: false });
                      }
                    }
                  } catch (e) {}
                }
              }

              // Deep Pass 2B: ZXing Multi-Format Barcode Reader fallback on zoomed barcode canvases
              if (typeof window !== 'undefined' && window.ZXing && typeof window.ZXing.BrowserMultiFormatReader === 'function') {
                try {
                  const zxingReader = new window.ZXing.BrowserMultiFormatReader();
                  for (let c = 0; c < Math.min(3, (deep.barcodeCanvases || []).length); c++) {
                    try {
                      const dataUrl = deep.barcodeCanvases[c].toDataURL('image/jpeg', 0.92);
                      const res = await zxingReader.decodeFromImageUrl(dataUrl);
                      if (res && res.getText) {
                        const found = extractVinFromBarcodeValue(res.getText(), categoryKey);
                        if (found) {
                          clearTimeout(timeout);
                          return resolve({ vin: found, unreadableVinTag: false });
                        }
                      }
                    } catch (zErr) {}
                  }
                } catch (zxingInitErr) {}
              }

              // Deep Pass 2C: Custom multi-scanline Code 39 decoder across all zoomed & local-contrast barcode crops
              for (let c = 0; c < (deep.code39Canvases || []).length; c++) {
                const c39 = scanCanvasForCode39(deep.code39Canvases[c], categoryKey);
                if (c39.fullVin) {
                  clearTimeout(timeout);
                  return resolve({ vin: c39.fullVin, unreadableVinTag: false });
                }
                for (let f = 0; f < c39.fragments.length; f++) {
                  const frag = c39.fragments[f];
                  const prev = barcodeFragmentsMap.get(frag.text);
                  barcodeFragmentsMap.set(frag.text, {
                    text: frag.text,
                    hasStartStar: Boolean(prev?.hasStartStar || frag.hasStartStar),
                    hasStopStar: Boolean(prev?.hasStopStar || frag.hasStopStar),
                    hits: (prev?.hits || 0) + (frag.hits || 1)
                  });
                }
              }
              barcodeFragments = Array.from(barcodeFragmentsMap.values());
              const crossStitched = stitchBarcodeFragments(barcodeFragments);
              if (crossStitched) {
                clearTimeout(timeout);
                return resolve({ vin: crossStitched, unreadableVinTag: false });
              }

              // Re-check any text collected during the gate pass now that we have full deep barcode fragments
              if (combinedText && barcodeFragments.length > 0) {
                const fusedFromGate = extractVinOrSerialFromOcrText(combinedText, categoryKey, barcodeFragments, isCrazed);
                if (fusedFromGate) {
                  clearTimeout(timeout);
                  return resolve({ vin: fusedFromGate, unreadableVinTag: false });
                }
              }

              // Deep Pass 2D: Full Multi-Crop Tesseract.js OCR across all enhanced canvases
              for (let c = 0; c < (deep.ocrCanvases || []).length; c++) {
                if (typeof shouldAbortScan === 'function' && shouldAbortScan()) {
                  clearTimeout(timeout);
                  return resolve({ vin: '', unreadableVinTag: false });
                }
                const targetCanvas = deep.ocrCanvases[c];
                if (!targetCanvas || recognizedCanvases.has(targetCanvas)) continue;
                recognizedCanvases.add(targetCanvas);
                const res = await worker.recognize(targetCanvas);
                const text = res?.data?.text || '';
                if (text) {
                  const found = extractVinOrSerialFromOcrText(text, categoryKey, barcodeFragments, isCrazed);
                  if (found) {
                    clearTimeout(timeout);
                    return resolve({ vin: found, unreadableVinTag: false });
                  }
                  combinedText += '\n' + text;
                  const combinedFound = extractVinOrSerialFromOcrText(combinedText, categoryKey, barcodeFragments, isCrazed);
                  if (combinedFound) {
                    clearTimeout(timeout);
                    return resolve({ vin: combinedFound, unreadableVinTag: false });
                  }
                }
              }

              clearTimeout(timeout);
              const finalVin = extractVinOrSerialFromOcrText(combinedText, categoryKey, barcodeFragments, isCrazed);
              if (finalVin) {
                return resolve({ vin: finalVin, unreadableVinTag: false });
              }
              const sawStickerContext =
                isCrazed ||
                barcodeFragments.length > 0 ||
                /\b(V\.?\s*I\.?\s*N|N\.?\s*I\.?\s*V|IDENTIFICATION|FOREST\s+RIVER|GVWR|GAWR|PNBV|MFD\s+BY|MFG\s+BY|FABRIQUE|MANUFACTURED|CONFORMS\s+TO|TRAILER|REMORQUE|ST2\d\d|KPA|PSI)\b/i.test(
                  combinedText
                );
              resolve({ vin: '', unreadableVinTag: Boolean(sawStickerContext) });
            } catch (ocrErr) {
              clearTimeout(timeout);
              resolve({ vin: '', unreadableVinTag: isCrazed });
            }
          });

        const nextJob = tesseractJobChain.then(runOcr, runOcr);
        tesseractJobChain = nextJob.then(() => {}, () => {});
        return await nextJob;
      } catch (err) {
        console.warn('VIN scan error:', err);
        return { vin: '', unreadableVinTag: false };
      }
    };

    function formatInquiryDate(dateStr) {
      if (!dateStr) return { date: 'Recently', time: '' };
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return { date: 'Recently', time: '' };
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const dateFormatted = isToday 
          ? 'Today' 
          : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
        const timeFormatted = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return { date: dateFormatted, time: timeFormatted };
      } catch (e) {
        return { date: 'Recently', time: '' };
      }
    }

    function formatSeenTimestamp(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return String(dateStr);
        const info = formatInquiryDate(dateStr);
        return info.time ? `${info.date} at ${info.time}` : info.date;
      } catch (e) {
        return String(dateStr);
      }
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentView, setCurrentView] = useState(() => {

            return 'portal';
          }
          if (v === 'dealer' || v === 'dealer_portal' || window.location.hash === '#dealer') {
            return 'dealer_portal';
          }
          if (v === 'bank' || v === 'bank_portal' || window.location.hash === '#bank') {
            return 'bank_portal';
          }
        } catch (e) {}
        return 'sell';
      });
      const [partners, setPartners] = useState(() => {
        try {
          const saved = localStorage.getItem('sell2sr1_partners_v1');
          const parsed = saved ? JSON.parse(saved) : [];
          return (Array.isArray(parsed) ? parsed : []).map(normalizePartner).filter(Boolean);
        } catch (e) {
          return [];
        }
      });
      const [partnerUser, setPartnerUser] = useState(() => {
        try {
          const saved = localStorage.getItem('sell2sr1_partner_user');
          return saved ? normalizePartner(JSON.parse(saved)) : null;
        } catch (e) {
          return null;
        }
      });
      const deletedIdsRef = useRef((() => {
        try {
          const raw = localStorage.getItem('sell2sr1_deleted_inquiry_ids');
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      })());

      const [inquiries, setInquiries] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('reset') === '1') {
            try {
              localStorage.removeItem('sell2sr1_inquiries_v2');
              localStorage.removeItem('sell2sr1_deleted_inquiry_ids');
              deletedIdsRef.current = [];
            } catch (e) {}
            return INITIAL_INQUIRIES_DATA.map(normalizeInquiry).filter(Boolean);
          }
          const deletedSet = new Set(deletedIdsRef.current || []);
          const saved = localStorage.getItem('sell2sr1_inquiries_v2');
          const list = saved ? JSON.parse(saved) : INITIAL_INQUIRIES_DATA;
          return (Array.isArray(list) ? list : INITIAL_INQUIRIES_DATA)
            .map(normalizeInquiry)
            .filter(item => item && !deletedSet.has(item.id));
        } catch (e) {
          console.warn('LocalStorage read error:', e);

        }

      const [selectedInquiryId, setSelectedInquiryId] = useState(() => {

      const [lastSubmittedRef, setLastSubmittedRef] = useState(null);
      const [staffUser, setStaffUser] = useState(() => {
        try {

          const params = new URLSearchParams(window.location.search);
          if (params.get('demo') === 'reid' || params.get('user') === 'reid') {
            return { email: 'reid@sr1companies.com', name: 'Reid Lanpher' };
          }
          if (params.get('demo') === '1') return { email: 'appraiser@sr1companies.com', name: 'SR1 Appraiser' };
          return null;
        } catch (e) {
          return null;
        }
      });
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try {
          const saved = localStorage.getItem('sell2sr1_staff_user');
          if (saved && JSON.parse(saved)?.email?.endsWith('@sr1companies.com')) return true;
          const params = new URLSearchParams(window.location.search);
          return params.get('demo') === '1' || params.get('demo') === 'reid' || params.get('user') === 'reid';

      const [emailRoutingConfig, setEmailRoutingConfig] = useState(() => {

        return DEALERSHIP_NOTIFICATION_EMAILS;
      });

      // Synchronize dynamic email routing config from Firestore REST
      useEffect(() => {
        fetchEmailRoutingConfigFromCloudRest().then(remoteConfig => {
          if (remoteConfig && typeof remoteConfig === 'object') {
            setEmailRoutingConfig(prev => ({
              ...prev,
              ...remoteConfig
            }));
            try {
              localStorage.setItem('sell2sr1_email_routing', JSON.stringify({
                ...DEALERSHIP_NOTIFICATION_EMAILS,
                ...remoteConfig
              }));
            } catch (e) {}
          }
        }).catch(err => {
          console.warn('Could not sync email routing config:', err);
        });
      }, []);

      const handleSaveEmailRoutingConfig = async (newRouting) => {
        setEmailRoutingConfig(newRouting);
        try {
          localStorage.setItem('sell2sr1_email_routing', JSON.stringify(newRouting));
        } catch (e) {}
        const ok = await saveEmailRoutingConfigToCloudRest(newRouting, staffUser?.email);

      };

      const handleSignOut = () => {
        try {
          localStorage.removeItem('sell2sr1_staff_user');
        } catch (e) {}
        setStaffUser(null);
        setIsAuthenticated(false);
      };

      const handleSavePartner = async (partnerObj) => {
        const normalized = normalizePartner({
          ...partnerObj,
          updatedAt: new Date().toISOString()
        });
        if (!normalized) return null;
        setPartners(prev => {
          const list = Array.isArray(prev) ? prev : [];
          const exists = list.some(p => p.id === normalized.id);
          const next = exists
            ? list.map(p => (p.id === normalized.id ? normalized : p))
            : [normalized, ...list];
          try {
            localStorage.setItem('sell2sr1_partners_v1', JSON.stringify(next));
          } catch (e) {}
          return next;
        });
        if (partnerUser && partnerUser.id === normalized.id) {
          setPartnerUser(normalized);
          try {
            localStorage.setItem('sell2sr1_partner_user', JSON.stringify(normalized));
          } catch (e) {}
        }
        await savePartnerToCloudRest(normalized);
        return normalized;
      };

      const handlePartnerSignInSession = (partnerObj) => {
        const normalized = normalizePartner(partnerObj);
        setPartnerUser(normalized);
        try {
          if (normalized) {
            localStorage.setItem('sell2sr1_partner_user', JSON.stringify(normalized));
          } else {
            localStorage.removeItem('sell2sr1_partner_user');
          }
        } catch (e) {}
      };

      const openPartnerPortal = (portalType) => {
        setSelectedInquiryId(null);
        setCurrentView(portalType === 'bank' ? 'bank_portal' : 'dealer_portal');
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      };

      const goToHome = () => {
        setCurrentView('sell');
        setSelectedInquiryId(null);
        setSellFlowKey(prev => prev + 1);
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      };

      useEffect(() => {
        try {
          // Keep inquiries safe for localStorage (strip heavy base64 strings so mobile never throws QuotaExceeded)
          const safeInquiries = (inquiries || []).map(normalizeInquiry).filter(Boolean).map(item => ({
            ...item,
            photos: (item.photos || []).map(p => ({
              id: p.id,
              label: p.label,
              url: (p.url && typeof p.url === 'string' && p.url.startsWith('data:') && p.url.length > 5000)
                ? 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80'
                : p.url,
              thumbUrl: (p.thumbUrl && typeof p.thumbUrl === 'string' && p.thumbUrl.startsWith('data:') && p.thumbUrl.length > 5000)
                ? 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80'
                : (p.thumbUrl || p.url),
              isVideo: !!p.isVideo
            }))
          }));
          localStorage.setItem('sell2sr1_inquiries_v2', JSON.stringify(safeInquiries));
        } catch (err) {
          console.warn('LocalStorage save skipped (quota limit or private browsing):', err);
        }
      }, [inquiries]);

      // Real-time Cloud Database Sync Engine (SDK onSnapshot + REST Polling)
      useEffect(() => {
        let isMounted = true;

        const mergeInquiries = (cloudList) => {
          if (!Array.isArray(cloudList)) return;
          if (cloudList.length === 0 && (!deletedIdsRef.current || deletedIdsRef.current.length === 0)) return;
          const deletedSet = new Set(deletedIdsRef.current || []);
          const normalized = cloudList
            .map(normalizeInquiry)
            .filter(item => item && !deletedSet.has(item.id));
          normalized.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setInquiries(normalized);
        };

        const mergePartners = (cloudPartners) => {
          if (!Array.isArray(cloudPartners)) return;
          const normalized = cloudPartners.map(normalizePartner).filter(Boolean);
          if (normalized.length === 0) return;
          normalized.sort((a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0));
          setPartners(prev => {
            const byId = new Map();
            (Array.isArray(prev) ? prev : []).forEach(p => { if (p && p.id) byId.set(p.id, p); });
            normalized.forEach(p => { if (p && p.id) byId.set(p.id, p); });
            const merged = Array.from(byId.values());
            try {
              localStorage.setItem('sell2sr1_partners_v1', JSON.stringify(merged));
            } catch (e) {}
            return merged;
          });
          setPartnerUser(curr => {
            if (!curr) return null;
            const updatedSelf = normalized.find(p => p.id === curr.id);
            if (updatedSelf) {
              try { localStorage.setItem('sell2sr1_partner_user', JSON.stringify(updatedSelf)); } catch (e) {}
              return updatedSelf;
            }
            return curr;
          });
        };

        // 1. Immediate fetch from Cloud REST API on startup
        fetchInquiriesFromCloudRest().then(list => {
          if (isMounted && list && list.length > 0) {
            mergeInquiries(list);
          }
        });
        fetchPartnersFromCloudRest().then(pList => {
          if (isMounted && pList && pList.length > 0) {
            mergePartners(pList);
          }
        });

        // 2. Real-time Firebase SDK subscription
        let unsubscribe = null;
        if (db) {
          try {
            unsubscribe = db.collection('inquiries').onSnapshot((snapshot) => {
              const cloudInquiries = [];
              const cloudPartners = [];
              snapshot.forEach((doc) => {
                const data = doc.data();
                if (data && (data.isPartnerDoc || String(doc.id || '').startsWith('_partner_'))) {
                  cloudPartners.push(data);
                } else {
                  cloudInquiries.push(data);
                }
              });
              if (isMounted && cloudInquiries.length > 0) {
                mergeInquiries(cloudInquiries);
              }
              if (isMounted && cloudPartners.length > 0) {
                mergePartners(cloudPartners);
              }
            }, (err) => {
              console.warn('Firestore onSnapshot sync notice:', err);
            });
          } catch (e) {
            console.warn('Firestore subscription error:', e);
          }
        }

        // 3. Fallback continuous polling (every 4 seconds) to ensure 100% sync reliability across all devices
        const pollInterval = setInterval(() => {
          fetchInquiriesFromCloudRest().then(list => {
            if (isMounted && list && list.length > 0) {
              mergeInquiries(list);
            }
          });
          fetchPartnersFromCloudRest().then(pList => {
            if (isMounted && pList && pList.length > 0) {
              mergePartners(pList);
            }
          });
        }, 4000);

        return () => {
          isMounted = false;
          if (unsubscribe) unsubscribe();
          clearInterval(pollInterval);
        };
      }, []);

      const handleNewInquiry = async (newInquiry) => {
        const normalized = normalizeInquiry(newInquiry);
        setInquiries(prev => [normalized, ...(prev || []).filter(i => i.id !== normalized.id)]);
        setLastSubmittedRef(normalized.referenceId);

        // Sanitize object (strips undefined values that Firestore rejects)
        const cleanInquiry = JSON.parse(JSON.stringify(normalized));

        // 1. Direct REST save (Guaranteed delivery)
        const saved = await saveInquiryToCloudRest(cleanInquiry);

        // 2. Firebase SDK save
        if (db) {
          try {
            let sdkInq = JSON.parse(JSON.stringify(cleanInquiry));
            if (sdkInq.photos && Array.isArray(sdkInq.photos)) {
              sdkInq.photos = sdkInq.photos.slice(0, 8).map(p => {
                const rawThumb = p.thumbUrl || p.url || '';
                const safeThumb = (typeof rawThumb === 'string' && rawThumb.length < 75000)
                  ? rawThumb
                  : '';
                return {
                  id: p.id || 'p-' + Math.random().toString(36).substr(2, 6),
                  label: p.label || 'Unit Media',
                  url: safeThumb,
                  thumbUrl: safeThumb,
                  isVideo: !!p.isVideo,
                  fileSize: p.fileSize || 0,
                  fileType: p.fileType || (p.isVideo ? 'video/mp4' : 'image/jpeg'),
                  uploadedAt: p.uploadedAt || new Date().toISOString()
                };
              });
            }
            db.collection('inquiries').doc(normalized.id).set(sdkInq)
              .catch(err => console.warn('Firestore SDK save notice:', err));
          } catch (e) {
            console.warn('Firestore write error:', e);
          }
        }
        return saved;
      };

      const handleUpdateInquiry = async (updated) => {
        const normalized = normalizeInquiry(updated);
        setInquiries(prev => (prev || []).map(item => item.id === normalized.id ? normalized : item));

        const cleanUpdated = JSON.parse(JSON.stringify(normalized));

        // 1. Direct REST save
        await saveInquiryToCloudRest(cleanUpdated);

        // 2. Firebase SDK save
        if (db) {
          try {
            let sdkInq = JSON.parse(JSON.stringify(cleanUpdated));
            if (sdkInq.photos && Array.isArray(sdkInq.photos)) {
              sdkInq.photos = sdkInq.photos.slice(0, 8).map(p => {
                const rawThumb = p.thumbUrl || p.url || '';
                const safeThumb = (typeof rawThumb === 'string' && rawThumb.length < 75000)
                  ? rawThumb
                  : '';
                return {
                  id: p.id || 'p-' + Math.random().toString(36).substr(2, 6),
                  label: p.label || 'Unit Media',
                  url: safeThumb,
                  thumbUrl: safeThumb,
                  isVideo: !!p.isVideo,
                  fileSize: p.fileSize || 0,
                  fileType: p.fileType || (p.isVideo ? 'video/mp4' : 'image/jpeg'),
                  uploadedAt: p.uploadedAt || new Date().toISOString()
                };
              });
            }
            db.collection('inquiries').doc(updated.id).set(sdkInq, { merge: true })
              .catch(err => console.warn('Firestore update notice:', err));
          } catch (e) {
            console.warn('Firestore update call error:', e);
          }
        }
      };

      const handleDeleteInquiry = async (inquiryOrId) => {
        if (!isSuperAdmin(staffUser)) {
          alert('Only reid@sr1companies.com is authorized to delete inquiries.');
          return false;
        }
        const targetId = typeof inquiryOrId === 'string' ? inquiryOrId : inquiryOrId?.id;
        if (!targetId) return false;

        if (!deletedIdsRef.current.includes(targetId)) {
          deletedIdsRef.current = [...deletedIdsRef.current, targetId];
          try {
            localStorage.setItem('sell2sr1_deleted_inquiry_ids', JSON.stringify(deletedIdsRef.current));
          } catch (e) {}
        }

        setInquiries(prev => (prev || []).filter(item => item && item.id !== targetId));
        if (selectedInquiryId === targetId) {
          setSelectedInquiryId(null);
        }

        await deleteInquiryFromCloudRest(targetId);

        if (db) {
          try {
            db.collection('inquiries').doc(targetId).delete()
              .catch(err => console.warn('Firestore SDK delete notice:', err));
          } catch (e) {
            console.warn('Firestore delete call error:', e);
          }
        }
        return true;
      };

      const handleSyncSamplesToCloud = async () => {
        try {
          for (const inq of INITIAL_INQUIRIES_DATA) {
            const clean = JSON.parse(JSON.stringify(inq));
            await saveInquiryToCloudRest(clean);
            if (db) {

              } catch (e) {}
            }
          }
          alert('Sample inquiries successfully synced to Cloud! They will now appear live across all your connected phones and computers.');

          if (list && list.length > 0) {

          console.error('Failed to sync to cloud:', err);

      // --- GOOGLE SIGN-IN EFFECT ---
      useEffect(() => {
        if (currentView === 'portal' && !isAuthenticated) {
          window.handleGoogleResponse = (response) => {
            try {
              // Decode JWT payload (base64)
              const payload = JSON.parse(atob(response.credential.split('.')[1]));
              const email = payload.email.toLowerCase();
              
              if (email.endsWith('@sr1companies.com')) {
                const userObj = {
                  email,
                  name: payload.name || email.split('@')[0],
                  picture: payload.picture
                };
                setStaffUser(userObj);
                try {
                  localStorage.setItem('sell2sr1_staff_user', JSON.stringify(userObj));
                } catch (e) {}
                setIsAuthenticated(true);
              } else {
                alert(`Access denied. The email ${email} is not authorized for the staff portal. You must sign in with an @sr1companies.com account.`);
              }
            } catch (err) {
              console.error('Failed to parse Google JWT', err);
              alert('Authentication failed. Please try again.');
            }
          };

          if (window.google) {
            window.google.accounts.id.initialize({
              client_id: '1062806885891-vhi7uu0osra4eab5q5pj9mik0fpmm48k.apps.googleusercontent.com',
              callback: window.handleGoogleResponse
            });
            window.google.accounts.id.renderButton(
              document.getElementById('google-signin-button'),
              { theme: 'outline', size: 'large', type: 'standard' }
            );
          } else {
            console.error("Google Identity Services library not loaded.");
          }

      // Reliably scroll view back up to the start of the next page/section on mobile & desktop
      const scrollToFormTop = () => {
        const doScroll = () => {
          try {
            const card = document.getElementById('sell-form-card');
            if (card) {
              const rect = card.getBoundingClientRect();
              const yOffset = -75; // Account for top announcement bar and sticky header
              const targetY = rect.top + window.pageYOffset + yOffset;

        setTimeout(doScroll, 50);
        setTimeout(doScroll, 150);
      };

      // Auto-scroll view back up to the start of the next page/step on step changes
      const isFirstStepMount = useRef(true);
      useEffect(() => {
        if (isFirstStepMount.current) {

      useEffect(() => {

          setTimeout(() => window.scrollTo(0, 0), 150);
        }
      }, [submittedInquiry]);

      // Generates a crisp, lightweight JPEG thumbnail (~20KB) directly from a File or Blob
      const compressImageFile = (file, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!file) return resolve('');
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              compressImageToDataUrl(ev.target.result, maxDim, quality).then(resolve);
            };
            reader.onerror = () => resolve('');
            reader.readAsDataURL(file);
            return;
          }

          const img = new Image();
          const cleanup = () => {
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (err) {
              cleanup();
              resolve('');
            }
          };

          img.onerror = () => {
            cleanup();
            try {
              const reader = new FileReader();
              reader.onload = (ev) => {
                const res = ev.target.result;
                if (typeof res === 'string' && res.startsWith('data:image/')) {
                  compressImageToDataUrl(res, maxDim, quality).then(resolve);
                } else {
                  resolve('');
                }
              };
              reader.onerror = () => resolve('');
              reader.readAsDataURL(file);
            } catch (e) {
              resolve('');
            }
          };

          img.src = objectUrl;
        });
      };

      // Extract a lightweight thumbnail preview (~20KB) from a video file
      const extractVideoThumbnail = (file) => {
        return new Promise((resolve) => {
          let objectUrl = '';
          try {
            objectUrl = URL.createObjectURL(file);
          } catch (e) {
            return resolve('');
          }

          const video = document.createElement('video');
          video.preload = 'metadata';
          video.muted = true;
          video.playsInline = true;

          let cleaned = false;
          const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          };

          const timer = setTimeout(() => {
            cleanup();
            resolve('');
          }, 6000);

          video.onloadedmetadata = () => {
            video.currentTime = Math.min(1.0, video.duration > 0 ? video.duration * 0.2 : 0.5);
          };

          video.onseeked = () => {
            clearTimeout(timer);
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480;
              let w = video.videoWidth || 480;
              let h = video.videoHeight || 270;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', 0.55));
            } catch (e) {
              cleanup();
              resolve('');
            }
          };

          video.onerror = () => {
            clearTimeout(timer);
            cleanup();
            resolve('');
          };

          video.src = objectUrl;
        });
      };

      // Generate a reduced-size preview base64 JPEG specifically for Resend email attachments
      const createEmailPreviewBase64 = (dataUrlOrUrl, isVideo = false) => {
        return new Promise((resolve) => {
          if (!dataUrlOrUrl) return resolve(null);
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 480; // Reduced size for fast email delivery
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

              if (isVideo) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(8, canvas.height - 30, 130, 22);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('▶ VIDEO PREVIEW', 14, canvas.height - 15);
              }

              const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.65);
              const base64Content = jpegDataUrl.includes(',') ? jpegDataUrl.split(',')[1] : null;
              resolve(base64Content);
            } catch (err) {
              resolve(null);
            }
          };
          img.onerror = () => resolve(null);
          img.src = dataUrlOrUrl;
        });
      };

      // Generate optimized lightweight JPEG thumbnail for cloud database sync (~20KB)
      const compressImageToDataUrl = (dataUrl, maxDim = 480, quality = 0.55) => {
        return new Promise((resolve) => {
          if (!dataUrl) return resolve('');
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width || 480;
              let h = img.height || 360;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (e) {
              resolve('');
            }
          };
          img.onerror = () => resolve('');
          img.src = dataUrl;
        });
      };

      const processFiles = async (filesList) => {
        const files = Array.from(filesList || []).filter(file => 
          file.type.startsWith('image/') || 
          file.type.startsWith('video/') ||
          /\.(mp4|mov|webm|m4v|avi|heic|heif|jpg|jpeg|png|webp)$/i.test(file.name)
        );
        if (files.length === 0) return '';
        setUploading(true);
        let firstDetectedInBatch = '';

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          try {
            setUploadStatus(`Uploading file ${i + 1} of ${files.length}...`);
            const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name);
            const mediaId = 'm-' + Math.random().toString(36).substr(2, 9);
            const label = file.name || (isVideo ? 'Uploaded Video' : 'Uploaded Photo');
            let resolvedDetectedVin = '';
            let resolvedUnreadableVinTag = false;

            // Start VIN / Serial barcode + OCR scan in parallel on image files (only if a VIN hasn't already been found)
            if (!isVideo && !latestVinRef.current) {
              activeScanCountRef.current += 1;
              setScanningVin(true);
              let scanPromise;
              scanPromise = scanImageFileForVin(file, category, () => Boolean(latestVinRef.current))
                .then((scanRes) => {
                  const detected = typeof scanRes === 'string' ? scanRes : (scanRes?.vin || '');
                  const unreadableTag = Boolean(typeof scanRes === 'object' && scanRes?.unreadableVinTag && !detected);
                  if (detected) {
                    resolvedDetectedVin = detected;
                    if (!firstDetectedInBatch) firstDetectedInBatch = detected;
                    setPhotos(prev => prev.map(p => (p.id === mediaId ? { ...p, detectedVin: detected, unreadableVinTag: false } : p)));
                    if (!latestVinRef.current) {
                      latestVinRef.current = detected;
                      setVinScanSource('ocr');
                      setFormData(prev => (prev.vinOrSerial && prev.vinOrSerial.trim() ? prev : { ...prev, vinOrSerial: detected }));
                    }
                  } else if (unreadableTag) {
                    resolvedUnreadableVinTag = true;
                    setPhotos(prev => prev.map(p => (p.id === mediaId ? { ...p, unreadableVinTag: true } : p)));
                  }
                  return detected || '';
                })
                .catch(() => '')
                .finally(() => {
                  activeScanPromisesRef.current = activeScanPromisesRef.current.filter(pr => pr !== scanPromise);
                  activeScanCountRef.current = Math.max(0, activeScanCountRef.current - 1);
                  if (activeScanCountRef.current === 0) {
                    setScanningVin(false);
                  }
                });
              activeScanPromisesRef.current.push(scanPromise);
            }

            // 1. Ensure HEIC/HEIF images are converted to browser-compatible JPEG before upload & thumbnail display
            const uploadableFile = !isVideo ? (await ensureDecodableImageBlob(file)) || file : file;

            // 2. Direct upload to Firebase Cloud Storage bucket
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(uploadableFile);
            } catch (storageErr) {
              console.warn('Storage upload notice, falling back:', storageErr);
            }

            if (cloudUrl) {
              setPhotos(prev => [
                ...prev,
                {
                  id: mediaId,
                  url: cloudUrl,
                  thumbUrl: cloudUrl,
                  isVideo: isVideo,
                  fileSize: uploadableFile.size || file.size,
                  fileType: uploadableFile.type || file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
                  label: label,
                  detectedVin: resolvedDetectedVin || '',
                  unreadableVinTag: resolvedUnreadableVinTag,
                  uploadedAt: new Date().toISOString()
                }
              ]);
            } else {
              // 3. Client-side fallback if storage bucket was unreachable
              if (isVideo) {
                const thumbUrl = await extractVideoThumbnail(file);
                if (thumbUrl) {
                  setPhotos(prev => [
                    ...prev,
                    {
                      id: mediaId,
                      url: thumbUrl,
                      thumbUrl: thumbUrl,
                      isVideo: true,
                      fileSize: file.size,
                      fileType: file.type || 'video/mp4',
                      label: label,
                      uploadedAt: new Date().toISOString()
                    }
                  ]);
                }
              } else {
                const thumbUrl = await compressImageFile(uploadableFile, 480, 0.55);
                if (thumbUrl) {
                  setPhotos(prev => [
                    ...prev,
                    {
                      id: mediaId,
                      url: thumbUrl,
                      thumbUrl: thumbUrl,
                      isVideo: false,
                      fileSize: file.size,
                      fileType: 'image/jpeg',
                      label: label,
                      detectedVin: resolvedDetectedVin || '',
                      unreadableVinTag: resolvedUnreadableVinTag,
                      uploadedAt: new Date().toISOString()
                    }
                  ]);
                }
              }
            }
          } catch (err) {
            console.error('Photo/Video processing error:', err);
          }
        }
        setUploading(false);
        setUploadStatus('');
        return firstDetectedInBatch;
      };

      const handleFileSelect = async (e) => {

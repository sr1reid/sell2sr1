    // 2B. DEALER TRADE-BANKING & BANK/CREDIT UNION REPO PORTAL
    // ==========================================
    function createBlankBatchUnit(defaultCategory = 'rv', partnerType = 'dealer') {
      return {
        tempId: 'u-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
        category: defaultCategory,
        subcategory: '',
        year: '',
        make: '',
        model: '',
        trimOrFloorplan: '',
        vinOrSerial: '',
        vinScanSource: '',
        scanningVin: false,
        mileageOrHours: '',
        lengthFeet: '',
        slidesCount: '',
        horsepower: '',
        cabType: 'open_rops',
        condition: 'good',
        tireOrTrackCondition: 'good',
        conditionNotes: '',
        knownIssuesOrDamage: '',
        titleStatus: partnerType === 'bank' ? 'Repo Affidavit / Title Pending' : 'Clean Title / Dealer Reassignment',
        lienHolderName: '',
        estimatedPayoff: '',
        askingPrice: '',
        preferredLocation: 'pickup_requested',
        salespersonName: '',
        photos: [],
        uploadingPhotos: false
      };
    }

    function PartnerPortalView({
      portalType,
      onSwitchPortalType,
      partnerUser,
      onSetPartnerUser,
      partners,
      onSavePartner,
      inquiries,
      onSubmitInquiry,
      onUpdateInquiry,
      emailRoutingConfig,
      onGoHome
    }) {
      const isBankPortal = portalType === 'bank';
      const portalTitle = isBankPortal
        ? 'Bank & Credit Union Repo Liquidation Portal'
        : 'Dealer Portal';
      const portalBadge = isBankPortal
        ? '🏦 BANK & CREDIT UNION REPO PORTAL'
        : '🤝 DEALER PORTAL';
      const orgLabel = isBankPortal ? 'Bank or Credit Union Name' : 'Dealership Name';

      // Auth states
      const [authMode, setAuthMode] = useState('signin'); // 'signin' | 'signup'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [signupOrg, setSignupOrg] = useState('');
      const [signupContact, setSignupContact] = useState('');
      const [signupPhone, setSignupPhone] = useState('');
      const [signupCity, setSignupCity] = useState('');
      const [signupState, setSignupState] = useState('ME');
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      // Active portal tab once logged in: 'hub' | 'submit' | 'chat'
      const [activeTab, setActiveTab] = useState('hub');
      const [batchUnits, setBatchUnits] = useState(() => [createBlankBatchUnit('rv', portalType)]);
      const [submittingBatch, setSubmittingBatch] = useState(false);
      const [bannerNotice, setBannerNotice] = useState('');

      // Hub filter & detail modal states
      const [hubSearch, setHubSearch] = useState('');
      const [hubStageFilter, setHubStageFilter] = useState('all');
      const [selectedUnitId, setSelectedUnitId] = useState(null);
      const [unitChatInput, setUnitChatInput] = useState('');
      const [sendingUnitChat, setSendingUnitChat] = useState(false);
      const [editingUnitDetails, setEditingUnitDetails] = useState(false);
      const [editUnitForm, setEditUnitForm] = useState({});
      const [uploadingExtraPhotos, setUploadingExtraPhotos] = useState(false);

      // General relationship chat state
      const [generalChatInput, setGeneralChatInput] = useState('');
      const [sendingGeneralChat, setSendingGeneralChat] = useState(false);

      // Live partner record from synced partners list
      const activePartner = useMemo(() => {
        if (!partnerUser) return null;
        const found = (Array.isArray(partners) ? partners : []).find(
          p => p && (p.id === partnerUser.id || (p.email && partnerUser.email && p.email.toLowerCase() === partnerUser.email.toLowerCase()))
        );
        return found || partnerUser;
      }, [partnerUser, partners]);

      // Units belonging to this partner
      const myUnits = useMemo(() => {
        if (!activePartner) return [];
        const pId = activePartner.id;
        const pEmail = (activePartner.email || '').toLowerCase();
        return (Array.isArray(inquiries) ? inquiries : []).filter(inq => {
          if (!inq) return false;
          if (inq.partnerId && inq.partnerId === pId) return true;
          if (pEmail && inq.partnerEmail && inq.partnerEmail.toLowerCase() === pEmail) return true;
          if (pEmail && inq.customer?.email && inq.customer.email.toLowerCase() === pEmail && (inq.submissionSource === 'dealer' || inq.submissionSource === 'bank')) return true;
          return false;
        });
      }, [inquiries, activePartner]);

      const filteredMyUnits = useMemo(() => {
        return myUnits.filter(u => {
          const isArch = u.isArchived || u.stage === 'archived';
          if (hubStageFilter === 'archived') {
            if (!isArch) return false;
          } else if (hubStageFilter === 'all') {
            if (isArch) return false;
          } else if (hubStageFilter === 'offer_sent') {
            if (isArch || (u.stage !== 'offer_sent' && (!Array.isArray(u.offers) || u.offers.length === 0))) return false;
          } else {
            if (isArch || u.stage !== hubStageFilter) return false;
          }
          if (hubSearch.trim()) {
            const q = hubSearch.toLowerCase().trim();
            const title = `${u.unit?.year || ''} ${u.unit?.make || ''} ${u.unit?.model || ''} ${u.unit?.trimOrFloorplan || ''}`.toLowerCase();
            const vin = String(u.unit?.vinOrSerial || '').toLowerCase();
            const ref = String(u.referenceId || '').toLowerCase();
            return title.includes(q) || vin.includes(q) || ref.includes(q);
          }
          return true;
        });
      }, [myUnits, hubStageFilter, hubSearch]);

      const totalUnreadUnitMsgs = useMemo(() => {
        return myUnits.reduce((acc, u) => acc + (Number(u.unreadUnitForPartner) || 0), 0);
      }, [myUnits]);

      const unreadGeneralMsgs = Number(activePartner?.unreadGeneralForPartner) || 0;

      const selectedUnit = useMemo(() => {
        if (!selectedUnitId) return null;
        return myUnits.find(u => u.id === selectedUnitId) || null;
      }, [myUnits, selectedUnitId]);

      // Clear unread general messages when partner opens general chat tab
      useEffect(() => {
        if (activeTab === 'chat' && activePartner && unreadGeneralMsgs > 0) {
          onSavePartner({
            ...activePartner,
            unreadGeneralForPartner: 0
          });
        }
      }, [activeTab, activePartner?.id, unreadGeneralMsgs]);

      // Clear unread unit messages when partner opens a unit modal
      useEffect(() => {
        if (selectedUnit && Number(selectedUnit.unreadUnitForPartner) > 0) {
          onUpdateInquiry({
            ...selectedUnit,
            unreadUnitForPartner: 0
          });
        }
      }, [selectedUnit?.id, selectedUnit?.unreadUnitForPartner]);

      const handleSignInSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        const emailClean = (authEmail || '').trim().toLowerCase();
        const passClean = (authPassword || '').trim();
        if (!emailClean || !passClean) {
          setAuthError('Please enter your email address and password.');
          return;
        }
        setAuthLoading(true);
        try {
          let pool = Array.isArray(partners) ? [...partners] : [];
          let matched = pool.find(p => p && p.email === emailClean);
          if (!matched) {
            const cloudPool = await fetchPartnersFromCloudRest();
            if (Array.isArray(cloudPool) && cloudPool.length > 0) {
              pool = cloudPool;
              matched = pool.find(p => p && p.email === emailClean);
            }
          }
          if (!matched || matched.password !== passClean) {
            setAuthError('Invalid email or password. If you do not have an account yet, click "Create Account" above.');
            setAuthLoading(false);
            return;
          }
          if (matched.status === 'disabled') {
            setAuthError('This partner account has been disabled by SR1 Administration. Please contact appraisals@sr1companies.com.');
            setAuthLoading(false);
            return;
          }
          const updatedPartner = {
            ...matched,
            lastLoginAt: new Date().toISOString()
          };
          await onSavePartner(updatedPartner);
          onSetPartnerUser(updatedPartner);
          if (updatedPartner.partnerType && updatedPartner.partnerType !== portalType) {
            onSwitchPortalType(updatedPartner.partnerType);
          }
        } catch (err) {
          setAuthError('Unable to sign in right now. Please try again.');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignUpSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        const orgClean = (signupOrg || '').trim();
        const contactClean = (signupContact || '').trim();
        const emailClean = (authEmail || '').trim().toLowerCase();
        const phoneClean = (signupPhone || '').trim();
        const cityClean = (signupCity || '').trim();
        const stateClean = (signupState || 'ME').trim();
        const passClean = (authPassword || '').trim();

        if (!orgClean || !contactClean || !emailClean || !phoneClean || !cityClean || !passClean) {
          setAuthError('Please fill in all fields to create your partner portal account.');
          return;
        }
        if (passClean.length < 4) {
          setAuthError('Please choose a password of at least 4 characters.');
          return;
        }

        setAuthLoading(true);
        try {
          let pool = Array.isArray(partners) ? [...partners] : [];
          const cloudPool = await fetchPartnersFromCloudRest();
          if (Array.isArray(cloudPool)) {
            pool = [...pool, ...cloudPool];
          }
          const existing = pool.find(p => p && p.email === emailClean);
          if (existing) {
            setAuthError('An account with this email address already exists. Please switch to Sign In.');
            setAuthLoading(false);
            return;
          }

          const newPartnerId = 'prt-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 5);
          const nowIso = new Date().toISOString();
          const welcomeMsg = {
            id: 'gmsg-' + Date.now(),
            senderRole: 'staff',
            senderName: 'SR1 Purchasing Desk',
            senderEmail: 'appraisals@sr1companies.com',
            text: isBankPortal
              ? `Welcome to the SR1 Bank & Credit Union Repo Liquidation Portal, ${contactClean}! Submit single or multiple repo units anytime, and use this General Chat or any Unit Chat to reach our buyers directly.`
              : `Welcome to the SR1 Dealer Portal, ${contactClean}! Submit single or multiple trade-in units anytime for wholesale buy offers, and use this General Chat or any Unit Chat to reach our buyers directly.`,
            createdAt: nowIso
          };

          const newPartner = normalizePartner({
            id: newPartnerId,
            partnerType: portalType,
            organizationName: orgClean,
            contactName: contactClean,
            email: emailClean,
            phone: phoneClean,
            city: cityClean,
            state: stateClean,
            password: passClean,
            status: 'active',
            createdAt: nowIso,
            updatedAt: nowIso,
            lastLoginAt: nowIso,
            generalMessages: [welcomeMsg],
            unreadGeneralForStaff: 0,
            unreadGeneralForPartner: 1
          });

          await onSavePartner(newPartner);
          onSetPartnerUser(newPartner);

          // Notify SR1 team of new partner registration
          const recipients = getPartnerPortalNotificationEmails(portalType, emailRoutingConfig);
          dispatchPartnerEmailNotification({
            recipients,
            partnerType: portalType,
            subject: `New ${isBankPortal ? 'Bank / Credit Union' : 'Dealer'} Portal Registration: ${orgClean}`,
            heading: `New ${isBankPortal ? 'Bank / Credit Union' : 'Dealer'} Partner Registered`,
            partnerOrgName: orgClean,
            partnerContactName: contactClean,
            partnerEmail: emailClean,

            extraRows: [

            messageText: `${orgClean} (${contactClean}) has registered an account in the ${portalTitle}.`,

          setAuthError('Error creating account. Please try again.');

          setAuthLoading(false);

      // Batch unit helpers
      const updateBatchUnit = (tempId, patch) => {
        setBatchUnits(prev => prev.map(u => (u.tempId === tempId ? { ...u, ...patch } : u)));
      };

      const handleAddBatchUnit = () => {
        setBatchUnits(prev => [...prev, createBlankBatchUnit('rv', portalType)]);
      };

      const handleDuplicateBatchUnit = (unitToCopy) => {
        const copy = {
          ...unitToCopy,
          tempId: 'u-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
          vinOrSerial: '',
          vinScanSource: '',
          photos: []
        };
        setBatchUnits(prev => [...prev, copy]);
      };

      const handleRemoveBatchUnit = (tempId) => {
        setBatchUnits(prev => (prev.length <= 1 ? prev : prev.filter(u => u.tempId !== tempId)));
      };

      const handleBatchUnitPhotos = async (tempId, fileList, unitCategory) => {
        const files = Array.from(fileList || []).filter(file =>
          file.type.startsWith('image/') ||
          file.type.startsWith('video/') ||
          /\.(mp4|mov|webm|m4v|avi|heic|heif|jpg|jpeg|png|webp)$/i.test(file.name)
        );
        if (files.length === 0) return;

        updateBatchUnit(tempId, { uploadingPhotos: true });

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name);
          const mediaId = 'pm-' + Math.random().toString(36).substr(2, 9);
          const label = file.name || (isVideo ? 'Uploaded Video' : 'Uploaded Photo');

          if (!isVideo) {
            updateBatchUnit(tempId, { scanningVin: true });
            scanImageFileForVin(file, unitCategory)
              .then(scanRes => {
                const detected = typeof scanRes === 'string' ? scanRes : (scanRes?.vin || '');
                if (detected) {
                  setBatchUnits(prev => prev.map(u => {
                    if (u.tempId !== tempId) return u;
                    const updatedPhotos = (u.photos || []).map(p => (p.id === mediaId ? { ...p, detectedVin: detected } : p));
                    if (u.vinScanSource === 'manual' && u.vinOrSerial && u.vinOrSerial.trim()) {
                      return { ...u, photos: updatedPhotos, scanningVin: false };
                    }
                    return {
                      ...u,
                      vinOrSerial: u.vinOrSerial && u.vinOrSerial.trim() ? u.vinOrSerial : detected,
                      vinScanSource: u.vinOrSerial && u.vinOrSerial.trim() ? u.vinScanSource : 'ocr',
                      photos: updatedPhotos,
                      scanningVin: false
                    };
                  }));
                } else {
                  updateBatchUnit(tempId, { scanningVin: false });
                }
              })
              .catch(() => {
                updateBatchUnit(tempId, { scanningVin: false });
              });
          }

          try {
            const uploadableFile = !isVideo ? (await ensureDecodableImageBlob(file)) || file : file;
            let cloudUrl = null;
            try {
              cloudUrl = await uploadMediaFileToStorage(uploadableFile);
            } catch (e) {}

            if (!cloudUrl) {
              // Lightweight dataURL fallback
              cloudUrl = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (ev) => resolve(ev.target.result || '');
                reader.onerror = () => resolve('');
                reader.readAsDataURL(uploadableFile);
              });
            }

            if (cloudUrl) {
              setBatchUnits(prev => prev.map(u => {
                if (u.tempId !== tempId) return u;
                return {
                  ...u,
                  photos: [
                    ...(u.photos || []),
                    {
                      id: mediaId,
                      url: cloudUrl,
                      thumbUrl: cloudUrl,
                      isVideo,
                      fileSize: uploadableFile.size || file.size,
                      fileType: uploadableFile.type || file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
                      label,
                      uploadedAt: new Date().toISOString()
                    }
                  ]
                };
              }));
            }
          } catch (err) {
            console.warn('Batch unit photo upload notice:', err);
          }
        }

        updateBatchUnit(tempId, { uploadingPhotos: false });
      };

              unreadUnitForStaff: 1,

                {

                  createdAt: new Date().toLocaleTimeString(),
                  category: 'general',
                  content: initialMsgText
                }
              ]
            };

            await onSubmitInquiry(newInq);
            submittedSummaryRows.push({
              label: `Unit #${idx + 1} [Ref #${refId}]`,
              value: `${[unitYear, unitMake, unitModel, u.trimOrFloorplan].filter(Boolean).join(' ')} • VIN: ${cleanVin}${u.askingPrice ? ` • Asking/Floor: $${Number(u.askingPrice).toLocaleString()}` : ''} • Photos: ${(u.photos || []).length}`
            });
          }

          // Dispatch email notification to SR1 configured recipients
          const sr1Recipients = getPartnerPortalNotificationEmails(portalType, emailRoutingConfig);
          dispatchPartnerEmailNotification({
            recipients: sr1Recipients,
            partnerType: portalType,
            subject: `[${isBankPortal ? 'BANK REPO SUBMISSION' : 'DEALER TRADE SUBMISSION'}] ${batchUnits.length} Unit(s) from ${activePartner.organizationName}`,
            heading: `${batchUnits.length} New Unit(s) Submitted by ${activePartner.organizationName}`,
            partnerOrgName: activePartner.organizationName,
            partnerContactName: activePartner.contactName,
            partnerEmail: activePartner.email,
            partnerPhone: activePartner.phone,
            extraRows: submittedSummaryRows,
            messageText: `${activePartner.organizationName} (${activePartner.contactName}) submitted ${batchUnits.length} unit(s) for an offer in the ${portalTitle}. Open the SR1 Staff Portal to review, make offers, and chat.`,
            ctaLabel: 'Open SR1 Staff Portal →',
            ctaUrl: 'https://selltosr1.com/?view=portal'
          });

          // Dispatch confirmation email to Partner
          if (activePartner.email && activePartner.email.includes('@')) {
            dispatchPartnerEmailNotification({
              recipients: [activePartner.email],
              partnerType: portalType,
              subject: `We Received Your ${batchUnits.length} Submitted Unit(s) - SR1 Companies`,
              heading: `${batchUnits.length} Unit(s) Received for SR1 Valuation`,

                          <div>
                            <label className="text-[10px] text-neutral-400 block mb-0.5">VIN / Serial</label>
                            <input type="text" value={editUnitForm.vinOrSerial} onChange={e => setEditUnitForm({ ...editUnitForm, vinOrSerial: e.target.value.toUpperCase() })} className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-2.5 py-1.5 text-white font-mono" />
                          </div>
                          <div>
                            <label className="text-[10px] text-neutral-400 block mb-0.5">Mileage / Hours</label>
                            <input type="number" value={editUnitForm.mileageOrHours} onChange={e => setEditUnitForm({ ...editUnitForm, mileageOrHours: e.target.value })} className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-2.5 py-1.5 text-white" />
                          </div>
                          <div>
                            <label className="text-[10px] text-neutral-400 block mb-0.5">Asking / Reserve ($)</label>
                            <input type="number" value={editUnitForm.askingPrice} onChange={e => setEditUnitForm({ ...editUnitForm, askingPrice: e.target.value })} className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-2.5 py-1.5 text-white" />
                          </div>
                          <div className="col-span-2">
                            <label className="text-[10px] text-neutral-400 block mb-0.5">Condition Notes</label>
                            <textarea rows="2" value={editUnitForm.conditionNotes} onChange={e => setEditUnitForm({ ...editUnitForm, conditionNotes: e.target.value })} className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-2.5 py-1.5 text-white" />
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Unit Photos & Upload More */}
                    <div className="bg-neutral-950 border border-neutral-800 rounded-xl p-4 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-bold uppercase text-neutral-400">
                          Photos &amp; Videos ({(selectedUnit.photos || []).length})
                        </span>
                        <label className="px-2.5 py-1 rounded-lg bg-neutral-900 hover:bg-neutral-800 border border-neutral-750 text-neutral-200 text-[11px] font-semibold cursor-pointer">
                          <span>{uploadingExtraPhotos ? 'Uploading...' : '+ Add Photos'}</span>
                          <input type="file" multiple accept="image/*,video/*,.heic,.heif" onChange={handleUploadAdditionalUnitPhotos} className="hidden" />
                        </label>
                      </div>
                      {(selectedUnit.photos || []).length > 0 ? (
                        <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                          {(selectedUnit.photos || []).map((p, idx) => (
                            <a key={p.id || idx} href={p.url || p.thumbUrl} target="_blank" rel="noopener noreferrer" className="block aspect-video rounded-lg overflow-hidden bg-neutral-900 border border-neutral-800">
                              <img src={p.thumbUrl || p.url} alt="" className="w-full h-full object-cover" />
                            </a>
                          ))}
                        </div>
                      ) : (
                        <p className="text-neutral-500 text-xs">No photos uploaded yet.</p>
                      )}
                    </div>
                  </div>

                  {/* Right 6 cols: Unit-Specific Chat with SR1 */}
                  <div className="lg:col-span-6 bg-neutral-950 border border-neutral-800 rounded-xl flex flex-col h-[500px] overflow-hidden">
                    <div className="p-3.5 bg-neutral-900 border-b border-neutral-800">
                      <div className="font-bold text-white text-xs flex items-center gap-1.5">
                        <span>💬</span>
                        <span>Unit Chat with SR1 — #{selectedUnit.referenceId}</span>
                      </div>
                      <div className="text-[10px] text-neutral-400 mt-0.5">
                        Messages sent here notify SR1 buyers immediately by email &amp; in the Staff Portal.
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-3.5 space-y-2.5">
                      {(selectedUnit.unitMessages || []).length === 0 ? (
                        <div className="h-full flex items-center justify-center text-neutral-500 text-xs text-center px-4">
                          No messages on this unit yet. Send a message below to discuss valuation, offers, or pickup details for this unit.
                        </div>
                      ) : (
                        (selectedUnit.unitMessages || []).map(msg => {
                          const isPartnerMsg = msg.senderRole === 'partner';
                          const tInfo = formatInquiryDate(msg.createdAt);
                          return (
                            <div key={msg.id} className={`flex flex-col ${isPartnerMsg ? 'items-end' : 'items-start'}`}>
                              <div className={`max-w-[85%] rounded-2xl px-3.5 py-2 text-xs space-y-1 ${
                                isPartnerMsg
                                  ? 'bg-neutral-100 text-neutral-950'
                                  : 'bg-neutral-900 border border-neutral-750 text-neutral-100'
                              }`}>
                                <div className={`flex items-center gap-1.5 text-[10px] font-bold ${isPartnerMsg ? 'text-neutral-600' : 'text-emerald-400'}`}>
                                  <span>{msg.senderName || (isPartnerMsg ? activePartner.contactName : 'SR1 Buyer')}</span>
                                  <span>•</span>
                                  <span>{tInfo.date} {tInfo.time}</span>
                                </div>
                                <div className="whitespace-pre-wrap leading-relaxed">{msg.text}</div>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>

                    <form onSubmit={handleSendUnitChatMessage} className="p-3 bg-neutral-900 border-t border-neutral-800 flex gap-2">
                      <input
                        type="text"
                        value={unitChatInput}
                        onChange={(e) => setUnitChatInput(e.target.value)}
                        placeholder={`Message SR1 about #${selectedUnit.referenceId}...`}
                        className="flex-1 bg-neutral-950 border border-neutral-750 rounded-xl px-3.5 py-2 text-white text-xs focus:outline-none"
                      />
                      <button
                        type="submit"
                        disabled={sendingUnitChat}
                        className="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-950 font-extrabold rounded-xl text-xs cursor-pointer"
                      >
                        {sendingUnitChat ? '...' : 'Send'}
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. EMAIL ROUTING MANAGER (SUPER ADMIN: reid@sr1companies.com ONLY)
    // ==========================================
    function EmailRoutingManager({ emailRoutingConfig, onSaveEmailRoutingConfig, staffUser, onBackToInquiries }) {
      if (!isSuperAdmin(staffUser)) {
        return (
          <div className="py-16 max-w-lg mx-auto text-center space-y-4">
            <div className="w-16 h-16 bg-neutral-900 border border-neutral-800 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
              🔒
            </div>
            <h2 className="text-xl font-bold text-white">Access Restricted to Super Admin</h2>
            <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
              Only authorized administrator <strong className="text-white">reid@sr1companies.com</strong> has permission to configure where appraisal submissions are routed.
            </p>
            <div className="pt-2">
              <button
                type="button"
                onClick={onBackToInquiries}
                className="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded-xl text-xs font-semibold cursor-pointer transition-colors"
              >
                ← Return to Inquiries Workspace
              </button>
            </div>
          </div>
        );
      }

      const initialRouting = useMemo(() => {
        const merged = { ...DEALERSHIP_NOTIFICATION_EMAILS };
        if (emailRoutingConfig && typeof emailRoutingConfig === 'object') {
          Object.assign(merged, emailRoutingConfig);
        }
        return merged;
      }, [emailRoutingConfig]);

      const [routingState, setRoutingState] = useState(() => initialRouting);
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [isSaving, setIsSaving] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [newEmailInputs, setNewEmailInputs] = useState({});

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Unsaved changes check
      const hasUnsavedChanges = useMemo(() => {
        return JSON.stringify(routingState) !== JSON.stringify(initialRouting);
      }, [routingState, initialRouting]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4500);
      };

      const handleAddEmail = (locId, emailInput) => {
        const raw = (emailInput || '').trim();
        if (!raw) return;
        const splitEmails = raw.split(/[,;\s]+/).map(e => e.trim().toLowerCase()).filter(Boolean);
        if (splitEmails.length === 0) return;

        const currentList = Array.isArray(routingState[locId]) ? routingState[locId] : [];
        const toAdd = splitEmails.filter(e => !currentList.includes(e));

        if (toAdd.length === 0) {
          showToast('Email already added for this store.');
          return;
        }

        setRoutingState(prev => ({
          ...prev,
          [locId]: [...currentList, ...toAdd]
        }));
        setNewEmailInputs(prev => ({ ...prev, [locId]: '' }));
      };

      const handleRemoveEmail = (locId, emailToRemove) => {
        const currentList = Array.isArray(routingState[locId]) ? routingState[locId] : [];
        if (currentList.length <= 1) {
          if (!window.confirm('Warning: Removing all recipients means this store location will fall back to appraisals@sr1companies.com. Remove anyway?')) {
            return;
          }
        }
        setRoutingState(prev => ({
          ...prev,
          [locId]: currentList.filter(e => e !== emailToRemove)
        }));
      };

      const handleResetLocation = (locId) => {
        const defaultEmails = DEALERSHIP_NOTIFICATION_EMAILS[locId] || ['appraisals@sr1companies.com'];
        setRoutingState(prev => ({
          ...prev,
          [locId]: [...defaultEmails]
        }));
        showToast('Reset store to factory defaults.');
      };

      const handleResetAllToDefaults = () => {
        if (window.confirm('Are you sure you want to reset ALL 18 store locations to system default routing? Click "Save Routing Changes" afterwards to commit to Firestore cloud.')) {
          setRoutingState({ ...DEALERSHIP_NOTIFICATION_EMAILS });
          showToast('Reset all locations to factory defaults.');
        }
      };

      const handleSave = async () => {
        setIsSaving(true);
        try {
          const ok = await onSaveEmailRoutingConfig(routingState);
          if (ok) {
            showToast('✓ Email routing saved successfully to Cloud Firestore! All future customer submissions will route to these recipients.');
          } else {
            showToast('Saved locally in browser storage.');
          }
        } catch (e) {
          showToast('Saved locally in browser storage.');
        } finally {
          setIsSaving(false);
        }
      };

      // Filter locations & partner portal channels
      const allRoutingEntries = useMemo(() => {
        return [...PARTNER_ROUTING_CHANNELS, ...LOCATIONS];
      }, []);

      const filteredLocations = useMemo(() => {
        return allRoutingEntries.filter(loc => {
          if (categoryFilter !== 'all') {
            if (categoryFilter === 'pickup') {
              if (loc.id !== 'pickup_requested') return false;
            } else if (categoryFilter === 'partner_portal') {
              if (loc.category !== 'partner_portal') return false;
            } else if (loc.category !== categoryFilter) {
              return false;
            }
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const nameMatch = loc.name.toLowerCase().includes(q);
            const idMatch = loc.id.toLowerCase().includes(q);
            const emails = routingState[loc.id] || [];
            const emailMatch = emails.some(e => e.toLowerCase().includes(q));
            return nameMatch || idMatch || emailMatch;
          }
          return true;
        });
      }, [allRoutingEntries, categoryFilter, searchQuery, routingState]);

      // Category counts for filter tabs
      const categoryCounts = useMemo(() => {
        const counts = { all: allRoutingEntries.length, partner_portal: PARTNER_ROUTING_CHANNELS.length, trailer: 0, rv: 0, equipment: 0, powersports: 0, container: 0, pickup: 0 };
        LOCATIONS.forEach(l => {
          if (l.id === 'pickup_requested') counts.pickup += 1;
          else if (counts[l.category] !== undefined) counts[l.category] += 1;
        });
        return counts;
      }, [allRoutingEntries]);

      return (
        <div className="space-y-6">
          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 max-w-md bg-neutral-900 border border-amber-500/60 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
              <span className="text-amber-400 text-lg">🔔</span>
              <div className="text-xs font-semibold leading-relaxed">{toastMsg}</div>
            </div>
          )}

          {/* ADMIN SUB-HEADER & ACTIONS BAR */}
          <div className="bg-neutral-900 border border-neutral-800 p-4 sm:p-5 rounded-2xl space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-400/20 text-amber-300 border border-amber-400/30">
                    Super Admin Mode
                  </span>
                  <span className="text-[11px] text-neutral-400">
                    Logged in as <strong className="text-white">reid@sr1companies.com</strong>
                  </span>
                </div>
                <h2 className="text-lg sm:text-xl font-bold text-white">
                  Email Submission Routing Configuration
                </h2>
                <p className="text-xs text-neutral-400 mt-0.5">
                  Configure where customer valuation and trade-in submissions are delivered across all 18 store locations.
                </p>
              </div>

              {/* SAVE / RESET ACTIONS */}
              <div className="flex flex-wrap items-center gap-2.5">
                <button
                  type="button"
                  onClick={onBackToInquiries}
                  className="px-3 py-2 bg-neutral-850 hover:bg-neutral-800 text-neutral-300 hover:text-white rounded-xl text-xs font-semibold border border-neutral-750 transition-colors cursor-pointer"
                >
                  ← Inquiries Pipeline
                </button>

                <button
                  type="button"
                  onClick={handleResetAllToDefaults}
                  className="px-3 py-2 bg-neutral-950 hover:bg-neutral-900 text-neutral-400 hover:text-rose-300 rounded-xl text-xs font-semibold border border-neutral-800 transition-colors cursor-pointer"
                  title="Revert all store recipients to default"
                >
                  Reset All Defaults
                </button>

                <button
                  type="button"
                  onClick={handleSave}
                  disabled={isSaving}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-2 cursor-pointer ${
                    hasUnsavedChanges
                      ? 'bg-amber-400 hover:bg-amber-300 text-neutral-950'
                      : 'bg-white hover:bg-neutral-200 text-neutral-950'
                  }`}
                >
                  {isSaving ? (
                    <>
                      <span className="w-3.5 h-3.5 border-2 border-neutral-950 border-t-transparent rounded-full animate-spin"></span>
                      <span>Saving to Cloud...</span>
                    </>
                  ) : (
                    <>
                      <span>💾</span>
                      <span>{hasUnsavedChanges ? 'Save Routing Changes *' : 'Save Routing Changes'}</span>
                    </>
                  )}
                </button>
              </div>
            </div>

            {/* LIVE STATUS BANNER */}
            <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-neutral-850 text-xs">
              <div className="flex items-center gap-2 text-neutral-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Real-Time Cloud Firestore Sync Active</span>
                <span className="text-neutral-600">•</span>
                <span className="text-[11px] text-neutral-400">
                  {hasUnsavedChanges ? (
                    <strong className="text-amber-400">● Unsaved edits pending save</strong>
                  ) : (
                    'All store routing up to date with cloud'
                  )}
                </span>
              </div>
              <div className="text-[11px] text-neutral-400">
                Central routing: <span className="text-neutral-300">All Inquiries →</span> <code className="text-neutral-200 bg-neutral-950 px-1.5 py-0.5 rounded border border-neutral-800">appraisals@sr1companies.com</code>
              </div>
            </div>
          </div>

          {/* FILTER & SEARCH BAR */}
          <div className="bg-neutral-900 border border-neutral-800 p-3.5 sm:p-4 rounded-2xl space-y-3">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
              {/* Category Filter Tabs */}
              <div className="flex flex-wrap items-center gap-1.5 text-xs">
                {[
                  { id: 'all', label: `All Channels (${categoryCounts.all})` },
                  { id: 'partner_portal', label: `🤝🏦 Partner Portals (${categoryCounts.partner_portal})` },
                  { id: 'trailer', label: `Trailers (${categoryCounts.trailer})` },
                  { id: 'rv', label: `RV (${categoryCounts.rv})` },
                  { id: 'equipment', label: `Equipment (${categoryCounts.equipment})` },
                  { id: 'powersports', label: `Powersports (${categoryCounts.powersports})` },
                  { id: 'container', label: `Containers (${categoryCounts.container})` },
                  { id: 'pickup', label: `Pickup (${categoryCounts.pickup})` }
                ].map(tab => (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => setCategoryFilter(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                      categoryFilter === tab.id
                        ? 'bg-neutral-100 text-neutral-950 font-bold shadow-sm'
                        : 'bg-neutral-950/80 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              {/* Search input */}
              <div className="w-full md:w-72 relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search store name, town, or email..."
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-lg pl-8 pr-7 py-1.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500"
                />
                <span className="absolute left-2.5 top-2 text-neutral-500 text-xs">🔍</span>
                {searchQuery && (
                  <button
                    type="button"
                    onClick={() => setSearchQuery('')}
                    className="absolute right-2 top-1.5 text-neutral-400 hover:text-white text-xs cursor-pointer"
                  >
                    ✕
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* STORE LOCATIONS LIST */}
          <div className="space-y-3">
            {filteredLocations.length === 0 ? (
              <div className="bg-neutral-900 border border-neutral-800 p-8 rounded-2xl text-center space-y-2">
                <div className="text-xl">🔍</div>
                <div className="text-sm font-bold text-white">No store locations match your filter</div>
                <p className="text-xs text-neutral-400">Try clearing your search term or selecting All Locations.</p>
                <button
                  type="button"
                  onClick={() => { setCategoryFilter('all'); setSearchQuery(''); }}
                  className="mt-2 px-3 py-1.5 bg-neutral-800 hover:bg-neutral-750 text-white rounded-lg text-xs font-semibold cursor-pointer"
                >
                  Clear Filters
                </button>
              </div>
            ) : (
              filteredLocations.map(loc => {
                const emails = Array.isArray(routingState[loc.id]) && routingState[loc.id].length > 0
                  ? routingState[loc.id]
                  : (DEALERSHIP_NOTIFICATION_EMAILS[loc.id] || ['appraisals@sr1companies.com']);
                
                const defaultEmails = DEALERSHIP_NOTIFICATION_EMAILS[loc.id] || ['appraisals@sr1companies.com'];
                const isCustomized = JSON.stringify(emails) !== JSON.stringify(defaultEmails);

                const getCategoryBadge = (cat) => {
                  switch (cat) {
                    case 'partner_portal':
                      return { label: 'Partner Portal', color: 'bg-indigo-950/80 border-indigo-700 text-indigo-300' };
                    case 'rv':
                      return { label: 'SR1 RV', color: 'bg-amber-950/70 border-amber-800/80 text-amber-300' };
                    case 'trailer':
                      return { label: 'SR1 Trailers', color: 'bg-blue-950/70 border-blue-800/80 text-blue-300' };
                    case 'equipment':
                      return { label: 'SR1 Equipment', color: 'bg-emerald-950/70 border-emerald-800/80 text-emerald-300' };
                    case 'powersports':
                      return { label: 'SR1 Powersports', color: 'bg-purple-950/70 border-purple-800/80 text-purple-300' };
                    case 'container':
                      return { label: 'SR1 Containers', color: 'bg-cyan-950/70 border-cyan-800/80 text-cyan-300' };
                    default:
                      return { label: 'On-Site Pickup', color: 'bg-neutral-800 border-neutral-700 text-neutral-300' };
                  }
                };
                const badge = getCategoryBadge(loc.category);

                return (
                  <div
                    key={loc.id}
                    className="bg-neutral-900 border border-neutral-800 hover:border-neutral-750 p-4 sm:p-5 rounded-2xl space-y-3.5 transition-all"
                  >
                    {/* Top Row: Store Title, Division Badge & Status */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-neutral-850">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold uppercase border ${badge.color}`}>
                          {badge.label}
                        </span>
                        <h4 className="text-sm sm:text-base font-bold text-white">
                          {loc.name}
                        </h4>
                        <code className="text-[10px] text-neutral-500 font-mono bg-neutral-950 px-1.5 py-0.5 rounded border border-neutral-850">
                          {loc.id}
                        </code>
                      </div>

                      <div className="flex items-center gap-2 self-start sm:self-auto">
                        {isCustomized ? (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-950/70 border border-amber-800 text-amber-300">
                            Customized ({emails.length})
                          </span>
                        ) : (
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-neutral-950 border border-neutral-800 text-neutral-400">
                            System Default ({emails.length})
                          </span>
                        )}

                        {isCustomized && (
                          <button
                            type="button"
                            onClick={() => handleResetLocation(loc.id)}
                            className="text-[11px] text-neutral-400 hover:text-white underline cursor-pointer"
                            title="Reset this store to default recipients"
                          >
                            Reset Store
                          </button>
                        )}
                      </div>
                    </div>

                    {/* Email Chips / Recipient Tags */}
                    <div className="space-y-2">
                      <label className="block text-[11px] font-semibold text-neutral-400 uppercase tracking-wide">
                        Notification Recipients:
                      </label>

                      <div className="flex flex-wrap items-center gap-2">
                        {emails.map((email, idx) => {
                          const isValid = emailRegex.test(email);
                          return (
                            <span
                              key={email + idx}
                              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-mono transition-all border ${
                                isValid
                                  ? idx === 0
                                    ? 'bg-neutral-850 border-neutral-700 text-white font-bold'
                                    : 'bg-neutral-950 border-neutral-800 text-neutral-300'
                                  : 'bg-rose-950/80 border-rose-800 text-rose-200'
                              }`}
                            >
                              <span className="text-[10px] opacity-70">
                                {idx === 0 ? '👑 Primary' : '📧 CC'}
                              </span>
                              <span>{email}</span>
                              {!isValid && (
                                <span className="text-rose-400 text-[10px] font-sans font-bold" title="Invalid email syntax">
                                  ⚠️
                                </span>
                              )}
                              <button
                                type="button"
                                onClick={() => handleRemoveEmail(loc.id, email)}
                                className="ml-1 text-neutral-400 hover:text-rose-300 font-sans text-xs cursor-pointer p-0.5 hover:bg-neutral-800 rounded"
                                title={`Remove ${email}`}
                              >
                                ✕
                              </button>
                            </span>
                          );
                        })}
                      </div>
                    </div>

                    {/* Add Recipient Form Input */}
                    <div className="pt-2 flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                      <div className="flex-1 relative">
                        <input
                          type="email"
                          value={newEmailInputs[loc.id] || ''}
                          onChange={(e) => setNewEmailInputs(prev => ({ ...prev, [loc.id]: e.target.value }))}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter') {
                              e.preventDefault();
                              handleAddEmail(loc.id, newEmailInputs[loc.id]);
                            }
                          }}
                          placeholder="Add email address (e.g. employee@sr1companies.com) or paste comma-separated list..."
                          className="w-full bg-neutral-950 border border-neutral-800 focus:border-amber-400 text-white placeholder-neutral-500 rounded-xl px-3 py-2 text-xs focus:outline-none"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={() => handleAddEmail(loc.id, newEmailInputs[loc.id])}
                        className="px-4 py-2 bg-neutral-800 hover:bg-neutral-750 text-white font-bold rounded-xl text-xs transition-colors cursor-pointer shrink-0 flex items-center justify-center gap-1.5"
                      >
                        <span>+</span>
                        <span>Add Recipient</span>
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function StaffPortalView({ inquiries, partners = [], onSavePartner, onUpdateInquiry, onDeleteInquiry, selectedInquiryId, setSelectedInquiryId, staffUser, onSignOut, onSyncSamplesToCloud, emailRoutingConfig, onSaveEmailRoutingConfig }) {
      const canManageRouting = isSuperAdmin(staffUser);
      const canDeleteInquiries = isSuperAdmin(staffUser);
      const [portalTab, setPortalTab] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const t = params.get('tab');
          if (t === 'routing' && isSuperAdmin(staffUser)) return 'routing';
          if (t === 'dealers' || t === 'banks' || t === 'inquiries') return t;
        } catch (e) {}
        return 'inquiries';
      });
      const [partnerSubTab, setPartnerSubTab] = useState('units'); // 'units' | 'chat'
      const [filterPartnerId, setFilterPartnerId] = useState('all');
      const [selectedPartnerId, setSelectedPartnerId] = useState(null);
      const [staffGeneralMsgText, setStaffGeneralMsgText] = useState('');
      const [sendingStaffGeneralMsg, setSendingStaffGeneralMsg] = useState(false);

      const [filterStage, setFilterStage] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          return params.get('stage') || 'all';
        } catch (e) {
          return 'all';
        }
      });
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterLocation, setFilterLocation] = useState('all');
      const [filterIntent, setFilterIntent] = useState('all'); // 'all', 'trade', 'sell'
      const [searchTerm, setSearchTerm] = useState('');
      const [mobileLayout, setMobileLayout] = useState(() => {
        try {
          return localStorage.getItem('sell2sr1_mobile_layout') || 'cards';
        } catch (e) {
          return 'cards';
        }
      });
      const [sortField, setSortField] = useState('date'); // 'date', 'ref', 'unit', 'customer', 'location', 'stage', 'offer', 'type'
      const [sortDirection, setSortDirection] = useState('desc'); // 'asc', 'desc'
      const [showInstallGuide, setShowInstallGuide] = useState(false);
      const [copiedLink, setCopiedLink] = useState(false);

      const handleSetMobileLayout = (layout) => {
        setMobileLayout(layout);
        try {
          localStorage.setItem('sell2sr1_mobile_layout', layout);
        } catch (e) {}
      };

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDirection(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDirection(field === 'date' || field === 'offer' ? 'desc' : 'asc');
        }
      };

      // Counts and unread badges across Consumer, Dealer, and Bank sections
      const sectionMetrics = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        const pList = Array.isArray(partners) ? partners : [];
        let consumerActive = 0;
        let dealerActive = 0;
        let bankActive = 0;
        let dealerUnreadUnit = 0;
        let bankUnreadUnit = 0;

        list.forEach(inq => {
          if (!inq) return;
          const isArch = inq.isArchived || inq.stage === 'archived';
          const src = inq.submissionSource || 'consumer';
          const unreadCount = Number(inq.unreadUnitForStaff) || 0;
          if (src === 'dealer') {
            if (!isArch) dealerActive += 1;
            if (unreadCount > 0) dealerUnreadUnit += unreadCount;
          } else if (src === 'bank') {
            if (!isArch) bankActive += 1;
            if (unreadCount > 0) bankUnreadUnit += unreadCount;
          } else {
            if (!isArch) consumerActive += 1;
          }
        });

        let dealerUnreadGeneral = 0;
        let bankUnreadGeneral = 0;
        let dealerOrgs = 0;
        let bankOrgs = 0;
        pList.forEach(p => {
          if (!p) return;
          const u = Number(p.unreadGeneralForStaff) || 0;
          if (p.partnerType === 'bank') {
            bankOrgs += 1;
            bankUnreadGeneral += u;
          } else {
            dealerOrgs += 1;
            dealerUnreadGeneral += u;
          }
        });

        return {
          consumerActive,
          dealerActive,
          bankActive,
          dealerUnreadUnit,
          bankUnreadUnit,
          dealerUnreadGeneral,
          bankUnreadGeneral,
          dealerTotalUnread: dealerUnreadUnit + dealerUnreadGeneral,
          bankTotalUnread: bankUnreadUnit + bankUnreadGeneral,
          dealerOrgs,
          bankOrgs
        };
      }, [inquiries, partners]);

      const activePartnerType = portalTab === 'dealers' ? 'dealer' : portalTab === 'banks' ? 'bank' : null;

      const currentPartnersList = useMemo(() => {
        if (!activePartnerType) return [];
        return (Array.isArray(partners) ? partners : [])
          .filter(p => p && p.partnerType === activePartnerType)
          .sort((a, b) => new Date(b.updatedAt || b.createdAt || 0).getTime() - new Date(a.updatedAt || a.createdAt || 0).getTime());
      }, [partners, activePartnerType]);

      const selectedPartner = useMemo(() => {
        if (!activePartnerType) return null;
        return currentPartnersList.find(p => p.id === selectedPartnerId) || currentPartnersList[0] || null;
      }, [currentPartnersList, selectedPartnerId, activePartnerType]);

      // Clear unreadGeneralForStaff when staff views that partner in the General Relationship Chat tab
      useEffect(() => {
        if (activePartnerType && partnerSubTab === 'chat' && selectedPartner && Number(selectedPartner.unreadGeneralForStaff) > 0 && onSavePartner) {
          onSavePartner({
            ...selectedPartner,
            unreadGeneralForStaff: 0
          });
        }
      }, [activePartnerType, partnerSubTab, selectedPartner?.id, selectedPartner?.unreadGeneralForStaff]);

      const handleSendStaffGeneralMessage = async (e) => {
        e.preventDefault();
        if (!selectedPartner || !staffGeneralMsgText.trim() || sendingStaffGeneralMsg) return;
        setSendingStaffGeneralMsg(true);
        const text = staffGeneralMsgText.trim();
        const nowIso = new Date().toISOString();
        const newMsg = {
          id: 'gmsg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          senderRole: 'staff',
          senderName: staffUser?.name || 'SR1 Buying Team',
          senderEmail: staffUser?.email || '',
          text,
          createdAt: nowIso
        };
        const updatedPartner = {
          ...selectedPartner,
          generalMessages: [...(Array.isArray(selectedPartner.generalMessages) ? selectedPartner.generalMessages : []), newMsg],
          unreadGeneralForPartner: (Number(selectedPartner.unreadGeneralForPartner) || 0) + 1,
          unreadGeneralForStaff: 0,
          updatedAt: nowIso
        };
        if (onSavePartner) {
          await onSavePartner(updatedPartner);
        }
        setStaffGeneralMsgText('');
        setSendingStaffGeneralMsg(false);

        if (selectedPartner.email) {
          dispatchPartnerEmailNotification({
            notificationKind: 'general_chat',
            partnerType: selectedPartner.partnerType,
            organizationName: selectedPartner.organizationName,
            contactName: selectedPartner.contactName,
            partnerEmail: selectedPartner.email,
            partnerPhone: selectedPartner.phone,
            senderName: staffUser?.name || 'SR1 Buying Team',
            senderRole: 'staff',
            messageText: text,
            recipientEmails: [selectedPartner.email],
            portalUrl: `https://selltosr1.com/?view=${selectedPartner.partnerType === 'bank' ? 'bank' : 'dealer'}`
          });
        }
      };

      const handleTogglePartnerStatus = async (partner) => {
        if (!partner || !onSavePartner) return;
        const nextStatus = partner.status === 'disabled' ? 'active' : 'disabled';
        const confirmMsg = nextStatus === 'disabled'
          ? `Disable portal login access for ${partner.organizationName} (${partner.email})?`
          : `Re-enable portal login access for ${partner.organizationName} (${partner.email})?`;
        if (!confirm(confirmMsg)) return;
        await onSavePartner({
          ...partner,
          status: nextStatus,
          updatedAt: new Date().toISOString()
        });
      };

      // Filter inquiries by current tab's submissionSource ('consumer', 'dealer', 'bank')
      const sourceFilteredInquiries = useMemo(() => {
        const list = Array.isArray(inquiries) ? inquiries : [];
        return list.filter(inq => {
          if (!inq) return false;
          const src = inq.submissionSource || 'consumer';
          if (portalTab === 'dealers') return src === 'dealer';
          if (portalTab === 'banks') return src === 'bank';
          return src === 'consumer';
        });
      }, [inquiries, portalTab]);

      const stageCounts = useMemo(() => {
        const list = sourceFilteredInquiries;
        let allActive = 0;
        let archived = 0;
        const counts = {};
        Object.keys(STAGES).forEach(k => { counts[k] = 0; });
        list.forEach(inq => {
          if (!inq) return;
          if (activePartnerType && filterPartnerId !== 'all' && inq.partnerId !== filterPartnerId) return;
          const isArch = inq.isArchived || inq.stage === 'archived';
          if (isArch) {
            archived += 1;
            counts.archived = (counts.archived || 0) + 1;
          } else {
            allActive += 1;
            if (inq.stage && counts[inq.stage] !== undefined) {
              counts[inq.stage] += 1;
            }
          }
        });
        counts.all = allActive;
        counts.archived = archived;
        return counts;
      }, [sourceFilteredInquiries, activePartnerType, filterPartnerId]);

      const filtered = useMemo(() => {
        const list = sourceFilteredInquiries;
        return list.filter(inq => {
          if (!inq) return false;
          const isArch = inq.isArchived || inq.stage === 'archived';

          if (filterStage === 'archived') {
            if (!isArch) return false;
          } else if (filterStage === 'all') {
            if (isArch) return false;
          } else {
            if (isArch) return false;
            if (inq.stage !== filterStage) return false;
          }

          if (activePartnerType && filterPartnerId !== 'all' && inq.partnerId !== filterPartnerId) return false;
          if (filterCategory !== 'all' && inq.unit?.category !== filterCategory) return false;
          if (filterLocation !== 'all' && inq.preferredLocation !== filterLocation) return false;
          if (!activePartnerType && filterIntent !== 'all') {
            const inqIntent = inq.intent || 'sell';
            if (inqIntent !== filterIntent) return false;
          }
          if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            const custName = `${inq.customer?.firstName || ''} ${inq.customer?.lastName || ''}`.toLowerCase();
            const orgName = String(inq.partnerOrgName || '').toLowerCase();
            const ref = String(inq.referenceId || '').toLowerCase();
            const unitStr = `${inq.unit?.year || ''} ${inq.unit?.make || ''} ${inq.unit?.model || ''}`.toLowerCase();
            const vinStr = String(inq.unit?.vinOrSerial || '').toLowerCase();
            const salesStr = String(inq.salespersonName || '').toLowerCase();
            const locStr = getLocationName(inq.preferredLocation).toLowerCase();
            const phoneStr = String(inq.customer?.phone || '').toLowerCase();
            const emailStr = String(inq.customer?.email || '').toLowerCase();
            return custName.includes(term) || orgName.includes(term) || ref.includes(term) || unitStr.includes(term) || vinStr.includes(term) || salesStr.includes(term) || locStr.includes(term) || phoneStr.includes(term) || emailStr.includes(term);
          }
          return true;
        });
      }, [sourceFilteredInquiries, filterStage, activePartnerType, filterPartnerId, filterCategory, filterLocation, filterIntent, searchTerm]);

      const sorted = useMemo(() => {
        return [...filtered].sort((a, b) => {
          let valA = '';
          let valB = '';
          if (sortField === 'date') {
            valA = new Date(a.createdAt || 0).getTime();
            valB = new Date(b.createdAt || 0).getTime();
          } else if (sortField === 'ref') {
            valA = String(a.referenceId || '');
            valB = String(b.referenceId || '');
          } else if (sortField === 'type') {
            valA = a.intent || 'sell';
            valB = b.intent || 'sell';
          } else if (sortField === 'unit') {
            valA = `${a.unit?.year || ''} ${a.unit?.make || ''} ${a.unit?.model || ''}`.trim().toLowerCase();
            valB = `${b.unit?.year || ''} ${b.unit?.make || ''} ${b.unit?.model || ''}`.trim().toLowerCase();
          } else if (sortField === 'customer') {
            valA = `${a.customer?.lastName || ''} ${a.customer?.firstName || ''}`.trim().toLowerCase();
            valB = `${b.customer?.lastName || ''} ${b.customer?.firstName || ''}`.trim().toLowerCase();
          } else if (sortField === 'location') {
            valA = getLocationName(a.preferredLocation).toLowerCase();
            valB = getLocationName(b.preferredLocation).toLowerCase();
          } else if (sortField === 'stage') {
            valA = a.stage || '';
            valB = b.stage || '';
          } else if (sortField === 'offer') {
            valA = (Array.isArray(a.offers) && a.offers.length > 0) ? (Number(a.offers[a.offers.length - 1].amount) || 0) : -1;
            valB = (Array.isArray(b.offers) && b.offers.length > 0) ? (Number(b.offers[b.offers.length - 1].amount) || 0) : -1;
          }
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filtered, sortField, sortDirection]);

      const handleArchiveInquiry = (inq) => {
        if (!inq) return;
        const confirmMsg = `Archive inquiry #${inq.referenceId} (${inq.unit?.year || ''} ${inq.unit?.make || ''} ${inq.unit?.model || ''})?\n\nIt will be hidden from the active pipeline and moved to the Archived tab.`;
        if (!confirm(confirmMsg)) return;

        const now = new Date().toISOString();
        const prevStage = (inq.stage && inq.stage !== 'archived') ? inq.stage : 'new';
        const archiveNote = {
          id: 'note-' + Date.now(),
          authorName: staffUser?.name || 'SR1 Staff',
          authorRole: 'Appraiser',
          createdAt: new Date().toLocaleTimeString(),
          category: 'general',
          content: 'Inquiry archived.'
        };

        const updated = {
          ...inq,
          isArchived: true,
          stage: 'archived',
          previousStage: prevStage,
          archivedAt: now,
          archivedBy: staffUser?.name || 'Staff Appraiser',
          notes: Array.isArray(inq.notes) ? [...inq.notes, archiveNote] : [archiveNote],
          updatedAt: now
        };

        onUpdateInquiry(updated);
      };

      const handleUnarchiveInquiry = (inq) => {
        if (!inq) return;
        const restoredStage = (inq.previousStage && inq.previousStage !== 'archived') ? inq.previousStage : 'new';
        const now = new Date().toISOString();
        const unarchiveNote = {
          id: 'note-' + Date.now(),
          authorName: staffUser?.name || 'SR1 Staff',
          authorRole: 'Appraiser',
          createdAt: new Date().toLocaleTimeString(),
          category: 'general',
          content: `Inquiry restored from archive back to ${STAGES[restoredStage]?.label || 'active pipeline'}.`
        };

        const updated = {
          ...inq,
          isArchived: false,
          stage: restoredStage,
          archivedAt: null,
          archivedBy: null,
          notes: Array.isArray(inq.notes) ? [...inq.notes, unarchiveNote] : [unarchiveNote],
          updatedAt: now
        };

        onUpdateInquiry(updated);
      };

      const handleConfirmDeleteInquiry = (inq) => {
        if (!inq || !canDeleteInquiries || !onDeleteInquiry) return;
        const unitTitle = [inq.unit?.year, inq.unit?.make, inq.unit?.model].filter(Boolean).join(' ') || 'Unit';
        const customerName = [inq.customer?.firstName, inq.customer?.lastName].filter(Boolean).join(' ') || 'Unknown Customer';
        const confirmMsg = `Permanently delete inquiry #${inq.referenceId} (${unitTitle} — ${customerName})?\n\nThis action cannot be undone and will permanently remove the inquiry from the portal and database.`;
        if (!confirm(confirmMsg)) return;
        onDeleteInquiry(inq);
      };

      const selectedInquiry = (inquiries || []).find(i => i && i.id === selectedInquiryId);
      const lastLoggedOpenRef = useRef(null);

      const recordInquirySeenBy = (inq, user) => {
        if (!inq) return null;
        const email = (user?.email || '').trim().toLowerCase();
        const name = (user?.name || (email ? email.split('@')[0] : '') || 'SR1 Staff').trim();
        const picture = user?.picture || '';
        const nowIso = new Date().toISOString();
        const existingList = Array.isArray(inq.seenBy) ? inq.seenBy : [];

        let matched = false;
        const updatedList = existingList.map(entry => {
          const entryEmail = (entry?.email || '').trim().toLowerCase();
          const entryName = (entry?.name || '').trim().toLowerCase();
          const isSameUser = (email && entryEmail && email === entryEmail) || (!email && name && entryName && name.toLowerCase() === entryName);
          if (isSameUser) {
            matched = true;
            return {
              ...entry,
              email: email || entry.email || '',
              name: name || entry.name || 'SR1 Staff',
              picture: picture || entry.picture || '',
              firstSeenAt: entry.firstSeenAt || entry.seenAt || nowIso,
              lastSeenAt: nowIso,
              viewCount: (Number(entry.viewCount) || 1) + 1
            };
          }
          return entry;
        });

        if (!matched) {
          updatedList.unshift({
            email,
            name,
            picture,
            firstSeenAt: nowIso,
            lastSeenAt: nowIso,
            viewCount: 1
          });
        }

        updatedList.sort((a, b) => new Date(b.lastSeenAt || b.seenAt || 0).getTime() - new Date(a.lastSeenAt || a.seenAt || 0).getTime());

        return {
          ...inq,
          seenBy: updatedList
        };
      };

      const handleOpenInquiry = (inq) => {
        if (!inq) return;
        lastLoggedOpenRef.current = inq.id;
        setSelectedInquiryId(inq.id);
        const updated = recordInquirySeenBy(inq, staffUser);
        if (updated) {
          onUpdateInquiry(updated);
        }
      };

      useEffect(() => {
        if (!selectedInquiryId) {
          lastLoggedOpenRef.current = null;
          return;
        }
        if (lastLoggedOpenRef.current !== selectedInquiryId && selectedInquiry) {
          lastLoggedOpenRef.current = selectedInquiryId;
          const updated = recordInquirySeenBy(selectedInquiry, staffUser);
          if (updated) {
            onUpdateInquiry(updated);
          }
        }
      }, [selectedInquiryId, selectedInquiry?.id, staffUser?.email]);

      return (
        <div className="py-4 sm:py-6 max-w-[1760px] w-full mx-auto px-2 sm:px-6 lg:px-8 space-y-4 sm:space-y-6 overflow-x-hidden">
          
          {/* HEADER */}
          <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-3 sm:gap-4 bg-neutral-900 border border-neutral-800 p-3.5 sm:p-4 rounded-2xl">
            <div className="flex flex-col lg:flex-row lg:items-center gap-3">
              <div>
                <h1 className="text-base sm:text-lg font-bold text-white">Staff Appraisal & Purchasing Desk</h1>
                <p className="text-xs text-neutral-400">Direct mobile & desktop appraisal portal for SR1 Companies</p>
              </div>

              <div className="flex flex-wrap items-center p-1 bg-neutral-950 border border-neutral-800 rounded-xl gap-1 lg:ml-3">
                <button
                  type="button"
                  onClick={() => {
                    setPortalTab('inquiries');
                    setFilterPartnerId('all');
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'inquiries' ? 'bg-neutral-100 text-neutral-950 shadow-sm' : 'text-neutral-400 hover:text-white'}`}
                >
                  <span>👤</span>
                  <span>Consumer Inquiries</span>
                  <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${portalTab === 'inquiries' ? 'bg-neutral-300 text-neutral-900' : 'bg-neutral-800 text-neutral-400'}`}>
                    {sectionMetrics.consumerActive || 0}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    setPortalTab('dealers');
                    setPartnerSubTab('units');
                    setFilterPartnerId('all');
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'dealers' ? 'bg-blue-500 text-neutral-950 shadow-sm' : 'text-blue-300 hover:text-white hover:bg-neutral-900'}`}
                >
                  <span>🤝</span>
                  <span>Dealers (Trade Banking)</span>
                  <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${portalTab === 'dealers' ? 'bg-neutral-950/20 text-neutral-950' : 'bg-blue-950/90 text-blue-300 border border-blue-800/70'}`}>
                    {sectionMetrics.dealerActive || 0}
                  </span>
                  {sectionMetrics.dealerTotalUnread > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full text-[10px] font-black bg-red-500 text-white animate-pulse">
                      💬 {sectionMetrics.dealerTotalUnread}
                    </span>
                  )}
                </button>

                <button
                  type="button"
                  onClick={() => {
                    setPortalTab('banks');
                    setPartnerSubTab('units');
                    setFilterPartnerId('all');
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'banks' ? 'bg-emerald-500 text-neutral-950 shadow-sm' : 'text-emerald-300 hover:text-white hover:bg-neutral-900'}`}
                >
                  <span>🏦</span>
                  <span>Banks / Credit Unions (Repos)</span>
                  <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${portalTab === 'banks' ? 'bg-neutral-950/20 text-neutral-950' : 'bg-emerald-950/90 text-emerald-300 border border-emerald-800/70'}`}>
                    {sectionMetrics.bankActive || 0}
                  </span>
                  {sectionMetrics.bankTotalUnread > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full text-[10px] font-black bg-red-500 text-white animate-pulse">
                      💬 {sectionMetrics.bankTotalUnread}
                    </span>
                  )}
                </button>

                {canManageRouting && (
                  <button
                    type="button"
                    onClick={() => setPortalTab('routing')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${portalTab === 'routing' ? 'bg-amber-400 text-neutral-950 shadow-sm' : 'text-amber-400 hover:text-amber-300 hover:bg-neutral-900'}`}
                    title="Exclusive to reid@sr1companies.com: Edit where each submission routes"
                  >
                    <span>✉️</span>
                    <span>Email Routing</span>
                    <span className="px-1.5 py-0.2 rounded-full text-[9px] font-black uppercase bg-amber-500/30 text-amber-300 border border-amber-400/40">
                      Admin
                    </span>
                  </button>
                )}
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {db && (
                <div className="flex items-center space-x-1.5 px-2.5 py-1 bg-emerald-950/70 border border-emerald-800/80 rounded-lg text-[11px] font-semibold text-emerald-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>Cloud Live</span>
                </div>
              )}

              {inquiries.length <= 3 && (
                <button
                  onClick={onSyncSamplesToCloud}
                  className="px-2.5 py-1 rounded-lg bg-neutral-850 hover:bg-neutral-800 text-neutral-300 border border-neutral-750 text-[11px] font-semibold transition-all"
                  title="Upload sample inquiries to Firebase Firestore cloud so other devices see them"
                >
                  ⚡ Sync Samples to Cloud
                </button>
              )}

              <button
                onClick={() => setShowInstallGuide(true)}
                className="px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-800 text-neutral-200 border border-neutral-750 font-semibold text-xs flex items-center space-x-1.5 transition-all shadow-sm"
              >
                <span>📱</span>
                <span>Install Mobile App</span>

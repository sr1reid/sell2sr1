                                <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded text-[10px] font-semibold bg-blue-950/80 border border-blue-800/80 text-blue-300">
                                  <span>💬 {unitMsgs.length} {unitMsgs.length === 1 ? 'Message' : 'Messages'}</span>
                                </span>
                              ) : item.outreach?.reachedOut ? (
                                <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-950/80 border border-emerald-800/80 text-emerald-300 shadow-sm">
                                  <span>✓</span>
                                  <span>{item.outreach.staffName || 'Contacted'}</span>
                                </span>
                              ) : (
                                <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded text-[10px] font-semibold bg-amber-950/60 border border-amber-800/60 text-amber-300">
                                  <span>⏳ Needs Outreach</span>
                                </span>
                              )}
                              {seenList.length > 0 ? (
                                <span
                                  className="inline-flex items-center gap-1 text-[10px] text-neutral-400 font-medium"
                                  title={`Seen by:\n${seenList.map(s => `• ${s.name || s.email}${s.lastSeenAt ? ` (${formatSeenTimestamp(s.lastSeenAt)})` : ''}`).join('\n')}`}
                                >
                                  <span>👁️</span>
                                  <span>
                                    Seen by {seenList.map(s => (s.name || s.email || 'Staff').split(' ')[0]).slice(0, 2).join(', ')}
                                    {seenList.length > 2 ? ` +${seenList.length - 2}` : ''}
                                  </span>
                                </span>
                              ) : (
                                <span className="inline-flex items-center gap-1 text-[10px] text-sky-400 font-semibold">
                                  <span>●</span>
                                  <span>Unseen</span>
                                </span>
                              )}
                            </div>
                          </td>

                          {/* Stage */}
                          <td className="p-3.5 whitespace-nowrap">
                            <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold border inline-block ${stageConfig.color}`}>
                              {stageConfig.label}
                            </span>
                          </td>

                          {/* Offer */}
                          <td className="p-3.5 whitespace-nowrap">
                            {lastOffer && typeof lastOffer.amount === 'number' ? (
                              <div>
                                <span className="font-bold text-white font-mono text-sm">
                                  ${lastOffer.amount.toLocaleString()}
                                </span>
                                {item.offers.length > 1 && (
                                  <div className="text-[9px] text-neutral-400">
                                    {item.offers.length} offers logged
                                  </div>
                                )}
                              </div>
                            ) : (
                              <span className="text-neutral-500 font-mono text-xs">—</span>
                            )}
                          </td>

                          {/* Action */}
                          <td className="p-3.5 text-right whitespace-nowrap" onClick={e => e.stopPropagation()}>
                            <div className="flex items-center justify-end gap-1.5">
                              <button
                                onClick={() => handleOpenInquiry(item)}
                                className="px-3.5 py-1.5 bg-neutral-100 hover:bg-white text-neutral-950 font-bold rounded-lg text-xs shadow-sm transition-all"
                              >
                                {item.submissionSource === 'dealer' || item.submissionSource === 'bank' ? 'Appraise / Chat →' : 'Appraise →'}
                              </button>
                              {item.isArchived || item.stage === 'archived' ? (
                                <button
                                  type="button"
                                  onClick={() => handleUnarchiveInquiry(item)}
                                  className="px-2.5 py-1.5 bg-neutral-900 hover:bg-neutral-800 text-amber-400 hover:text-amber-300 border border-neutral-800 hover:border-amber-700/60 font-semibold rounded-lg text-xs transition-all"
                                  title="Restore to active pipeline"
                                >
                                  ↩️ Restore
                                </button>
                              ) : (
                                <button
                                  type="button"
                                  onClick={() => handleArchiveInquiry(item)}
                                  className="px-2.5 py-1.5 bg-neutral-900 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800 hover:border-neutral-700 font-semibold rounded-lg text-xs transition-all"
                                  title="Archive inquiry"
                                >
                                  📦 Archive
                                </button>
                              )}
                              {canDeleteInquiries && (
                                <button
                                  type="button"
                                  onClick={() => handleConfirmDeleteInquiry(item)}
                                  className="px-2.5 py-1.5 bg-red-950/60 hover:bg-red-900/80 text-red-300 hover:text-white border border-red-800/70 hover:border-red-600 font-semibold rounded-lg text-xs transition-all"
                                  title="Permanently delete inquiry (Admin: reid@sr1companies.com)"
                                >
                                  🗑️ Delete
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
                </>
              )}
            </>
          )}

          {/* APPRAISAL MODAL */}
          {selectedInquiry && (
            <AppraisalWorkspaceModal
              inquiry={selectedInquiry}
              staffUser={staffUser}
              emailRoutingConfig={emailRoutingConfig}
              onOpenPartnerGeneralChat={(partnerId, partnerType) => {
                setSelectedInquiryId(null);
                setPortalTab(partnerType === 'bank' ? 'banks' : 'dealers');
                setSelectedPartnerId(partnerId);
                setPartnerSubTab('chat');
              }}
              onClose={() => setSelectedInquiryId(null)}
              onUpdateInquiry={onUpdateInquiry}
              onDeleteInquiry={canDeleteInquiries ? handleConfirmDeleteInquiry : null}
            />
          )}

          {/* MOBILE APP INSTALLATION MODAL */}
          {showInstallGuide && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-750 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-5 text-neutral-200">
                <div className="flex items-center justify-between pb-3 border-b border-neutral-800">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-xl bg-neutral-800 border border-neutral-700 flex items-center justify-center text-lg">
                      📱
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-white">Install SR1 Staff App</h3>
                      <p className="text-xs text-neutral-400">Direct standalone access on iPhone & Android</p>
                    </div>
                  </div>
                  <button onClick={() => setShowInstallGuide(false)} className="text-neutral-400 hover:text-white text-lg font-bold">✕</button>
                </div>

                {/* iPhone instructions */}
                <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-2.5">
                  <div className="flex items-center space-x-2 text-white font-bold text-xs uppercase tracking-wide">
                    <span>🍏</span>
                    <span>For iPhone (Apple Safari)</span>
                  </div>
                  <ol className="list-decimal list-inside space-y-1.5 text-xs text-neutral-300">
                    <li>Open <strong>selltosr1.com/?view=portal</strong> in Safari.</li>
                    <li>Tap the <strong>Share button (↑)</strong> at the bottom center of Safari.</li>
                    <li>Scroll down and select <strong>"Add to Home Screen"</strong>.</li>
                    <li>Tap <strong>"Add"</strong> in the top right. The <strong>SR1 Staff</strong> app icon will appear directly on your home screen and open full-screen!</li>
                  </ol>
                </div>

                {/* Android instructions */}
                <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-2.5">
                  <div className="flex items-center space-x-2 text-white font-bold text-xs uppercase tracking-wide">
                    <span>🤖</span>
                    <span>For Android (Google Chrome)</span>
                  </div>
                  <ol className="list-decimal list-inside space-y-1.5 text-xs text-neutral-300">
                    <li>Open <strong>selltosr1.com/?view=portal</strong> in Chrome.</li>
                    <li>Tap the <strong>three dots (⋮)</strong> menu in the upper right.</li>
                    <li>Select <strong>"Install app"</strong> or <strong>"Add to Home screen"</strong>.</li>
                    <li>Confirm installation. The app will launch in full-screen standalone mode.</li>
                  </ol>
                </div>

                {/* Direct Link Actions */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText('https://selltosr1.com/?view=portal');
                      setCopiedLink(true);
                      setTimeout(() => setCopiedLink(false), 2500);
                    }}
                    className="w-full sm:w-auto px-4 py-2.5 bg-neutral-100 hover:bg-white text-neutral-950 font-bold text-xs rounded-xl transition-all"
                  >
                    {copiedLink ? '✓ Portal Link Copied to Clipboard!' : 'Copy Direct App Link'}
                  </button>
                  <button
                    onClick={() => setShowInstallGuide(false)}
                    className="w-full sm:w-auto px-5 py-2.5 bg-neutral-800 hover:bg-neutral-750 text-neutral-300 text-xs font-semibold rounded-xl"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 4. APPRAISAL WORKSPACE MODAL
    // ==========================================
    function AppraisalWorkspaceModal({ inquiry, staffUser, emailRoutingConfig, onOpenPartnerGeneralChat, onClose, onUpdateInquiry, onDeleteInquiry }) {
      const canDeleteInquiries = isSuperAdmin(staffUser) && typeof onDeleteInquiry === 'function';
      const [currentStage, setCurrentStage] = useState(inquiry.stage);
      const latestOffer = (Array.isArray(inquiry.offers) && inquiry.offers.length > 0)
        ? inquiry.offers[inquiry.offers.length - 1]
        : null;
      const [offerAmount, setOfferAmount] = useState(
        latestOffer?.amount !== undefined && latestOffer?.amount !== null ? String(latestOffer.amount) : ''
      );
      const [offerNotes, setOfferNotes] = useState(latestOffer?.notes || 'Subject to physical inspection and title verification.');
      const [newNoteText, setNewNoteText] = useState('');
      const [staffUnitMsgText, setStaffUnitMsgText] = useState('');
      const [sendingStaffUnitMsg, setSendingStaffUnitMsg] = useState(false);

      // Clear unreadUnitForStaff when staff opens this unit
      useEffect(() => {
        if (inquiry && Number(inquiry.unreadUnitForStaff) > 0 && onUpdateInquiry) {
          onUpdateInquiry({
            ...inquiry,
            unreadUnitForStaff: 0
          });
        }
      }, [inquiry?.id, inquiry?.unreadUnitForStaff]);

      const handleSendStaffUnitMessage = (e) => {
        e.preventDefault();
        if (!staffUnitMsgText.trim() || sendingStaffUnitMsg) return;
        setSendingStaffUnitMsg(true);
        const text = staffUnitMsgText.trim();
        const nowIso = new Date().toISOString();
        const newMsg = {
          id: 'umsg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          senderRole: 'staff',
          senderName: staffUser?.name || 'SR1 Buying Team',
          senderEmail: staffUser?.email || '',
          text,
          createdAt: nowIso
        };
        const updatedMsgs = [...(Array.isArray(inquiry.unitMessages) ? inquiry.unitMessages : []), newMsg];
        const updated = {
          ...inquiry,
          unitMessages: updatedMsgs,
          unreadUnitForPartner: (Number(inquiry.unreadUnitForPartner) || 0) + 1,
          unreadUnitForStaff: 0,
          updatedAt: nowIso
        };
        onUpdateInquiry(updated);
        setStaffUnitMsgText('');
        setSendingStaffUnitMsg(false);

        const targetEmail = (inquiry.partnerEmail || inquiry.customer?.email || '').trim();
        if (targetEmail) {
          const unitTitle = [inquiry.unit?.year, inquiry.unit?.make, inquiry.unit?.model].filter(Boolean).join(' ') || 'Submitted Unit';
          const pType = inquiry.submissionSource === 'bank' ? 'bank' : 'dealer';
          dispatchPartnerEmailNotification({
            notificationKind: 'unit_chat',
            partnerType: pType,
            organizationName: inquiry.partnerOrgName || `${inquiry.customer?.firstName || ''} ${inquiry.customer?.lastName || ''}`.trim(),
            contactName: inquiry.partnerContactName || `${inquiry.customer?.firstName || ''} ${inquiry.customer?.lastName || ''}`.trim(),
            partnerEmail: targetEmail,
            partnerPhone: inquiry.partnerPhone || inquiry.customer?.phone || '',
            referenceId: inquiry.referenceId,
            unitSummary: unitTitle,
            senderName: staffUser?.name || 'SR1 Buying Team',
            senderRole: 'staff',
            messageText: text,
            recipientEmails: [targetEmail],
            portalUrl: `https://selltosr1.com/?view=${pType}`
          });
        }
      };
      const mediaItems = Array.isArray(inquiry.photos) ? inquiry.photos : [];
      const [activeMediaIndex, setActiveMediaIndex] = useState(0);
      const [isLightboxOpen, setIsLightboxOpen] = useState(false);
      const [isZoomed, setIsZoomed] = useState(false);
      const touchStartXRef = useRef(null);

      const safeMediaIndex = mediaItems.length > 0 ? Math.min(activeMediaIndex, mediaItems.length - 1) : 0;
      const activeMedia = mediaItems[safeMediaIndex] || null;
      const activePhoto = activeMedia ? (activeMedia.url || activeMedia.thumbUrl || '') : '';

      const goToMedia = (idx) => {
        if (mediaItems.length === 0) return;
        const nextIdx = ((idx % mediaItems.length) + mediaItems.length) % mediaItems.length;
        setActiveMediaIndex(nextIdx);
        setIsZoomed(false);
      };

      const handlePrevMedia = (e) => {
        if (e) e.stopPropagation();
        goToMedia(safeMediaIndex - 1);
      };

      const handleNextMedia = (e) => {
        if (e) e.stopPropagation();
        goToMedia(safeMediaIndex + 1);
      };

      const handleTouchStartMedia = (e) => {
        if (e.touches && e.touches.length === 1) {
          touchStartXRef.current = e.touches[0].clientX;
        }
      };

      const handleTouchEndMedia = (e) => {
        if (touchStartXRef.current === null || !e.changedTouches || e.changedTouches.length === 0) return;
        const deltaX = e.changedTouches[0].clientX - touchStartXRef.current;
        touchStartXRef.current = null;
        if (Math.abs(deltaX) > 45 && mediaItems.length > 1) {
          if (deltaX < 0) {
            goToMedia(safeMediaIndex + 1);
          } else {
            goToMedia(safeMediaIndex - 1);
          }
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
          const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
          if (isLightboxOpen) {
            if (e.key === 'Escape') {
              e.preventDefault();
              e.stopPropagation();
              setIsLightboxOpen(false);
              setIsZoomed(false);
            } else if (e.key === 'ArrowLeft' && mediaItems.length > 1) {
              e.preventDefault();
              goToMedia(safeMediaIndex - 1);
            } else if (e.key === 'ArrowRight' && mediaItems.length > 1) {
              e.preventDefault();
              goToMedia(safeMediaIndex + 1);
            }
          } else if (!isTyping && mediaItems.length > 1) {
            if (e.key === 'ArrowLeft') {
              e.preventDefault();
              goToMedia(safeMediaIndex - 1);
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              goToMedia(safeMediaIndex + 1);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isLightboxOpen, safeMediaIndex, mediaItems.length]);

      const [outreachStaffName, setOutreachStaffName] = useState(inquiry.outreach?.staffName || staffUser?.name || '');
      const [reachedOut, setReachedOut] = useState(inquiry.outreach?.reachedOut || false);
      const [reachedOutAt, setReachedOutAt] = useState(inquiry.outreach?.reachedOutAt || null);
      const seenByList = useMemo(() => {
        const list = Array.isArray(inquiry.seenBy) ? [...inquiry.seenBy] : [];
        return list.sort((a, b) => new Date(b.lastSeenAt || b.seenAt || 0).getTime() - new Date(a.lastSeenAt || a.seenAt || 0).getTime());
      }, [inquiry.seenBy]);

      // Market Comps Live Search State
      const defaultCompsQuery = [inquiry.unit.year, inquiry.unit.make, inquiry.unit.model].filter(Boolean).join(' ');
      const [fbCompsQuery, setFbCompsQuery] = useState(defaultCompsQuery);

      const parsedOfferAmount = Number(offerAmount) || 0;
      const netEquity = Math.max(0, parsedOfferAmount - (inquiry.financials.estimatedPayoff || 0));

      const handleToggleOutreach = (checked) => {
        if (checked && !outreachStaffName.trim()) {
          alert('Please enter your staff name before checking off that you reached out.');
          return;
        }
        const now = new Date().toLocaleString();
        setReachedOut(checked);
        setReachedOutAt(checked ? now : null);

        const newOutreach = {
          reachedOut: checked,
          staffName: checked ? outreachStaffName.trim() : '',
          reachedOutAt: checked ? now : null
        };

        const updated = {
          ...inquiry,
          outreach: newOutreach,
          updatedAt: new Date().toISOString(),
          notes: checked ? [
            ...inquiry.notes,
            {
              id: 'n-outreach-' + Date.now(),
              authorName: outreachStaffName.trim(),
              authorRole: 'Staff Member',
              createdAt: new Date().toLocaleTimeString(),
              category: 'call_log',
              content: `Staff member ${outreachStaffName.trim()} confirmed direct outreach to client (${inquiry.customer.phone} / ${inquiry.customer.email}).`
            }
          ] : inquiry.notes
        };

        onUpdateInquiry(updated);
      };

      const handleSaveStaffName = (name) => {
        setOutreachStaffName(name);
        if (reachedOut) {
          onUpdateInquiry({
            ...inquiry,
            outreach: {
              ...inquiry.outreach,
              staffName: name.trim()
            },
            updatedAt: new Date().toISOString()
          });
        }
      };

      const isArchived = Boolean(inquiry.isArchived || currentStage === 'archived' || inquiry.stage === 'archived');

      useEffect(() => {
        setCurrentStage(inquiry.stage);
      }, [inquiry.stage]);

      const handleSaveStage = (newSt) => {
        setCurrentStage(newSt);
        const now = new Date().toISOString();
        if (newSt === 'archived') {
          const prevStage = (inquiry.stage && inquiry.stage !== 'archived') ? inquiry.stage : (inquiry.previousStage || 'new');
          const archiveNote = {
            id: 'note-' + Date.now(),
            authorName: outreachStaffName.trim() || 'Staff Appraiser',
            authorRole: 'Appraiser',
            createdAt: new Date().toLocaleTimeString(),
            category: 'general',
            content: 'Stage set to Archived. Inquiry hidden from active pipeline.'
          };
          onUpdateInquiry({
            ...inquiry,
            stage: 'archived',
            isArchived: true,
            previousStage: prevStage,
            archivedAt: now,
            archivedBy: outreachStaffName.trim() || 'Staff Appraiser',
            notes: Array.isArray(inquiry.notes) ? [...inquiry.notes, archiveNote] : [archiveNote],
            updatedAt: now
          });
        } else if (inquiry.isArchived || inquiry.stage === 'archived') {
          const restoreNote = {
            id: 'note-' + Date.now(),
            authorName: outreachStaffName.trim() || 'Staff Appraiser',
            authorRole: 'Appraiser',
            createdAt: new Date().toLocaleTimeString(),
            category: 'general',
            content: `Stage changed from Archived to ${STAGES[newSt]?.label || newSt}. Inquiry restored to active pipeline.`
          };
          onUpdateInquiry({
            ...inquiry,
            stage: newSt,
            isArchived: false,
            previousStage: null,
            notes: Array.isArray(inquiry.notes) ? [...inquiry.notes, restoreNote] : [restoreNote],
            updatedAt: now
          });
        } else {
          onUpdateInquiry({
            ...inquiry,
            stage: newSt,
            updatedAt: now
          });
        }
      };

      const handleArchiveInModal = () => {
        const confirmMsg = `Archive inquiry #${inquiry.referenceId} (${inquiry.unit?.year || ''} ${inquiry.unit?.make || ''} ${inquiry.unit?.model || ''})?\n\nIt will be hidden from the active pipeline and moved to the Archived tab.`;
        if (!confirm(confirmMsg)) return;
        handleSaveStage('archived');
      };

      const handleUnarchiveInModal = () => {
        const restoredStage = (inquiry.previousStage && inquiry.previousStage !== 'archived') ? inquiry.previousStage : 'new';
        handleSaveStage(restoredStage);
      };

      const handleSendOffer = () => {
        const numericOffer = Number(String(offerAmount).replace(/[^0-9.]/g, ''));
        if (offerAmount === '' || isNaN(numericOffer) || numericOffer <= 0) {
          alert('Please enter an offer amount before saving.');
          return;
        }
        const nowIso = new Date().toISOString();
        const newOffer = {
          id: 'off-' + Date.now(),
          amount: numericOffer,
          expirationDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'sent',
          createdAt: new Date().toLocaleTimeString(),
          createdBy: staffUser?.name || 'SR1 Appraisal Desk',
          notes: offerNotes,
          customerPayoffEstimate: inquiry.financials.estimatedPayoff || 0,
          calculatedNetEquity: Math.max(0, numericOffer - (inquiry.financials.estimatedPayoff || 0))
        };

        const isPartnerUnit = inquiry.submissionSource === 'dealer' || inquiry.submissionSource === 'bank';
        const offerChatMsg = {
          id: 'umsg-offer-' + Date.now(),
          senderRole: 'staff',
          senderName: staffUser?.name || 'SR1 Appraisal Desk',
          senderEmail: staffUser?.email || '',
          text: `💵 Official SR1 Offer Recorded: $${numericOffer.toLocaleString()}${offerNotes ? ` — ${offerNotes}` : ''}`,
          createdAt: nowIso
        };

        const updated = {
          ...inquiry,
          stage: 'offer_sent',
          updatedAt: nowIso,
          offers: [...(inquiry.offers || []), newOffer],
          unitMessages: isPartnerUnit
            ? [...(Array.isArray(inquiry.unitMessages) ? inquiry.unitMessages : []), offerChatMsg]
            : (inquiry.unitMessages || []),
          unreadUnitForPartner: isPartnerUnit ? (Number(inquiry.unreadUnitForPartner) || 0) + 1 : (inquiry.unreadUnitForPartner || 0),
          notes: [
            ...inquiry.notes,
            {
              id: 'n-off-' + Date.now(),
              authorName: staffUser?.name || 'Appraisal Desk',
              authorRole: 'Buyer',
              createdAt: new Date().toLocaleTimeString(),
              category: 'offer_reason',
              content: `Initial offer of $${numericOffer.toLocaleString()} recorded.`
            }
          ]
        };

        setCurrentStage('offer_sent');
        onUpdateInquiry(updated);

        const targetEmail = (inquiry.partnerEmail || inquiry.customer?.email || '').trim();
        if (isPartnerUnit && targetEmail) {
          const unitTitle = [inquiry.unit?.year, inquiry.unit?.make, inquiry.unit?.model].filter(Boolean).join(' ') || 'Submitted Unit';
          const pType = inquiry.submissionSource === 'bank' ? 'bank' : 'dealer';
          dispatchPartnerEmailNotification({
            notificationKind: 'offer_sent',
            partnerType: pType,
            organizationName: inquiry.partnerOrgName || `${inquiry.customer?.firstName || ''} ${inquiry.customer?.lastName || ''}`.trim(),
            contactName: inquiry.partnerContactName || `${inquiry.customer?.firstName || ''} ${inquiry.customer?.lastName || ''}`.trim(),
            partnerEmail: targetEmail,
            partnerPhone: inquiry.partnerPhone || inquiry.customer?.phone || '',
            referenceId: inquiry.referenceId,
            unitSummary: unitTitle,
            offerAmount: numericOffer,
            senderName: staffUser?.name || 'SR1 Appraisal Desk',
            senderRole: 'staff',
            messageText: offerNotes || 'Subject to physical inspection and title verification.',
            recipientEmails: [targetEmail],
            portalUrl: `https://selltosr1.com/?view=${pType}`
          });
        }

        alert(`Offer of $${numericOffer.toLocaleString()} logged${isPartnerUnit ? ` and sent to ${inquiry.partnerOrgName || inquiry.customer.firstName}` : ` for ${inquiry.customer.firstName}`}.`);
      };

      const handleAddNote = (e) => {
        e.preventDefault();
        if (!newNoteText.trim()) return;

        const newNote = {
          id: 'note-' + Date.now(),
          authorName: 'Staff Buyer',
          authorRole: 'Team Member',
          createdAt: new Date().toLocaleTimeString(),
          category: 'comp',
          content: newNoteText.trim()
        };

        onUpdateInquiry({
          ...inquiry,
          notes: [...inquiry.notes, newNote],
          updatedAt: new Date().toISOString()
        });
        setNewNoteText('');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 md:p-6 overflow-y-auto">
          <div className="bg-neutral-900 border border-neutral-750 rounded-2xl w-full max-w-6xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden text-xs">
            
            <div className="bg-neutral-950 p-4 border-b border-neutral-800 flex items-center justify-between">
              <div>

                      onChange={(e) => handleSaveStaffName(e.target.value)}
                      placeholder="Enter staff name..."
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2 sm:pt-4">
                    <label className="flex items-center space-x-2.5 cursor-pointer bg-neutral-900 p-2.5 rounded-lg border border-neutral-750 hover:border-neutral-600 transition-colors">
                      <input
                        type="checkbox"
                        checked={reachedOut}
                        onChange={(e) => handleToggleOutreach(e.target.checked)}
                        className="w-4 h-4 rounded border-neutral-700 text-neutral-100 bg-neutral-950 focus:ring-0 cursor-pointer"
                      />
                      <span className="text-xs font-semibold text-neutral-200 select-none">
                        I have reached out to this client
                      </span>
                    </label>
                  </div>
                </div>
              </div>

              {/* DIRECT UNIT CHAT WITH DEALER / BANK / SELLER */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-blue-800/60 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center space-x-2">
                    <span className="text-[11px] font-bold uppercase tracking-wider text-blue-300 flex items-center gap-1.5">
                      <span>💬</span>
                      <span>
                        Direct Unit Chat with {inquiry.partnerOrgName || `${inquiry.customer.firstName} ${inquiry.customer.lastName}`}
                      </span>
                    </span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-950 border border-blue-800 text-blue-300">
                      {(inquiry.unitMessages || []).length} {(inquiry.unitMessages || []).length === 1 ? 'Message' : 'Messages'}
                    </span>
                  </div>
                  <span className="text-[10px] text-neutral-400">
                    Synced in real time with Partner Portal & emailed to {inquiry.partnerEmail || inquiry.customer.email || 'partner'}
                  </span>
                </div>

                <div className="bg-neutral-900/80 border border-neutral-800 rounded-xl p-3 max-h-56 overflow-y-auto space-y-2.5">
                  {(!Array.isArray(inquiry.unitMessages) || inquiry.unitMessages.length === 0) ? (
                    <div className="text-center py-4 text-neutral-500 text-xs">
                      No unit-specific chat messages yet. Send a message below to discuss condition, payoff, reserve price, or offer details on this unit.
                    </div>
                  ) : (
                    inquiry.unitMessages.map((msg, idx) => {
                      const isStaff = msg.senderRole === 'staff';
                      return (
                        <div key={msg.id || idx} className={`flex flex-col ${isStaff ? 'items-end' : 'items-start'}`}>
                          <div className="flex items-center gap-1.5 mb-0.5 px-1">
                            <span className="text-[10px] font-bold text-neutral-300">
                              {msg.senderName || (isStaff ? 'SR1 Buying Team' : (inquiry.partnerOrgName || inquiry.customer.firstName))}
                            </span>
                            <span className="text-[10px] text-neutral-500">
                              {msg.createdAt ? new Date(msg.createdAt).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}
                            </span>
                          </div>
                          <div className={`max-w-[85%] rounded-xl px-3.5 py-2 text-xs leading-relaxed whitespace-pre-wrap ${
                            isStaff
                              ? 'bg-white text-neutral-950 font-medium rounded-br-xs shadow-sm'
                              : 'bg-neutral-800 border border-neutral-700 text-neutral-100 rounded-bl-xs'
                          }`}>
                            {msg.text}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                <form onSubmit={handleSendStaffUnitMessage} className="flex gap-2">
                  <input
                    type="text"
                    value={staffUnitMsgText}
                    onChange={(e) => setStaffUnitMsgText(e.target.value)}
                    placeholder={`Send message on #${inquiry.referenceId} (${[inquiry.unit.year, inquiry.unit.make, inquiry.unit.model].filter(Boolean).join(' ') || 'Unit'})...`}
                    className="flex-1 bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-white"
                  />
                  <button
                    type="submit"
                    disabled={!staffUnitMsgText.trim() || sendingStaffUnitMsg}
                    className="px-4 py-2 bg-blue-500 hover:bg-blue-400 disabled:opacity-40 text-neutral-950 font-extrabold rounded-lg text-xs cursor-pointer transition-colors shrink-0"
                  >
                    {sendingStaffUnitMsg ? 'Sending...' : 'Send Unit Chat →'}
                  </button>
                </form>
              </div>

              {/* OFFER BUILDER */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold uppercase text-neutral-400 block">Offer Desk</span>
                  {inquiry.financials?.askingPrice > 0 && (
                    <span className="text-xs font-semibold text-emerald-400">
                      Partner Ask / Reserve: ${Number(inquiry.financials.askingPrice).toLocaleString()}
                    </span>
                  )}
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">SR1 Offer Amount ($)</label>
                    <input
                      type="number"
                      min="0"
                      value={offerAmount}
                      onChange={(e) => setOfferAmount(e.target.value)}
                      placeholder="e.g. 18500"
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white font-bold text-sm focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">Offer Notes / Terms (Visible to Partner)</label>
                    <input
                      type="text"
                      value={offerNotes}
                      onChange={(e) => setOfferNotes(e.target.value)}
                      placeholder="Subject to physical inspection and title verification."
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="pt-1">
                  <button
                    onClick={handleSendOffer}
                    className="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-950 font-bold rounded-lg text-xs cursor-pointer"
                  >
                    {inquiry.submissionSource === 'dealer' || inquiry.submissionSource === 'bank'
                      ? 'Save & Send Offer to Partner Portal'
                      : 'Save & Record Offer'}
                  </button>
                </div>
              </div>

              {/* NOTES */}
              <div className="space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Team Notes</span>
                <div className="space-y-2 max-h-36 overflow-y-auto">
                  {inquiry.notes.map(note => (
                    <div key={note.id} className="bg-neutral-950 p-2.5 rounded-lg border border-neutral-800 text-[11px]">
                      <div className="flex justify-between text-neutral-500 text-[10px]">
                        <span>{note.authorName} ({note.authorRole})</span>
                        <span>{note.createdAt}</span>
                      </div>
                      <p className="text-neutral-300 mt-1">{note.content}</p>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleAddNote} className="flex gap-2">
                  <input
                    type="text"
                    value={newNoteText}
                    onChange={(e) => setNewNoteText(e.target.value)}
                    placeholder="Add an internal note..."
                    className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-neutral-800 text-white font-semibold rounded-lg text-xs">
                    Post
                  </button>
                </form>
              </div>

            </div>

            <div className="bg-neutral-950 p-3 border-t border-neutral-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white font-semibold rounded-lg text-xs"
              >
                Close
              </button>
            </div>

          </div>

          {/* FULL-SCREEN INTERACTIVE MEDIA LIGHTBOX GALLERY */}
          {isLightboxOpen && activePhoto && (
            <div
              className="fixed inset-0 z-[80] bg-black/95 backdrop-blur-md flex flex-col select-none"
              onClick={() => {
                setIsLightboxOpen(false);
                setIsZoomed(false);
              }}
              onTouchStart={handleTouchStartMedia}
              onTouchEnd={handleTouchEndMedia}
            >
              {/* Top Header Bar */}
              <div
                className="flex items-center justify-between px-4 sm:px-6 py-3 bg-neutral-950/90 border-b border-neutral-800 shrink-0"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center gap-3 min-w-0">
                  <span className="px-2.5 py-1 rounded-md bg-neutral-800 border border-neutral-700 text-xs font-mono font-bold text-white shrink-0">
                    {safeMediaIndex + 1} / {mediaItems.length}
                  </span>
                  <div className="min-w-0">
                    <div className="text-xs sm:text-sm font-bold text-white truncate">
                      {activeMedia?.label || (activeMedia?.isVideo ? `Video ${safeMediaIndex + 1}` : `Photo ${safeMediaIndex + 1}`)}
                    </div>
                    <div className="text-[11px] text-neutral-400 truncate">
                      #{inquiry.referenceId} • {inquiry.unit.year} {inquiry.unit.make} {inquiry.unit.model}
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-2 shrink-0">
                  {!activeMedia?.isVideo && (
                    <button
                      type="button"
                      onClick={() => setIsZoomed((z) => !z)}
                      className="px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-750 border border-neutral-700 text-xs font-semibold text-neutral-200 hover:text-white flex items-center gap-1.5 cursor-pointer transition-colors"
                    >
                      <span>{isZoomed ? '🔍 Reset Zoom' : '🔍 Zoom In'}</span>
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => {
                      const w = window.open('');
                      if (w) {
                        if (activeMedia?.isVideo) {
                          w.document.write(`<!DOCTYPE html><html><head><title>SR1 Video Preview</title></head><body style="margin:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;"><video src="${activePhoto}" controls autoplay style="max-width:95vw;max-height:95vh;border-radius:8px;"></video></body></html>`);
                        } else {
                          w.document.write(`<!DOCTYPE html><html><head><title>SR1 Media Preview</title></head><body style="margin:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${activePhoto}" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8);"/></body></html>`);
                        }
                      }
                    }}
                    className="hidden sm:flex px-3 py-1.5 rounded-lg bg-neutral-850 hover:bg-neutral-750 border border-neutral-700 text-xs font-semibold text-neutral-300 hover:text-white items-center gap-1 cursor-pointer transition-colors"
                  >
                    <span>↗</span> New Tab
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setIsLightboxOpen(false);
                      setIsZoomed(false);
                    }}
                    className="px-3.5 py-1.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 text-xs font-bold text-white flex items-center gap-1.5 cursor-pointer transition-colors"
                  >
                    <span>✕</span> Close
                  </button>
                </div>
              </div>

              {/* Center Stage with Large Prev / Next Buttons */}
              <div className="flex-1 relative flex items-center justify-center overflow-auto p-3 sm:p-8">
                {mediaItems.length > 1 && (
                  <button
                    type="button"
                    onClick={handlePrevMedia}
                    aria-label="Previous item"
                    title="Previous (Left Arrow)"
                    className="fixed sm:absolute left-2 sm:left-5 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-neutral-900/90 hover:bg-white text-white hover:text-neutral-950 border border-white/25 flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-2xl transition-all cursor-pointer z-20"
                  >
                    ‹
                  </button>
                )}

                <div
                  className="relative flex items-center justify-center max-w-full max-h-full"
                  onClick={(e) => e.stopPropagation()}
                >
                  {activeMedia?.isVideo ? (
                    <video
                      key={activePhoto}
                      src={activePhoto}
                      controls
                      autoPlay
                      playsInline
                      className="max-w-[90vw] max-h-[75vh] rounded-xl shadow-2xl border border-neutral-800 bg-black"
                    />
                  ) : (
                    <img
                      src={activePhoto}
                      alt={activeMedia?.label || `Photo ${safeMediaIndex + 1}`}
                      onClick={() => setIsZoomed((z) => !z)}
                      className={`rounded-lg shadow-2xl transition-transform duration-200 ${
                        isZoomed
                          ? 'scale-150 cursor-zoom-out max-w-[90vw] max-h-[75vh] object-contain'
                          : 'cursor-zoom-in max-w-[90vw] max-h-[75vh] object-contain'
                      }`}
                    />
                  )}
                </div>

                {mediaItems.length > 1 && (
                  <button
                    type="button"
                    onClick={handleNextMedia}
                    aria-label="Next item"
                    title="Next (Right Arrow)"
                    className="fixed sm:absolute right-2 sm:right-5 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-neutral-900/90 hover:bg-white text-white hover:text-neutral-950 border border-white/25 flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-2xl transition-all cursor-pointer z-20"
                  >
                    ›
                  </button>
                )}
              </div>

              {/* Bottom Thumbnail Filmstrip & Keyboard Hint */}
              <div
                className="bg-neutral-950/95 border-t border-neutral-800 px-4 py-3 flex flex-col items-center gap-2 shrink-0"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center gap-2 overflow-x-auto max-w-full pb-1">
                  {mediaItems.map((p, idx) => {
                    const isSelected = idx === safeMediaIndex;
                    return (
                      <button
                        key={p.id || idx}
                        type="button"
                        onClick={() => goToMedia(idx)}
                        className={`flex-shrink-0 w-20 h-14 rounded-lg border relative overflow-hidden bg-neutral-900 cursor-pointer transition-all ${
                          isSelected
                            ? 'border-white ring-2 ring-white scale-105 opacity-100'
                            : 'border-neutral-800 opacity-50 hover:opacity-90'
                        }`}
                      >
                        <img
                          src={p.thumbUrl || p.url}
                          alt={p.label || `Media ${idx + 1}`}
                          className="w-full h-full object-cover"
                        />
                        {p.isVideo && (
                          <span className="absolute inset-0 bg-black/45 flex items-center justify-center text-white text-xs font-bold">
                            ▶
                          </span>
                        )}
                        <span className="absolute bottom-0.5 right-1 px-1 rounded bg-black/80 text-[9px] font-mono text-white">
                          {idx + 1}
                        </span>
                      </button>
                    );
                  })}
                </div>
                <div className="text-[11px] text-neutral-400 flex items-center gap-4">
                  <span>Use <strong className="text-neutral-200">← / → Arrow Keys</strong>, click <strong className="text-neutral-200">‹ / ›</strong>, or swipe to toggle photos</span>
                  <span className="hidden sm:inline">•</span>
                  <span className="hidden sm:inline">Press <strong className="text-neutral-200">Esc</strong> to close</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-neutral-950 text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
              <h2 className="text-xl font-bold">Submission Confirmed</h2>
              <p className="text-xs text-neutral-400 max-w-md">Your inquiry has been received by our appraisal desk. If you need to make changes or submit another unit, click below.</p>
              <button 
                onClick={() => {
                  try { localStorage.removeItem('sell2sr1_inquiries_v2'); } catch(e){}
                  window.location.reload();
                }} 
                className="px-5 py-2.5 bg-neutral-100 text-neutral-950 font-bold rounded-xl text-xs hover:bg-white transition-all shadow-md"
              >
                Return to Home
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

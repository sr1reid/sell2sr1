        lienHolderName: '',
        estimatedPayoff: '',
        askingPrice: '',
        lengthFeet: '',
        slidesCount: '',
        horsepower: '',

        preferredLocation: 'trailers_loudon_nh',
        firstName: '',
        lastName: '',
        email: '',
        phone: '',
        preferredContact: 'text',
        city: '',
        state: 'ME',
        zipCode: ''

        setUploading(true);

        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (uploadEvent) => {
            setPhotos(prev => [
              ...prev,
              {
                id: 'p-' + Math.random().toString(36).substr(2, 9),
                url: uploadEvent.target.result,
                label: file.name.split('.')[0] || 'Uploaded Photo',
                uploadedAt: new Date().toISOString()
              }
            ]);
            setUploading(false);
          };
          reader.readAsDataURL(file);
        });
      };

      const handleLoadSamplePhotos = () => {
        const sampleUrlMap = {
          rv: [
            'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80',
            'https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1000&q=80'

          ],

            'https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=1000&q=80',
            'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?auto=format&fit=crop&w=1000&q=80'

            'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1000&q=80'
          ],

            'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=1000&q=80'
          ]
        };

        const urls = sampleUrlMap[category] || sampleUrlMap.rv;

          id: 'sample-' + i + '-' + Date.now(),

        setPhotos(prev => [...prev, ...newSamples]);

      const removePhoto = (id) => {

      const handleSubmit = (e) => {

          id: 'inq-' + Date.now(),
          referenceId: refId,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          stage: 'new',
          preferredLocation: formData.preferredLocation,
          assignedStaffName: 'Appraisal Desk Queue',
          customer: {
            firstName: formData.firstName || 'Client',
            lastName: formData.lastName || 'Seller',
            email: formData.email || 'client@example.com',
            phone: formData.phone || '(207) 555-0199',
            preferredContact: formData.preferredContact,
            city: formData.city || 'Manchester',
            state: formData.state || 'ME',

              horsepower: Number(formData.horsepower) || undefined,

            conditionNotes: formData.conditionNotes,
            tireOrTrackCondition: formData.tireOrTrackCondition,
            knownIssuesOrDamage: formData.knownIssuesOrDamage

            headers: { 
              'Content-Type': 'application/json',

            },
            body: JSON.stringify({
              _subject: `New Unit Valuation Request [${refId}]: ${formData.year} ${formData.make} ${formData.model}`,
              Reference_ID: refId,
              Customer_Name: `${formData.firstName} ${formData.lastName}`,
              Customer_Email: formData.email,
              Customer_Phone: formData.phone,
              Preferred_Contact: formData.preferredContact,
              Preferred_Location: (LOCATIONS.find(l => l.id === formData.preferredLocation)?.name) || formData.preferredLocation,
              Unit: `${formData.year} ${formData.make} ${formData.model} ${formData.trimOrFloorplan || ''}`,
              Subcategory: formData.subcategory,
              VIN_or_Serial: formData.vinOrSerial || 'N/A',
              Mileage_or_Hours: `${formData.mileageOrHours || 0} ${activeCatConfig.isHours ? 'Hours' : 'Miles'}`,
              Condition: formData.condition,
              Condition_Description: formData.conditionNotes || 'None',
              Title_Status: formData.titleStatus,
              Lien_Holder: formData.lienHolderName || 'N/A',
              Estimated_Payoff: formData.estimatedPayoff ? `$${formData.estimatedPayoff}` : 'N/A'

                <button 
                  onClick={() => {
                    setSubmittedInquiry(null);

                      titleStatus: 'owned_clean_title',
                      lienHolderName: '',

    // ==========================================
    // 3. STAFF APPRAISAL PORTAL (NEUTRAL THEME)
    // ==========================================
    function StaffPortalView({ inquiries, onUpdateInquiry, selectedInquiryId, setSelectedInquiryId }) {
      const [filterStage, setFilterStage] = useState('all');
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterLocation, setFilterLocation] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [viewMode, setViewMode] = useState('board');

      const metrics = useMemo(() => {
        const total = inquiries.length;
        const newCount = inquiries.filter(i => i.stage === 'new').length;
        const appraisingCount = inquiries.filter(i => i.stage === 'appraising').length;
        const offersSent = inquiries.filter(i => i.stage === 'offer_sent').length;
        const accepted = inquiries.filter(i => i.stage === 'accepted' || i.stage === 'inspection' || i.stage === 'purchased').length;

        return { total, newCount, appraisingCount, offersSent, accepted };
      }, [inquiries]);

      const filtered = useMemo(() => {
        return inquiries.filter(inq => {
          if (filterStage !== 'all' && inq.stage !== filterStage) return false;
          if (filterCategory !== 'all' && inq.unit.category !== filterCategory) return false;
          if (filterLocation !== 'all' && inq.preferredLocation !== filterLocation) return false;
          if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            const matchesCustomer = `${inq.customer.firstName} ${inq.customer.lastName}`.toLowerCase().includes(term);
            const matchesRef = inq.referenceId.toLowerCase().includes(term);
            const matchesUnit = `${inq.unit.year} ${inq.unit.make} ${inq.unit.model}`.toLowerCase().includes(term);
            const matchesVin = (inq.unit.vinOrSerial || '').toLowerCase().includes(term);
            return matchesCustomer || matchesRef || matchesUnit || matchesVin;
          }
          return true;
        });
      }, [inquiries, filterStage, filterCategory, filterLocation, searchTerm]);

      const selectedInquiry = inquiries.find(i => i.id === selectedInquiryId);

      return (
        <div className="py-6 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
          
          {/* HEADER */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">
            <div className="flex items-center space-x-3">
              <div>
                <h1 className="text-lg font-bold text-white">Staff Appraisal & Purchasing Desk</h1>
                <p className="text-xs text-neutral-400">Manage inquiries across all SR1 dealership locations</p>
              </div>
            </div>

            <div className="bg-neutral-950 p-1 rounded-lg flex items-center space-x-1 border border-neutral-800 text-xs">
              <button
                onClick={() => setViewMode('board')}
                className={`px-3 py-1.5 rounded-md font-semibold transition-all ${viewMode === 'board' ? 'bg-neutral-100 text-neutral-950' : 'text-neutral-400 hover:text-white'}`}
              >
                Kanban
              </button>
              <button
                onClick={() => setViewMode('list')}
                className={`px-3 py-1.5 rounded-md font-semibold transition-all ${viewMode === 'list' ? 'bg-neutral-100 text-neutral-950' : 'text-neutral-400 hover:text-white'}`}
              >
                Table
              </button>
            </div>
          </div>

          {/* KPI STATS */}
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
            <div className="bg-neutral-900 border border-neutral-800 p-3.5 rounded-xl">
              <span className="text-[11px] font-semibold text-neutral-400">Total Inquiries</span>
              <div className="text-xl font-bold text-white mt-1">{metrics.total}</div>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-3.5 rounded-xl">
              <span className="text-[11px] font-semibold text-neutral-400">Awaiting Review</span>
              <div className="text-xl font-bold text-white mt-1">{metrics.newCount}</div>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-3.5 rounded-xl">
              <span className="text-[11px] font-semibold text-neutral-400">Under Appraisal</span>
              <div className="text-xl font-bold text-white mt-1">{metrics.appraisingCount}</div>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-3.5 rounded-xl">
              <span className="text-[11px] font-semibold text-neutral-400">Offers Sent</span>
              <div className="text-xl font-bold text-white mt-1">{metrics.offersSent}</div>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-3.5 rounded-xl col-span-2 sm:col-span-1">
              <span className="text-[11px] font-semibold text-neutral-400">Deals Accepted</span>
              <div className="text-xl font-bold text-white mt-1">{metrics.accepted}</div>
            </div>
          </div>

          {/* FILTER BAR */}
          <div className="bg-neutral-900 border border-neutral-800 p-3 rounded-xl flex flex-wrap items-center justify-between gap-3 text-xs">
            <div className="flex-1 min-w-[200px]">
              <input
                type="text"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                placeholder="Search customer, make/model, VIN, reference..."
                className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5 text-white focus:outline-none focus:ring-1 focus:ring-neutral-400"
              />
            </div>

                    <div className="flex items-center justify-between pb-2 border-b border-neutral-800">
                      <h3 className="font-bold text-xs uppercase tracking-wider text-neutral-200">{stageConfig.label}</h3>
                      <span className="text-[10px] bg-neutral-800 text-neutral-300 px-2 py-0.5 rounded font-mono font-bold">
                        {stageInquiries.length}
                      </span>
                    </div>

                    <div className="flex-1 space-y-2.5 overflow-y-auto">
                      {stageInquiries.length === 0 ? (
                        <div className="h-28 flex items-center justify-center text-[11px] text-neutral-600 border border-dashed border-neutral-800 rounded-xl">
                          No inquiries in stage
                        </div>
                      ) : (
                        stageInquiries.map(item => (
                          <div
                            key={item.id}
                            onClick={() => setSelectedInquiryId(item.id)}
                            className="bg-neutral-950 hover:bg-neutral-850 border border-neutral-800 hover:border-neutral-600 rounded-xl p-3 cursor-pointer transition-all space-y-2"
                          >
                            <div className="flex items-center justify-between">
                              <span className="text-[10px] font-mono text-neutral-400 bg-neutral-900 px-1.5 py-0.5 rounded">
                                {item.referenceId}
                              </span>
                              <span className="text-[10px] uppercase font-semibold text-neutral-400">
                                {CATEGORIES[item.unit.category]?.label}
                              </span>
                            </div>

                            <div>
                              <h4 className="font-bold text-xs text-white">
                                {item.unit.year} {item.unit.make} {item.unit.model}
                              </h4>
                              <p className="text-[11px] text-neutral-400">
                                {item.unit.subcategory} • {item.unit.mileageOrHours.toLocaleString()} {item.unit.isHours ? 'hrs' : 'mi'}
                              </p>
                            </div>

                            <div className="text-[11px] text-neutral-400 flex items-center justify-between pt-1 border-t border-neutral-850">
                              <span>{item.customer.firstName} {item.customer.lastName}</span>
                              <span className="text-neutral-500">{item.customer.city}, {item.customer.state}</span>
                            </div>

                            {/* Client Outreach Badge */}
                            <div className="flex items-center justify-between text-[10px] pt-1 border-t border-neutral-900">
                              <span className="text-neutral-400">{item.customer.phone}</span>
                              {item.outreach?.reachedOut ? (
                                <span className="text-emerald-400 font-semibold flex items-center space-x-1">
                                  <span>✓</span>
                                  <span>{item.outreach.staffName}</span>
                                </span>
                              ) : (
                                <span className="text-amber-400 font-medium">⏳ Needs Outreach</span>
                              )}
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden text-xs">
              <table className="w-full text-left">
                <thead className="bg-neutral-950 text-neutral-400 uppercase font-semibold border-b border-neutral-800 text-[10px]">
                  <tr>
                    <th className="p-3">Ref ID</th>
                    <th className="p-3">Unit</th>
                    <th className="p-3">Customer</th>
                    <th className="p-3">Location</th>
                    <th className="p-3">Outreach Status</th>
                    <th className="p-3">Stage</th>
                    <th className="p-3">Offer</th>
                    <th className="p-3 text-right">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-neutral-800">
                  {filtered.map(item => (
                    <tr key={item.id} className="hover:bg-neutral-850">
                      <td className="p-3 font-mono text-neutral-400">{item.referenceId}</td>
                      <td className="p-3 font-bold text-white">{item.unit.year} {item.unit.make} {item.unit.model}</td>
                      <td className="p-3">{item.customer.firstName} {item.customer.lastName}</td>
                      <td className="p-3">{LOCATIONS.find(l => l.id === item.preferredLocation)?.name}</td>
                      <td className="p-3">
                        {item.outreach?.reachedOut ? (
                          <span className="text-emerald-400 font-semibold text-[11px] flex items-center space-x-1">
                            <span>✓</span>
                            <span>{item.outreach.staffName}</span>
                          </span>
                        ) : (
                          <span className="text-amber-400 text-[11px]">⏳ Needs Outreach</span>
                        )}
                      </td>
                      <td className="p-3">{STAGES[item.stage]?.label}</td>
                      <td className="p-3 font-bold text-white">
                        {item.offers.length > 0 ? `$${item.offers[item.offers.length - 1].amount.toLocaleString()}` : '-'}
                      </td>
                      <td className="p-3 text-right">
                        <button
                          onClick={() => setSelectedInquiryId(item.id)}
                          className="px-2.5 py-1 bg-neutral-100 text-neutral-950 font-bold rounded text-[11px]"
                        >
                          Appraise
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* APPRAISAL MODAL */}
          {selectedInquiry && (
            <AppraisalWorkspaceModal
              inquiry={selectedInquiry}
              onClose={() => setSelectedInquiryId(null)}
              onUpdateInquiry={onUpdateInquiry}
            />
          )}

        </div>
      );
    }

    // ==========================================
    // 4. APPRAISAL WORKSPACE MODAL
    // ==========================================
    function AppraisalWorkspaceModal({ inquiry, onClose, onUpdateInquiry }) {
      const [currentStage, setCurrentStage] = useState(inquiry.stage);
      const [offerAmount, setOfferAmount] = useState(inquiry.offers?.[0]?.amount || 25000);
      const [offerNotes, setOfferNotes] = useState(inquiry.offers?.[0]?.notes || 'Subject to physical inspection and title verification.');
      const [newNoteText, setNewNoteText] = useState('');
      const [activePhoto, setActivePhoto] = useState(inquiry.photos?.[0]?.url);
      const [outreachStaffName, setOutreachStaffName] = useState(inquiry.outreach?.staffName || '');
      const [reachedOut, setReachedOut] = useState(inquiry.outreach?.reachedOut || false);
      const [reachedOutAt, setReachedOutAt] = useState(inquiry.outreach?.reachedOutAt || null);

      const netEquity = Math.max(0, offerAmount - (inquiry.financials.estimatedPayoff || 0));

      const handleToggleOutreach = (checked) => {
        if (checked && !outreachStaffName.trim()) {
          alert('Please enter your staff name before checking off that you reached out.');
          return;
        }
        const now = new Date().toLocaleString();
        setReachedOut(checked);
        setReachedOutAt(checked ? now : null);

        const newOutreach = {
          reachedOut: checked,
          staffName: checked ? outreachStaffName.trim() : '',
          reachedOutAt: checked ? now : null
        };

        const updated = {
          ...inquiry,
          outreach: newOutreach,
          updatedAt: new Date().toISOString(),
          notes: checked ? [
            ...inquiry.notes,
            {
              id: 'n-outreach-' + Date.now(),
              authorName: outreachStaffName.trim(),
              authorRole: 'Staff Member',
              createdAt: new Date().toLocaleTimeString(),
              category: 'call_log',
              content: `Staff member ${outreachStaffName.trim()} confirmed direct outreach to client (${inquiry.customer.phone} / ${inquiry.customer.email}).`
            }
          ] : inquiry.notes
        };

        onUpdateInquiry(updated);
      };

      const handleSaveStaffName = (name) => {
        setOutreachStaffName(name);
        if (reachedOut) {
          onUpdateInquiry({
            ...inquiry,
            outreach: {
              ...inquiry.outreach,
              staffName: name.trim()
            },
            updatedAt: new Date().toISOString()
          });
        }
      };

      const handleSaveStage = (newSt) => {
        setCurrentStage(newSt);
        onUpdateInquiry({
          ...inquiry,
          stage: newSt,
          updatedAt: new Date().toISOString()
        });
      };

      const handleSendOffer = () => {
        const newOffer = {
          id: 'off-' + Date.now(),
          amount: Number(offerAmount),
          expirationDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'sent',
          createdAt: new Date().toLocaleTimeString(),
          createdBy: 'SR1 Appraisal Desk',
          notes: offerNotes,
          customerPayoffEstimate: inquiry.financials.estimatedPayoff || 0,
          calculatedNetEquity: netEquity
        };

        const updated = {
          ...inquiry,
          stage: 'offer_sent',
          updatedAt: new Date().toISOString(),
          offers: [...(inquiry.offers || []), newOffer],
          notes: [
            ...inquiry.notes,
            {
              id: 'n-off-' + Date.now(),
              authorName: 'Appraisal Desk',
              authorRole: 'Buyer',
              createdAt: new Date().toLocaleTimeString(),
              category: 'offer_reason',
              content: `Cash offer of $${Number(offerAmount).toLocaleString()} recorded.`
            }
          ]
        };

        setCurrentStage('offer_sent');
        onUpdateInquiry(updated);
        alert(`Cash offer of $${Number(offerAmount).toLocaleString()} logged for ${inquiry.customer.firstName}.`);
      };

      const handleAddNote = (e) => {
        e.preventDefault();
        if (!newNoteText.trim()) return;

        const newNote = {
          id: 'note-' + Date.now(),
          authorName: 'Staff Buyer',
          authorRole: 'Team Member',
          createdAt: new Date().toLocaleTimeString(),
          category: 'comp',
          content: newNoteText.trim()
        };

        onUpdateInquiry({
          ...inquiry,
          notes: [...inquiry.notes, newNote],
          updatedAt: new Date().toISOString()
        });
        setNewNoteText('');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-neutral-900 border border-neutral-750 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden text-xs">
            
            <div className="bg-neutral-950 p-4 border-b border-neutral-800 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-mono text-neutral-300 font-bold bg-neutral-850 px-2 py-0.5 rounded">
                    {inquiry.referenceId}
                  </span>
                  <h2 className="text-base font-bold text-white">
                    {inquiry.unit.year} {inquiry.unit.make} {inquiry.unit.model}
                  </h2>
                </div>
                <p className="text-[11px] text-neutral-400 mt-0.5">
                  Seller: {inquiry.customer.firstName} {inquiry.customer.lastName} • {inquiry.customer.phone}
                </p>
              </div>

              <div className="flex items-center space-x-2">
                <select
                  value={currentStage}
                  onChange={(e) => handleSaveStage(e.target.value)}
                  className="bg-neutral-850 border border-neutral-750 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-white"
                >
                  {Object.entries(STAGES).map(([k, v]) => (
                    <option key={k} value={k}>{v.label}</option>
                  ))}
                </select>

                <button
                  onClick={onClose}
                  className="w-7 h-7 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-neutral-300 flex items-center justify-center font-bold"
                >
                  ✕
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="space-y-2">
                  <span className="text-[11px] font-bold uppercase text-neutral-400">Photos</span>
                  <div className="rounded-xl overflow-hidden aspect-video bg-black border border-neutral-800">
                    {activePhoto ? (
                      <img src={activePhoto} alt="Inspection" className="w-full h-full object-cover" />
                    ) : (
                      <div className="h-full flex items-center justify-center text-neutral-500">No photos</div>
                    )}
                  </div>
                  <div className="flex space-x-2 overflow-x-auto pb-1">
                    {inquiry.photos.map(p => (
                      <button
                        key={p.id}
                        onClick={() => setActivePhoto(p.url)}
                        className={`flex-shrink-0 w-16 h-12 rounded border ${activePhoto === p.url ? 'border-neutral-200' : 'border-neutral-800 opacity-60'}`}
                      >
                        <img src={p.url} alt={p.label} className="w-full h-full object-cover rounded" />
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-3 bg-neutral-950 p-4 rounded-xl border border-neutral-800">
                  <span className="text-[11px] font-bold uppercase text-neutral-400 block">Unit Details</span>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Category</span>
                      <span className="font-semibold text-neutral-200">{CATEGORIES[inquiry.unit.category]?.label}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Type</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.subcategory}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">VIN / Serial</span>
                      <span className="font-mono text-neutral-200">{inquiry.unit.vinOrSerial || 'N/A'}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">{inquiry.unit.isHours ? 'Hours' : 'Mileage'}</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.mileageOrHours.toLocaleString()}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Condition</span>
                      <span className="font-semibold text-neutral-200">{inquiry.unit.condition}</span>
                    </div>
                    <div>
                      <span className="text-neutral-500 block text-[10px]">Title Status</span>
                      <span className="font-semibold text-neutral-200">{inquiry.financials.titleStatus}</span>
                    </div>
                  </div>

                  {inquiry.financials.estimatedPayoff > 0 && (
                    <div className="pt-2 border-t border-neutral-850">
                      <span className="text-neutral-500 text-[10px] block">Lender Payoff:</span>
                      <span className="text-neutral-200 font-bold">${inquiry.financials.estimatedPayoff.toLocaleString()}</span>
                    </div>
                  )}

                  {inquiry.unit.conditionNotes && (
                    <div className="pt-2 border-t border-neutral-850">
                      <span className="text-neutral-500 text-[10px] block">Disclosures:</span>
                      <p className="text-neutral-300 text-[11px] mt-0.5">{inquiry.unit.conditionNotes}</p>
                    </div>
                  )}
                </div>
              </div>

              {/* STAFF CLIENT OUTREACH CHECK-OFF */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-[11px] font-bold uppercase text-neutral-300">Staff Client Outreach</span>
                    {reachedOut ? (
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 border border-emerald-700 text-emerald-300">
                        ✓ Reached Out
                      </span>
                    ) : (
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 border border-amber-800 text-amber-300">
                        ⏳ Pending Outreach
                      </span>
                    )}
                  </div>
                  {reachedOutAt && (
                    <span className="text-[10px] text-neutral-400">
                      Logged on {reachedOutAt}
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center pt-1">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">Staff Member Name *</label>
                    <input
                      type="text"
                      value={outreachStaffName}
                      onChange={(e) => handleSaveStaffName(e.target.value)}
                      placeholder="Enter staff name..."
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-2 text-white text-xs focus:ring-1 focus:ring-neutral-400 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2 sm:pt-4">
                    <label className="flex items-center space-x-2.5 cursor-pointer bg-neutral-900 p-2.5 rounded-lg border border-neutral-750 hover:border-neutral-600 transition-colors">
                      <input
                        type="checkbox"
                        checked={reachedOut}
                        onChange={(e) => handleToggleOutreach(e.target.checked)}
                        className="w-4 h-4 rounded border-neutral-700 text-neutral-100 bg-neutral-950 focus:ring-0 cursor-pointer"
                      />
                      <span className="text-xs font-semibold text-neutral-200 select-none">
                        I have reached out to this client
                      </span>
                    </label>
                  </div>
                </div>
              </div>

              {/* OFFER BUILDER */}
              <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Offer Desk</span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">SR1 Buy Offer ($)</label>
                    <input
                      type="number"
                      value={offerAmount}
                      onChange={(e) => setOfferAmount(Number(e.target.value))}
                      className="w-full bg-neutral-900 border border-neutral-750 rounded-lg px-3 py-1.5 text-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-neutral-400 text-[10px] block mb-1">Loan Payoff ($)</label>
                    <input
                      type="number"
                      readOnly
                      value={inquiry.financials.estimatedPayoff || 0}
                      className="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-1.5 text-neutral-500 font-bold"
                    />
                  </div>
                  <div className="bg-neutral-900 p-2 rounded-lg border border-neutral-800">
                    <span className="text-neutral-400 text-[10px] block">Customer Net Check:</span>
                    <span className="text-lg font-bold text-white mt-0.5 block">${netEquity.toLocaleString()}</span>
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    onClick={handleSendOffer}
                    className="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-950 font-bold rounded-lg text-xs"
                  >
                    Save & Record Offer
                  </button>
                </div>
              </div>

              {/* NOTES */}
              <div className="space-y-3">
                <span className="text-[11px] font-bold uppercase text-neutral-400 block">Team Notes</span>
                <div className="space-y-2 max-h-36 overflow-y-auto">
                  {inquiry.notes.map(note => (
                    <div key={note.id} className="bg-neutral-950 p-2.5 rounded-lg border border-neutral-800 text-[11px]">
                      <div className="flex justify-between text-neutral-500 text-[10px]">
                        <span>{note.authorName} ({note.authorRole})</span>
                        <span>{note.createdAt}</span>
                      </div>
                      <p className="text-neutral-300 mt-1">{note.content}</p>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleAddNote} className="flex gap-2">
                  <input
                    type="text"
                    value={newNoteText}
                    onChange={(e) => setNewNoteText(e.target.value)}
                    placeholder="Add an internal note..."
                    className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-neutral-800 text-white font-semibold rounded-lg text-xs">
                    Post
                  </button>
                </form>
              </div>

            </div>

            <div className="bg-neutral-950 p-3 border-t border-neutral-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white font-semibold rounded-lg text-xs"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
